<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>汇盛支付平台端控制台 - 租户管理</title>
  <script src="../platform-auth-route-guard.js" data-platform-route-targets='{"":"platform.tenant.view"}'></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&family=Fira+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --font-ui: "Avenir Next", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --primary: #145fe8;
      --primary-hover: #0f52cc;
      --primary-soft: #E8F3FF;
      --bg-main: #F5F7FB;
      --bg-rail: #111827;
      --bg-card: #FFFFFF;
      --bg-muted: #F1F5F9;
      --text-primary: #1D2129;
      --text-secondary: #4E5969;
      --text-tertiary: #626d7b;
      --text-inverse: #F8FAFC;
      --border: #E5E6EB;
      --border-strong: #D8DDE8;
      --success: #0F9F6E;
      --success-soft: #DCFCE7;
      --warning: #92400E;
      --warning-soft: #FEF3C7;
      --danger: #DC2626;
      --danger-soft: #FEE2E2;
      --cyan: #0891B2;
      --violet: #6D28D9;
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --shadow-popover: 0 18px 48px rgba(15, 23, 42, 0.16);
      --shadow-panel: 0 1px 2px rgba(15, 23, 42, 0.06);
      --rail-width: 248px;
      --topbar-height: 56px;
      --mono: "Fira Code", "SFMono-Regular", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg-main);
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 14px;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--primary-hover);
      outline-offset: 2px;
    }

    .app-shell {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: var(--rail-width) minmax(0, 1fr);
    }

    .sidebar {
      background: var(--bg-rail);
      color: #E5E7EB;
      padding: 0;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100dvh;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      overflow-y: auto;
    }

    .brand {
      min-height: 64px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #165DFF 0%, #0E7490 100%);
      color: white;
      font-weight: 800;
      font-size: 13px;
      line-height: 1;
      font-family: "Fira Code", "SFMono-Regular", Consolas, monospace;
    }

    .brand-title {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .brand-title strong {
      font-size: 15px;
      white-space: nowrap;
    }

    .brand-title span {
      color: #9CA3AF;
      font-size: 12px;
    }

    .nav-group-title {
      padding: 0 10px;
      color: #8B95A7;
      font-size: 12px;
      font-weight: 700;
      line-height: 22px;
    }

    .nav-list {
      padding: 14px 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .nav-group {
      display: grid;
      gap: 4px;
    }

    .nav-button {
      width: 100%;
      min-height: 38px;
      border: 0;
      background: transparent;
      color: #C9D1DF;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 6px;
      text-align: left;
      transition: background 160ms ease, color 160ms ease;
    }

    .nav-button:hover {
      background: rgba(255, 255, 255, 0.07);
      color: white;
    }

    .nav-button.active {
      background: rgba(20, 95, 232, 0.24);
      color: white;
    }

    .nav-button svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .nav-button span {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 14px;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: var(--topbar-height) minmax(0, 1fr);
    }

    .topbar {
      height: var(--topbar-height);
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .breadcrumb {
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .breadcrumb strong {
      color: var(--text-primary);
      font-weight: 700;
    }

    .topbar-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .search-box {
      position: relative;
      width: min(340px, 30vw);
      min-width: 220px;
    }

    .search-box svg {
      width: 16px;
      height: 16px;
      position: absolute;
      top: 50%;
      left: 10px;
      transform: translateY(-50%);
      color: var(--text-tertiary);
    }

    .search-box input {
      width: 100%;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0 12px 0 34px;
      color: var(--text-primary);
      background: var(--bg-main);
    }

    .search-box input::placeholder {
      color: var(--text-tertiary);
      opacity: 1;
    }

    .role-chip {
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 4px 10px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      background: white;
      white-space: nowrap;
    }

    .role-chip select {
      height: 28px;
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 700;
      padding: 0;
      min-width: 62px;
    }

    .content {
      padding: 20px 24px 32px;
      min-width: 0;
    }

    .page-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: start;
      margin-bottom: 14px;
    }

    .page-title {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .page-title h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: 0;
    }

    .page-title p {
      margin: 0;
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 82ch;
    }

    .head-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      min-height: 34px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: white;
      color: var(--text-primary);
      font-weight: 600;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease, transform 180ms ease;
      white-space: nowrap;
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    .btn:hover {
      background: var(--bg-muted);
      border-color: var(--text-tertiary);
    }

    .btn:disabled {
      color: var(--text-tertiary);
      background: var(--bg-muted);
      border-color: var(--border);
      cursor: not-allowed;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .btn.primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn.danger {
      color: var(--danger);
      border-color: #FCA5A5;
      background: white;
    }

    .btn.danger:hover {
      background: var(--danger-soft);
    }

    .btn.ghost {
      border-color: transparent;
      background: transparent;
    }

    .icon-btn {
      width: 34px;
      padding: 0;
    }

    .risk-strip {
      border: 1px solid #FACC15;
      background: var(--warning-soft);
      color: #713F12;
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    .risk-strip svg {
      width: 18px;
      height: 18px;
    }

    .risk-copy {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .risk-copy strong {
      color: #713F12;
    }

    .layout-grid {
      display: block;
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-panel);
      min-width: 0;
    }

    .panel-header {
      height: 50px;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-header h2,
    .panel-header h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }

    .panel-body {
      padding: 14px;
    }

    .filter-bar {
      display: grid;
      grid-template-columns: 1.45fr repeat(2, minmax(130px, 1fr)) auto auto;
      gap: 10px;
      margin-bottom: 12px;
      align-items: end;
    }

    .field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .field label {
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
    }

    .field input,
    .field select,
    .field textarea {
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0 10px;
      background: white;
      color: var(--text-primary);
      width: 100%;
    }

    .field input[readonly] {
      background: #F8FAFC;
      color: var(--text-secondary);
      cursor: default;
    }

    .field textarea {
      padding: 9px 10px;
      min-height: 78px;
      resize: vertical;
      line-height: 1.5;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 8px;
      background: white;
    }

    table {
      width: 100%;
      min-width: 780px;
      border-collapse: collapse;
      background: white;
    }

    th,
    td {
      text-align: left;
      padding: 0 10px;
      border-bottom: 1px solid var(--border);
      height: 56px;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      height: 44px;
      background: #F8FAFC;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .detail-table table {
      min-width: 640px;
    }

    .detail-table th,
    .detail-table td {
      height: 48px;
    }

    tbody tr {
      transition: background 160ms ease;
    }

    tbody tr:hover {
      background: var(--bg-muted);
    }

    .mono,
    .amount {
      font-family: "Fira Code", "SFMono-Regular", Consolas, monospace;
    }

    .mono {
      font-size: 12px;
    }

    .tenant-cell {
      display: grid;
      gap: 3px;
      min-width: 140px;
    }

    .tenant-cell strong {
      font-size: 13px;
    }

    .tenant-cell span {
      color: var(--text-tertiary);
      font-size: 12px;
    }

    .cell-stack {
      display: grid;
      gap: 4px;
      min-width: 150px;
    }

    .cell-stack strong {
      font-size: 13px;
    }

    .cell-sub {
      color: var(--text-tertiary);
      font-size: 12px;
      line-height: 1.35;
    }

    .tag-row {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .business-matrix {
      display: grid;
      gap: 5px;
      min-width: 110px;
    }

    .business-line {
      display: flex;
      gap: 5px;
      flex-wrap: nowrap;
    }

    .ability-pill {
      height: 24px;
      border: 1px solid #E2E8F0;
      border-radius: var(--radius-md);
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #F1F5F9;
      color: #626d7b;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .ability-pill.active {
      color: #075985;
      background: var(--primary-soft);
      border-color: #BAE6FD;
    }

    .wallet-ledger {
      display: grid;
      gap: 4px;
      min-width: 246px;
    }

    .wallet-ledger-line {
      display: grid;
      grid-template-columns: 38px 96px 96px;
      gap: 8px;
      align-items: center;
      line-height: 1.35;
    }

    .wallet-ledger-line .label {
      color: var(--text-secondary);
      font-weight: 700;
    }

    .wallet-ledger-line .amount {
      font-size: 11px;
      text-align: right;
    }

    .wallet-link {
      margin-top: 2px;
      border: 0;
      padding: 0;
      justify-self: center;
      background: transparent;
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
    }

    .wallet-link:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 24px;
      border-radius: var(--radius-md);
      padding: 0 8px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .tag.green {
      color: #166534;
      background: var(--success-soft);
      border-color: #BBF7D0;
    }

    .tag.orange {
      color: #854D0E;
      background: var(--warning-soft);
      border-color: #FDE68A;
    }

    .tag.red {
      color: #991B1B;
      background: var(--danger-soft);
      border-color: #FECACA;
    }

    .tag.blue {
      color: #075985;
      background: var(--primary-soft);
      border-color: #BAE6FD;
    }

    .tag.gray {
      color: #334155;
      background: #E2E8F0;
      border-color: #CBD5E1;
    }

    .tag.violet {
      color: #4C1D95;
      background: #EDE9FE;
      border-color: #DDD6FE;
    }

    .amount {
      font-weight: 700;
    }

    .table-actions {
      display: flex;
      gap: 5px;
      justify-content: flex-end;
      align-items: center;
    }

    .action-col {
      min-width: 82px;
      text-align: right;
      background: white;
    }

    .action-link {
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-link:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    .action-link.danger {
      color: var(--danger);
    }

    .action-link.muted {
      color: var(--text-tertiary);
      cursor: not-allowed;
    }

    th.action-col {
      background: #F8FAFC;
    }

    tbody tr:hover .action-col {
      background: var(--bg-muted);
    }

    .mini-list {
      display: grid;
      gap: 10px;
    }

    .mini-item {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 10px;
      display: grid;
      gap: 8px;
      background: white;
    }

    .mini-item-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .mini-item strong {
      font-size: 13px;
    }

    .mini-item p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.5;
    }

    .table-empty {
      height: 132px;
      text-align: center;
      color: var(--text-secondary);
    }

    .table-empty strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text-primary);
      font-size: 14px;
    }

    .table-empty .btn {
      margin-top: 10px;
    }

    .detail-backdrop,
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.38);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
      z-index: 40;
    }

    .modal-backdrop {
      z-index: 55;
    }

    .detail-backdrop.open,
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .detail-modal {
      position: fixed;
      top: 50%;
      left: calc(var(--rail-width) + (100vw - var(--rail-width)) / 2);
      width: min(1040px, calc(100vw - var(--rail-width) - 48px));
      max-height: calc(100dvh - 64px);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-popover);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -48%) scale(0.98);
      transition: opacity 180ms ease, transform 200ms ease;
      z-index: 50;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      overflow: hidden;
    }

    .detail-modal.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .detail-modal-head {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--border);
      display: grid;
      gap: 12px;
    }

    .detail-title-row {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
    }

    .detail-title {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .detail-title h2 {
      margin: 0;
      font-size: 19px;
    }

    .detail-title p {
      margin: 0;
      color: var(--text-secondary);
    }

    .detail-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      padding: 8px 18px;
      overflow-x: auto;
    }

    .detail-tab {
      height: 42px;
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      padding: 0 12px;
      font-weight: 700;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }

    .detail-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .detail-modal-body {
      overflow: auto;
      padding: 18px;
    }

    .detail-section {
      display: none;
    }

    .detail-section.active {
      display: grid;
      gap: 14px;
    }

    .kv-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .kv {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 10px;
      min-width: 0;
      background: white;
    }

    .kv span {
      display: block;
      color: var(--text-tertiary);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .kv strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wallet-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .wallet-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
      background: white;
      display: grid;
      gap: 6px;
    }

    .wallet-card span {
      color: var(--text-secondary);
      font-size: 12px;
    }

    .wallet-card strong {
      font-size: 18px;
      font-family: "Fira Code", "SFMono-Regular", Consolas, monospace;
    }

    .modal {
      position: fixed;
      left: 50%;
      top: 50%;
      width: min(760px, calc(100vw - 32px));
      max-height: calc(100dvh - 44px);
      transform: translate(-50%, -48%) scale(0.98);
      opacity: 0;
      pointer-events: none;
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-popover);
      z-index: 60;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      transition: transform 180ms ease, opacity 180ms ease;
    }

    .modal.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .modal-head,
    .modal-foot {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .form-grid .wide {
      grid-column: 1 / -1;
    }

    .operation-receipt {
      display: none;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px 14px;
      border: 1px solid #B7EAD5;
      border-radius: var(--radius-lg);
      background: #F2FBF7;
      color: #075D46;

      display: grid;
    }

    .operation-receipt.error {
      border-color: #F0C7C7;
      background: #FFF7F7;
      color: #8F1D1D;
    }

    .operation-receipt-main {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .operation-receipt-main strong {
      font-size: 13px;
    }

    .operation-receipt-main span {
      font-size: 12px;
      line-height: 1.5;
    }

    .form-error {
      display: none;
      margin-bottom: 12px;
      padding: 10px 12px;
      border: 1px solid #F0C7C7;
      border-radius: var(--radius-md);
      background: #FFF7F7;
      color: #8F1D1D;
      font-size: 12px;
      line-height: 1.5;
    }

    .form-error.show {
      display: block;
    }

    .field.has-error input,
    .field.has-error select,
    .field.has-error textarea {
      border-color: var(--danger);
      background: #FFF7F7;
    }

    .toast-stack {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 80;
      display: grid;
      gap: 8px;
    }

    .toast {
      min-width: 280px;
      max-width: 380px;
      border: 1px solid var(--border);
      background: white;
      box-shadow: var(--shadow-popover);
      border-radius: var(--radius-lg);
      padding: 12px;
      display: grid;
      gap: 4px;
      animation: toastIn 180ms ease both;
    }

    .toast strong {
      font-size: 13px;
    }

    .toast span {
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.45;
    }

    @keyframes toastIn {
      from {
        transform: translateY(8px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
      }
    }

    function tenantDialogFocusable(dialog) {
      return [...dialog.querySelectorAll('button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])')]
        .filter(element => element.offsetParent !== null && element.getAttribute('aria-hidden') !== 'true');
    }

    function showTenantDialog(dialog) {
      if (!dialog.classList.contains('open')) {
        tenantDialogReturnFocus.set(dialog, document.activeElement);
      }
      dialog.classList.add('open');
      dialog.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(() => {
        const focusable = tenantDialogFocusable(dialog);
        (focusable[0] || dialog).focus();
      });
    }

    function restoreTenantDialogFocus(dialog, fallbackSelector = '') {
      const returnTarget = tenantDialogReturnFocus.get(dialog);
      tenantDialogReturnFocus.delete(dialog);
      const fallback = fallbackSelector ? document.querySelector(fallbackSelector) : null;
      const target = returnTarget?.isConnected && returnTarget.offsetParent !== null ? returnTarget : fallback;
      if (target?.isConnected && target.offsetParent !== null) target.focus();
    }

    function trapTenantDialogFocus(event, dialog) {
      const focusable = tenantDialogFocusable(dialog);
      if (!focusable.length) {
        event.preventDefault();
        dialog.focus();
        return;
      }
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    function showFormError(errorId, message, fieldIds = []) {
      clearFormError(errorId);
      const panel = document.getElementById(errorId);
      if (panel) {
        panel.textContent = message;
        panel.classList.add('show');
        panel.setAttribute('role', 'alert');
        panel.setAttribute('aria-live', 'assertive');
        panel.setAttribute('aria-atomic', 'true');
      }
      fieldIds.forEach(id => {
        const field = document.getElementById(id);
        field?.closest('.field')?.classList.add('has-error');
      });
      const firstField = document.getElementById(fieldIds[0]) || panel?.closest('form')?.querySelector('input, select, textarea');
      window.HSFormFeedback?.report(message, firstField, panel);
    }

    function isValidTenantDomain(value) {
      const domain = String(value || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/\/$/, '');
      if (!domain || domain.includes('/') || domain.includes(':') || /^(localhost|127\.|0\.|10\.|192\.168\.)/.test(domain)) return false;
      return /^(?=.{4,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/.test(domain);
    }

    function currentTenantForAction() {
      return tenants.find(item => item.id === appState.confirmTenantId) || appState.selectedTenant;
    }

    function addTenantAudit(tenant, action, result, reason, tone = 'green') {
      const audit = {
        id: `AL-20260718-${String(appState.auditSequence++).padStart(5, '0')}`,
        time: platformNow(),
        operator: appState.currentRole === '平台超管' ? 'Jeff' : appState.currentRole,
        role: appState.currentRole,
        tenant: tenant.name,
        object: `${tenant.id} / ${action}`,
        action,
        result,
        tone,
        ip: '10.12.4.18',
        device: 'Chrome macOS',
        reason
      };
      auditEvents.unshift(audit);
      return audit;
    }

    function setOperationReceipt({ title, tenant, status, detail, audit }) {
      appState.latestReceipt = { title, tenantId: tenant.id, status, detail, auditId: audit.id, time: audit.time };
      renderOperationReceipt();
    }

    function renderOperationReceipt() {
      const receipt = document.getElementById('operationReceipt');
      const data = appState.latestReceipt;
      if (!data) {
        receipt.className = 'operation-receipt';
        receipt.innerHTML = '';
        return;
      }
      receipt.className = 'operation-receipt show';
      receipt.innerHTML =
        '<div class="operation-receipt-main">' +
          '<strong>' + data.title + ' · ' + data.status + '</strong>' +
          '<span>' + data.tenantId + ' · ' + data.detail + ' · ' + data.time + '（UTC+8） · 审计编号 ' + data.auditId + '</span>' +
        '</div>' +
        '<div class="table-actions">' +
          '<button class="btn" data-receipt-tenant="' + data.tenantId + '">查看租户</button>' +
          '<button class="btn" data-receipt-audit="' + data.auditId + '">查看审计</button>' +
        '</div>';
    }

    function formatMoney(value) {
      const amount = Math.max(Number(value) || 0, 0);
      return 'CNY ' + amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatCurrency(value, currency) {
      const amount = Math.max(Number(value) || 0, 0);
      return currency + ' ' + amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatLedgerAmount(value, currency) {
      const amount = Math.max(Number(value) || 0, 0);
      return currency + ' ' + amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function getPermissions() {
      return roleProfiles[appState.currentRole] || roleProfiles['平台超管'];
    }

    function tenantInCurrentScope(tenant) {
      if (!tenant) return false;
      const permissions = getPermissions();
      return permissions.scopeCode === 'platform.all_tenants' || permissions.tenantIds.includes(tenant.id);
    }

    function canCreateTenant() {
      const permissions = getPermissions();
      return permissions.canCreate && permissions.scopeCode === 'platform.all_tenants';
    }

    function disabledButton(label, icon, reason) {
      return '<button class="btn" disabled title="' + reason + '"><i data-lucide="' + icon + '"></i>' + label + '</button>';
    }

    function disabledActionLink(label, reason) {
      return '<button class="action-link muted" disabled title="' + reason + '">' + label + '</button>';
    }

    function hasAuthorizedBusiness(tenant, aliases) {
      return (tenant.businessCatalog || []).some(item => aliases.includes(item.name) && item.status === '已授权');
    }

    function businessAbilityCell(tenant) {
      return '<div class="business-matrix">' + businessAbilities.map(group => (
        '<div class="business-line">' + group.map(item => {
          const active = hasAuthorizedBusiness(tenant, item.aliases);
          const extraClass = item.className ? ' ' + item.className : '';
          return '<span class="ability-pill' + extraClass + (active ? ' active' : '') + '">' + item.label + '</span>';
        }).join('') + '</div>'
      )).join('') + '</div>';
    }

    function walletSummaryCell(tenant) {
      const snapshot = listWalletSnapshots[tenant.id] || {
        withdrawable: { CNY: tenant.credit || 0 },
        collection: { CNY: 0 },
        payout: { CNY: tenant.available || 0 }
      };
      const rows = [
        ['可提现', snapshot.withdrawable],
        ['代收', snapshot.collection],
        ['代付', snapshot.payout]
      ];
      return '<div class="wallet-ledger">' + rows.map(row => (
        '<div class="wallet-ledger-line">' +
          '<span class="label">' + row[0] + '</span>' +
          '<span class="amount">' + formatLedgerAmount(row[1].CNY, 'CNY') + '</span>' +
        '</div>'
      )).join('') +
        '<button class="wallet-link" data-open-wallet="' + tenant.id + '">钱包详情</button>' +
      '</div>';
    }

    function tag(text, tone) {
      return '<span class="tag ' + tone + '">' + text + '</span>';
    }

    function renderRows() {
      const rows = document.getElementById('tenantRows');
      const result = appState.filtered;
      const permissions = getPermissions();
      const createAllowed = canCreateTenant();
      document.getElementById('createTenantTop').disabled = !createAllowed;
      document.getElementById('createTenantTop').title = createAllowed ? '' : (permissions.canCreate ? '新增顶层租户要求“全部租户”数据范围' : appState.currentRole + ' 无新增租户权限');

      if (result.length === 0) {
        rows.innerHTML = '<tr><td colspan="5" class="table-empty"><strong>没有符合条件的租户</strong><span>请调整筛选条件后再查看列表。</span><br><button class="btn" data-clear-filters><i data-lucide="rotate-ccw"></i>清空筛选</button></td></tr>';
        refreshIcons();
        return;
      }

      rows.innerHTML = result.map((tenant, index) => {
        const accessPending = allTenantDomains(tenant).filter(domain => domain.status === '未启用').length;
        const statusAction = !permissions.canSecurity
          ? ''
          : tenant.status === '正常'
            ? '<button class="action-link danger" data-confirm="停用租户" data-confirm-tenant="' + tenant.id + '" data-confirm-detail="停用 ' + tenant.name + ' 后，租户端与商户端后续登录和全部新业务被阻止；历史与在途继续保留。">停用</button>'
            : tenant.status === '停用'
              ? '<button class="action-link" data-confirm="启用租户" data-confirm-tenant="' + tenant.id + '" data-confirm-detail="启用 ' + tenant.name + ' 只恢复租户层级的后续登录与新业务资格；下级对象状态保持不变。">启用</button>'
              : '';
        return '<tr data-index="' + index + '">' +
          '<td><div class="tenant-cell"><strong>' + tenant.name + '</strong><span class="mono">' + tenant.id + ' / ' + tenant.contact + '</span>' + (accessPending ? '<span>' + tag('域名待处理 ' + accessPending, 'orange') + '</span>' : '') + '</div></td>' +
          '<td>' + tag(tenant.status, tenant.statusTone) + '</td>' +
          '<td>' + businessAbilityCell(tenant) + '</td>' +
          '<td>' + walletSummaryCell(tenant) + '</td>' +
          '<td class="action-col"><div class="table-actions">' +
            '<button class="action-link" data-open="' + tenant.id + '">详情</button>' +
            statusAction +
          '</div></td>' +
        '</tr>';
      }).join('');

      refreshIcons();
    }

    function renderAuditTableRows(rows) {
      if (rows.length === 0) {
        return '<tr><td colspan="7" class="table-empty"><strong>暂无审计记录</strong><span>该租户当前没有匹配的审计日志。</span></td></tr>';
      }

      return rows.map(event => (
        '<tr>' +
          '<td class="mono">' + event.id + '</td>' +
          '<td class="mono">' + event.time + '</td>' +
          '<td><strong>' + event.operator + '</strong><br><span class="mono">' + event.role + '</span></td>' +
          '<td>' + event.action + '</td>' +
          '<td>' + tag(event.result, event.tone) + '</td>' +
          '<td><span class="mono">' + event.ip + '</span><br><span class="mono">' + event.device + '</span></td>' +
          '<td><div class="table-actions"><button class="btn" data-audit-detail="' + event.id + '"><i data-lucide="eye"></i>查看</button></div></td>' +
        '</tr>'
      )).join('');
    }

    function renderAuthorizedChannelRows(tenant) {
      const model = window.HSProviderDemo;
      const grants = model.grants.filter(g => g.tenantId === tenant.id);
      return grants.map(g => {
        const provider = model.providers.find(p => p.id === g.providerId);
        return '<tr><td><strong>' + escapeHtml(provider?.name || g.providerId) + '</strong></td><td>' + escapeHtml(g.providerId) + '</td><td>' + tag(g.status, g.status === '已授权' ? 'green' : 'gray') + '</td><td>' + escapeHtml(g.updatedAt) + '</td></tr>';
      }).join('') || '<tr><td colspan="4" class="table-empty">暂无已授权通道商</td></tr>';
    }

    function domainStatusTone(status) {
      if (status === '可用') return 'green';
      if (status === '已停用') return 'red';
      return 'orange';
    }

    function allTenantDomains(tenant) {
      return [...(tenant.domains || []), ...(tenant.merchantDomains || [])];
    }

    function domainActionButtons(domain, permissions) {
      if (!permissions.canAccessProcess) return '<span class="cell-sub">—</span>';
      const unbind = domain.kind.includes('自定义域名')
        ? '<button class="btn danger" data-domain-action="解绑域名" data-domain-id="' + domain.id + '"><i data-lucide="unlink"></i>解绑</button>'
        : '';
      if (domain.status === '未启用') {
        return '<button class="btn primary" data-domain-action="启用域名" data-domain-id="' + domain.id + '"><i data-lucide="circle-check"></i>启用</button>' + unbind;
      }
      if (domain.status === '可用') {
        return '<button class="btn danger" data-domain-action="停用域名" data-domain-id="' + domain.id + '"><i data-lucide="ban"></i>停用</button>' + unbind;
      }
      if (domain.status === '已停用') {
        return '<button class="btn primary" data-domain-action="启用域名" data-domain-id="' + domain.id + '"><i data-lucide="circle-check"></i>启用</button>' + unbind;
      }
      return unbind || '<span class="cell-sub">—</span>';
    }

    function renderDomainRows(domains, permissions) {
      if (!domains.length) {
        return '<tr><td colspan="3" class="table-empty"><strong>暂无域名记录</strong><span>平台录入或系统生成后在此展示。</span></td></tr>';
      }
      return domains.map(domain => {
        return '<tr>' +
          '<td><strong class="mono">' + domain.value + '</strong><br><span class="cell-sub">' + domain.id + '</span></td>' +
          '<td>' + tag(domain.status, domainStatusTone(domain.status)) + '</td>' +
          '<td><div class="table-actions">' + domainActionButtons(domain, permissions) + '</div></td>' +
        '</tr>';
      }).join('');
    }

    function renderIpRuleRows(type, rules, permissions, readonlyTenant) {
      if (!rules.length) {
        return '<tr><td colspan="6" class="table-empty"><strong>暂无规则</strong><span>' + (type === 'login' ? '新增并启用后，规则才参与租户后台登录校验。' : '业务 API 启用前需至少配置并启用一条来源规则。') + '</span></td></tr>';
      }
      return rules.map(rule => {
        const canOperate = permissions.canSecurity && !readonlyTenant;
        const action = canOperate
          ? '<button class="btn ' + (rule.status === '启用' ? 'danger' : 'primary') + '" data-ip-action="toggle" data-ip-type="' + type + '" data-ip-id="' + rule.id + '"><i data-lucide="' + (rule.status === '启用' ? 'pause-circle' : 'play-circle') + '"></i>' + (rule.status === '启用' ? '停用' : '启用') + '</button>'
          : disabledButton(rule.status === '启用' ? '停用' : '启用', rule.status === '启用' ? 'pause-circle' : 'play-circle', readonlyTenant ? '当前租户状态只允许查看' : appState.currentRole + ' 无安全配置权限');
        return '<tr>' +
          '<td class="mono">' + rule.id + '</td>' +
          '<td><strong class="mono">' + rule.value + '</strong></td>' +
          '<td>' + rule.name + '</td>' +
          '<td>' + tag(rule.status, rule.status === '启用' ? 'green' : 'gray') + '</td>' +
          '<td class="mono">' + rule.updatedAt + '</td>' +
          '<td><div class="table-actions">' + action + '</div></td>' +
        '</tr>';
      }).join('');
    }

    function tenantIpRules(tenant, type) {
      return type === 'api' ? tenant.apiIpRules : tenant.loginIpRules;
    }

    function currentIpRuleForAction() {
      const tenant = currentTenantForAction();
      if (!tenant) return null;
      return tenantIpRules(tenant, appState.confirmIpType).find(rule => rule.id === appState.confirmIpId) || null;
    }

    function validCompleteIpv4(value) {
      const parts = String(value || '').split('.');
      return parts.length === 4 && parts.every(part => /^\d{1,3}$/.test(part) && Number(part) >= 0 && Number(part) <= 255 && String(Number(part)) === part);
    }

    function validApiIpRule(value) {
      if (validCompleteIpv4(value)) return true;
      const [ip, prefix] = String(value || '').split('/');
      return validCompleteIpv4(ip) && /^\d{1,2}$/.test(prefix || '') && Number(prefix) >= 0 && Number(prefix) <= 32;
    }

    function openIpAction(action, type, ruleId = '') {
      appState.confirmIpType = type;
      appState.confirmIpId = ruleId;
      const typeName = type === 'api' ? '业务 API 来源 IP' : '租户后台登录 IP';
      openConfirm(action === 'add' ? '新增' + typeName : (currentIpRuleForAction()?.status === '启用' ? '停用' : '启用') + typeName, '两套名单相互独立，不自动同步或联动。', appState.selectedTenant?.id || '');
    }

    function renderIpConfirmForm(title, form, actionBtn) {
      if (!appState.confirmIpType || !/(登录 IP|API 来源 IP)/.test(title)) return false;
      const type = appState.confirmIpType;
      const typeName = type === 'api' ? '业务 API 来源 IP' : '租户后台登录 IP';
      const rule = currentIpRuleForAction();
      document.getElementById('confirmDetail').textContent = type === 'api'
        ? '仅控制租户业务 API 请求来源，不影响租户后台登录。'
        : '仅控制租户管理员后台登录，不影响业务 API 请求。';
      if (title.startsWith('新增')) {
        form.innerHTML =
          '<div class="field wide"><label for="newTenantIpValue">' + typeName + '</label><input id="newTenantIpValue" class="mono" placeholder="' + (type === 'api' ? 'IPv4 或 CIDR，例如 10.20.0.0/24' : '完整 IPv4，例如 103.18.50.80') + '" autocomplete="off"></div>' +
          '<div class="field wide"><label for="newTenantIpName">用途说明</label><input id="newTenantIpName" placeholder="例如管理员办公出口 / API 生产出口"></div>' +
          '<div class="field"><label>初始状态</label><input value="停用" readonly></div>' +
          '<div class="field"><label>名单边界</label><input value="' + (type === 'api' ? '只校验业务 API' : '只校验后台登录') + '" readonly></div>';
        actionBtn.className = 'btn primary';
        actionBtn.innerHTML = '<i data-lucide="save"></i>保存为停用';
        return true;
      }
      if (!rule) return false;
      const enabling = rule.status !== '启用';
      form.innerHTML =
        '<div class="field wide"><label>规则</label><input class="mono" value="' + rule.value + '" readonly></div>' +
        '<div class="field"><label>当前状态</label><input value="' + rule.status + '" readonly></div>' +
        '<div class="field wide"><label for="tenantIpActionReason">操作原因</label><textarea id="tenantIpActionReason" placeholder="必填，写入永久审计"></textarea></div>' +
        '<div class="field wide"><label for="tenantIpAction2fa">当前操作人 Google 2FA</label><input id="tenantIpAction2fa" inputmode="numeric" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code"></div>';
      actionBtn.className = enabling ? 'btn primary' : 'btn danger';
      actionBtn.innerHTML = '<i data-lucide="' + (enabling ? 'play-circle' : 'pause-circle') + '"></i>确认' + (enabling ? '启用' : '停用');
      return true;
    }

    function currentDomainForAction() {
      const tenant = currentTenantForAction();
      if (!tenant) return null;
      return allTenantDomains(tenant).find(item => item.id === appState.confirmDomainId) || null;
    }

    function nextTenantDomainId(tenant) {
      return 'DOM-' + tenant.id.slice(-3) + '-' + String((tenant.domains || []).length + 1).padStart(3, '0');
    }

    function nextMerchantPortalDomainId(tenant) {
      return 'MDOM-' + tenant.id.slice(-3) + '-' + String((tenant.merchantDomains || []).length + 1).padStart(3, '0');
    }

    function openDomainAction(action, domainId = '') {
      appState.confirmDomainId = domainId;
      appState.confirmDomainAction = action;
      openConfirm(action, '域名由平台登记并控制开放状态；全部操作永久写入审计。', appState.selectedTenant?.id || '');
    }

    function renderDomainConfirmForm(title, form, actionBtn) {
      const tenant = currentTenantForAction();
      const domain = currentDomainForAction();
      if (title === '新增自定义域名' || title === '新增商户端域名') {
        const merchantPortal = title === '新增商户端域名';

        form.innerHTML =
          '<div class="field wide"><label for="newCustomDomain">完整域名</label><input id="newCustomDomain" class="mono" placeholder="pay.example.com" autocomplete="off"></div>' +
          '<div class="field"><label>绑定租户</label><input value="' + tenant.id + ' / ' + tenant.name + '" readonly></div>' +
          '<div class="field"><label>入口类型</label><input value="' + (merchantPortal ? '商户端登录' : '租户后台登录') + '" readonly></div>' +
          '<div class="field"><label>初始状态</label><input value="未启用" readonly></div>' +
          '<div class="field wide"><label for="domainAddReason">线下沟通说明</label><textarea id="domainAddReason" placeholder="记录线下沟通对象和配置目的"></textarea></div>';

      document.getElementById('confirmDetail').textContent = '目标域名：' + domain.value + '；本次操作只影响该域名，不改变主体、账号或其他可用域名。';
      form.innerHTML =
        '<div class="field wide"><label>域名</label><input class="mono" value="' + domain.value + '" readonly></div>' +
        '<div class="field"><label>当前状态</label><input value="' + domain.status + '" readonly></div>';
      if (title === '启用域名') {
        form.insertAdjacentHTML('beforeend',
          '<div class="field wide"><div class="notice"><i data-lucide="info"></i><div>启用只开放平台登录准入；DNS、网关和证书仍由运维在线下配置。</div></div></div>' +
          '<div class="field wide"><label for="domainActionReason">启用原因</label><textarea id="domainActionReason" placeholder="必填，永久写入审计"></textarea></div>' +
          '<div class="field wide"><label for="domainAction2fa">当前操作人 2FA</label><input id="domainAction2fa" inputmode="numeric" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code"></div>'
        );
        actionBtn.className = 'btn primary';
        actionBtn.innerHTML = '<i data-lucide="circle-check"></i>确认启用';
        return true;
      }
      if (title === '停用域名') {
        const isLastUsableForType = allTenantDomains(tenant).filter(item => item.subjectType === domain.subjectType && item.status === '可用').length <= 1;
        form.insertAdjacentHTML('beforeend',
          (isLastUsableForType ? '<div class="field wide"><div class="notice danger"><i data-lucide="triangle-alert"></i><div><strong>这是该入口类型最后一个可用域名。</strong><br>停用后将暂时没有可用登录地址，确认后仍可继续。</div></div></div>' : '') +
          '<div class="field wide"><label>会话影响</label><textarea readonly>停用后立即阻止该域名全部新访问，并使该域名下已有登录会话失效；其他可用域名不受影响。</textarea></div>' +
          '<div class="field wide"><label for="domainActionReason">停用原因</label><textarea id="domainActionReason" placeholder="必填，永久写入审计"></textarea></div>' +
          '<div class="field wide"><label for="domainAction2fa">当前操作人 2FA</label><input id="domainAction2fa" inputmode="numeric" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code"></div>'
        );
        actionBtn.className = 'btn danger';
        actionBtn.innerHTML = '<i data-lucide="ban"></i>确认停用';
        return true;
      }
      if (title === '解绑域名') {
        form.insertAdjacentHTML('beforeend',
          '<div class="field wide"><div class="empty compact"><strong>解绑后立即停止域名识别</strong><p>系统将删除当前绑定关系。即使 DNS、网关或证书配置仍存在，访问该域名也无法反查到租户编号并进入登录。</p></div></div>' +
          '<div class="field wide"><label for="domainActionReason">解绑原因</label><textarea id="domainActionReason" placeholder="请说明本次解绑原因"></textarea></div>' +
          '<div class="field wide"><label for="domainAction2fa">当前操作人 2FA</label><input id="domainAction2fa" inputmode="numeric" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code"></div>'
        );
        actionBtn.className = 'btn danger';
        actionBtn.innerHTML = '<i data-lucide="unlink"></i>确认解绑';
        return true;
      }
      return false;
    }

    function clearFilters() {
      document.getElementById('keywordFilter').value = '';
      document.getElementById('globalSearch').value = '';
      document.getElementById('statusFilter').value = 'all';
      document.getElementById('businessFilter').value = 'all';
      applyFilters(false);
    }

    function applyFilters(announce = true) {
      const keyword = document.getElementById('keywordFilter').value.trim().toLowerCase();
      const globalKeyword = document.getElementById('globalSearch').value.trim().toLowerCase();
      const status = document.getElementById('statusFilter').value;
      const business = document.getElementById('businessFilter').value;
      const search = keyword || globalKeyword;

      appState.filtered = tenants.filter(tenant => {
        const text = [tenant.id, tenant.name, tenant.contact, tenant.phone, tenant.domain].join(' ').toLowerCase();
        const okSearch = !search || text.includes(search);
        const okStatus = status === 'all' || tenant.status === status;
        const okBusiness = business === 'all' || tenant.businessTypes.includes(business);
        return tenantInCurrentScope(tenant) && okSearch && okStatus && okBusiness;
      });

      renderRows();
      if (announce) showToast('筛选已更新', '结果已按租户、业务和状态刷新。');
    }

    function openDetailModal(tenantId) {
      const tenant = tenants.find(item => item.id === tenantId);
      if (!tenantInCurrentScope(tenant)) {
        showToast('记录不存在或无权访问', '请返回当前授权范围重新查询。');
        return;
      }
      appState.selectedTenant = tenant;
      document.getElementById('detailTenantName').textContent = tenant.name;
      document.getElementById('detailTenantMeta').textContent = tenant.id + ' / ' + tenant.contact + ' / ' + tenant.domain;
      document.getElementById('detailTags').innerHTML = [
        tag(tenant.status, tenant.statusTone)
      ].join('');
      renderDetailSections(tenant);
      document.getElementById('detailBackdrop').classList.add('open');
      showTenantDialog(document.getElementById('tenantDetailModal'));
      activateDetailTab('overview');
      refreshIcons();
    }

    function closeDetailModal() {
      const dialog = document.getElementById('tenantDetailModal');
      if (!dialog.classList.contains('open')) return;
      document.getElementById('detailBackdrop').classList.remove('open');
      dialog.classList.remove('open');
      dialog.setAttribute('aria-hidden', 'true');
      restoreTenantDialogFocus(dialog, '[data-open="' + (appState.selectedTenant?.id || '') + '"]');
    }

    function saveTenantProfile() {
      const permissions = getPermissions();
      const editing = Boolean(appState.editingTenantId);
      if ((editing && (!permissions.canEdit || !tenantInCurrentScope(tenants.find(item => item.id === appState.editingTenantId)))) || (!editing && !canCreateTenant())) {
        showFormError('tenantFormError', '当前角色没有本次租户资料操作权限，未保存任何数据。');
        return;
      }
      const values = {
        name: document.getElementById('tenantNameInput').value.trim(),
        contact: document.getElementById('contactInput').value.trim(),
        phone: document.getElementById('mobileInput').value.trim(),
        expire: document.getElementById('expireInput').value,
        remark: document.getElementById('tenantRemarkInput').value.trim(),
        domainPrefix: document.getElementById('domainPrefixInput').value.trim().toLowerCase(),
        initialLoginIp: document.getElementById('initialLoginIpInput').value.trim()
      };
      const missing = [
        ['name', 'tenantNameInput'], ['contact', 'contactInput'], ['phone', 'mobileInput'],
        ['expire', 'expireInput']
      ].filter(([key]) => !values[key]).map(([, id]) => id);
      if (missing.length) {
        showFormError('tenantFormError', '请补全租户名称、联系人、联系手机和过期时间。', missing);
        return;
      }
      if (values.phone.replace(/\D/g, '').length < 8) {
        showFormError('tenantFormError', '联系手机格式不正确，请至少填写 8 位数字并保留国家或地区区号。', ['mobileInput']);
        return;
      }
      if (!editing && !/^(?!-)[a-z0-9-]{3,48}(?<!-)$/.test(values.domainPrefix)) {
        showFormError('tenantFormError', '初始域名前缀只能使用小写字母、数字和连字符，长度为 3–48 位，且不能以连字符开头或结尾。', ['domainPrefixInput']);
        return;
      }
      if (!editing && !validCompleteIpv4(values.initialLoginIp)) {
        showFormError('tenantFormError', '初始管理员登录 IP 必填，且仅支持完整 IPv4；不支持 CIDR、范围、通配符或 IPv6。', ['initialLoginIpInput']);
        return;
      }
      const requestedDomain = values.domainPrefix + '.hs-pay.com';
      if (!editing && tenants.flatMap(allTenantDomains).some(item => item.value.toLowerCase() === requestedDomain)) {
        showFormError('tenantFormError', '完整系统域名已存在，请调整域名前缀。', ['domainPrefixInput']);
        return;
      }
      delete values.domainPrefix;
      const initialLoginIp = values.initialLoginIp;
      delete values.initialLoginIp;
      const duplicateName = tenants.find(item => item.id !== appState.editingTenantId && item.name.toLowerCase() === values.name.toLowerCase());
      if (duplicateName) {
        showFormError('tenantFormError', `租户名称已存在，对应租户 ${duplicateName.id}；本次未创建重复租户。`, ['tenantNameInput']);
        return;
      }
      let tenant;
      let action;
      let oneTimePassword = '';
      if (editing) {
        tenant = tenants.find(item => item.id === appState.editingTenantId);
        if (!tenant || tenant.status === '关闭') {
          showFormError('tenantFormError', '租户不存在或已关闭，只能查看历史资料，不能继续编辑。');
          return;
        }
        Object.assign(tenant, values);
        action = '编辑租户资料';
      } else {
        const id = `HS-TEN-${String(appState.tenantSequence++).padStart(3, '0')}`;
        const suffix = id.slice(-3);
        oneTimePassword = `Hs@${suffix}Q8!`;
        tenant = {
          id,
          ...values,
          domain: requestedDomain,
          status: '审核中',
          statusTone: 'orange',
          business: [],
          businessCatalog: [
            { name: '法币代收', status: '未授权', tone: 'gray' },
            { name: '法币代付', status: '未授权', tone: 'gray' }
          ],
          businessTypes: ['法币业务'],
          wallet: 0,
          available: 0,
          frozen: 0,
          wallets: [
            { currency: 'CNY', network: '代收钱包', balance: 0, available: 0, frozen: 0, status: '正常', tone: 'green' },
            { currency: 'CNY', network: '代付钱包', balance: 0, available: 0, frozen: 0, status: '正常', tone: 'green' },
            { currency: 'CNY', network: '提款钱包', balance: 0, available: 0, frozen: 0, status: '正常', tone: 'green' }
          ],
          credit: 0,
          admin: `admin_${suffix}`,
          loginIpRules: [{ id: `LIP-${suffix}-001`, value: initialLoginIp, name: '初始管理员登录 IP', status: '启用', updatedAt: platformNow() }],
          apiIpRules: [],
          channels: [],
          tx: '-',
          feePolicy: '待业务开通绑定套餐',
          audit: []
        };
        tenants.unshift(tenant);
        listWalletSnapshots[id] = {
          withdrawable: { CNY: 0 },
          collection: { CNY: 0 },
          payout: { CNY: 0 }
        };
        action = '新增租户';
      }

      appState.selectedTenant = tenant;
      ensureTenantAccessState(tenant);
      const audit = addTenantAudit(tenant, action, '成功', editing ? '更新租户基础资料，域名配置、管理账号和白名单未改变' : '原子创建租户、唯一超级管理员、已启用初始登录 IP、未启用系统域名和三个 CNY 钱包');
      setOperationReceipt({
        title: editing ? '租户资料已保存并生效' : '租户已创建',
        tenant,
        status: editing ? tenant.status : '审核中',
        detail: editing ? '列表与详情已更新' : '超级管理员及初始登录 IP 已可用于首次登录；API 来源 IP 待后续独立配置',
        audit
      });
      closeTenantModal();
      applyFilters(false);
      showToast(editing ? '租户资料已保存' : '租户已创建', tenant.id + ' 已同步列表、详情和审计日志。');
      if (!editing) openTenantCreatedResult(tenant, oneTimePassword);
    }
