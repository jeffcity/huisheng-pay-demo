    function applyTenantConfirm() {
      if (appState.currentConfirm === '审计详情' || appState.currentConfirm === '租户创建结果' || appState.currentConfirm === '查看域名') {
        closeConfirm();
        return;
      }
      const tenant = currentTenantForAction();
      if (!tenant) {
        showFormError('confirmFormError', '租户记录不存在，本次操作未执行。');
        return;
      }
      if (tenant.status === '关闭') {
        showFormError('confirmFormError', '该租户已关闭，只能查看历史资料，本次操作未执行。');
        return;
      }

      if (appState.currentConfirm === '新增自定义域名' || appState.currentConfirm === '新增商户端域名') {
        const merchantPortal = appState.currentConfirm === '新增商户端域名';
        const raw = document.getElementById('newCustomDomain')?.value.trim().toLowerCase() || '';
        const reason = document.getElementById('domainAddReason')?.value.trim() || '';
        const hostname = raw.replace(/\.$/, '');
        if (!/^(?=.{4,253}$)(?!-)[a-z0-9-]+(?:\.[a-z0-9-]+)+$/.test(hostname) || /[:/?#]/.test(hostname)) {
          showFormError('confirmFormError', '请输入不带协议、端口、路径、参数或锚点的完整公网域名。', ['newCustomDomain']);
          return;
        }
        if (!reason) {
          showFormError('confirmFormError', '请填写线下沟通说明。', ['domainAddReason']);
          return;
        }
        const duplicate = tenants.flatMap(allTenantDomains).find(item => item.value.toLowerCase().replace(/\.$/, '') === hostname);
        if (duplicate) {
          showFormError('confirmFormError', '该域名已经存在，不能重复绑定。', ['newCustomDomain']);
          return;
        }
        const domain = {
          id: merchantPortal ? nextMerchantPortalDomainId(tenant) : nextTenantDomainId(tenant),
          value: hostname,
          kind: merchantPortal ? '商户端自定义域名' : '租户自定义域名',
          subjectType: merchantPortal ? 'merchant_portal' : 'tenant',
          subjectId: tenant.id,
          subjectName: tenant.name,
          status: '未启用',
          lastCheck: '待检测',
          updatedAt: platformNow()
        };
        (merchantPortal ? tenant.merchantDomains : tenant.domains).push(domain);
        finishTenantAction(tenant, {
          action: merchantPortal ? '录入商户端共享域名' : '录入租户自定义域名',
          detail: hostname + ' 已保存为未启用，等待平台确认开放登录准入',
          reason
        });
        return;
      }

      if (['启用域名', '停用域名', '解绑域名'].includes(appState.currentConfirm)) {
        const domain = currentDomainForAction();
        if (!domain) {
          showFormError('confirmFormError', '域名状态已变化，请关闭弹窗并刷新后重试。');
          return;
        }
        const action = appState.currentConfirm;
        const reason = document.getElementById('domainActionReason')?.value.trim() || '';
        const otpField = document.getElementById('domainAction2fa');
        const otp = otpField?.value.trim() || '';
        if (action === '启用域名') {
          if (!['未启用', '已停用'].includes(domain.status)) {
            showFormError('confirmFormError', '只有未启用或已停用的域名可以启用。');
            return;
          }
          if (!reason || !/^\d{6}$/.test(otp)) {
            if (otpField) otpField.value = '';
            showFormError('confirmFormError', '请填写启用原因并输入当前操作人的 6 位 Google 2FA 验证码。', [!reason ? 'domainActionReason' : 'domainAction2fa']);
            return;
          }
          domain.status = '可用';
          domain.updatedAt = platformNow();
          finishTenantAction(tenant, {
            action: '启用域名',
            detail: domain.value + ' 已可识别绑定主体并进入登录流程',
            reason
          });
          return;
        }
        if (action === '停用域名') {
          if (domain.status !== '可用') {
            showFormError('confirmFormError', '只有可用域名可以停用。');
            return;
          }
          if (!reason || !/^\d{6}$/.test(otp)) {
            if (otpField) otpField.value = '';
            showFormError('confirmFormError', '请填写停用原因并输入当前操作人的 6 位 Google 2FA 验证码。', [!reason ? 'domainActionReason' : 'domainAction2fa']);
            return;
          }
          domain.status = '已停用';
          domain.updatedAt = platformNow();
          finishTenantAction(tenant, {
            action: '停用域名',
            detail: domain.value + ' 的新访问和既有会话已失效，其他可用域名继续使用',
            reason
          });
          return;
        }
        if (action === '解绑域名') {
          if (!domain.kind.includes('自定义域名')) {
            showFormError('confirmFormError', '只有自定义域名可以解绑。');
            return;
          }
          if (!reason || !/^\d{6}$/.test(otp)) {
            if (otpField) otpField.value = '';
            showFormError('confirmFormError', '请填写解绑原因并输入当前操作人的 6 位 Google 2FA 验证码。', [!reason ? 'domainActionReason' : 'domainAction2fa']);
            return;
          }
          if (domain.subjectType === 'merchant_portal') tenant.merchantDomains = (tenant.merchantDomains || []).filter(item => item.id !== domain.id);
          else tenant.domains = (tenant.domains || []).filter(item => item.id !== domain.id);
          finishTenantAction(tenant, {
            action: '解绑域名',
            detail: domain.value + ' 已解除当前租户绑定并从当前列表移除',
            reason
          });
          return;
        }
      }

      if (appState.confirmIpType && /(登录 IP|API 来源 IP)/.test(appState.currentConfirm)) {
        const type = appState.confirmIpType;
        const rules = tenantIpRules(tenant, type);
        const typeName = type === 'api' ? '业务 API 来源 IP' : '租户后台登录 IP';
        if (appState.currentConfirm.startsWith('新增')) {
          const value = document.getElementById('newTenantIpValue')?.value.trim() || '';
          const name = document.getElementById('newTenantIpName')?.value.trim() || '';
          const valid = type === 'api' ? validApiIpRule(value) : validCompleteIpv4(value);
          if (!valid) {
            showFormError('confirmFormError', type === 'api' ? '请输入有效的完整 IPv4 或 CIDR；不支持 IPv6、范围或通配符。' : '请输入有效的完整 IPv4；不支持 CIDR、IPv6、范围或通配符。', ['newTenantIpValue']);
            return;
          }
          if (!name) {
            showFormError('confirmFormError', '请填写用途说明。', ['newTenantIpName']);
            return;
          }
          if (rules.some(rule => rule.value === value)) {
            showFormError('confirmFormError', '该名单内已存在相同规则，不能重复新增。', ['newTenantIpValue']);
            return;
          }
          const prefix = type === 'api' ? 'AIP' : 'LIP';
          const sequence = String(Math.max(0, ...rules.map(rule => Number(rule.id.split('-').pop()) || 0)) + 1).padStart(3, '0');
          rules.push({ id: prefix + '-' + tenant.id.slice(-3) + '-' + sequence, value, name, status: '停用', updatedAt: platformNow() });
          finishTenantAction(tenant, {
            action: '新增' + typeName,
            detail: value + ' 已保存为停用，请在规则行显式启用后再参与校验',
            reason: name
          });
          return;
        }

        const rule = currentIpRuleForAction();
        if (!rule) {
          showFormError('confirmFormError', 'IP 规则已变化，请关闭弹窗并刷新后重试。');
          return;
        }
        const reason = document.getElementById('tenantIpActionReason')?.value.trim() || '';
        const otpField = document.getElementById('tenantIpAction2fa');
        const otp = otpField?.value.trim() || '';
        if (!reason || !/^\d{6}$/.test(otp)) {
          if (otpField) otpField.value = '';
          showFormError('confirmFormError', '请填写操作原因并输入当前操作人的 6 位 Google 2FA 验证码。', [!reason ? 'tenantIpActionReason' : 'tenantIpAction2fa']);
          return;
        }
        const enabling = rule.status !== '启用';
        if (!enabling) {
          const activeCount = rules.filter(item => item.status === '启用').length;
          if (type === 'login' && ['正常', '审核中'].includes(tenant.status) && activeCount <= 1) {
            otpField.value = '';
            showFormError('confirmFormError', '正常或审核中的租户必须保留至少一条启用的后台登录 IP，已阻断停用。');
            return;
          }
          const hasLiveBusiness = (tenant.businessCatalog || []).some(item => item.status === '已授权');
          if (type === 'api' && hasLiveBusiness && activeCount <= 1) {
            otpField.value = '';
            showFormError('confirmFormError', '当前租户已有启用业务，必须保留至少一条启用的 API 来源 IP，已阻断停用。');
            return;
          }
        }
        rule.status = enabling ? '启用' : '停用';
        rule.updatedAt = platformNow();
        finishTenantAction(tenant, {
          action: (enabling ? '启用' : '停用') + typeName,
          detail: rule.value + ' 已' + (enabling ? '启用并参与' : '停用且不再参与') + (type === 'api' ? '业务 API 来源校验' : '租户后台登录校验'),
          reason
        });
        return;
      }

      if (appState.currentConfirm === '重置账号') {
        const newAccount = document.getElementById('resetNewAccount').value.trim();
        const otp = document.getElementById('resetOperator2fa').value.trim();
        if (!newAccount || !/^\d{6}$/.test(otp)) {
          document.getElementById('resetOperator2fa').value = '';
          showFormError('confirmFormError', '需要输入新的管理账号，并填写当前操作人的 6 位 Google 2FA 验证码。', [!newAccount ? 'resetNewAccount' : 'resetOperator2fa']);
          return;
        }
        if (tenants.some(item => item.id !== tenant.id && item.admin === newAccount)) {
          document.getElementById('resetOperator2fa').value = '';
          showFormError('confirmFormError', '该管理账号已被其他租户使用，请更换账号。', ['resetNewAccount']);
          return;
        }
        tenant.admin = newAccount;
        finishTenantAction(tenant, { action: '重置管理账号', detail: '新账号已生效，原账号会话已失效', reason: '通过当前操作人 Google 2FA 重置租户管理账号' });
        return;
      }

      if (appState.currentConfirm === '重置密码' || appState.currentConfirm === '重置 2FA') {
        const fieldId = appState.currentConfirm === '重置密码' ? 'resetPasswordOperator2fa' : 'reset2faOperator2fa';
        const otp = document.getElementById(fieldId).value.trim();
        if (!/^\d{6}$/.test(otp)) {
          document.getElementById(fieldId).value = '';
          showFormError('confirmFormError', '需要填写当前操作人的 6 位 Google 2FA 验证码。', [fieldId]);
          return;
        }
        const action = appState.currentConfirm;
        finishTenantAction(tenant, {
          action,
          detail: action === '重置密码' ? '租户需通过重置流程设置新密码' : '旧绑定已解除，下次登录必须重新绑定',
          reason: action + '已通过当前操作人 Google 2FA 验证'
        });
        return;
      }

      const reason = document.getElementById('confirmReason')?.value.trim() || '';
      const otpField = document.getElementById('confirmOperator2fa');
      const otp = otpField?.value.trim() || '';
      if (!reason || !/^\d{6}$/.test(otp)) {
        if (otpField) otpField.value = '';
        showFormError('confirmFormError', '请填写操作原因并输入当前操作人的 6 位 Google 2FA 验证码。', [!reason ? 'confirmReason' : 'confirmOperator2fa']);
        return;
      }

      if (appState.currentConfirm === '停用租户' || appState.currentConfirm === '启用租户' || appState.currentConfirm === '关闭租户') {
        const expected = appState.currentConfirm === '停用租户' ? '正常' : appState.currentConfirm === '启用租户' ? '停用' : null;
        if (expected && tenant.status !== expected) {
          otpField.value = '';
          showFormError('confirmFormError', `租户状态已变为${tenant.status}，请关闭弹窗并刷新后重新确认。`);
          return;
        }
        tenant.status = appState.currentConfirm === '停用租户' ? '停用' : appState.currentConfirm === '启用租户' ? '正常' : '关闭';
        tenant.statusTone = statusTone[tenant.status];
        finishTenantAction(tenant, {
          action: appState.currentConfirm,
          detail: tenant.status === '正常'
            ? '租户层级后续登录与新业务资格已恢复；下级对象状态保持不变'
            : tenant.status === '停用'
              ? '租户端、商户端后续登录与全部新业务已阻止；历史与在途继续保留'
              : '租户转为历史只读',
          reason
        });
        return;
      }

      if (appState.currentConfirm === '关闭业务授权' || appState.currentConfirm === '发起业务授权' || appState.currentConfirm === '重新开通业务授权') {
        const item = (tenant.businessCatalog || []).find(entry => entry.name === appState.confirmBusinessName);
        if (!item) {
          otpField.value = '';
          showFormError('confirmFormError', '业务配置不存在，本次授权未执行。');
          return;
        }
        const enabling = appState.currentConfirm !== '关闭业务授权';
        if ((enabling && item.status === '已授权') || (!enabling && item.status !== '已授权')) {
          otpField.value = '';
          showFormError('confirmFormError', '业务授权状态已变化，请关闭弹窗并刷新后重新确认。');
          return;
        }
        if (enabling) {
          const hasFeeBinding = Boolean(tenant.feePolicy) && !/待业务开通|待计费/.test(tenant.feePolicy);
          const hasUsableChannel = (tenant.channels || []).some(channel => channel.startsWith(item.name + ' / '));
          const hasActiveApiIp = (tenant.apiIpRules || []).some(rule => rule.status === '启用');
          if (tenant.status !== '正常' || !hasFeeBinding || !hasUsableChannel || !hasActiveApiIp) {
            otpField.value = '';
            const missing = [tenant.status !== '正常' && '租户当前不是正常状态', !hasFeeBinding && '没有唯一启用套餐', !hasUsableChannel && '没有可用授权通道', !hasActiveApiIp && '没有已启用的业务 API 来源 IP'].filter(Boolean).join('；');
            showFormError('confirmFormError', `${missing}，业务继续保持原状态，本次未重置任何下级状态。`);
            return;
          }
        }
        item.status = enabling ? '已授权' : '已停用';
        item.tone = enabling ? 'green' : 'red';
        tenant.business = enabling
          ? Array.from(new Set([...(tenant.business || []), item.name]))
          : (tenant.business || []).filter(name => name !== item.name);
        finishTenantAction(tenant, {
          action: enabling ? '开通业务授权' : '关闭业务授权',
          detail: `${item.name}${enabling ? '已恢复后续新单资格；下级状态保持不变' : '已阻断三端新单；存量订单、历史通道和费用快照保留'}`,
          reason
        });
        return;
      }

      showFormError('confirmFormError', '当前操作没有可执行的业务规则，本次未写入任何数据。');
    }

    function bindEvents() {
      document.addEventListener('click', event => {
        const receiptTenant = event.target.closest('[data-receipt-tenant]');
        if (receiptTenant) {
          openDetailModal(receiptTenant.dataset.receiptTenant);
          return;
        }

        const receiptAudit = event.target.closest('[data-receipt-audit]');
        if (receiptAudit) {
          openAuditDetail(receiptAudit.dataset.receiptAudit);
          return;
        }

        const masterNav = event.target.closest('[data-master-page]');
        if (masterNav) {
          const route = platformMasterRoutes[masterNav.dataset.masterPage];
          if (route) navigatePlatformMaster(masterNav.dataset.masterPage, route);
          else showToast('当前页面', masterNav.dataset.masterNote);
          return;
        }

        const detailTabBtn = event.target.closest('.detail-tab');
        if (detailTabBtn) {
          activateDetailTab(detailTabBtn.dataset.tab);
          return;
        }

        const clearBtn = event.target.closest('[data-clear-filters]');
        if (clearBtn) {
          clearFilters();
          return;
        }

        const auditDetailBtn = event.target.closest('[data-audit-detail]');
        if (auditDetailBtn) {
          openAuditDetail(auditDetailBtn.dataset.auditDetail);
          return;
        }

        const openWalletBtn = event.target.closest('[data-open-wallet]');
        if (openWalletBtn) {
          openDetailModal(openWalletBtn.dataset.openWallet);
          activateDetailTab('wallet');
          return;
        }

        const domainActionBtn = event.target.closest('[data-domain-action]');
        if (domainActionBtn) {
          openDomainAction(domainActionBtn.dataset.domainAction, domainActionBtn.dataset.domainId || '');
          return;
        }

        const ipActionBtn = event.target.closest('[data-ip-action]');
        if (ipActionBtn) {
          openIpAction(ipActionBtn.dataset.ipAction, ipActionBtn.dataset.ipType, ipActionBtn.dataset.ipId || '');
          return;
        }

        const domainFilterBtn = event.target.closest('[data-domain-filter]');
        if (domainFilterBtn) {
          const keyword = (document.getElementById('domainKeyword')?.value || '').trim().toLowerCase();
          const status = document.getElementById('domainStatusFilter')?.value || '';
          document.querySelectorAll('#tenantDomainRows tr, #merchantDomainRows tr').forEach(row => {
            const text = row.textContent.toLowerCase();
            row.hidden = Boolean((keyword && !text.includes(keyword)) || (status && !text.includes(status)));
          });
          showToast('域名筛选已更新', '已按关键词和状态刷新当前租户域名。');
          return;
        }

        const domainResetBtn = event.target.closest('[data-domain-reset]');
        if (domainResetBtn) {
          const keyword = document.getElementById('domainKeyword');
          const status = document.getElementById('domainStatusFilter');
          if (keyword) keyword.value = '';
          if (status) status.value = '';
          document.querySelectorAll('#tenantDomainRows tr, #merchantDomainRows tr').forEach(row => { row.hidden = false; });
          showToast('域名筛选已重置', '已展示当前租户全部域名记录。');
          return;
        }

        const openBtn = event.target.closest('[data-open]');
        if (openBtn) {
          openDetailModal(openBtn.dataset.open);
          return;
        }

        const editBtn = event.target.closest('[data-edit]');
        if (editBtn) {
          openTenantModal('edit', editBtn.dataset.edit);
          return;
        }

        const confirmBtn = event.target.closest('[data-confirm]');
        if (confirmBtn) {
          openConfirm(confirmBtn.dataset.confirm, confirmBtn.dataset.confirmDetail, confirmBtn.dataset.confirmTenant, confirmBtn.dataset.confirmBusiness);
        }
      });

      document.getElementById('applyFilter').addEventListener('click', applyFilters);
      document.getElementById('clearFilter').addEventListener('click', clearFilters);
      document.getElementById('globalSearch').addEventListener('input', applyFilters);
      document.getElementById('roleSelect').addEventListener('change', event => {
        appState.currentRole = event.target.value;
        applyFilters(false);
        if (!tenantInCurrentScope(appState.selectedTenant)) appState.selectedTenant = appState.filtered[0] || null;
        renderDetailSections(appState.selectedTenant);
        showToast('角色视角已切换', '当前按 ' + appState.currentRole + ' 展示可操作入口。');
      });
      document.getElementById('keywordFilter').addEventListener('keydown', event => {
        if (event.key === 'Enter') applyFilters();
      });
      document.getElementById('refreshBtn').addEventListener('click', () => {
        applyFilters(false);
        showToast('数据已刷新', '已保留当前筛选并重新加载租户列表。');
      });
      document.getElementById('createTenantTop').addEventListener('click', () => openTenantModal('create'));
      document.getElementById('domainPrefixInput').addEventListener('input', event => {
        const normalized = event.target.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
        document.getElementById('domainInput').value = normalized ? normalized + '.hs-pay.com' : '请输入域名前缀';
      });
      document.getElementById('saveTenantBtn').addEventListener('click', saveTenantProfile);
      document.querySelectorAll('[data-close-modal]').forEach(button => button.addEventListener('click', closeTenantModal));
      document.querySelectorAll('[data-close-confirm]').forEach(button => button.addEventListener('click', closeConfirm));
      document.getElementById('confirmActionBtn').addEventListener('click', applyTenantConfirm);
      document.getElementById('detailClose').addEventListener('click', closeDetailModal);
      document.getElementById('detailBackdrop').addEventListener('click', closeDetailModal);
      document.getElementById('modalBackdrop').addEventListener('click', () => {
        closeTenantModal();
        closeConfirm();
      });
      document.querySelectorAll('.detail-tab').forEach(button => {
        button.addEventListener('click', () => activateDetailTab(button.dataset.tab));
        button.addEventListener('keydown', event => {
          if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
          event.preventDefault();
          const tabs = [...document.querySelectorAll('.detail-tab')];
          const current = tabs.indexOf(button);
          const next = event.key === 'ArrowRight' ? (current + 1) % tabs.length : (current - 1 + tabs.length) % tabs.length;
          activateDetailTab(tabs[next].dataset.tab);
          tabs[next].focus();
        });
      });
      document.addEventListener('keydown', event => {
        const dialogs = ['confirmModal', 'tenantModal', 'tenantDetailModal']
          .map(id => document.getElementById(id))
          .filter(dialog => dialog.classList.contains('open'));
        const topDialog = dialogs[0];
        if (!topDialog) return;
        if (event.key === 'Escape') {
          if (topDialog.id === 'confirmModal') closeConfirm();
          else if (topDialog.id === 'tenantModal') closeTenantModal();
          else closeDetailModal();
        } else if (event.key === 'Tab') {
          trapTenantDialogFocus(event, topDialog);
        }
      });
    }

    function init() {
      applyFilters(false);
      renderOperationReceipt();
      bindEvents();
      applyPlatformTenantAuthorization();
      const initialRoute = window.__UNIFIED_DEMO_HASH || window.location.hash.replace('#', '');
      if (initialRoute.startsWith('detail-')) {
        openDetailModal(tenants[0].id);
        activateDetailTab(initialRoute.replace('detail-', ''));
      } else if (initialRoute === 'create') {
        openTenantModal('create');
      }
      refreshIcons();
    }

    window.__platformTenantTest = {
      getTenants: () => tenants.map(tenant => ({
        id: tenant.id,
        name: tenant.name,
        contact: tenant.contact,
        status: tenant.status,
        admin: tenant.admin,
        domain: tenant.domain,
        domains: allTenantDomains(tenant).map(domain => ({ ...domain })),
        businessCatalog: (tenant.businessCatalog || []).map(item => ({ ...item })),
        wallets: (tenant.wallets || []).map(wallet => ({ ...wallet }))
      })),
      getAudits: () => auditEvents.map(item => ({ ...item })),
      getLatestReceipt: () => appState.latestReceipt ? { ...appState.latestReceipt } : null,
      getCurrentScope: () => ({ role: appState.currentRole, scopeCode: getPermissions().scopeCode, tenantIds: [...getPermissions().tenantIds] }),
      getVisibleTenantIds: () => appState.filtered.map(tenant => tenant.id),
      canCreateTenant: () => canCreateTenant(),
      canAccessTenant: tenantId => tenantInCurrentScope(tenants.find(tenant => tenant.id === tenantId))
    };

    init();
    }
  </script>
  <script>
    (() => {
      const liveId = "hsFormErrorLive";
      const nativeErrorClass = "hs-native-field-error";
      const errorSelector = `.form-error, .field-error, .error-text, [data-error], .${nativeErrorClass}`;
      const fieldSelector = 'input:not([type="hidden"]), select, textarea';
      const fieldContainerSelector = '.field, .form-field, .modal-field, .blue-row, .setting-row, .filter-item, .form-group, .control-group';
      let errorSequence = 0;
      let fieldLabelSequence = 0;

      function normalizedLabelText(label) {
        if (!(label instanceof HTMLElement)) return "";
        const copy = label.cloneNode(true);
        copy.querySelectorAll("input, select, textarea, button, svg, i").forEach(node => node.remove());
        return copy.textContent.replace(/\s+/g, " ").trim();
      }

      function hasAccessibleFieldName(field) {
        if ((field.getAttribute("aria-label") || "").trim()) return true;
        const labelledByText = (field.getAttribute("aria-labelledby") || "")
          .split(/\s+/)
          .filter(Boolean)
          .map(id => document.getElementById(id)?.textContent?.replace(/\s+/g, " ").trim() || "")
          .filter(Boolean)
          .join(" ");
        if (labelledByText) return true;
        return Array.from(field.labels || []).some(label => normalizedLabelText(label));
      }

      function upgradeFieldName(field) {
        if (!(field instanceof HTMLElement) || !field.matches(fieldSelector) || hasAccessibleFieldName(field)) return;
        const container = field.closest(fieldContainerSelector);
        const label = container?.querySelector("label");
        if (!label || !normalizedLabelText(label)) return;
        if (!label.id) label.id = `hsFieldLabel${++fieldLabelSequence}`;
        const ids = new Set((field.getAttribute("aria-labelledby") || "").split(/\s+/).filter(Boolean));
        ids.add(label.id);
        field.setAttribute("aria-labelledby", [...ids].join(" "));
      }

      function ensureNativeErrorStyles() {
        if (document.getElementById("hsNativeFieldErrorStyles")) return;
        const style = document.createElement("style");
        style.id = "hsNativeFieldErrorStyles";
        style.textContent = `
          .${nativeErrorClass} {
            display: block;
            flex: 0 0 100%;
            width: 100%;
            max-width: 100%;
            margin: 6px 0 0;
            color: var(--color-danger, var(--danger, #b42318));
            font-size: 12px;
            font-weight: 500;
            line-height: 1.45;
          }
          .${nativeErrorClass}[hidden] { display: none !important; }
        `;
        document.head.appendChild(style);
      }

      function fieldKey(field) {
        if (!field.dataset.hsFeedbackKey) {
          field.dataset.hsFeedbackKey = field.id || `hsFeedbackField${++errorSequence}`;
        }
        return field.dataset.hsFeedbackKey;
      }

      function ensureLiveRegion() {
        let live = document.getElementById(liveId);
        if (live) return live;
        live = document.createElement("div");
        live.id = liveId;
        live.setAttribute("role", "alert");
        live.setAttribute("aria-live", "assertive");
        live.setAttribute("aria-atomic", "true");
        live.style.cssText = "position:fixed;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0";
        document.body.appendChild(live);
        return live;
      }

      function upgradeErrorNode(node) {
        if (!(node instanceof HTMLElement) || !node.matches(errorSelector)) return null;
        if (!node.id) node.id = `hsFieldError${++errorSequence}`;
        node.setAttribute("role", "alert");
        node.setAttribute("aria-live", "assertive");
        node.setAttribute("aria-atomic", "true");
        return node;
      }

      function ensureNativeError(field) {
        let node = field.dataset.hsNativeErrorId
          ? document.getElementById(field.dataset.hsNativeErrorId)
          : null;
        if (!node) {
          node = document.createElement("div");
          node.id = `hsNativeFieldError${++errorSequence}`;
          node.className = nativeErrorClass;
          node.dataset.hsNativeError = "true";
          node.hidden = true;
          field.insertAdjacentElement("afterend", node);
          field.dataset.hsNativeErrorId = node.id;
        }
        return upgradeErrorNode(node);
      }

      function linkField(field, errorNode, focusField = true) {
        if (!(field instanceof HTMLElement) || !field.matches("input, select, textarea, [contenteditable='true']")) return;
        field.setAttribute("aria-invalid", "true");
        const ids = new Set((field.getAttribute("aria-describedby") || "").split(/\s+/).filter(Boolean));
        ids.add(errorNode.id);
        field.setAttribute("aria-describedby", [...ids].join(" "));
        errorNode.dataset.hsErrorFor = fieldKey(field);
        if (!focusField || !field.isConnected) return;
        field.focus({ preventScroll: true });
        requestAnimationFrame(() => {
          if (!field.isConnected || document.activeElement !== field) return;
          field.scrollIntoView({ block: "nearest", inline: "nearest" });
        });
      }

      function clearField(field) {
        if (!(field instanceof HTMLElement) || field.getAttribute("aria-invalid") !== "true") return;
        field.removeAttribute("aria-invalid");
        const key = field.dataset.hsFeedbackKey || field.id || "";
        const ids = (field.getAttribute("aria-describedby") || "").split(/\s+/).filter(Boolean);
        const kept = ids.filter(id => id !== liveId && document.getElementById(id)?.dataset.hsErrorFor !== key);
        if (kept.length) field.setAttribute("aria-describedby", kept.join(" "));
        else field.removeAttribute("aria-describedby");
        ids.forEach(id => {
          const node = document.getElementById(id);
          if (!node || node.dataset.hsErrorFor !== key) return;
          if (node.dataset.hsNativeError === "true") {
            if (field.dataset.hsNativeErrorId === node.id) delete field.dataset.hsNativeErrorId;
            node.remove();
            return;
          }
          node.textContent = "";
          node.classList.remove("show");
          if (node.hasAttribute("hidden")) node.hidden = true;
          delete node.dataset.hsErrorFor;
        });
      }

      function report(message, field = null, errorNode = null, focusField = true) {
        const live = ensureLiveRegion();
        const target = upgradeErrorNode(errorNode) || live;
        if (errorNode && message) {
          target.textContent = message;
          target.hidden = false;
          target.classList.add("show");
        }
        live.textContent = "";
        requestAnimationFrame(() => { live.textContent = message || "请检查表单内容。"; });
        if (field) linkField(field, target, focusField);
        return false;
      }

      window.HSFormFeedback = { report, clear: clearField, upgrade: upgradeErrorNode };
      ensureNativeErrorStyles();
      ensureLiveRegion();
      document.querySelectorAll(errorSelector).forEach(upgradeErrorNode);
      document.querySelectorAll(fieldSelector).forEach(upgradeFieldName);

      document.addEventListener("invalid", event => {
        const field = event.target;
        if (!(field instanceof HTMLElement)) return;
        const firstInvalid = field.form?.querySelector(":invalid");
        const error = ensureNativeError(field);
        report(
          field.validationMessage || "请检查此字段。",
          field,
          error,
          !firstInvalid || firstInvalid === field
        );
      }, true);

      ["input", "change"].forEach(type => {
        document.addEventListener(type, event => {
          const field = event.target;
          if (!(field instanceof HTMLElement)) return;
          if (field.matches("input, select, textarea") && field.willValidate && !field.validity.valid) return;
          clearField(field);
        }, true);
      });

      new MutationObserver(records => {
        records.forEach(record => {
          if (record.target instanceof HTMLElement) {
            const node = record.target.matches?.(errorSelector) ? record.target : record.target.closest?.(errorSelector);
            if (node) {
              upgradeErrorNode(node);
              if (node.textContent.trim() && !node.hidden) ensureLiveRegion().textContent = node.textContent.trim();
            }
          }
          record.addedNodes.forEach(added => {
            if (!(added instanceof HTMLElement)) return;
            if (added.matches(errorSelector)) upgradeErrorNode(added);
            added.querySelectorAll?.(errorSelector).forEach(upgradeErrorNode);
            if (added.matches(fieldSelector)) upgradeFieldName(added);
            added.querySelectorAll?.(fieldSelector).forEach(upgradeFieldName);
            const labelContainers = added.matches("label") ? [added] : Array.from(added.querySelectorAll?.("label") || []);
            labelContainers.forEach(label => label.closest(fieldContainerSelector)?.querySelectorAll(fieldSelector).forEach(upgradeFieldName));
          });
        });
      }).observe(document.body, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["class", "hidden"] });
    })();
  </script>

</body>
</html>
