<!-- PROJECT: 汇盛支付平台端 -->
<!-- PAGES: 首页数据看板 -->
<!-- FIDELITY: high -->
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>汇盛支付平台端 · 首页数据看板</title>
  <script data-platform-route-targets='{"home":"platform.dashboard.view","business":"platform.business_grant.view","wallets":"platform.wallet.view","funds":"platform.fund_task.view","report":"platform.report.view","ledger":"platform.ledger.view","orders":"platform.order.view","audit":"platform.audit.view","tickets":"platform.ticket.view"}'>
(() => {
  "use strict";

  const MODE_PARAM = "authRoute";
  const TICKET_PARAM = "authTicket";
  const TICKET_PREFIX = "hs.platform.auth-route.ticket.";
  const CURRENT_FACT_KEY = "hs.platform.auth-route.current-fact";
  const TICKET_KIND = "hs-platform-auth-route-v1";
  const TICKET_TTL_MS = 15_000;
  const MAX_CLOCK_SKEW_MS = 1_000;
  const AUTHENTICATION_COMPLETION_TTL_MS = 120_000;

  const currentScript = document.currentScript;
  const routeTargets = parseRouteTargets(currentScript?.dataset.platformRouteTargets);
  const query = new URLSearchParams(window.location.search);
  const routeMode = query.get(MODE_PARAM) === "1" ? "authRoute" : "preview";
  const state = {
    mode: routeMode,
    allowed: routeMode === "preview",
    reason: routeMode === "preview" ? "preview" : "pending",
    ticket: null,
    authorization: null
  };
  let loginIssuerRegistered = false;

  document.documentElement.dataset.hsPlatformRouteMode = routeMode;
  if (routeMode === "authRoute") {
    document.documentElement.dataset.hsPlatformAuthState = "pending";
    installPendingStyle();
    Object.assign(state, consumeNavigationTicket(routeTargets));
    document.documentElement.dataset.hsPlatformAuthState = state.allowed ? "authorized" : "blocked";
    if (!state.allowed) {
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => renderBlockedRoute(state.reason), { once: true });
      } else {
        renderBlockedRoute(state.reason);
      }
    }
  }

  function parseRouteTargets(raw) {
    if (!raw) return null;
    try {
      const parsed = JSON.parse(raw);
      return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : null;
    } catch {
      return null;
    }
  }

  function installPendingStyle() {
    const style = document.createElement("style");
    style.id = "hsPlatformAuthRoutePendingStyle";
    style.textContent = `
      html[data-hs-platform-route-mode="authRoute"][data-hs-platform-auth-state="pending"] body > *,
      html[data-hs-platform-route-mode="authRoute"][data-hs-platform-auth-state="blocked"] body > * {
        display: none !important;
      }
    `;
    document.head.appendChild(style);
  }

  function safeSessionGet(key) {
    try {
      return window.sessionStorage.getItem(key);
    } catch {
      return null;
    }
  }

  function safeSessionSet(key, value) {
    try {
      window.sessionStorage.setItem(key, value);
      return true;
    } catch {
      return false;
    }
  }

  function safeSessionRemove(key) {
    try {
      window.sessionStorage.removeItem(key);
    } catch {
      // A storage failure is handled by the caller as a closed route.
    }
  }

  function readJson(raw) {
    if (!raw) return null;
    try {
      return JSON.parse(raw);
    } catch {
      return null;
    }
  }

  function positiveInteger(value) {
    return Number.isInteger(Number(value)) && Number(value) > 0;
  }

  function activePagePermissions(fact) {
    const roles = Array.isArray(fact?.roles) ? fact.roles : [];
    return new Set(roles
      .filter(role => role?.enabled === true || role?.status === "启用")
      .flatMap(role => Array.isArray(role.pagePermissions) ? role.pagePermissions : []));
  }

  function activeActionPermissions(fact) {
    const roles = Array.isArray(fact?.roles) ? fact.roles : [];
    return new Set(roles
      .filter(role => role?.enabled === true || role?.status === "启用")
      .flatMap(role => Array.isArray(role.actionPermissions) ? role.actionPermissions : []));
  }

  function normalizedDataScope(fact) {
    const scope = fact?.dataScope;
    const scopeCode = typeof scope?.scopeCode === "string" && scope.scopeCode.trim()
      ? scope.scopeCode.trim()
      : "platform.all_tenants";
    const tenantIds = Array.isArray(scope?.tenantIds) ? [...new Set(scope.tenantIds.map(String).filter(Boolean))] : [];
    return { scopeCode, tenantIds };
  }

  function activePermissionSnapshot(fact) {
    return {
      pagePermissions: [...activePagePermissions(fact)],
      actionPermissions: [...activeActionPermissions(fact)],
      dataScope: normalizedDataScope(fact),
      sensitiveAccess: fact?.sensitiveAccess === true
    };
  }

  function sameJson(left, right) {
    return JSON.stringify(left) === JSON.stringify(right);
  }

  function deepFreeze(value) {
    if (!value || typeof value !== "object" || Object.isFrozen(value)) return value;
    Object.values(value).forEach(deepFreeze);
    return Object.freeze(value);
  }

  function factIsCurrent(fact, now = Date.now()) {
    if (!fact || typeof fact.account !== "string" || !fact.account.trim()) return false;
    if (fact.status && !["active", "正常", "启用"].includes(fact.status)) return false;
    if (fact.factStatus && fact.factStatus !== "current") return false;
    if (fact.expiresAt && Number(new Date(fact.expiresAt)) <= now) return false;
    return positiveInteger(fact.permissionVersion) && positiveInteger(fact.menuVersion) && Array.isArray(fact.roles);
  }

  function currentRouteKey() {
    return window.location.hash.replace(/^#/, "");
  }

  function expectedPermissionFor(targets) {
    if (!targets) return null;
    const key = currentRouteKey();
    return typeof targets[key] === "string" && targets[key].trim() ? targets[key].trim() : null;
  }

  function consumeNavigationTicket(targets) {
    const nonce = query.get(TICKET_PARAM) || "";
    if (!/^[a-zA-Z0-9-]{16,80}$/.test(nonce)) return { allowed: false, reason: "missing-ticket", ticket: null };

    const ticketKey = `${TICKET_PREFIX}${nonce}`;
    const ticket = readJson(safeSessionGet(ticketKey));
    safeSessionRemove(ticketKey);
    const fact = readJson(safeSessionGet(CURRENT_FACT_KEY));
    const now = Date.now();
    const expectedPermission = expectedPermissionFor(targets);

    if (!ticket || ticket.kind !== TICKET_KIND || ticket.nonce !== nonce) return { allowed: false, reason: "missing-ticket", ticket: null };
    if (!Number.isFinite(ticket.issuedAt) || !Number.isFinite(ticket.expiresAt) || ticket.issuedAt > now + MAX_CLOCK_SKEW_MS || ticket.expiresAt < now || ticket.expiresAt - ticket.issuedAt > TICKET_TTL_MS) {
      return { allowed: false, reason: "expired-ticket", ticket: null };
    }
    if (!expectedPermission || ticket.pagePermission !== expectedPermission) return { allowed: false, reason: "wrong-target", ticket: null };
    if (ticket.targetPath !== window.location.pathname || ticket.targetRoute !== currentRouteKey()) return { allowed: false, reason: "wrong-target", ticket: null };
    if (!factIsCurrent(fact, now) || fact.account !== ticket.account) return { allowed: false, reason: "stale-fact", ticket: null };
    if (Number(fact.permissionVersion) !== Number(ticket.permissionVersion) || Number(fact.menuVersion) !== Number(ticket.menuVersion)) {
      return { allowed: false, reason: "stale-version", ticket: null };
    }
    if (!activePagePermissions(fact).has(expectedPermission)) return { allowed: false, reason: "permission-denied", ticket: null };
    const snapshot = activePermissionSnapshot(fact);
    if (
      !sameJson(ticket.pagePermissions, snapshot.pagePermissions) ||
      !sameJson(ticket.actionPermissions, snapshot.actionPermissions) ||
      !sameJson(ticket.dataScope, snapshot.dataScope) ||
      ticket.sensitiveAccess !== snapshot.sensitiveAccess
    ) {
      return { allowed: false, reason: "stale-fact", ticket: null };
    }
    const authorization = deepFreeze({
      account: ticket.account,
      permissionVersion: ticket.permissionVersion,
      menuVersion: ticket.menuVersion,
      pagePermission: ticket.pagePermission,
      targetPath: ticket.targetPath,
      targetRoute: ticket.targetRoute,
      pagePermissions: [...snapshot.pagePermissions],
      actionPermissions: [...snapshot.actionPermissions],
      dataScope: { ...snapshot.dataScope, tenantIds: [...snapshot.dataScope.tenantIds] },
      sensitiveAccess: snapshot.sensitiveAccess
    });
    return { allowed: true, reason: "authorized", ticket: Object.freeze({ ...ticket }), authorization };
  }

  function clearOutstandingTickets() {
    try {
      for (let index = window.sessionStorage.length - 1; index >= 0; index -= 1) {
        const key = window.sessionStorage.key(index);
        if (key?.startsWith(TICKET_PREFIX)) window.sessionStorage.removeItem(key);
      }
    } catch {
      // The following write will fail closed if storage is unavailable.
    }
  }

  function randomNonce() {
    if (window.crypto?.randomUUID) return window.crypto.randomUUID();
    const bytes = new Uint8Array(24);
    window.crypto?.getRandomValues?.(bytes);
    return Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("") || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  }

  function issueTicketFromFact({ account, fact, route } = {}) {
    const now = Date.now();
    const target = route?.target;
    const normalizedAccount = String(account || fact?.account || "").trim().toLowerCase();
    if (!target || !factIsCurrent(fact, now) || fact.account !== normalizedAccount || !activePagePermissions(fact).has(target.pagePermission)) {
      return { ok: false, reason: "permission-fact-unavailable", href: null };
    }

    let targetUrl;
    try {
      targetUrl = new URL(target.href, window.location.href);
    } catch {
      return { ok: false, reason: "invalid-target", href: null };
    }

    const nonce = randomNonce();
    const snapshot = activePermissionSnapshot(fact);
    const ticket = {
      kind: TICKET_KIND,
      nonce,
      account: normalizedAccount,
      permissionVersion: Number(fact.permissionVersion),
      menuVersion: Number(fact.menuVersion),
      pagePermission: target.pagePermission,
      targetPath: targetUrl.pathname,
      targetRoute: targetUrl.hash.replace(/^#/, ""),
      pagePermissions: [...snapshot.pagePermissions],
      actionPermissions: [...snapshot.actionPermissions],
      dataScope: { ...snapshot.dataScope, tenantIds: [...snapshot.dataScope.tenantIds] },
      sensitiveAccess: snapshot.sensitiveAccess,
      issuedAt: now,
      expiresAt: now + TICKET_TTL_MS
    };
    const currentFact = {
      account: normalizedAccount,
      status: fact.status || "active",
      factStatus: fact.factStatus || "current",
      expiresAt: fact.expiresAt || null,
      permissionVersion: Number(fact.permissionVersion),
      menuVersion: Number(fact.menuVersion),
      roles: fact.roles.map(role => ({
        enabled: role?.enabled === true,
        status: role?.status,
        pagePermissions: Array.isArray(role?.pagePermissions) ? [...role.pagePermissions] : [],
        actionPermissions: Array.isArray(role?.actionPermissions) ? [...role.actionPermissions] : []
      })),
      dataScope: { ...snapshot.dataScope, tenantIds: [...snapshot.dataScope.tenantIds] },
      sensitiveAccess: snapshot.sensitiveAccess
    };

    clearOutstandingTickets();
    if (!safeSessionSet(CURRENT_FACT_KEY, JSON.stringify(currentFact)) || !safeSessionSet(`${TICKET_PREFIX}${nonce}`, JSON.stringify(ticket))) {
      safeSessionRemove(`${TICKET_PREFIX}${nonce}`);
      return { ok: false, reason: "ticket-storage-unavailable", href: null };
    }

    targetUrl.searchParams.set(MODE_PARAM, "1");
    targetUrl.searchParams.set(TICKET_PARAM, nonce);
    return { ok: true, reason: "issued", href: targetUrl.href, ticket: Object.freeze({ ...ticket }) };
  }

  function registerLoginIssuer() {
    if (routeMode !== "preview" || routeTargets || loginIssuerRegistered) return null;
    loginIssuerRegistered = true;
    let pendingAttempt = null;
    let authenticationCompletion = null;

    function clearAuthenticationAttempt() {
      pendingAttempt = null;
      authenticationCompletion = null;
      return true;
    }

    function beginAuthentication(event, { account } = {}) {
      clearAuthenticationAttempt();
      const normalizedAccount = String(account || "").trim().toLowerCase();
      if (!event?.isTrusted || event.target?.id !== "loginForm" || !normalizedAccount) {
        return { ok: false, reason: "trusted-login-attempt-required" };
      }
      pendingAttempt = { account: normalizedAccount, startedAt: Date.now() };
      return { ok: true, reason: "authentication-started" };
    }

    function completeAuthentication({ account } = {}) {
      const normalizedAccount = String(account || "").trim().toLowerCase();
      const pending = pendingAttempt;
      pendingAttempt = null;
      authenticationCompletion = null;
      if (
        !pending ||
        pending.account !== normalizedAccount ||
        Date.now() - pending.startedAt > AUTHENTICATION_COMPLETION_TTL_MS
      ) return { ok: false, reason: "trusted-login-attempt-required" };
      authenticationCompletion = { account: normalizedAccount, completedAt: Date.now() };
      return { ok: true, reason: "authentication-completed" };
    }

    function issueNavigationTicket(options = {}) {
      const normalizedAccount = String(options.account || options.fact?.account || "").trim().toLowerCase();
      const completed = authenticationCompletion;
      authenticationCompletion = null;
      if (
        !completed ||
        completed.account !== normalizedAccount ||
        Date.now() - completed.completedAt > AUTHENTICATION_COMPLETION_TTL_MS
      ) return { ok: false, reason: "authentication-context-required", href: null };
      return issueTicketFromFact(options);
    }

    return Object.freeze({ beginAuthentication, clearAuthenticationAttempt, completeAuthentication, issueNavigationTicket });
  }

  function createAuthorizedNavigation({ href, pagePermission } = {}) {
    let targetUrl;
    try {
      targetUrl = new URL(href, window.location.href);
    } catch {
      return { ok: false, reason: "invalid-target", href: null };
    }
    if (routeMode !== "authRoute") return { ok: true, reason: "preview", href: targetUrl.href };
    if (!state.allowed || !state.authorization) return { ok: false, reason: "authorization-context-required", href: null };
    const fact = readJson(safeSessionGet(CURRENT_FACT_KEY));
    if (
      !factIsCurrent(fact) ||
      fact.account !== state.authorization.account ||
      Number(fact.permissionVersion) !== Number(state.authorization.permissionVersion) ||
      Number(fact.menuVersion) !== Number(state.authorization.menuVersion)
    ) return { ok: false, reason: "stale-fact", href: null };
    return issueTicketFromFact({
      account: state.authorization.account,
      fact,
      route: { target: { href: targetUrl.href, pagePermission: String(pagePermission || "") } }
    });
  }

  function navigateAuthorized(options = {}) {
    const issued = createAuthorizedNavigation(options);
    if (issued.ok && issued.href) window.location.assign(issued.href);
    return issued;
  }

  function renderBlockedRoute(reason) {
    if (state.allowed || !document.body) return;
    const copy = {
      "missing-ticket": "登录路由票据不存在、已使用或已被清除，请返回登录页重新验证。",
      "expired-ticket": "登录路由票据已过期，请返回登录页重新验证。",
      "wrong-target": "登录路由与当前页面不一致，已阻止加载业务页面。",
      "stale-fact": "当前账号或权限资料不可确认，请返回登录页重新验证。",
      "stale-version": "权限版本已更新，旧登录路由不再有效。",
      "permission-denied": "当前账号没有该页面权限，已阻止加载业务页面。"
    }[reason] || "登录路由校验未通过，已阻止加载业务页面。";
    document.body.innerHTML = `
      <main role="main" aria-labelledby="platformAuthRouteTitle" style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f7fb;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;color:#1d2129">
        <section style="width:min(520px,100%);padding:28px;border:1px solid #e5e6eb;border-radius:16px;background:#fff;box-shadow:0 16px 48px rgba(17,24,39,.10)">
          <p style="margin:0 0 8px;color:#b42318;font-weight:700">访问已阻止</p>
          <h1 id="platformAuthRouteTitle" style="margin:0 0 12px;font-size:24px">请重新登录</h1>
          <p style="margin:0;color:#4e5969;line-height:1.7">${copy}</p>
        </section>
      </main>`;
    document.documentElement.dataset.hsPlatformAuthState = "blocked-ui";
  }

  window.HSPlatformAuthRouteGuard = Object.freeze({
    registerLoginIssuer,
    createAuthorizedNavigation,
    navigateAuthorized,
    allowBusinessBoot: () => state.allowed === true,
    isAuthRouteMode: () => state.mode === "authRoute",
    getRouteState: () => Object.freeze({ mode: state.mode, allowed: state.allowed, reason: state.reason }),
    getAuthorizationContext: () => state.authorization
  });
})();

</script>

      align-items: start;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .page-title {
      margin: 0 0 8px;
      font-family: var(--display-font);
      font-size: 30px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .page-subtitle {
      margin: 0;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.6;
      max-width: 840px;
    }

    .page-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn {
      min-height: 44px;
      border-radius: 6px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      white-space: nowrap;
      transition: border-color 0.16s ease, color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    }

    .btn:hover {
      border-color: var(--primary-hover);
      color: var(--primary);
    }

    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn.primary:hover {
      background: var(--primary-hover);
      color: #fff;
    }

    .btn:disabled,
    .btn:disabled:hover {
      cursor: not-allowed;
      border-color: var(--border);
      background: #f2f3f5;
      color: #9aa0aa;
      box-shadow: none;
      opacity: 1;
    }

    .btn.ghost {
      border-color: transparent;
      background: #f2f3f5;
      color: var(--text-secondary);
    }

    .btn.danger {
      color: var(--danger);
      border-color: #ffd4cc;
      background: #fff;
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 12px;
    }

    .metrics.home-metrics {
      grid-template-columns: repeat(2, minmax(180px, 1fr));
    }

    .context-panel {
      display: none;
      padding: 12px 14px;
      border: 1px solid #bedaff;
      border-radius: var(--radius);
      background: #f4f9ff;
    }

    .context-panel.show {
      display: block;
    }

    .queue-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .queue-chip {
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      background: #fff;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .queue-chip:hover,
    .queue-chip.active {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .context-note {
      margin: 0 0 10px;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.6;
    }

    .metric {
      min-height: 108px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 76px;
      gap: 12px;
      align-items: end;
    }

    .metric.metric-link {
      cursor: pointer;
      transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }

    .metric.metric-link:hover,
    .metric.metric-link:focus-visible {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(20, 95, 232, .12);
      outline: none;
      transform: translateY(-1px);
    }

    .source-context {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
      border: 1px solid #9bc5ff;
      border-radius: 6px;
      background: #eaf4ff;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.6;
    }

    .source-context strong { color: var(--text); }

    .home-module-notice {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 12px;
      padding: 10px 12px;
      border: 1px solid #f5c77a;
      border-radius: 6px;
      background: #fff8e8;
      color: #7a4b00;
      font-size: 13px;
      line-height: 1.5;
    }

    .home-module-notice.error { border-color: #ffb4ab; background: #fff1f0; color: #9f1d18; }
    .metrics.stale { opacity: .78; }
    .home-card.module-stale .trend-chart,
    .home-card.module-stale .chart-legend,
    .home-card.module-stale .structure-list,
    .home-card.module-stale .rank-list,
    .home-card.module-stale .alert-list { opacity: .7; }
    .home-card.module-empty .trend-chart,
    .home-card.module-empty .chart-legend,
    .home-card.module-empty .structure-list,
    .home-card.module-empty .rank-list,
    .home-card.module-empty .alert-list { display: none; }

    .metric label {
      display: block;
      color: var(--text-secondary);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .metric strong {
      display: block;
      font-family: var(--mono);
      font-size: 28px;
      line-height: 1.15;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .metric small {
      display: block;
      margin-top: 8px;
      color: var(--text-tertiary);
      font-size: 12px;
      white-space: nowrap;
    }

    .spark {
      height: 44px;
      width: 76px;
    }

    .home-extra {
      display: grid;
      grid-template-columns: minmax(0, 1.24fr) minmax(340px, 0.76fr);
      gap: 12px;
      align-items: stretch;
    }

    .home-extra > .home-module-notice { grid-column: 1 / -1; margin-bottom: 0; }

    .home-stack {
      display: grid;
      gap: 12px;
      min-width: 0;
    }

    .home-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      min-width: 0;
    }

    .home-card-head {
      min-height: 48px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .home-card-head h2 {
      margin: 0;
      font-family: var(--display-font);
      font-size: 17px;
      line-height: 1.3;
    }

    .home-card-head span {
      color: var(--text-tertiary);
      font-size: 12px;
      white-space: nowrap;
    }

    .trend-chart {
      height: 256px;
      padding: 18px 18px 14px;
      display: grid;
      grid-template-columns: repeat(8, minmax(28px, 1fr));
      gap: 12px;
      align-items: end;
      border-bottom: 1px solid var(--border);
      background:
        linear-gradient(to top, rgba(229, 230, 235, 0.78) 1px, transparent 1px) 0 0 / 100% 52px,
        #fff;
    }

    .trend-col {
      min-width: 0;
      display: grid;
      gap: 8px;
      justify-items: center;
      align-items: end;
    }

    .trend-bar {
      width: min(100%, 34px);
      min-height: 28px;
      border-radius: 5px 5px 2px 2px;
      background: linear-gradient(180deg, var(--primary) 0%, #4e8fff 100%);
      box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.28);
    }

    .trend-col small {
      color: var(--text-tertiary);
      font-size: 11px;
      white-space: nowrap;
    }

    .chart-legend {
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      background: var(--primary);
    }

    .structure-list,
    .rank-list,
    .alert-list {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .structure-row {
      display: grid;
      grid-template-columns: 124px minmax(0, 1fr) 54px;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .progress {
      height: 8px;
      border-radius: 999px;
      background: #edf0f5;
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
    }

    .rank-row,
    .alert-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 38px;
      font-size: 13px;
    }

    .rank-index {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: var(--primary);
      background: var(--primary-light);
      font-weight: 700;
      font-size: 12px;
    }

    .row-main {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .row-main strong {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 13px;
    }

    .row-main small {
      color: var(--text-tertiary);
      font-size: 12px;
      white-space: nowrap;
    }

    .value-strong {
      font-family: var(--mono);
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 0;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .panel-head {
      min-height: 54px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-title {
      margin: 0;
      font-family: var(--display-font);
      font-size: 17px;
      font-weight: 700;
    }

    .panel-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .filters {
      padding: 14px 16px;
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr)) auto;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      background: #fbfcfe;
    }

    .field {
      min-width: 0;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
    }

    .input-like {
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .filter-control {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text-primary);
      padding: 0 10px;
      font: inherit;
      font-size: 13px;
      outline: none;
    }

    .filter-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(20, 95, 232, 0.12);
    }

    .empty-state {
      min-height: 170px;
      display: grid;
      place-items: center;
      gap: 6px;
      color: var(--text-tertiary);
      text-align: center;
      padding: 28px;
    }

    .empty-state strong {
      color: var(--text-primary);
      font-size: 15px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .list-state-banner {
      display: none;
      margin: 12px 14px 0;
      padding: 10px 12px;
      border: 1px solid #f0c7c7;
      border-radius: 8px;
      background: #fff7f7;
      color: #8f1d1d;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
    }

    .list-state-banner.show { display: flex; }
    .list-state-banner.loading {
      border-color: #b9d2ff;
      background: #f3f7ff;
      color: #254e91;
    }

    .list-state-banner strong { color: inherit; }
    .table-wrap.is-loading { opacity: .56; pointer-events: none; }

    .table-pagination {
      min-height: 52px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .table-pagination .pager-actions { display: flex; align-items: center; gap: 8px; }
    .table-pagination select { min-height: 34px; border: 1px solid var(--border); border-radius: 7px; background: #fff; padding: 0 28px 0 10px; color: var(--text); }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      height: 42px;
      padding: 0 14px;
      background: #f7f8fa;
      color: var(--text-secondary);
      text-align: left;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      height: 48px;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      white-space: nowrap;
      vertical-align: middle;
    }

    tr {
      transition: background 0.14s ease;
    }

    tbody tr:hover {
      background: #f5f8ff;
    }

    .mono {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }

    .link-btn {
      border: 0;
      background: transparent;
      color: var(--primary);
      padding: 0;
      font-weight: 600;
    }

    .drawer-mask {
      position: fixed;
      inset: 0;
      display: none;
      background: rgba(17, 24, 39, 0.38);
      z-index: 50;
    }

    .drawer-mask.open {
      display: block;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 60;
      width: min(560px, 100vw);
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: -16px 0 32px rgba(29, 33, 41, 0.14);
      transform: translateX(100%);
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-head {
      min-height: 64px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .drawer-head h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .drawer-body {
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
    }

    .form-field.full {
      grid-column: 1 / -1;
    }

    .form-grid > .full {
      grid-column: 1 / -1;
    }

    .form-field input,
    .form-field select,
    .form-field textarea {
      min-height: 44px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 10px 12px;
      background: #fff;
      color: var(--text);
    }

    .form-field textarea {
      min-height: 88px;
      resize: vertical;
    }

    .check-list {
      display: grid;
      gap: 8px;
    }

    .check-card {
      min-height: 52px;
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fff;
      cursor: pointer;
    }

    .check-card:hover {
      border-color: var(--primary-hover);
      background: #f8fbff;
    }

    .check-card input {
      width: 18px;
      height: 18px;
    }

    .check-card strong,
    .check-card small {
      display: block;
    }

    .check-card small {
      margin-top: 3px;
      color: var(--text-tertiary);
      font-weight: 400;
    }

    .inline-alert {
      padding: 10px 12px;
      border: 1px solid #ffe4ba;
      border-radius: 6px;
      background: var(--warning-light);
      color: #7a3e00;
      font-size: 13px;
      line-height: 1.6;
    }

    .operation-feedback {
      margin: 14px 0 0;
      padding: 12px;
      border: 1px solid #b9d2ff;
      border-radius: 8px;
      background: #f3f7ff;
      color: #254e91;
      display: grid;
      gap: 6px;
      font-size: 12px;
    }

    .operation-feedback.warning { border-color: #f2d5a8; background: #fff9ed; color: #8a4b08; }
    .operation-feedback.error { border-color: #f0c7c7; background: #fff7f7; color: #8f1d1d; }
    .operation-feedback.success { border-color: #b7ead5; background: #f2fbf7; color: #087452; }
    .operation-feedback strong { color: inherit; font-size: 13px; }
    .operation-feedback .feedback-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

    .fact-receipt {
      display: none;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border: 1px solid #b7ead5;
      border-radius: var(--radius);
      background: #f2fbf7;
      color: #075d46;
    }

    .fact-receipt.show { display: grid; }
    .fact-receipt-main { display: grid; gap: 4px; min-width: 0; }
    .fact-receipt-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
    .fact-receipt-title strong { font-size: 14px; }
    .fact-receipt-meta { color: var(--text-secondary); font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
    .fact-receipt-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

    .detail-section {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .detail-section h3 {
      margin: 0;
      padding: 12px 14px;
      font-size: 14px;
      background: #f7f8fa;
      border-bottom: 1px solid var(--border);
    }

    .kv {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr);
      gap: 0;
    }

    .kv div {
      min-height: 40px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .kv div:nth-child(odd) {
      color: var(--text-secondary);
      background: #fbfcfe;
      font-weight: 600;
    }

    .kv div:nth-last-child(-n + 2) {
      border-bottom: 0;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 80;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      padding: 10px 14px;
      color: #fff;
      background: rgba(29, 33, 41, 0.92);
      border-radius: 6px;
      font-size: 13px;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1180px) {
      .app {
        grid-template-columns: 76px minmax(0, 1fr);
      }

      .brand-title,
      .nav-group-title,
      .nav-button span {
        display: none;
      }

      .brand {
        justify-content: center;
        padding: 0;
      }

      .nav-button {
        justify-content: center;
        padding: 10px;
      }

      .main-grid {
        grid-template-columns: 1fr;
      }

      .home-extra {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 840px) {
      .app {
        display: block;
      }

      .sidebar {
        position: sticky;
        top: 0;
        z-index: 30;
        height: auto;
        min-height: 0;
        overflow-x: auto;
      }

      .brand {
        height: 54px;
        justify-content: flex-start;
        padding: 0 14px;
      }

      .brand-title {
        display: flex;
      }

      .nav {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: max-content;
        gap: 8px;
        padding: 8px 12px 12px;
      }

      .nav-group {
        display: contents;
      }

      .nav-group-title {
        display: none;
      }

      .nav-button {
        width: auto;
        min-width: 92px;
      }

      .nav-button span {
        display: inline;
      }

      .topbar {
        grid-template-columns: 1fr;
        height: auto;
        padding: 12px 16px;
      }

      .top-actions {
        justify-content: space-between;
      }

      .search {
        width: min(100%, 260px);
      }

      .content {
        padding: 16px;
      }

      .page-head,
      .risk-strip {
        grid-template-columns: 1fr;
      }

      .page-actions {
        justify-content: flex-start;
      }

      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .metrics.home-metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .filter-control {
        font-size: 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

        panel.innerHTML = '';
        return;
      }
      const receipt = platformLatestReceipt;
      panel.classList.add('show');
      panel.innerHTML = `<div class="fact-receipt-main"><div class="fact-receipt-title"><span class="pill green">最近操作</span><strong>${escapeHtml(receipt.title)}</strong><span>${escapeHtml(receipt.status)}</span></div><div class="fact-receipt-meta">对象：${escapeHtml(receipt.object)}　审计编号：${escapeHtml(receipt.auditId)}　${escapeHtml(receipt.time)}（UTC+8）</div></div><div class="fact-receipt-actions"><button class="btn" type="button" data-platform-receipt-target="${escapeHtml(receipt.target)}">查看最新记录</button><button class="btn ghost" type="button" data-platform-receipt-audit="${escapeHtml(receipt.auditId)}">查看审计</button></div>`;
    }

    function parseCny(value) {
      return Number(String(value || '').replace(/[^0-9.-]/g, '')) || 0;
    }

    function parseCnyInput(value, { allowZero = false } = {}) {
      const text = String(value ?? '').trim();
      if (!/^\d+(?:\.\d{1,2})?$/.test(text)) return null;
      const amount = Number(text);
      const cents = Math.round(amount * 100);
      if (!Number.isFinite(amount) || !Number.isSafeInteger(cents)) return null;
      if (allowZero ? amount < 0 : amount <= 0) return null;
      return amount;
    }

    const BUSINESS_EVIDENCE_MAX_FILES = 5;
    const BUSINESS_EVIDENCE_MAX_BYTES = 10 * 1024 * 1024;
    const BUSINESS_EVIDENCE_TYPES = {
      jpg: ['image/jpeg'],
      jpeg: ['image/jpeg'],
      png: ['image/png'],
      pdf: ['application/pdf']
    };

    function validateBusinessEvidenceInput(input, { required = false, existingCount = 0 } = {}) {
      const files = Array.from(input?.files || []);
      if (required && files.length === 0) return { ok: false, message: '请至少选择 1 份 JPG、JPEG、PNG 或 PDF 凭证。' };
      if (existingCount + files.length > BUSINESS_EVIDENCE_MAX_FILES) return { ok: false, message: `凭证累计最多 ${BUSINESS_EVIDENCE_MAX_FILES} 份，当前还可选择 ${Math.max(0, BUSINESS_EVIDENCE_MAX_FILES - existingCount)} 份。` };
      for (const file of files) {
        const extension = String(file.name || '').split('.').pop().toLowerCase();
        const allowedTypes = BUSINESS_EVIDENCE_TYPES[extension];
        if (!allowedTypes) return { ok: false, message: `${file.name || '所选文件'} 格式不支持，请改用 JPG、JPEG、PNG 或 PDF。` };
        if (!file.size || file.size > BUSINESS_EVIDENCE_MAX_BYTES) return { ok: false, message: `${file.name} 必须大于 0 且不超过 10MB。` };
        if (file.type && !allowedTypes.includes(String(file.type).toLowerCase())) return { ok: false, message: `${file.name} 的扩展名与内容类型不一致，请重新选择。` };
      }
      return { ok: true, count: files.length, names: files.map(file => file.name), summary: files.length ? `${files.length} 份：${files.map(file => file.name).join('、')}` : '未选择附件' };
    }

    function applyBusinessEvidenceFeedback(input, result) {
      if (!input) return result.ok;
      const summary = input.closest('.form-field')?.querySelector('[data-evidence-summary]');
      if (!result.ok) {
        let error = input.closest('.form-field')?.querySelector('[data-business-evidence-error]');
        if (!error) {
          error = document.createElement('div');
          error.className = 'field-error';
          error.dataset.businessEvidenceError = '';
          error.hidden = true;
          input.insertAdjacentElement('afterend', error);
        }
        window.HSFormFeedback?.report(result.message, input, error);
        setTimeout(() => { if (input.isConnected) input.focus({ preventScroll: true }); }, 0);
        return false;
      }
      window.HSFormFeedback?.clear?.(input);
      if (summary) summary.textContent = result.summary;
      return true;
    }

    function formatCny(value) {
      return `CNY ${Number(value || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }

    function platformWalletRow(tenantName) {
      return pages.wallets.rows.find(row => row[1] === tenantName);
    }

    function platformWalletColumn(walletName) {
      return ({ '代收钱包': 2, '代付钱包': 3, '提款钱包': 4 })[walletName];
    }

    function normalizePlatformWalletName(walletName) {
      return String(walletName || '').replace(/^CNY\s*/, '');
    }

    function clonePlatformWalletTransfer(value) {
      return value ? JSON.parse(JSON.stringify(value)) : value;
    }

    function platformWalletState(tenantName, walletName) {
      return platformWalletStates.get(`${tenantName}|${normalizePlatformWalletName(walletName)}`) || null;
    }

    function platformWalletStateSnapshot(state) {
      return state ? { total: state.total, frozen: state.frozen, available: Math.round((state.total - state.frozen) * 100) / 100, status: state.status, version: state.version } : null;
    }

    function sameWalletMoney(left, right) {
      return Number.isFinite(Number(left)) && Math.abs(Number(left) - Number(right)) < 0.001;
    }

    function changePlatformWallet({ tenantName, walletName, totalDelta = 0, frozenDelta = 0 }) {
      walletName = normalizePlatformWalletName(walletName);
      const row = platformWalletRow(tenantName);
      const column = platformWalletColumn(walletName);
      if (!row || column === undefined) return null;
      const before = parseCny(row[column]);
      const after = Math.max(0, before + Number(totalDelta || 0));
      const state = platformWalletState(tenantName, walletName);
      const beforeState = platformWalletStateSnapshot(state);
      row[column] = formatCny(after);
      row[5] = formatCny(Math.max(0, parseCny(row[5]) + Number(frozenDelta || 0)));
      row[7] = platformNow();
      if (state) {
        state.total = Math.round((state.total + Number(totalDelta || 0)) * 100) / 100;
        state.frozen = Math.round((state.frozen + Number(frozenDelta || 0)) * 100) / 100;
        state.version += 1;
      }
      if (tenantName === '汇盛东南亚') {
        const tenantRow = pages.tenants.rows.find(item => item[1] === tenantName);
        if (tenantRow) {
          tenantRow[4] = formatCny(parseCny(row[2]) + parseCny(row[3]) + parseCny(row[4]));
          tenantRow[5] = formatCny(Math.max(0, parseCny(row[4]) - 20020));
        }
      }
      return { before, after, beforeState, afterState: platformWalletStateSnapshot(state) };
    }

    function applyWalletTransferProjection(transfer = {}) {
      const transferId = String(transfer.transferId || '');
      const tenantName = String(transfer.tenantName || (transfer.tenantId === 'HS-TEN-001' ? '汇盛东南亚' : ''));
      const sourceWallet = normalizePlatformWalletName(transfer.sourceWallet);
      const targetWallet = normalizePlatformWalletName(transfer.targetWallet);
      const amount = Number(transfer.amount);
      const fingerprint = JSON.stringify({ tenantName, currency: transfer.currency, sourceWallet, targetWallet, amount, correlationId: transfer.correlationId, ledgerIds: transfer.ledgerIds });
      const existing = platformWalletTransferFacts.get(transferId);
      if (!transferId || !tenantName) return { ok: false, code: 'WALLET_TRANSFER_FACT_INVALID' };
      if (existing) {
        const existingFingerprint = existing._fingerprint || JSON.stringify({ tenantName: existing.tenantName, currency: existing.currency, sourceWallet: normalizePlatformWalletName(existing.sourceWallet), targetWallet: normalizePlatformWalletName(existing.targetWallet), amount: existing.amount, correlationId: existing.correlationId, ledgerIds: existing.ledgerIds });
        return existingFingerprint === fingerprint ? { ...clonePlatformWalletTransfer(existing), ok: true, duplicate: true } : { ok: false, code: 'IDEMPOTENCY_CONFLICT' };
      }
      const allowed = (sourceWallet === '代收钱包' && ['代付钱包', '提款钱包'].includes(targetWallet)) || (sourceWallet === '代付钱包' && targetWallet === '提款钱包');
      if (transfer.currency !== 'CNY' || !allowed || !Number.isFinite(amount) || amount <= 0 || !Array.isArray(transfer.ledgerIds) || transfer.ledgerIds.length !== 2) return { ok: false, code: 'WALLET_TRANSFER_FACT_INVALID' };
      const sourceState = platformWalletState(tenantName, sourceWallet);
      const targetState = platformWalletState(tenantName, targetWallet);
      if (!sourceState || !targetState || sourceState.status !== 'active' || targetState.status !== 'active') return { ok: false, code: 'WALLET_UNAVAILABLE' };
      const sourceBefore = transfer.sourceBefore || {};
      const targetBefore = transfer.targetBefore || {};
      const sourceAfter = transfer.sourceAfter || {};
      const targetAfter = transfer.targetAfter || {};
      const beforeMatches = sameWalletMoney(sourceBefore.total, sourceState.total) && sameWalletMoney(sourceBefore.frozen, sourceState.frozen) && sameWalletMoney(sourceBefore.available, sourceState.total - sourceState.frozen) && sourceBefore.version === sourceState.version && sameWalletMoney(targetBefore.total, targetState.total) && sameWalletMoney(targetBefore.frozen, targetState.frozen) && sameWalletMoney(targetBefore.available, targetState.total - targetState.frozen) && targetBefore.version === targetState.version;
      const afterMatches = sameWalletMoney(sourceAfter.total, sourceState.total - amount) && sameWalletMoney(sourceAfter.frozen, sourceState.frozen) && sameWalletMoney(sourceAfter.available, sourceState.total - sourceState.frozen - amount) && sourceAfter.version === sourceState.version + 1 && sameWalletMoney(targetAfter.total, targetState.total + amount) && sameWalletMoney(targetAfter.frozen, targetState.frozen) && sameWalletMoney(targetAfter.available, targetState.total - targetState.frozen + amount) && targetAfter.version === targetState.version + 1;
      if (!beforeMatches || !afterMatches) return { ok: false, code: 'STATE_VERSION_CONFLICT' };
      if (pages.ledger.rows.some(row => transfer.ledgerIds.includes(row[0]))) return { ok: false, code: 'LEDGER_ID_CONFLICT' };

      changePlatformWallet({ tenantName, walletName: sourceWallet, totalDelta: -amount });
      changePlatformWallet({ tenantName, walletName: targetWallet, totalDelta: amount });
      const relation = `${transferId} / ${transfer.correlationId}`;
      const occurredAt = String(transfer.occurredAt || platformNow());
      const walletRow = platformWalletRow(tenantName);
      if (walletRow) walletRow[7] = occurredAt;
      pages.ledger.rows.unshift(
        [transfer.ledgerIds[0], occurredAt, tenantName, '租户平台钱包', sourceWallet, '内部划转', '支出', formatCny(amount), `总额 ${formatCny(sourceBefore.total)} → ${formatCny(sourceAfter.total)} / 冻结 ${formatCny(sourceBefore.frozen)} → ${formatCny(sourceAfter.frozen)} / 可用 ${formatCny(sourceBefore.available)} → ${formatCny(sourceAfter.available)}`, relation],
        [transfer.ledgerIds[1], occurredAt, tenantName, '租户平台钱包', targetWallet, '内部划转', '收入', formatCny(amount), `总额 ${formatCny(targetBefore.total)} → ${formatCny(targetAfter.total)} / 冻结 ${formatCny(targetBefore.frozen)} → ${formatCny(targetAfter.frozen)} / 可用 ${formatCny(targetBefore.available)} → ${formatCny(targetAfter.available)}`, relation]
      );
      const projected = { ...clonePlatformWalletTransfer(transfer), tenantName, sourceWallet: `CNY ${sourceWallet}`, targetWallet: `CNY ${targetWallet}`, _fingerprint: fingerprint, projectedAt: platformNow(), projectionStatus: 'succeeded' };
      platformWalletTransferFacts.set(transferId, projected);
      return { ...clonePlatformWalletTransfer(projected), ok: true, duplicate: false };
    }

    function platformWalletTransferForRow(row) {
      return [...platformWalletTransferFacts.values()].find(item => item.ledgerIds?.includes(row?.[0]) || String(row?.[9] || '').includes(item.transferId) || String(row?.[9] || '').includes(item.correlationId)) || null;
    }

    function addPlatformLedger({ tenantName, walletName, type, direction, amount, before, after, relation, ledgerId: fixedLedgerId = '' }) {
      const tenant = pages.tenants.rows.find(row => row[1] === tenantName);
      const ledgerId = fixedLedgerId || `LG-20260718-${String(platformLedgerSequence++).padStart(5, '0')}`;
      const existing = pages.ledger.rows.find(row => row[0] === ledgerId);
      if (existing) return ledgerId;
      pages.ledger.rows.unshift([
        ledgerId,
        platformNow(),
        tenantName,
        '租户平台钱包',
        walletName,
        type,
        direction,
        formatCny(amount),
        `${formatCny(before)} → ${formatCny(after)}`,
        relation
      ]);
      return ledgerId;
    }

        fundCommunicationForm: 'platform.fund_task.message', exportForm: platformExportPermissionByPage[form?.dataset.pageId || currentPage] || ''

    function renderMetricSpark(index, tone) {

        red: '#cf1f1f',
        purple: '#722ed1'
      };
      const color = colors[tone] || '#165dff';
      const points = [
        [2, 33 - index * 2],
        [18, 26 - index],
        [34, 30 - index * 3],
        [50, 18 + index],
        [66, 24 - index],
        [74, 12 + index]
      ].map(point => point.join(',')).join(' ');
      return `
        <svg class="spark" viewBox="0 0 76 44" aria-hidden="true">
          <path d="M2 38 H74" stroke="#e5e6eb" stroke-width="1"/>
