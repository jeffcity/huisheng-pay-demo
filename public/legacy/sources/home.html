      },
      getWorkOrders: () => platformWorkOrders.map(order => ({ ...order, events: order.events.map(event => ({ ...event, attachments: [...event.attachments] })) })),
      setCurrentAccount: name => { currentPlatformAccount.name = String(name || 'platform-admin'); },
      setFundVersion: (fundId, version) => {
        const meta = platformFundMeta.get(String(fundId));
        if (!meta) return false;
        meta.entityVersion = Number(version);
        return true;
      },
      setActionPermission: (code, allowed) => {
        if (allowed) currentPlatformAccount.actionPermissions.add(String(code));
        else currentPlatformAccount.actionPermissions.delete(String(code));
        applyPlatformActionPermissions();
        closePlatformExportDrawerAfterAccessChange();
        return hasPlatformActionPermission(String(code));
      },
      setExportSecurity: ({ permissionVersion, sensitiveAccess, scopeCode, tenantIds } = {}) => {
        if (permissionVersion !== undefined) currentPlatformAccount.permissionVersion = Number(permissionVersion);
        if (sensitiveAccess !== undefined) currentPlatformAccount.sensitiveAccess = sensitiveAccess === true;
        if (scopeCode !== undefined) currentPlatformAccount.dataScope = { scopeCode: String(scopeCode), tenantIds: Array.isArray(tenantIds) ? tenantIds.map(String) : [] };
        closePlatformExportDrawerAfterAccessChange();
        return clonePlatformExportValue({ permissionVersion: currentPlatformAccount.permissionVersion, sensitiveAccess: currentPlatformAccount.sensitiveAccess, dataScope: currentPlatformAccount.dataScope });
      },
      hasActionPermission: code => hasPlatformActionPermission(String(code)),
      requiredPermissionFor: selector => platformRequiredPermission(document.querySelector(String(selector)))
    };

    new MutationObserver(() => applyPlatformActionPermissions()).observe(document.body, { childList: true, subtree: true });

    renderNav();
    renderPage(currentPage);
    }
  </script>
  <script>
    (() => {
      const liveId = "hsFormErrorLive";
      const nativeErrorClass = "hs-native-field-error";
      const errorSelector = `.form-error, .field-error, .error-text, [data-error], .${nativeErrorClass}`;
      const fieldSelector = 'input:not([type="hidden"]), select, textarea';
      const fieldContainerSelector = '.field, .form-field, .modal-field, .blue-row, .setting-row, .filter-item, .form-group, .control-group';
      let errorSequence = 0;
      let fieldLabelSequence = 0;

      function normalizedLabelText(label) {
        if (!(label instanceof HTMLElement)) return "";
        const copy = label.cloneNode(true);
        copy.querySelectorAll("input, select, textarea, button, svg, i").forEach(node => node.remove());
        return copy.textContent.replace(/\s+/g, " ").trim();
      }

      function hasAccessibleFieldName(field) {
        if ((field.getAttribute("aria-label") || "").trim()) return true;
        const labelledByText = (field.getAttribute("aria-labelledby") || "")
          .split(/\s+/)
          .filter(Boolean)
          .map(id => document.getElementById(id)?.textContent?.replace(/\s+/g, " ").trim() || "")
          .filter(Boolean)
          .join(" ");
        if (labelledByText) return true;
        return Array.from(field.labels || []).some(label => normalizedLabelText(label));
      }

      function upgradeFieldName(field) {
        if (!(field instanceof HTMLElement) || !field.matches(fieldSelector) || hasAccessibleFieldName(field)) return;
        const container = field.closest(fieldContainerSelector);
        const label = container?.querySelector("label");
        if (!label || !normalizedLabelText(label)) return;
        if (!label.id) label.id = `hsFieldLabel${++fieldLabelSequence}`;
        const ids = new Set((field.getAttribute("aria-labelledby") || "").split(/\s+/).filter(Boolean));
        ids.add(label.id);
        field.setAttribute("aria-labelledby", [...ids].join(" "));
      }

      function ensureNativeErrorStyles() {
        if (document.getElementById("hsNativeFieldErrorStyles")) return;
        const style = document.createElement("style");
        style.id = "hsNativeFieldErrorStyles";
        style.textContent = `
          .${nativeErrorClass} {
            display: block;
            flex: 0 0 100%;
            width: 100%;
            max-width: 100%;
            margin: 6px 0 0;
            color: var(--color-danger, var(--danger, #b42318));
            font-size: 12px;
            font-weight: 500;
            line-height: 1.45;
          }
          .${nativeErrorClass}[hidden] { display: none !important; }
        `;
        document.head.appendChild(style);
      }

      function fieldKey(field) {
        if (!field.dataset.hsFeedbackKey) {
          field.dataset.hsFeedbackKey = field.id || `hsFeedbackField${++errorSequence}`;
        }
        return field.dataset.hsFeedbackKey;
      }

      function ensureLiveRegion() {
        let live = document.getElementById(liveId);
        if (live) return live;
        live = document.createElement("div");
        live.id = liveId;
        live.setAttribute("role", "alert");
        live.setAttribute("aria-live", "assertive");
        live.setAttribute("aria-atomic", "true");
        live.style.cssText = "position:fixed;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0";
        document.body.appendChild(live);
        return live;
      }

      function upgradeErrorNode(node) {
        if (!(node instanceof HTMLElement) || !node.matches(errorSelector)) return null;
        if (!node.id) node.id = `hsFieldError${++errorSequence}`;
        node.setAttribute("role", "alert");
        node.setAttribute("aria-live", "assertive");
        node.setAttribute("aria-atomic", "true");
        return node;
      }

      function ensureNativeError(field) {
        let node = field.dataset.hsNativeErrorId
          ? document.getElementById(field.dataset.hsNativeErrorId)
          : null;
        if (!node) {
          node = document.createElement("div");
          node.id = `hsNativeFieldError${++errorSequence}`;
          node.className = nativeErrorClass;
          node.dataset.hsNativeError = "true";
          node.hidden = true;
          field.insertAdjacentElement("afterend", node);
          field.dataset.hsNativeErrorId = node.id;
        }
        return upgradeErrorNode(node);
      }

      function linkField(field, errorNode, focusField = true) {
        if (!(field instanceof HTMLElement) || !field.matches("input, select, textarea, [contenteditable='true']")) return;
        field.setAttribute("aria-invalid", "true");
        const ids = new Set((field.getAttribute("aria-describedby") || "").split(/\s+/).filter(Boolean));
        ids.add(errorNode.id);
        field.setAttribute("aria-describedby", [...ids].join(" "));
        errorNode.dataset.hsErrorFor = fieldKey(field);
        if (!focusField || !field.isConnected) return;
        field.focus({ preventScroll: true });
        requestAnimationFrame(() => {
          if (!field.isConnected || document.activeElement !== field) return;
          field.scrollIntoView({ block: "nearest", inline: "nearest" });
        });
      }

      function clearField(field) {
        if (!(field instanceof HTMLElement) || field.getAttribute("aria-invalid") !== "true") return;
        field.removeAttribute("aria-invalid");
        const key = field.dataset.hsFeedbackKey || field.id || "";
        const ids = (field.getAttribute("aria-describedby") || "").split(/\s+/).filter(Boolean);
        const kept = ids.filter(id => id !== liveId && document.getElementById(id)?.dataset.hsErrorFor !== key);
        if (kept.length) field.setAttribute("aria-describedby", kept.join(" "));
        else field.removeAttribute("aria-describedby");
        ids.forEach(id => {
          const node = document.getElementById(id);
          if (!node || node.dataset.hsErrorFor !== key) return;
          if (node.dataset.hsNativeError === "true") {
            if (field.dataset.hsNativeErrorId === node.id) delete field.dataset.hsNativeErrorId;
            node.remove();
            return;
          }
          node.textContent = "";
          node.classList.remove("show");
          if (node.hasAttribute("hidden")) node.hidden = true;
          delete node.dataset.hsErrorFor;
        });
      }

      function report(message, field = null, errorNode = null, focusField = true) {
        const live = ensureLiveRegion();
        const target = upgradeErrorNode(errorNode) || live;
        if (errorNode && message) {
          target.textContent = message;
          target.hidden = false;
          target.classList.add("show");
        }
        live.textContent = "";
        requestAnimationFrame(() => { live.textContent = message || "请检查表单内容。"; });
        if (field) linkField(field, target, focusField);
        return false;
      }

      window.HSFormFeedback = { report, clear: clearField, upgrade: upgradeErrorNode };
      ensureNativeErrorStyles();
      ensureLiveRegion();
      document.querySelectorAll(errorSelector).forEach(upgradeErrorNode);
      document.querySelectorAll(fieldSelector).forEach(upgradeFieldName);

      document.addEventListener("invalid", event => {
        const field = event.target;
        if (!(field instanceof HTMLElement)) return;
        const firstInvalid = field.form?.querySelector(":invalid");
        const error = ensureNativeError(field);
        report(
          field.validationMessage || "请检查此字段。",
          field,
          error,
          !firstInvalid || firstInvalid === field
        );
      }, true);

      ["input", "change"].forEach(type => {
        document.addEventListener(type, event => {
          const field = event.target;
          if (!(field instanceof HTMLElement)) return;
          if (field.matches("input, select, textarea") && field.willValidate && !field.validity.valid) return;
          clearField(field);
        }, true);
      });

      new MutationObserver(records => {
        records.forEach(record => {
          if (record.target instanceof HTMLElement) {
            const node = record.target.matches?.(errorSelector) ? record.target : record.target.closest?.(errorSelector);
            if (node) {
              upgradeErrorNode(node);
              if (node.textContent.trim() && !node.hidden) ensureLiveRegion().textContent = node.textContent.trim();
            }
          }
          record.addedNodes.forEach(added => {
            if (!(added instanceof HTMLElement)) return;
            if (added.matches(errorSelector)) upgradeErrorNode(added);
            added.querySelectorAll?.(errorSelector).forEach(upgradeErrorNode);
            if (added.matches(fieldSelector)) upgradeFieldName(added);
            added.querySelectorAll?.(fieldSelector).forEach(upgradeFieldName);
            const labelContainers = added.matches("label") ? [added] : Array.from(added.querySelectorAll?.("label") || []);
            labelContainers.forEach(label => label.closest(fieldContainerSelector)?.querySelectorAll(fieldSelector).forEach(upgradeFieldName));
          });
        });
      }).observe(document.body, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["class", "hidden"] });
    })();
  </script>

</body>
</html>
