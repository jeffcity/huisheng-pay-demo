      panel.classList.add('show');
      if (state.status === 'loading') {
        panel.classList.add('loading');
        panel.innerHTML = `<span><strong>正在重新加载列表</strong> · 已保留当前筛选和最近一次成功结果</span>`;
        return;
      }
      panel.innerHTML = `<span><strong>列表加载失败</strong> · 已保留当前筛选与 ${state.lastSuccess} UTC+8 的最近成功结果 · 错误编号 ${state.errorId || 'LIST-LOAD-001'}</span><button class="btn" type="button" data-retry-platform-list>重新加载</button>`;
    }

    function renderPlatformPagination(pageId, total) {
      const pager = platformPagination[pageId];
      const totalPages = Math.max(1, Math.ceil(total / pager.pageSize));
      pager.page = Math.min(Math.max(1, pager.page), totalPages);
      const start = total ? (pager.page - 1) * pager.pageSize + 1 : 0;
      const end = Math.min(total, pager.page * pager.pageSize);
      document.getElementById('tablePagination').innerHTML = `
        <span>当前页 ${start}–${end} 条 · 当前搜索结果 ${total} 条 · 第 ${pager.page} / ${totalPages} 页</span>
        <span class="pager-actions">
          <label>每页 <select data-platform-page-size aria-label="每页条数"><option value="3" ${pager.pageSize === 3 ? 'selected' : ''}>3</option><option value="5" ${pager.pageSize === 5 ? 'selected' : ''}>5</option><option value="10" ${pager.pageSize === 10 ? 'selected' : ''}>10</option></select> 条</label>
          <button class="btn ghost" type="button" data-platform-page-turn="prev" ${pager.page <= 1 ? 'disabled' : ''}>上一页</button>
          <button class="btn ghost" type="button" data-platform-page-turn="next" ${pager.page >= totalPages ? 'disabled' : ''}>下一页</button>
        </span>`;
    }

    function renderTableRows(page, rows, { resetPage = false } = {}) {
      const pageId = Object.entries(pages).find(([, item]) => item === page)?.[0] || currentPage;
      const state = platformListState[pageId];
      if (resetPage) platformPagination[pageId].page = 1;
      if (state.status === 'ok') {
        state.lastRows = [...rows];
        state.lastSuccess = utc8DateTime();
      }
      const effectiveRows = state.status === 'failure' && state.lastRows.length ? state.lastRows : rows;
      const pager = platformPagination[pageId];
      const totalPages = Math.max(1, Math.ceil(effectiveRows.length / pager.pageSize));
      pager.page = Math.min(pager.page, totalPages);
      const pageRows = effectiveRows.slice((pager.page - 1) * pager.pageSize, pager.page * pager.pageSize);
      renderPlatformListState(pageId);
      renderPlatformPagination(pageId, effectiveRows.length);
      if (!effectiveRows.length) {
        document.getElementById('tableBody').innerHTML = `<tr class="empty-row"><td colspan="${page.columns.length}"><div class="empty-state"><strong>当前条件没有数据</strong><span>请调整筛选条件后重新查询。</span></div></td></tr>`;
        return;
      }
      document.getElementById('tableBody').innerHTML = pageRows.map(row => {
        const rowIndex = page.rows.indexOf(row);
        const fundMeta = pageId === 'funds' ? platformFundMeta.get(row[0]) || {} : null;
        const orderMeta = pageId === 'orders' ? platformOrderQueryMetaFor(row) : null;
        return `
        <tr data-row="${rowIndex}">
          ${row.map((cell, cellIndex) => {
            const value = String(cell);
            const cls = cellIndex === 0 || /CNY|%|2026|ORD|LG|AL|CFG|CH|HS|FT-/.test(value) ? 'mono' : '';
            if (pageId === 'funds' && cellIndex === 0) {
              return `<td class="mono"><div class="stack"><span data-platform-fund-task-id="${escapeHtml(row[0])}">${escapeHtml(row[0])}</span>${fundMeta.tenantRequestNo ? `<span class="muted" data-tenant-request-no="${escapeHtml(fundMeta.tenantRequestNo)}">租户 ${escapeHtml(fundMeta.tenantRequestNo)}</span>` : ''}${fundMeta.fundApplicationId ? `<span class="muted" data-fund-application-id="${escapeHtml(fundMeta.fundApplicationId)}">平台 ${escapeHtml(fundMeta.fundApplicationId)}</span>` : ''}</div></td>`;
            }
            if (pageId === 'funds' && cellIndex === 7) {
              return `<td><div class="stack"><span class="mono">${escapeHtml(fundMeta.enteredAt || '-')}</span><span class="muted">等待 ${escapeHtml(value)}</span></div></td>`;
            }
            if (pageId === 'orders' && cellIndex === 1) {
              return `<td><div class="stack"><strong>${escapeHtml(orderMeta.tenantName)}</strong><span class="mono muted">${escapeHtml(orderMeta.tenantId)}</span></div></td>`;
            }
            if (pageId === 'orders' && cellIndex === 2) {
              return orderMeta.merchantId
                ? `<td><div class="stack"><strong>${escapeHtml(orderMeta.merchantName || '名称未提供')}</strong><span class="mono muted">${escapeHtml(orderMeta.merchantId)}</span></div></td>`
                : '<td><span class="muted">不适用（租户代付请求）</span></td>';
            }
            if (pageId === 'orders' && cellIndex === 6) {
              return `<td><div class="stack"><strong>${escapeHtml(orderMeta.actualChannelName)}</strong><span class="mono muted">${escapeHtml(orderMeta.actualChannelId)}</span><span>${escapeHtml(value)}</span></div></td>`;
            }
            if (isStatusValue(cell)) {
              return `<td><span class="pill ${statusClass(cell)}">${cell}</span></td>`;
            }
            return `<td class="${cls}">${cell}</td>`;
          }).join('')}
          <td><button class="link-btn" data-detail="${rowIndex}">查看详情</button></td>
        </tr>
      `}).join('');
    }

    function platformFundIdentifiersFor(row) {
      const meta = platformFundMeta.get(row?.[0]) || {};
      return [row?.[0], meta.tenantRequestNo, meta.fundApplicationId]
        .map(value => String(value || '').trim())
        .filter(Boolean);
    }

    function platformLedgerMetaFor(row) {
      return platformLedgerMeta.get(String(row?.[0] || '')) || null;
    }

    function platformLedgerIdentifiersFor(row) {
      const transfer = platformWalletTransferForRow(row);
      const meta = platformLedgerMetaFor(row);
      const relation = String(row?.[9] || '').trim();
      return [...new Set([
        row?.[0],
        transfer?.transferId,
        transfer?.correlationId,
        meta?.tenantRequestNo,
        meta?.fundApplicationId,
        meta?.platformFundTaskId,
        meta?.fundTraceId,
        meta?.correlationId,
        transfer || meta ? '' : relation
      ].map(value => String(value || '').trim()).filter(Boolean))];
    }

    function platformLedgerBusinessDirection(row) {
      const type = String(row?.[5] || '');
      if (/内部划转|转/.test(type)) return '内部划转';
      if (/退款/.test(type)) return '代收退款';
      if (/代收/.test(type)) return '代收';
      if (/代付/.test(type)) return '代付';
      if (/提款/.test(type)) return '租户提款';
      if (/人工/.test(type)) return '人工调整';
      if (/更正|冲正|补扣|补入|退回/.test(type)) return '资金更正';
      if (String(row?.[3] || '').includes('平台')) return '平台费用与成本';
      return '其他';
    }

    function platformTenantReference(tenantName) {
      const tenant = pages.tenants.rows.find(row => String(row[1] || '') === String(tenantName || ''));
      return tenant ? { id: String(tenant[0] || ''), name: String(tenant[1] || '') } : { id: '', name: String(tenantName || '') };
    }

    function platformReportMetaFor(row) {
      return platformReportMeta.get(`${row?.[0] || ''}|${row?.[2] || ''}`) || {
        reportDateUtc8: '', formalCount: 0, terminalCount: 0, successCount: 0,
        failedCount: 0, cancelledCount: 0, processingCount: 0, exceptionCount: 0,
        successAmount: 0, platformFee: 0, feeFormed: false, channelCost: 0, platformProfit: 0
      };
    }

    function formatReportCny(value) {
      const amount = Number(value || 0);
      return amount < 0 ? `-CNY ${Math.abs(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}` : formatCny(amount);
    }

    function platformReportMetricsFor(rows) {
      const totals = rows.reduce((summary, row) => {
        const meta = platformReportMetaFor(row);
        summary.formalCount += meta.formalCount;
        summary.terminalCount += meta.terminalCount;
        summary.successCount += meta.successCount;
        summary.successAmount += meta.successAmount;
        summary.platformFee += meta.platformFee;
        summary.channelCost += meta.channelCost;
        summary.platformProfit += meta.platformProfit;
        summary.feeFormedRows += meta.feeFormed ? 1 : 0;
        return summary;
      }, { formalCount: 0, terminalCount: 0, successCount: 0, successAmount: 0, platformFee: 0, channelCost: 0, platformProfit: 0, feeFormedRows: 0 });
      const successRate = totals.terminalCount ? `${(totals.successCount / totals.terminalCount * 100).toFixed(2)}%` : '-';
      return [
        ['正式订单', totals.formalCount.toLocaleString('en-US'), '已生成平台订单号', 'blue'],
        ['成功出账金额', formatReportCny(totals.successAmount), '退款冲突保留尚未更正的原成功出账', 'green'],
        ['终态成功率', successRate, '成功笔数总和 ÷ 明确终态总和', 'green'],
        ['平台费用收入', rows.length && !totals.feeFormedRows ? '未形成' : formatReportCny(totals.platformFee), '普通订单费与独立退款费', 'orange'],
        ['通道成本', formatReportCny(totals.channelCost), '通道商正式结果与成本更正', 'red'],
        ['平台利润', formatReportCny(totals.platformProfit), '费用收入减通道成本', totals.platformProfit < 0 ? 'red' : 'purple']
      ];
    }

    function datePartUtc8(value) {
      const match = String(value || '').trim().match(/^\d{4}-\d{2}-\d{2}/);
      return match ? match[0] : '';
    }

    function normalizedUtc8DateRange(startValue, endValue) {
      const start = datePartUtc8(startValue);
      const end = datePartUtc8(endValue);
      if (start && end) return { start, end };
      const exactDay = start || end;
      return { start: exactDay, end: exactDay };
    }

    function inUtc8DateRange(value, startValue, endValue) {
      const range = normalizedUtc8DateRange(startValue, endValue);
      if (!range.start) return true;
      const day = datePartUtc8(value);
      return Boolean(day && day >= range.start && day <= range.end);
    }

    function platformHomeReportRows() {
      const [startDate, businessDirection, tenant, endDate] = (filterState.home || []).map(value => String(value || '').trim().toLowerCase());
      return pages.report.rows.filter(row => {
        const meta = platformReportMetaFor(row);
        if (tenant && !`${row[0]} ${row[1]}`.toLowerCase().includes(tenant)) return false;
        if (businessDirection && String(row[2] || '').trim().toLowerCase() !== businessDirection) return false;
        return inUtc8DateRange(meta.reportDateUtc8, startDate, endDate);
      }).sort((left, right) => platformReportMetaFor(right).successAmount - platformReportMetaFor(left).successAmount);
    }

    function platformHomeTotals(rows = platformHomeReportRows()) {
      return rows.reduce((summary, row) => {
        const meta = platformReportMetaFor(row);
        summary.formalCount += meta.formalCount;
        summary.terminalCount += meta.terminalCount;
        summary.successCount += meta.successCount;
        summary.successAmount += meta.successAmount;
        summary.platformFee += meta.platformFee;
        summary.channelCost += meta.channelCost;
        summary.platformProfit += meta.platformProfit;
        summary.processingCount += meta.processingCount;
        summary.exceptionCount += meta.exceptionCount;
        summary.feeFormedRows += meta.feeFormed ? 1 : 0;
        return summary;
      }, { formalCount: 0, terminalCount: 0, successCount: 0, successAmount: 0, platformFee: 0, channelCost: 0, platformProfit: 0, processingCount: 0, exceptionCount: 0, feeFormedRows: 0 });
    }

    function platformHomeMetricsFor(rows = platformHomeReportRows()) {
      const totals = platformHomeTotals(rows);
      const successRate = totals.terminalCount ? `${(totals.successCount / totals.terminalCount * 100).toFixed(2)}%` : '-';
      return [
        ['成功出账金额', formatReportCny(totals.successAmount), '退款独立统计；冲突不抹除原成功出账', 'blue'],
        ['正式订单 / 成功率', `${totals.formalCount.toLocaleString('en-US')} / ${successRate}`, '处理中与异常不进分母', 'green']
      ];
    }

    function renderPlatformHomeMetrics(rows) {
      if (!rows.length) {
        return `<article class="metric" style="grid-column:1/-1"><div><label>首页指标</label><strong style="font-size:18px">当前筛选范围暂无报表事实</strong><small>其他资金与审计模块仍按各自适用条件展示</small></div></article>`;
      }
      return platformHomeMetricsFor(rows).map((item, index) => `
        <article class="metric metric-link" data-home-metric="${index}" data-source-target="${platformHomeMetricTarget(index)}" role="button" tabindex="0" aria-label="查看${item[0]}来源">
          <div><label>${item[0]}</label><strong>${item[1]}</strong><small>${item[2]}</small></div>
          ${renderMetricSpark(index, item[3])}
        </article>
      `).join('');
    }

    function platformHomeRangeLabel() {
      const [startDate, businessDirection, tenant, endDate] = filterState.home || [];
      const range = normalizedUtc8DateRange(startDate, endDate);
      const dateLabel = !range.start ? '全部日期' : range.start === range.end ? `${range.start} UTC+8` : `${range.start} 至 ${range.end} UTC+8`;
      return `${dateLabel} · ${businessDirection || '全部业务方向'} · ${tenant || '全部租户'}`;
    }

    function platformHomeSubtitle() {
      return `跨租户 CNY 交易概览 · ${platformHomeRangeLabel()} · 截止 ${platformHomeCutoffAt} UTC+8`;
    }

    function platformHomeTableTitle() {
      return `运营数据总览 · 同一筛选快照 · 截止 ${platformHomeCutoffAt} UTC+8`;
    }

    function platformReportTableTitle() {
      return `租户经营报表 · 统计截止 ${platformReportCutoffAt} UTC+8 · 最近刷新 ${platformReportRefreshedAt}`;
    }

    function platformReportDrillFilters(row, target) {
      const [, , filterStart, filterEnd] = filterState.report || [];
      const fallbackDate = platformReportMetaFor(row).reportDateUtc8;
      const range = normalizedUtc8DateRange(filterStart || fallbackDate, filterEnd || fallbackDate);
      return target === 'orders'
        ? { 1: row[0], 3: row[2], 10: range.start, 11: range.end }
        : { 1: row[0], 6: row[2], 9: range.start, 10: range.end };
    }

    function parseLedgerQueryAmount(value) {
      const normalized = String(value || '').trim().replace(/^CNY\s*/i, '').replaceAll(',', '');
      if (!/^\d+(?:\.\d{1,2})?$/.test(normalized)) return null;
      return Number(normalized);
    }

    function platformAuditMetaFor(row) {
      return platformAuditMeta.get(row?.[0]) || {
        operatorAccount: String(row?.[2] || ''),
        operatorScope: '',
        actionCategory: '',
        objectType: '',
        objectId: '',
        relatedApplicationId: '',
        platformOrderId: '',
        requestId: '',
        traceId: '',
        targetPage: '',
        targetIdentifier: ''
      };
    }

    function platformAuditIdentifiersFor(row) {
      const meta = platformAuditMetaFor(row);
      return [...new Set([
        row?.[0],
        meta.objectId,
        meta.relatedApplicationId,
        meta.platformOrderId,
        meta.requestId,
        meta.traceId
      ].map(value => String(value || '').trim()).filter(Boolean))];
    }

    function platformHomeTargetFilters(target, extraFilters = {}) {
      const [startDate, businessDirection, tenant, endDate] = filterState.home || [];
      const mappings = {
        report: { 0: tenant, 1: businessDirection, 2: startDate, 3: endDate },
        orders: { 1: tenant, 3: businessDirection, 10: startDate, 11: endDate },
        ledger: { 1: tenant, 6: businessDirection, 9: startDate, 10: endDate },
        funds: { 1: tenant, 8: startDate, 9: endDate },
        wallets: { 0: tenant, 3: startDate, 4: endDate },
        audit: { 8: startDate, 9: endDate }
      };
      return Object.fromEntries(Object.entries({ ...(mappings[target] || {}), ...extraFilters }).filter(([, value]) => String(value || '').trim()));
    }

    function platformHomeContext(label, dimensionNote = '') {
      const [startDate, businessDirection, tenant, endDate] = filterState.home || [];
      const range = normalizedUtc8DateRange(startDate, endDate);
      return [
        label,
        '币种:CNY',
        `业务方向:${businessDirection || '全部'}`,
        `租户:${tenant || '全部'}`,
        `UTC+8 日期:${range.start ? (range.start === range.end ? range.start : `${range.start} 至 ${range.end}`) : '全部'}`,
        `数据截止:${platformHomeCutoffAt}`,
        dimensionNote ? `适用范围:${dimensionNote}` : ''
      ].filter(Boolean).join('|');
    }

    function platformHomeFundsRows(dataScope = null) {
      const [startDate, , tenant, endDate] = filterState.home || [];
      const rows = pages.funds.rows.filter(row => {
        const meta = platformFundMeta.get(row[0]) || {};
        if (tenant && !`${row[1]} ${meta.tenantId || ''}`.toLowerCase().includes(String(tenant).toLowerCase())) return false;
        return inUtc8DateRange(meta.enteredAt, startDate, endDate);
      });
      return dataScope ? platformExportRowsCoveredByScope('funds', rows, dataScope) : rows;
    }

    function platformHomeWalletRiskRows(dataScope = null) {
      const [startDate, , tenant, endDate] = filterState.home || [];
      const rows = pages.wallets.rows.filter(row => {
        if (tenant && !`${row[0]} ${row[1]}`.toLowerCase().includes(String(tenant).toLowerCase())) return false;
        if (!['低', '风险观察'].includes(String(row[8] || ''))) return false;
        return inUtc8DateRange(row[7], startDate, endDate);
      });
      return dataScope ? platformExportRowsCoveredByScope('wallets', rows, dataScope) : rows;
    }

    function platformHomeAuditRiskRows(dataScope = null) {
      const [startDate, , , endDate] = filterState.home || [];
      const rows = pages.audit.rows.filter(row => String(row[6] || '') === '高风险' && inUtc8DateRange(row[1], startDate, endDate));
      return dataScope ? platformExportRowsCoveredByScope('audit', rows, dataScope) : rows;
    }

    function platformHomeChannelRiskRows() {
      const [, businessDirection, tenant] = filterState.home || [];
      const tenantRow = pages.tenants.rows.find(row => tenant && `${row[0]} ${row[1]}`.toLowerCase().includes(String(tenant).toLowerCase()));
      const grants = tenantRow
        ? pages.business.rows.filter(row => row[0] === tenantRow[0] && row[4] === '已开通' && (!businessDirection || row[2] === businessDirection))
        : [];
      return pages.channels.rows.filter(row => {
        const direction = String(row[2] || '').replace(/^CNY\s*/, '');
        const successRate = Number.parseFloat(row[7]);
        if (!Number.isFinite(successRate) || successRate >= 95) return false;
        if (businessDirection && direction !== businessDirection) return false;
        if (tenant && !grants.some(grant => String(grant[7] || '').split(' / ').includes(row[1]))) return false;
        return true;
      }).sort((left, right) => Number.parseFloat(left[7]) - Number.parseFloat(right[7]));
    }

    function platformHomeOverviewRows(reportRows = platformHomeReportRows(), dataScope = null) {
      const totals = platformHomeTotals(reportRows);
      const fundsCount = platformHomeFundsRows(dataScope).length;
      const walletRiskCount = platformHomeWalletRiskRows(dataScope).length;
      const auditRiskCount = platformHomeAuditRiskRows(dataScope).length;
      const orderRiskCount = totals.processingCount + totals.exceptionCount;
      const scopedAuditDimension = dataScope?.scopeCode === 'platform.assigned_tenants'
        ? '时间、账号租户范围；方向不适用'
        : '仅时间；方向、租户不适用';
      pages.home.rows = [
        ['交易概览', '成功金额', formatReportCny(totals.successAmount), '当前筛选范围', reportRows.length ? '正常' : '暂无数据', '租户整体报表'],
        ['经营结果', '平台利润', formatReportCny(totals.platformProfit), '当前筛选范围', totals.platformProfit < 0 ? '预警' : '正常', '租户整体报表 / 租户整体流水'],
        ['订单风险', '处理中 / 异常', `${totals.processingCount} / ${totals.exceptionCount}`, '时间、方向、租户', orderRiskCount ? '待处理' : '正常', '全局订单查询'],
        ['资金风险', '低余额租户', `${walletRiskCount} 个`, '时间、租户；方向不适用', walletRiskCount ? '待处理' : '正常', '租户平台钱包'],
        ['资金待办', '待平台处理', `${fundsCount} 项`, '时间、租户；方向不适用', fundsCount ? '待处理' : '正常', '资金待办'],
        ['审计风险', '高风险事件', `${auditRiskCount} 项`, scopedAuditDimension, auditRiskCount ? '待处理' : '正常', '审计日志']
      ];
      return pages.home.rows;
    }

    function filteredRowsForPage(pageId = currentPage) {
      const page = pages[pageId];
      if (pageId === 'home') {
        const reportRows = platformExportRowsCoveredByScope('report', platformHomeReportRows(), currentPlatformAccount.dataScope);
        return platformHomeOverviewRows(reportRows, currentPlatformAccount.dataScope);
      }
      const rawValues = (filterState[pageId] || []).map(value => value.trim().toLowerCase());
      const values = rawValues.filter(Boolean);
      const queueRows = pageId === 'funds' && activeFundQueue !== '全部'
        ? page.rows.filter(row => row[2] === activeFundQueue)
        : page.rows;
      const scopedRows = platformExportRowsCoveredByScope(pageId, queueRows, currentPlatformAccount.dataScope);
      const filtered = scopedRows.filter(row => {
        if (pageId === 'wallets') {
          const [tenant, status, balanceRange, startDateUtc8, endDateUtc8] = rawValues;
          if (tenant && !`${row[0]} ${row[1]}`.toLowerCase().includes(tenant)) return false;
          if (status && String(row[8] || '').trim().toLowerCase() !== status) return false;
          if (balanceRange && !row.slice(2, 6).join(' ').toLowerCase().includes(balanceRange)) return false;
          if (!inUtc8DateRange(row[7], startDateUtc8, endDateUtc8)) return false;
          return true;
        }
        if (pageId === 'funds') {
          const [identifier, tenant, vendor, channelOrder, wallet, type, status, amount, startDateUtc8, endDateUtc8] = rawValues;
          const meta = platformFundMeta.get(row[0]) || {};
          const identifiers = platformFundIdentifiersFor(row).map(value => value.toLowerCase());
          if (identifier && !identifiers.includes(identifier)) return false;
          if (tenant && !`${row[1]} ${meta.tenantId || ''}`.toLowerCase().includes(tenant)) return false;
          if (vendor && !String(row[6] || '').toLowerCase().includes(vendor)) return false;
          if (channelOrder && String(meta.channelOrderId || '').trim().toLowerCase() !== channelOrder) return false;
          if (wallet && !String(row[3] || '').toLowerCase().includes(wallet)) return false;
          if (type && String(row[2] || '').trim().toLowerCase() !== type) return false;
          if (status && String(row[5] || '').trim().toLowerCase() !== status) return false;
          if (amount && !String(row[4] || '').toLowerCase().includes(amount)) return false;
          if (!inUtc8DateRange(meta.enteredAt, startDateUtc8, endDateUtc8)) return false;
          return true;
        }
        if (pageId === 'report') {
          const [tenant, businessDirection, startDateUtc8, endDateUtc8] = rawValues;
          const meta = platformReportMetaFor(row);
          if (tenant && !`${row[0]} ${row[1]}`.toLowerCase().includes(tenant)) return false;
          if (businessDirection && String(row[2] || '').trim().toLowerCase() !== businessDirection) return false;
          if (!inUtc8DateRange(meta.reportDateUtc8, startDateUtc8, endDateUtc8)) return false;
          return true;
        }
        if (pageId === 'orders') {
          const [identifier, tenant, merchant, businessDirection, platformStatus, channelVendor, actualChannel, notificationStatus, minimumAmount, maximumAmount, startDateUtc8, endDateUtc8] = rawValues;
          const exactIdentifiers = Object.values(orderIdentifiersFor(row)).map(value => String(value).trim().toLowerCase());
          const meta = platformOrderQueryMetaFor(row);
          const amount = parseCny(row[5]);
          const minimum = minimumAmount ? parseLedgerQueryAmount(minimumAmount) : null;
          const maximum = maximumAmount ? parseLedgerQueryAmount(maximumAmount) : null;
          if (identifier && !exactIdentifiers.includes(identifier)) return false;
          if (tenant && !`${meta.tenantId} ${meta.tenantName}`.toLowerCase().includes(tenant)) return false;
          if (merchant && !`${meta.merchantId} ${meta.merchantName}`.toLowerCase().includes(merchant)) return false;
          if (businessDirection && String(row[3] || '').trim().toLowerCase() !== businessDirection) return false;
          if (platformStatus && String(row[4] || '').trim().toLowerCase() !== platformStatus) return false;
          if (channelVendor && !`${meta.channelVendorId} ${meta.channelVendorName}`.toLowerCase().includes(channelVendor)) return false;
          if (actualChannel && !`${meta.actualChannelId} ${meta.actualChannelName}`.toLowerCase().includes(actualChannel)) return false;
          if (notificationStatus && String(meta.notificationStatus || '').trim().toLowerCase() !== notificationStatus) return false;
          if (minimumAmount && (minimum === null || amount < minimum)) return false;
          if (maximumAmount && (maximum === null || amount > maximum)) return false;
          if (!inUtc8DateRange(row[8], startDateUtc8, endDateUtc8)) return false;
          return true;
        }
        if (pageId === 'ledger') {
          const [identifier, tenant, accountScope, wallet, ledgerType, direction, businessDirection, minimumAmount, maximumAmount, startDateUtc8, endDateUtc8] = rawValues;
          const identifiers = platformLedgerIdentifiersFor(row).map(value => value.toLowerCase());
          const tenantReference = platformTenantReference(row[2]);
          const amount = parseCny(row[7]);
          const minimum = minimumAmount ? parseLedgerQueryAmount(minimumAmount) : null;
          const maximum = maximumAmount ? parseLedgerQueryAmount(maximumAmount) : null;
          if (identifier && !identifiers.includes(identifier)) return false;
          if (tenant && !`${tenantReference.id} ${tenantReference.name}`.toLowerCase().includes(tenant)) return false;
          if (accountScope && !String(row[3] || '').toLowerCase().includes(accountScope)) return false;
          if (wallet && !String(row[4] || '').toLowerCase().includes(wallet)) return false;
          if (ledgerType && !String(row[5] || '').toLowerCase().includes(ledgerType)) return false;
          if (direction && String(row[6] || '').trim().toLowerCase() !== direction) return false;
          if (businessDirection && platformLedgerBusinessDirection(row).toLowerCase() !== businessDirection) return false;
          if (minimumAmount && (minimum === null || amount < minimum)) return false;
          if (maximumAmount && (maximum === null || amount > maximum)) return false;
          if (!inUtc8DateRange(row[1], startDateUtc8, endDateUtc8)) return false;
          return true;
        }
        if (pageId === 'audit') {
          const [identifier, operatorAccount, operatorScope, actionCategory, objectType, result, risk, sourceIp, startDateUtc8, endDateUtc8] = rawValues;
          const meta = platformAuditMetaFor(row);
          const identifiers = platformAuditIdentifiersFor(row).map(value => value.toLowerCase());
          if (identifier && !identifiers.includes(identifier)) return false;
          if (operatorAccount && !String(meta.operatorAccount || '').toLowerCase().includes(operatorAccount)) return false;
          if (operatorScope && String(meta.operatorScope || '').trim().toLowerCase() !== operatorScope) return false;
          if (actionCategory && String(meta.actionCategory || '').trim().toLowerCase() !== actionCategory) return false;
          if (objectType && String(meta.objectType || '').trim().toLowerCase() !== objectType) return false;
          if (result && String(row[5] || '').trim().toLowerCase() !== result) return false;
          if (risk && String(row[6] || '').trim().toLowerCase() !== risk) return false;
          if (sourceIp && String(row[7] || '').trim().toLowerCase() !== sourceIp) return false;
          if (!inUtc8DateRange(row[1], startDateUtc8, endDateUtc8)) return false;
          return true;
        }
        const text = row.join(' ').toLowerCase();
        return values.every(value => text.includes(value));
      });
      return pageId === 'report'
        ? filtered.sort((left, right) => platformReportMetaFor(right).successAmount - platformReportMetaFor(left).successAmount)
        : filtered;
    }

    function orderFactsFor(row) {
      return platformOrderFacts[row[0]] || {
        identifiers: {
          '商户订单号': '未提供',
          '租户订单 / 请求号': '未提供',
          '平台订单号': row[0],
          '通道订单号': '未提供',
          '幂等键': '未提供'
        },
        source: '未提供',
        platformFee: '未提供',
        channelCost: '未提供',
        platformProfit: '未提供',
        walletSummary: '未提供',
        dataBoundary: '按当前端权限返回',
        ledgerRef: '未提供',
        auditRef: '未提供'
      };
    }

    function orderIdentifiersFor(row) {
      return orderFactsFor(row).identifiers;
    }

    function platformOrderQueryMetaFor(row) {
      return platformOrderQueryMeta.get(row?.[0]) || {
        tenantId: '',
        tenantName: '',
        merchantId: '',
        merchantName: '',
        channelVendorId: '',
        channelVendorName: '',
        actualChannelId: '',
        actualChannelName: '',
        notificationStatus: ''
      };
    }

    function capturePageFilters() {
      filterState[currentPage] = pages[currentPage].filters.map((_, index) => document.querySelector(`[data-page-filter="${index}"]`)?.value.trim() || '');
    }

    function validatePlatformOrderAmountFilters() {
      if (currentPage !== 'orders') return true;
      const minimumField = document.querySelector('[data-page-filter="8"]');
      const maximumField = document.querySelector('[data-page-filter="9"]');
      [minimumField, maximumField].forEach(field => field?.removeAttribute('aria-invalid'));
      const minimumRaw = minimumField?.value.trim() || '';
      const maximumRaw = maximumField?.value.trim() || '';
      const minimum = minimumRaw ? parseLedgerQueryAmount(minimumRaw) : null;
      const maximum = maximumRaw ? parseLedgerQueryAmount(maximumRaw) : null;
      if (minimumRaw && minimum === null) {
        minimumField.setAttribute('aria-invalid', 'true');
        minimumField.focus();
        showToast('CNY 最小金额格式错误，请输入最多两位小数的普通十进制');
        return false;
      }
      if (maximumRaw && maximum === null) {
        maximumField.setAttribute('aria-invalid', 'true');
        maximumField.focus();
        showToast('CNY 最大金额格式错误，请输入最多两位小数的普通十进制');
        return false;
      }
      if (minimum !== null && maximum !== null && minimum > maximum) {
        maximumField.setAttribute('aria-invalid', 'true');
        maximumField.focus();
        showToast('CNY 最小金额不能大于最大金额');
        return false;
      }
      return true;
    }

    function validatePlatformDateFilters(pageId = currentPage) {
      const dateIndices = { home: [0, 3], report: [2, 3], wallets: [3, 4], funds: [8, 9], orders: [10, 11], ledger: [9, 10], audit: [8, 9] };
      const indices = dateIndices[pageId];
      if (!indices) return true;
      const [startIndex, endIndex] = indices;
      const startField = document.querySelector(`[data-page-filter="${startIndex}"]`);
      const endField = document.querySelector(`[data-page-filter="${endIndex}"]`);
      [startField, endField].forEach(field => field?.removeAttribute('aria-invalid'));
      const start = String(filterState[pageId]?.[startIndex] || '').trim();
      const end = String(filterState[pageId]?.[endIndex] || '').trim();
      for (const [field, value, label] of [[startField, start, '开始日期'], [endField, end, '结束日期']]) {
        if (value && !/^\d{4}-\d{2}-\d{2}$/.test(value)) {
          field?.setAttribute('aria-invalid', 'true');
          field?.focus();
          showToast(`${label}格式错误，请输入 YYYY-MM-DD`);
          return false;
        }
      }
      if (start && end && start > end) {
        endField?.setAttribute('aria-invalid', 'true');
        endField?.focus();
        showToast('UTC+8 开始日期不能晚于结束日期');
        return false;
      }
      return true;
    }

    function updateCurrentTable({ announce = true } = {}) {
      capturePageFilters();
      if (!validatePlatformOrderAmountFilters() || !validatePlatformDateFilters()) return null;
      const page = pages[currentPage];
      const rows = filteredRowsForPage(currentPage);
      if (currentPage === 'home') {
        renderPage('home');
        if (announce) showToast(`首页已按同一筛选快照更新，共 ${rows.length} 个运营数据域`);
        return rows.length;
      }
      renderTableRows(page, rows, { resetPage: true });
      if (currentPage === 'report') document.getElementById('metrics').innerHTML = renderPlatformReportMetrics(rows);
      document.getElementById('tableTitle').textContent = currentPage === 'funds' && activeFundQueue !== '全部'
        ? `${activeFundQueue}待办`
        : currentPage === 'report' ? platformReportTableTitle() : page.tableTitle;
      if (announce) showToast(`已按当前条件查询，共 ${rows.length} 条结果`);
      return rows.length;
    }

    function resetCurrentFilters() {
      filterState[currentPage] = currentPage === 'home'
        ? ['2026-07-17', '', '', '2026-07-17']
        : currentPage === 'report'
          ? ['', '', '2026-07-17', '2026-07-17']
          : pages[currentPage].filters.map(() => '');
      document.querySelectorAll('[data-page-filter]').forEach((input, index) => { input.value = filterState[currentPage][index] || ''; });
      const rows = filteredRowsForPage(currentPage);
      if (currentPage === 'home') {
        renderPage('home');
        showToast(`首页筛选已恢复演示基准日，共 ${rows.length} 个运营数据域`);
        return;
      }
      renderTableRows(pages[currentPage], rows, { resetPage: true });
      if (currentPage === 'report') {
        document.getElementById('metrics').innerHTML = renderPlatformReportMetrics(rows);
        document.getElementById('tableTitle').textContent = platformReportTableTitle();
      }
      showToast(`筛选条件已重置，共 ${rows.length} 条结果`);
    }

    function setPlatformListState(pageId, status, errorId = 'LIST-LOAD-001') {
      if (!platformListState[pageId] || !['ok', 'loading', 'failure'].includes(status)) return;
      platformListState[pageId].status = status;
      platformListState[pageId].errorId = status === 'failure' ? errorId : '';
      if (pageId === currentPage) {
        const rows = filteredRowsForPage(pageId);
        renderTableRows(pages[pageId], rows);
        if (pageId === 'report') document.getElementById('metrics').innerHTML = renderPlatformReportMetrics(rows);
      }
    }

    function retryPlatformList() {
      const pageId = currentPage;
      setPlatformListState(pageId, 'loading');
      setTimeout(() => {
        platformListState[pageId].status = 'ok';
        if (pageId !== currentPage) return;
        updateCurrentTable({ announce: false });
        showToast(`列表已重新加载，当前搜索结果 ${filteredRowsForPage(pageId).length} 条`);
      }, 360);
    }

    function currentFilterSummary(pageId) {
      const page = pages[pageId];
      const summary = page.filters.map((label, index) => [label, filterState[pageId]?.[index] || '全部']).filter(item => item[1] !== '');
      const filterSummary = summary.map(item => `${item[0]}：${item[1]}`).join('；') || '全部';
      if (pageId === 'home') return `${filterSummary}；数据截止：${platformHomeCutoffAt} UTC+8`;
      return pageId === 'report' ? `${filterSummary}；统计截止：${platformReportCutoffAt} UTC+8` : filterSummary;
    }

    function utc8DateTime(date = new Date()) {
      const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      }).formatToParts(date).filter(part => part.type !== 'literal').map(part => [part.type, part.value]));
      return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`;
    }

    function clonePlatformExportValue(value) {
      return value == null ? value : JSON.parse(JSON.stringify(value));
    }

    function platformExportSnapshotDigest(value) {
      const input = JSON.stringify(value);
      let hash = 2166136261;
      for (let index = 0; index < input.length; index += 1) {
        hash ^= input.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return `fnv1a32:${(hash >>> 0).toString(16).padStart(8, '0')}:${input.length}`;
    }

    function platformTenantIdFromKnownIdentifier(value) {
      const text = String(value || '').trim();
      if (!text) return '';
      const directTenantId = text.match(/HS-TEN-\d+/)?.[0] || '';
      if (directTenantId) return directTenantId;
      const tenant = pages.tenants.rows.find(item => String(item?.[1] || '') === text);
      if (tenant) return String(tenant[0] || '');
      const orderId = [...platformOrderQueryMeta.keys()].find(id => text === id || text.includes(id));
      if (orderId) return String(platformOrderQueryMeta.get(orderId)?.tenantId || '');
      const fundEntry = [...platformFundMeta.entries()].find(([fundId, meta]) => [
        fundId,
        meta?.tenantRequestNo,
        meta?.fundApplicationId,
        meta?.sourceObjectId,
        meta?.sourceOrderId,
        meta?.platformOrderId
      ].some(identifier => identifier && (text === String(identifier) || text.includes(String(identifier)))));
      if (fundEntry) return String(fundEntry[1]?.tenantId || '');
      const ticket = platformWorkOrders.find(item => text === item.id || text.includes(item.id));
      if (ticket) return String(ticket.tenantId || '');
      const ledger = pages.ledger.rows.find(item => text === String(item?.[0] || '') || text.includes(String(item?.[0] || '')));
      if (ledger) return String(platformTenantReference(ledger[2]).id || '');
      return '';
    }

    function platformAuditTenantIdForRow(row) {
      const meta = platformAuditMetaFor(row);
      if (meta.scopeKind === 'platform_global') return 'PLATFORM_GLOBAL';
      const candidates = [
        meta.tenantId,
        meta.targetIdentifier,
        meta.objectId,
        meta.platformOrderId,
        meta.relatedApplicationId,
        row?.[4]
      ];
      for (const candidate of candidates) {
        const tenantId = platformTenantIdFromKnownIdentifier(candidate);
        if (tenantId) return tenantId;
      }
      return '';
    }

    function platformExportTenantIdForRow(pageId, row) {
      if (['tenants', 'business', 'report'].includes(pageId)) return String(row?.[0] || '');
      if (pageId === 'orders') return String(platformOrderQueryMetaFor(row)?.tenantId || '');
      if (pageId === 'funds') return String(platformFundMeta.get(row?.[0])?.tenantId || '');
      if (pageId === 'ledger') return String(platformTenantReference(row?.[2])?.id || '');
      if (pageId === 'tickets') return String(platformWorkOrderById(row?.[0])?.tenantId || '');
      if (pageId === 'wallets') return String(row?.[0] || '');
      if (pageId === 'audit') return platformAuditTenantIdForRow(row);
      return '';
    }

    function platformExportRowsCoveredByScope(pageId, rows, dataScope) {
      const scope = dataScope || { scopeCode: 'platform.all_tenants', tenantIds: [] };
      if (scope.scopeCode === 'platform.all_tenants') return rows;
      if (scope.scopeCode !== 'platform.assigned_tenants') return [];
      const allowed = new Set((scope.tenantIds || []).map(String));
      return rows.filter(row => {
        const tenantId = platformExportTenantIdForRow(pageId, row);
        return tenantId === 'PLATFORM_GLOBAL' || (tenantId && allowed.has(tenantId));
      });
    }

    function platformExportRows(pageId, dataScope = currentPlatformAccount.dataScope) {
      const page = pages[pageId];
      const fieldSnapshot = (page?.columns || []).filter(field => field !== '操作');
      const visibleRows = pageId === 'home' && dataScope?.scopeCode === 'platform.assigned_tenants'
        ? platformHomeOverviewRows(platformExportRowsCoveredByScope('report', filteredRowsForPage('report'), dataScope), dataScope)
        : platformExportRowsCoveredByScope(pageId, filteredRowsForPage(pageId), dataScope);
      const rowSnapshot = visibleRows.map(row => fieldSnapshot.map((_, index) => String(row[index] ?? '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim()));
      return { fieldSnapshot, rowSnapshot };
    }

    function platformExportSecuritySnapshot(permissionCode) {
      return {
        permissionCode,
        permissionVersion: currentPlatformAccount.permissionVersion,
        dataScope: clonePlatformExportValue(currentPlatformAccount.dataScope),
        sensitiveAccess: currentPlatformAccount.sensitiveAccess === true,
        fieldPolicy: currentPlatformAccount.sensitiveAccess === true ? '完整业务字段（绝密字段永久排除）' : '页面相同脱敏值',
        permanentlyExcluded: ['password', 'one_time_password', 'google_2fa', 'secret', 'token', 'raw_evidence_file']
      };
    }

    function addPlatformExportAudit(task, action, result = '成功', reason = '') {
      const item = {
        id: `PEA-20260722-${String(platformExportAuditSequence++).padStart(5, '0')}`,
        taskId: task?.id || '',
        action,
        result,
        reason,
        operator: currentPlatformAccount.name,
        at: utc8DateTime()
      };
      platformExportAudits.unshift(item);
      return item;
    }

    function addPlatformExportSecurityAudit(taskId, action, reason) {
      platformExportSecurityAudits.unshift({
        id: `PESA-20260722-${String(platformExportSecurityAuditSequence++).padStart(5, '0')}`,
        taskId: String(taskId || ''),
        action,
        result: '拒绝',
        reason,
        operator: currentPlatformAccount.name,
        at: utc8DateTime()
      });
    }

    function platformExportPermissionCovers(task) {
      const security = task?.securitySnapshot || {};
      const permissionCode = task?.permissionCode || security.permissionCode || platformExportPermissionByPage[task?.pageId] || '';
      if (!currentPlatformAccount.canExport || !hasPlatformActionPermission(permissionCode)) return false;
      const sensitiveAccessRequired = task?.sourceSensitiveAccessRequired ?? security.sensitiveAccess === true;
      if (sensitiveAccessRequired && currentPlatformAccount.sensitiveAccess !== true) return false;
      const createdScope = task?.sourceScopeSnapshot || security.dataScope || { scopeCode: 'platform.all_tenants', tenantIds: [] };
      const currentScope = currentPlatformAccount.dataScope || { scopeCode: 'platform.all_tenants', tenantIds: [] };
      if (currentScope.scopeCode === 'platform.all_tenants') return true;
      if (createdScope.scopeCode !== currentScope.scopeCode) return false;
      return (createdScope.tenantIds || []).every(id => (currentScope.tenantIds || []).includes(id));
    }

    function visiblePlatformExportTasks() {
      return [...platformExportTasks.values()].filter(platformExportPermissionCovers);
    }

    function visiblePlatformExportAudits() {
      const visibleTaskIds = new Set(visiblePlatformExportTasks().map(task => task.id));
      return platformExportAudits.filter(item => visibleTaskIds.has(item.taskId));
    }

    function rejectHiddenPlatformExportTask(taskId, action) {
      addPlatformExportSecurityAudit(taskId, action, '任务不存在或当前账号无权查看');
      showToast('当前无权查看或操作该导出任务');
    }

    function closePlatformExportDrawerAfterAccessChange() {
      const title = document.getElementById('drawerTitle')?.textContent || '';
      if (title === '导出记录' || title.startsWith('导出文件 ·')) closeDrawer();
    }

    function platformExportExpired(task, now = new Date()) {
      const expiresAtMs = Number(task?.expiresAtMs ?? Date.parse(`${String(task?.expiresAt || '').replace(' ', 'T')}+08:00`));
      return Number.isFinite(expiresAtMs) && now.getTime() >= expiresAtMs;
    }

    function ensurePlatformExportTaskContract(task) {
      const permissionCode = task.permissionCode || platformExportPermissionByPage[task.pageId] || '';
      task.permissionCode = permissionCode;
      task.normalizedFilterSnapshot ||= { pageId: task.pageId, filters: {}, legacyScope: task.scope };
      task.cutoffAt ||= task.createdAt;
      task.securitySnapshot ||= {
        permissionCode,
        permissionVersion: 1,
        dataScope: { scopeCode: 'platform.all_tenants', tenantIds: [] },
        sensitiveAccess: false,
        fieldPolicy: '页面相同脱敏值',
        permanentlyExcluded: ['password', 'one_time_password', 'google_2fa', 'secret', 'token', 'raw_evidence_file']
      };
      task.sourceScopeSnapshot ||= clonePlatformExportValue(task.securitySnapshot.dataScope);
      task.sourceSensitiveAccessRequired ??= task.securitySnapshot.sensitiveAccess === true;
      if (!task.fileDefinitionSnapshot) {
        const fieldSnapshot = (pages[task.pageId]?.columns || []).filter(field => field !== '操作');
        const rowSnapshot = [];
        const contentDigest = platformExportSnapshotDigest({ fieldSnapshot, rowSnapshot, redactionResult: task.securitySnapshot.fieldPolicy });
        task.fileDefinitionSnapshot = {
          pageId: task.pageId,
          pageTitle: task.pageTitle,
          normalizedFilterSnapshot: clonePlatformExportValue(task.normalizedFilterSnapshot),
          cutoffAt: task.cutoffAt,
          fieldSnapshot,
          redactionResult: task.securitySnapshot.fieldPolicy,
          rowRangeSnapshot: { mode: 'legacy_task_without_file_rows', rowCount: 0 },
          rowSnapshot,
          watermark: `汇盛平台 / ${task.operator} / ${task.createdAt} / ${task.scope}`,
          format: String(task.format || 'XLSX').toUpperCase(),
          contentDigest,
          permanentlyExcluded: [...task.securitySnapshot.permanentlyExcluded]
        };
      }
      task.fileSnapshotDigest ||= platformExportSnapshotDigest(task.fileDefinitionSnapshot);
      task.expiresAtMs ||= Date.parse(`${String(task.expiresAt || '').replace(' ', 'T')}+08:00`);
      return task;
    }

    platformExportTasks.forEach(ensurePlatformExportTaskContract);

    function createPlatformExportTask(pageId, format, sourceTask = null) {
      const now = new Date();
      const createdAt = utc8DateTime(now);
      const expiresAt = utc8DateTime(new Date(now.getTime() + 24 * 60 * 60 * 1000));
      const page = pages[pageId];
      const permissionCode = platformExportPermissionByPage[pageId] || '';
      if (!page || !currentPlatformAccount.canExport || !hasPlatformActionPermission(permissionCode)) return null;
      const compact = createdAt.replace(/[- :]/g, '');
      const includesRefundSnapshot = ['home', 'report', 'orders', 'ledger'].includes(pageId);
      const normalizedFilterSnapshot = sourceTask
        ? clonePlatformExportValue(sourceTask.normalizedFilterSnapshot)
        : {
            pageId,
            filters: Object.fromEntries(page.filters.map((label, index) => [label, String(filterState[pageId]?.[index] || '').trim()]))
          };
      const securitySnapshot = platformExportSecuritySnapshot(permissionCode);
      const sourceScopeSnapshot = sourceTask
        ? clonePlatformExportValue(sourceTask.sourceScopeSnapshot || sourceTask.securitySnapshot.dataScope)
        : clonePlatformExportValue(securitySnapshot.dataScope);
      const sourceSensitiveAccessRequired = sourceTask
        ? Boolean(sourceTask.sourceSensitiveAccessRequired ?? sourceTask.securitySnapshot.sensitiveAccess)
        : securitySnapshot.sensitiveAccess === true;
      const cutoffAt = includesRefundSnapshot ? platformRefundAggregate.cutoffAt : createdAt;
      const originalRows = sourceTask
        ? { fieldSnapshot: clonePlatformExportValue(sourceTask.fileDefinitionSnapshot.fieldSnapshot), rowSnapshot: clonePlatformExportValue(sourceTask.fileDefinitionSnapshot.rowSnapshot) }
        : platformExportRows(pageId, sourceScopeSnapshot);
      const redactionResult = sourceTask?.fileDefinitionSnapshot.redactionResult || securitySnapshot.fieldPolicy;
      const watermark = `汇盛平台 / ${currentPlatformAccount.name} / ${createdAt} / ${sourceTask?.scope || currentFilterSummary(pageId)}`;
      const fileFormat = String(sourceTask?.format || format).toUpperCase();
      const contentDigest = platformExportSnapshotDigest({ fieldSnapshot: originalRows.fieldSnapshot, rowSnapshot: originalRows.rowSnapshot, redactionResult });
      const fileDefinitionSnapshot = {
        pageId,
        pageTitle: page.title,
        normalizedFilterSnapshot: clonePlatformExportValue(normalizedFilterSnapshot),
        cutoffAt,
        fieldSnapshot: originalRows.fieldSnapshot,
        redactionResult,
        rowRangeSnapshot: { mode: 'created_snapshot', rowCount: originalRows.rowSnapshot.length },
        rowSnapshot: originalRows.rowSnapshot,
        watermark,
        format: fileFormat,
        contentDigest,
        permanentlyExcluded: [...securitySnapshot.permanentlyExcluded],
        ...(sourceTask ? { regeneratedFrom: sourceTask.id } : {})
      };
      const task = {
        id: `EX-${pageId.toUpperCase()}-${compact.slice(0, 8)}-${String(platformExportSequence++).padStart(4, '0')}`,
        pageId,
        pageTitle: page.title,
        scope: sourceTask?.scope || currentFilterSummary(pageId),
        operator: currentPlatformAccount.name,
        createdAt,
        expiresAt,
        expiresAtMs: now.getTime() + 24 * 60 * 60 * 1000,
        format: fileFormat,
        fileName: `${page.title.replace(/[\\/:*?"<>|\s]+/g, '-')}_${compact.slice(0, 8)}.${format.toLowerCase()}`,
        downloads: 0,
        status: '已完成',
        permissionResult: '已通过',
        permissionCode,
        cutoffAt,
        normalizedFilterSnapshot,
        securitySnapshot,
        sourceScopeSnapshot,
        sourceSensitiveAccessRequired,
        fileDefinitionSnapshot,
        fileSnapshotDigest: platformExportSnapshotDigest(fileDefinitionSnapshot),
        factRevision: PLATFORM_REFUND_JOURNEY_FACTS_REVISION,
        refundAggregateSnapshot: includesRefundSnapshot ? JSON.parse(JSON.stringify(platformRefundAggregate)) : null
      };
      if (sourceTask) task.retryOf = sourceTask.id;
      platformExportTasks.set(task.id, task);
      addPlatformExportAudit(task, sourceTask ? '按原范围重试并创建新任务' : '创建导出任务', '成功', sourceTask ? `原任务 ${sourceTask.id}` : task.scope);
      return task;
    }

    function retryPlatformExport(taskId) {
      const oldTask = platformExportTasks.get(taskId);
      if (!oldTask || !platformExportPermissionCovers(oldTask)) {
        rejectHiddenPlatformExportTask(taskId, '重试导出任务');
        return null;
      }
      if (!['生成失败', '已失效'].includes(oldTask.status)) {
        addPlatformExportAudit(oldTask, '重试导出任务', '拒绝', `任务状态 ${oldTask.status} 不允许重试`);
        showToast('只有生成失败或已失效的任务可以按原范围重试');
        return null;
      }
      const task = createPlatformExportTask(oldTask.pageId, oldTask.format.toLowerCase(), oldTask);
      if (!task) return null;
      openPlatformExportResult(task.id);
      showToast(`已按原范围生成新任务 ${task.id}，旧任务继续保留`);
      return task;
    }

    function downloadPlatformExport(taskId) {
      const task = platformExportTasks.get(taskId);
      if (!task || !platformExportPermissionCovers(task)) {
        rejectHiddenPlatformExportTask(taskId, '下载导出文件');
        return false;
      }
      if (task.status === '已失效') {
        addPlatformExportAudit(task, '下载导出文件', '拒绝', '文件已失效，本次重复下载尝试继续留审计');
        showToast('文件已失效，不能继续下载；本次拒绝已登记审计');
        return false;
      }
      if (task.status !== '已完成') {
        addPlatformExportAudit(task, '下载导出文件', '拒绝', `任务状态 ${task.status} 不允许下载`);
        showToast('文件尚不可下载或已失效');
        return false;
      }
      if (platformExportExpired(task)) {
        task.status = '已失效';
        addPlatformExportAudit(task, '下载导出文件', '拒绝', '文件超过 24 小时有效期');
        openPlatformExportResult(taskId);
        showToast('文件已超过 24 小时，旧任务与审计继续保留');
        return false;
      }
      task.downloads += 1;
      addPlatformExportAudit(task, '下载导出文件', '成功', `第 ${task.downloads} 次`);
      openPlatformExportResult(taskId);
      showToast(`${task.fileName} 第 ${task.downloads} 次下载已登记审计`);
      return true;
    }

    function platformHomeModuleNotice(key, label) {
      const health = platformHomeHealth[key] || { status: 'ok', lastSuccess: '-' };
      if (health.status === 'ok') return '';
      const copy = health.status === 'failure'
        ? `更新失败，继续展示 ${health.lastSuccess} UTC+8 的最近成功值`
        : health.status === 'delayed'
          ? `数据延迟超过 1 分钟，当前展示 ${health.lastSuccess} UTC+8 的最近成功值`
          : '当前范围暂无数据，请调整筛选或重新加载';
      return `<div class="home-module-notice ${health.status === 'failure' ? 'error' : ''}"><span><strong>${label}</strong> · ${copy}</span><button class="btn" type="button" data-retry-platform-home="${key}">重新加载</button></div>`;
    }

      if (!platformHomeHealth[key] || !['ok', 'failure', 'delayed', 'empty'].includes(status)) return;
      platformHomeHealth[key].status = status;

    function fundActionMarkup(row) {
      const rowIndex = pages.funds.rows.indexOf(row);
      const correction = platformFundCorrections.get(row[0]);
      const fundMeta = platformFundMeta.get(row[0]) || {};
      const buttons = [];
      if (row[2] === '存款确认') {
        buttons.push(['query', '主动查单', ''], ['feedback', '登记通道商反馈', 'primary']);
      } else if (row[2] === '提款审核') {
        if (row[5] === '待审批') buttons.push(fundMeta.applicant === currentPlatformAccount.name ? ['self-review-blocked', '申请人不可自审', 'disabled'] : ['review', '审核申请', 'primary']);
        if (row[5] === '待执行') buttons.push(['execute-withdrawal', '选择通道并执行', 'primary']);
        if (row[5] === '处理中') buttons.push(['query', '主动查单', ''], ['feedback', '登记通道商反馈', 'primary']);
      } else if (/账户审核|人工调整/.test(row[2]) && row[5] === '待审批') {
        buttons.push(fundMeta.applicant === currentPlatformAccount.name ? ['self-review-blocked', '申请人不可自审', 'disabled'] : ['review', '审核申请', 'primary']);
      } else if (/异常资金|结果冲突/.test(row[2])) {
        buttons.push(['query', '主动查单', '']);
        if (row[2] === '结果冲突' && (fundMeta.riskHoldId || fundMeta.channelFundReturnId)) buttons.push(['feedback', '登记核实结果', '']);
        if (!correction) buttons.push(['create-correction', '创建资金更正', 'primary']);
        if (correction?.status === '待复核') {
          if (correction.applicant === currentPlatformAccount.name) buttons.push(['self-review-blocked', '等待其他人员复核', 'disabled']);
          else buttons.push(['review-correction', '复核资金更正', 'primary']);
        }
        if (correction?.status === '待执行') buttons.push(['execute-correction', '执行资金更正', 'primary']);
      }
      buttons.push(['communicate', '记录沟通', '']);
      return buttons.map(([action, label, tone]) => {
        const disabledReason = '申请人不能审核自己发起的业务申请';
        return `<button class="btn ${tone === 'primary' ? 'primary' : ''}" type="button" data-fund-action="${action}" data-fund-row="${rowIndex}" ${tone === 'disabled' ? `disabled aria-disabled="true" title="${disabledReason}"` : ''}>${label}</button>`;
      }).join('');

    function renderPlatformWorkOrderTimeline(order) {
      if (!order?.events?.length) return '<p class="muted">当前没有公开时间线。</p>';
      return renderKv(order.events.map(event => [
        `#${event.sequence} · ${escapeHtml(event.actorScope)} · ${escapeHtml(event.action)}`,
        `${escapeHtml(event.message)}${event.attachments?.length ? `<br><small>附件：${event.attachments.map(escapeHtml).join('、')} · 只追加</small>` : ''}<br><small>${escapeHtml(event.actor)} · ${escapeHtml(event.at)}（UTC+8）</small>`
      ]));
    }

    function platformWorkOrderActionMarkup(order, rowIndex) {
      if (!order) return '<span class="muted">工单事实不存在，请刷新。</span>';
      const buttons = [];
      if (order.status === '待平台受理') buttons.push(['accept', '受理', 'primary'], ['reply', '追加公开回复', '']);
      if (order.status === '处理中') buttons.push(['reply', '追加公开进展', ''], ['request-info', '要求租户补充', ''], ['resolve', '标记已解决', 'primary']);
      if (order.status === '待租户补充') buttons.push(['reply', '追加公开说明', '']);
      if (!buttons.length) return '<span class="muted">当前状态只读，等待租户确认或查看历史。</span>';
      return buttons.map(([action, label, tone]) => `<button class="btn ${tone}" type="button" data-ticket-action="${action}" data-ticket-row="${rowIndex}" data-ticket-version="${order.version}">${label}</button>`).join('');

    function submitPlatformTicketAction(button) {
      const order = platformWorkOrderById(button.dataset.ticketId);
      const expectedVersion = Number(button.dataset.ticketVersion);
      const action = button.dataset.ticketSubmit;
      if (!order || order.version !== expectedVersion) {
        showToast(`工单版本已变化，请刷新最新记录；本次未追加消息或状态`);
        return;
      }
      const allowedStates = {
        accept: ['待平台受理'],
        reply: ['待平台受理', '处理中', '待租户补充'],
        'request-info': ['处理中'],
        resolve: ['处理中']
      };
      if (!allowedStates[action]?.includes(order.status)) {
        showToast('当前状态不允许该动作，请刷新后重新判断');
        return;
      }
      const messageField = document.getElementById('platformTicketMessage');
      const message = messageField?.value.trim() || '';
      const minimum = action === 'accept' ? 2 : 4;
      if (message.length < minimum) {
        showToast(action === 'resolve' ? '请填写可核对的公开处理结论' : action === 'request-info' ? '请明确说明需要租户补充的资料' : '请填写公开进展');
        messageField?.focus();
        return;
      }
      const evidenceInput = document.getElementById('platformTicketEvidence');
      const evidenceResult = validateBusinessEvidenceInput(evidenceInput, { required: false, existingCount: 0 });
      if (evidenceInput && !applyBusinessEvidenceFeedback(evidenceInput, evidenceResult)) return;

      const transitions = { accept: '处理中', reply: order.status, 'request-info': '待租户补充', resolve: '已解决' };
      const labels = { accept: '受理', reply: '追加进展', 'request-info': '要求补充', resolve: '标记解决' };
      const nextStatus = transitions[action];
      const at = platformNow();
      order.status = nextStatus;
      order.version += 1;
      order.updatedAt = at;
      order.wait = '00:00:00';
      order.latest = message;
      order.delivery = '已排队';
      order.events.push({
        sequence: order.events.length + 1,
        actorScope: '平台',
        actor: currentPlatformAccount.name,
        action: labels[action],
        message,
        attachments: evidenceResult.names || [],
        at
      });
      syncPlatformWorkOrderRows();
      const auditId = addPlatformAudit({ action: `工单${labels[action]}`, object: `工单 / ${order.id}`, result: '成功', risk: '一般', actionCategory: '租户与商户', objectType: '工单', objectId: order.id, targetPage: 'tickets', targetIdentifier: order.id });
      setPlatformFactReceipt({ title: `工单${labels[action]}已提交`, object: order.id, status: `${order.status} · v${order.version}`, auditId, target: 'tickets' });
      closeDrawer();
      renderPage('tickets');
      showToast(`${order.id} 已追加公开时间线并更新为 ${order.status} · v${order.version}；原业务事实未变化`);
    }

    function businessGrantExists(tenantId, direction) {
      return pages.business.rows.some(row => row[0] === tenantId && row[2] === direction);
    }

    function firstNewBusinessGrantScope() {
      const directions = ['代收', '代付'];
      for (const tenant of pages.tenants.rows) {
        if (tenant[2] === '停用') continue;
        const direction = directions.find(item => !businessGrantExists(tenant[0], item));
        if (direction) return { tenantId: tenant[0], tenantName: tenant[1], direction };
      }
      return { tenantId: '', tenantName: '', direction: '代收' };
    }

    function businessTenantOptions(selectedTenantId = '', forCreate = false) {
      const tenantMap = new Map();
      pages.tenants.rows.forEach(row => tenantMap.set(row[0], { name: row[1], status: row[2] }));
      pages.business.rows.forEach(row => {
        if (!tenantMap.has(row[0])) tenantMap.set(row[0], { name: row[1], status: '正常' });
      });
      return [...tenantMap.entries()].map(([id, tenant]) => {
        const noNewDirection = forCreate && ['代收', '代付'].every(direction => businessGrantExists(id, direction));
        const disabled = (tenant.status === '停用' || noNewDirection) && id !== selectedTenantId;
        const suffix = tenant.status === '停用' ? ' / 已停用' : noNewDirection ? ' / 两个方向均已存在' : '';
        return `<option value="${escapeHtml(`${id}|${tenant.name}`)}" ${id === selectedTenantId ? 'selected' : ''} ${disabled ? 'disabled' : ''}>${escapeHtml(id)} / ${escapeHtml(tenant.name)}${suffix}</option>`;
      }).join('');
    }

    function syncBusinessAuthorizationOptions(direction, selectedChannels = null, selectedRate = '') {
      document.querySelectorAll('[data-channel-direction]').forEach(card => {
        const matches = card.dataset.channelDirection === direction;
        const input = card.querySelector('input');
        card.hidden = !matches;
        input.disabled = !matches;
        input.checked = matches && (selectedChannels instanceof Set ? selectedChannels.has(input.value) : true);
      });
      const packageSelect = document.getElementById('businessFeePackage');
      if (!packageSelect) return;
      const matchingPackages = Array.from(packageSelect.options).filter(option => option.dataset.packageDirection === direction);
      Array.from(packageSelect.options).forEach(option => {
        const matches = option.dataset.packageDirection === direction;
        option.hidden = !matches;
        option.disabled = !matches;
      });
      const selectedOption = matchingPackages.find(option => option.value === selectedRate) || matchingPackages[0];
      if (selectedOption) packageSelect.value = selectedOption.value;
    }

    function syncNewBusinessGrantScope(tenantId) {
      const directionSelect = document.getElementById('businessDirection');
      if (!directionSelect) return;
      Array.from(directionSelect.options).forEach(option => {
        option.disabled = businessGrantExists(tenantId, option.value);
      });
      if (directionSelect.selectedOptions[0]?.disabled) {
        const firstAvailable = Array.from(directionSelect.options).find(option => !option.disabled);
        if (firstAvailable) directionSelect.value = firstAvailable.value;
      }
      syncBusinessAuthorizationOptions(directionSelect.value);
    }

    function parseSourceContext(text, fallback = '页面关联下钻') {
      const parts = String(text || '').split('|').filter(Boolean);
      const from = parts.shift() || fallback;
      const items = parts.map(part => {
        const separator = part.indexOf(':');
        return separator > -1 ? { label: part.slice(0, separator), value: part.slice(separator + 1) } : { label: '条件', value: part };
      });
      return { from, items };
    }

      filterState[target] = pages[target].filters.map((_, index) => {
        if (Object.prototype.hasOwnProperty.call(sourceFilters, index)) return String(sourceFilters[index] ?? '');

    async function copyText(value) {
      const text = String(value ?? '');
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (error) {
        void error;
      }
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        return Boolean(document.execCommand?.('copy'));
      } catch (error) {
        return false;
      } finally {
        textarea.remove();
      }
    }

    function platformOperationReference(form) {

      if (form.id === 'businessAuthForm') return `${String(data.get('tenant') || '').split('|')[0]} / CNY ${data.get('direction') || ''}`;

    function showPlatformOperationFeedback(form, { tone = 'warning', title, message, action = '' }) {
      const panel = platformOperationPanel(form);
      if (!panel) return;
      panel.className = `operation-feedback ${tone}`;
      panel.setAttribute('role', tone === 'error' ? 'alert' : 'status');
      panel.setAttribute('aria-live', tone === 'error' ? 'assertive' : 'polite');
      panel.setAttribute('aria-atomic', 'true');
      panel.innerHTML = `<strong>${escapeHtml(title)}</strong><span>${escapeHtml(message)}</span>${action === 'query' ? '<div class="feedback-actions"><button class="btn" type="button" data-platform-operation-query>查询原请求结果</button></div>' : action === 'refresh' ? '<div class="feedback-actions"><button class="btn" type="button" data-platform-operation-refresh>刷新最新版本</button></div>' : ''}`;
      if (tone === 'error') requestAnimationFrame(() => panel.querySelector('button')?.focus());
    }

    function setPlatformNextSubmitOutcome(outcome = 'success') {
      if (!['success', 'duplicate', 'conflict', 'timeout'].includes(outcome)) return;
      platformOperationControl.nextOutcome = outcome;
    }

    function guardPlatformOperationSubmit(event) {
      const form = event.target;
      const requiredPermission = platformRequiredPermissionForForm(form);
      if (!hasPlatformActionPermission(requiredPermission)) {
        event.preventDefault();
        event.stopImmediatePropagation();
        blockPlatformPermission(requiredPermission);
        return;
      }
      const kind = platformOperationKind(form);
      if (!kind) return;
      const button = event.submitter || form.querySelector('[type="submit"]');
      const originalText = button?.textContent || '确认提交';
      if (button) {
        button.disabled = true;
        button.textContent = '提交中…';
      }
      const restore = () => {
        if (!button?.isConnected) return;
        button.disabled = false;
        button.textContent = originalText;
      };
      const outcome = platformOperationControl.nextOutcome;
      platformOperationControl.nextOutcome = 'success';
      if (outcome === 'success') {
        setTimeout(restore, 420);
        return;
      }
      event.preventDefault();
      event.stopImmediatePropagation();
      const secretField = form.querySelector('[name="twofa"]');
      if (secretField) secretField.value = '';
      const reference = platformOperationReference(form);
      const requestId = `REQ-P-${String(platformOperationControl.sequence++).padStart(4, '0')}`;
      platformOperationControl.pending = { form, kind, reference, requestId, outcome };
      setTimeout(() => {
        restore();
        if (outcome === 'duplicate') {
          showPlatformOperationFeedback(form, { tone: 'success', title: '已存在相同请求', message: `${reference} 已返回原记录 ${requestId}；本次未重复执行、生成任务或写入结果。` });
        } else if (outcome === 'conflict') {
          showPlatformOperationFeedback(form, { tone: 'error', title: '数据已更新，请刷新后重新确认', message: `${reference} 的记录版本已由 v1 更新为 v2；当前表单内容已保留，刷新前不会提交。`, action: 'refresh' });
        } else {
          showPlatformOperationFeedback(form, { tone: 'warning', title: '结果尚未确认', message: `${requestId} 请求超时；当前业务状态与资金事实保持不变，确认原请求结果前不能重复提交。`, action: 'query' });
        }
      }, 320);
    }

          showToast('资金事项已变化，请刷新后重试');

        if (action === 'feedback') return openFundFeedback(rowIndex);
        if (action === 'review') return openFundReview(rowIndex);
        if (action === 'execute-withdrawal') return openWithdrawalExecution(rowIndex);
        if (action === 'create-correction') return openFundCorrection(rowIndex);
        if (action === 'review-correction') return openFundCorrectionReview(rowIndex);
        if (action === 'execute-correction') return openFundCorrectionExecution(rowIndex);
        if (action === 'communicate') return openFundCommunication(rowIndex);
        if (action === 'query') {
          recordPlatformFundAction(row, { action: '主动查单', title: '通道查单已提交', status: '等待原通道返回，不改变当前资金状态', progress: '主动查单已提交，等待原通道返回' });

    document.addEventListener('submit', guardPlatformOperationSubmit, true);

    document.addEventListener('submit', event => {
      if (event.target.id === 'exportForm') {
        event.preventDefault();
        const pageId = event.target.dataset.pageId;
        const data = new FormData(event.target);
        const task = createPlatformExportTask(pageId, String(data.get('format') || 'xlsx'));
        if (!task) {
          showToast('最新权限校验未通过，未创建导出任务、文件或成功审计');
          return;
        }
        openPlatformExportResult(task.id);
        showToast(`${task.pageTitle}导出任务 ${task.id} 已生成，可在 24 小时内重复下载`);
        return;
      }

      if (event.target.id === 'orderSearchForm') {
        event.preventDefault();
        const data = new FormData(event.target);
        const type = data.get('idType');
        const orderId = String(data.get('orderId') || '').trim();
        const normalizedOrderId = orderId.toLowerCase();
        const matches = pages.orders.rows.filter(row => String(orderIdentifiersFor(row)[type] || '').trim().toLowerCase() === normalizedOrderId);
        closeDrawer();
        filterState.orders = pages.orders.filters.map((_, index) => index === 0 ? orderId : '');
        renderPage('orders');
        renderTableRows(pages.orders, matches);
        if (matches.length === 1) openDrawer(pages.orders.rows.indexOf(matches[0]));
        showToast(matches.length ? `已按${type} ${orderId} 定位 ${matches.length} 条订单链并记录查询审计` : `未找到${type} ${orderId}，没有打开其他订单`);
        return;
      }

      if (event.target.id === 'businessAuthForm') {
        event.preventDefault();
        if (!validPlatformTwoFa(event.target)) return;
        const data = new FormData(event.target);
        const channels = data.getAll('channels');
        if (!channels.length) {
          showToast('至少选择一个可授权通道');
          return;
        }
        const [tenantId, tenantName] = String(data.get('tenant')).split('|');
        const direction = String(data.get('direction'));
        const rate = String(data.get('rate'));
        const editingRowIndex = event.target.dataset.editingRow === '' ? null : Number(event.target.dataset.editingRow);
        const editingRow = Number.isInteger(editingRowIndex) ? pages.business.rows[editingRowIndex] : null;
        if (editingRow && (editingRow[0] !== tenantId || editingRow[2] !== direction)) {
          showPlatformOperationFeedback(event.target, { tone: 'error', title: '业务授权范围已变化', message: '本次没有保存，请关闭后从最新列表重新进入调整。', action: 'refresh' });
          return;
        }
        const selectedPackage = event.target.querySelector('#businessFeePackage option:checked');
        if (!selectedPackage || selectedPackage.dataset.packageDirection !== direction || selectedPackage.disabled) {
          showToast('请选择与业务方向一致的启用套餐');
          return;
        }
        const existing = pages.business.rows.find(row => row[0] === tenantId && row[2] === direction);
        if (existing && !editingRow) {
          showPlatformOperationFeedback(event.target, { tone: 'error', title: '该业务授权已经存在', message: '本次没有覆盖现有授权。请关闭后从对应详情进入“调整授权”。' });
          return;
        }
        const status = existing?.[4] || '已开通';
        const nextRow = [tenantId, tenantName, direction, 'CNY', status, rate, `${channels.length} 个`, channels.join(' / '), utc8DateTime()];
        if (existing) pages.business.rows[pages.business.rows.indexOf(existing)] = nextRow;
        else pages.business.rows.unshift(nextRow);
        businessGrantMeta.set(`${tenantId}:${direction}`, { tenantActive: true, feeBindingActive: true, availableChannelCount: channels.length });
        syncBusinessGrantStats();
        const auditId = addPlatformAudit({ action: existing ? '变更业务授权' : '新增业务授权', object: `租户业务 / ${tenantId} CNY ${direction}`, actionCategory: '业务与通道', objectType: '租户业务', objectId: `${tenantId}:CNY:${direction}`, targetPage: 'business', targetIdentifier: tenantId });
        setPlatformFactReceipt({ title: existing ? '业务授权已更新' : '业务授权已新增', object: `${tenantId} / CNY ${direction}`, status: `${status} · ${channels.length} 个通道`, auditId, target: 'business' });
        closeDrawer();
        renderPage('business');
        showToast(`已保存 ${tenantName} CNY ${direction}：${channels.length} 个授权通道${status === '停用' ? '；业务仍保持停用' : ''}`);
        return;
      }

      if (event.target.id === 'businessStatusForm') {
        event.preventDefault();
        if (!validPlatformTwoFa(event.target)) return;
        const rowIndex = Number(event.target.dataset.rowIndex);
        const row = pages.business.rows[rowIndex];
        const action = event.target.dataset.action;
        const expectedStatus = event.target.dataset.expectedStatus;
        if (!row || row[4] !== expectedStatus) {
          showPlatformOperationFeedback(event.target, { tone: 'error', title: '业务授权状态已变化', message: '本次没有改变业务状态，请刷新列表后重新核对。', action: 'refresh' });
          return;
        }
        const enabling = action === 'enable';
        const meta = businessGrantMeta.get(businessGrantKey(row)) || { tenantActive: true, feeBindingActive: Boolean(row[5]), availableChannelCount: Number.parseInt(row[6], 10) || 0 };
        if (enabling && (!meta.tenantActive || !meta.feeBindingActive || meta.availableChannelCount < 1)) {
          event.target.querySelector('[name="twofa"]').value = '';
          const missing = [!meta.tenantActive && '租户当前不可用', !meta.feeBindingActive && '没有唯一同方向启用套餐', meta.availableChannelCount < 1 && '没有当前可用授权通道'].filter(Boolean).join('；');
          showPlatformOperationFeedback(event.target, { tone: 'error', title: '重新开通条件未满足', message: `${missing}。业务继续保持停用，本次未重置任何下级状态。` });
          return;
        }
        row[4] = enabling ? '已开通' : '停用';
        row[8] = platformNow().slice(0, 16);
        syncBusinessGrantStats();
        const auditId = addPlatformAudit({ action: enabling ? '重新开通业务授权' : '停用业务授权', object: `租户业务 / ${row[0]} CNY ${row[2]}`, actionCategory: '业务与通道', objectType: '租户业务', objectId: `${row[0]}:CNY:${row[2]}`, targetPage: 'business', targetIdentifier: row[0] });
        setPlatformFactReceipt({
          title: enabling ? '业务已重新开通' : '业务已停用',
          object: `${row[0]} / CNY ${row[2]}`,
          status: enabling ? '后续新单资格已恢复 · 下级状态保持不变' : '三端新单已阻断 · 存量业务继续',
          auditId,
          target: 'business'
        });
        closeDrawer();
        renderPage('business');
        showToast(enabling ? `${row[1]} CNY ${row[2]}已重新开通；下级状态保持不变` : `${row[1]} CNY ${row[2]}已停用；历史和存量业务继续保留`);
        return;
      }

      if (event.target.id === 'fundReviewForm') {
        event.preventDefault();
        const row = pages.funds.rows[Number(event.target.dataset.rowIndex)];
        if (!row || row[0] !== event.target.dataset.fundId || row[5] !== '待审批') {
          showPlatformOperationFeedback(event.target, { tone: 'error', title: '申请状态已变化', message: '当前审核未提交，请刷新待办后重新核对。', action: 'refresh' });
          return;
        }
        const meta = platformFundMeta.get(row[0]) || {};
        if (meta.applicant === currentPlatformAccount.name) {
          showPlatformOperationFeedback(event.target, { tone: 'error', title: '申请人不能自审', message: '请由平台内部另一名有审核权限的账号处理；本次没有资金、账户版本或通知副作用。' });
          return;
        }
        if (meta.entityVersion !== Number(event.target.dataset.expectedVersion)) {
          event.target.querySelector('[name="twofa"]').value = '';
          showPlatformOperationFeedback(event.target, { tone: 'error', title: '申请版本已变化', message: `当前版本为 v${meta.entityVersion}，本次审核未提交，请刷新后重新核对。`, action: 'refresh' });
          return;
        }
        if (!validPlatformTwoFa(event.target)) return;
        const data = new FormData(event.target);
        const approved = data.get('decision') === 'approve';
        if (approved && row[2] === '人工调整') {
          const wallet = platformWalletRow(row[1]);
          const column = platformWalletColumn(row[3]);
          const available = meta.available !== undefined ? meta.available : wallet && column !== undefined ? parseCny(wallet[column]) : 0;
          const amount = parseCny(row[4]);
          if (meta.adjustment === '扣款' && amount > available) {
            event.target.querySelector('[name="twofa"]').value = '';
            showPlatformOperationFeedback(event.target, { tone: 'error', title: '余额复核未通过，不能扣款', message: `当前${row[3]}账面余额为 ${formatCny(available)}，低于申请扣款 ${row[4]}。可改为拒绝并写明余额不足，不能修改原申请金额。` });
            return;
          }
        }
        if (!approved) {
          if (row[2] === '提款审核') changePlatformWallet({ tenantName: row[1], walletName: row[3], frozenDelta: -(meta.frozen || parseCny(row[4])) });
          meta.reviewer = currentPlatformAccount.name;
          meta.reviewedAt = platformNow();
          meta.reviewDecision = '拒绝';
          meta.reviewReason = String(data.get('reason'));
          meta.entityVersion += 1;
          meta.reviewAuditId = removePlatformFund(row, { title: `${row[2]}已拒绝`, status: `拒绝 · 审核人 ${meta.reviewer} · v${meta.entityVersion}`, action: `拒绝${row[2]}`, result: '拒绝' });
          refreshPlatformFunds(`${row[0]} 已拒绝；申请快照、理由与审核记录已保留`);
          return;
        }
        meta.reviewer = currentPlatformAccount.name;
        meta.reviewedAt = platformNow();
        meta.reviewDecision = '通过';
        meta.reviewReason = String(data.get('reason'));
        meta.entityVersion += 1;
        if (row[2] === '提款审核') {
          row[5] = '待执行';
          row[8] = '平台审核通过，等待选择已启用的 CNY 代付通道';
          row[9] = '可执行';
          meta.reviewAuditId = recordPlatformFundAction(row, { action: '通过租户提款审核', title: '租户提款审核已通过', status: `审核人 ${meta.reviewer} · v${meta.entityVersion} · 待选择通道执行` });
          refreshPlatformFunds(`${row[0]} 审核通过；下一步由平台选择通道执行`);
          return;
        }
        if (row[2] === '人工调整') {
          const amount = parseCny(row[4]);
          const delta = meta.adjustment === '扣款' ? -amount : amount;
          const balance = changePlatformWallet({ tenantName: row[1], walletName: row[3], totalDelta: delta });
          if (balance) addPlatformLedger({ tenantName: row[1], walletName: row[3], type: `人工${meta.adjustment || '调整'}`, direction: delta < 0 ? '支出' : '收入', amount, before: balance.before, after: balance.after, relation: meta.tenantRequestNo || meta.sourceObjectId || row[0] });
          meta.reviewAuditId = removePlatformFund(row, { title: '人工调整审核并执行完成', status: `${meta.adjustment || '调整'} ${row[4]} · 审核人 ${meta.reviewer} · v${meta.entityVersion}`, action: '通过并执行人工调整' });
          refreshPlatformFunds(`${row[0]} 已完成审核与独立流水入账`);
