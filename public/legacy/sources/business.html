<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汇盛支付平台端 · 通道商授权</title><style>
    :root {
      --font-ui: "Avenir Next", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: "DIN Alternate", "Avenir Next Condensed", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-mono: "SFMono-Regular", "Fira Code", Consolas, monospace;
      --color-primary: #145fe8;
      --color-primary-hover: #0f52cc;
      --color-primary-light: #e8f3ff;
      --color-bg-page: #f5f7fb;
      --color-bg-surface: #ffffff;
      --color-bg-subtle: #f7f8fa;
      --color-border: #e5e6eb;
      --color-border-strong: #c9cdd4;
      --color-text-primary: #1d2129;
      --color-text-secondary: #4e5969;
      --color-text-tertiary: #626d7b;
      --color-success: #087a55;
      --color-success-light: #e8fff3;
      --color-warning: #8a4b00;
      --color-warning-light: #fff7e8;
      --color-danger: #cf1f1f;
      --color-danger-light: #fff0ed;
      --color-info: #0e7490;
      --color-info-light: #e6fffb;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --shadow-modal: 0 18px 48px rgba(29, 33, 41, 0.18);
      --sidebar-width: 248px;
      --topbar-height: 56px;
      --spacing-control: 32px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--color-bg-page);
      color: var(--color-text-primary);
      font-family: var(--font-ui);
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      background: #111827;
      color: #d9e0ec;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .brand {
      min-height: 64px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #145fe8 0%, #0e7490 100%);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
    }

    .brand strong {
      display: block;
      color: #fff;
      font-size: 16px;
      line-height: 1.3;
    }

    .brand span {
      display: block;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 2px;
    }

    .nav {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .nav-title {
      padding: 0 10px;
      color: #8b95a7;
      font-size: 12px;
      font-weight: 700;
      line-height: 24px;
    }

    .nav-button {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 0;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: 10px;
      color: #c9d1df;
      background: transparent;
      text-align: left;
      transition: background 0.16s ease, color 0.16s ease;
    }

    .nav-button:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
    }

    .nav-button.active {
      background: rgba(20, 95, 232, 0.24);
      color: #fff;
    }

    .nav-button i,
    .btn i,
    .icon-link i {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .workspace {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 15;
      height: var(--topbar-height);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--color-border);
      backdrop-filter: blur(10px);
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--color-text-tertiary);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .breadcrumbs strong {
      color: var(--color-text-secondary);
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .searchbox {
      width: 280px;
      height: 34px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-bg-subtle);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      color: var(--color-text-tertiary);
      font-size: 13px;
    }

    .searchbox input {
      min-width: 0;
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--color-text-primary);
    }

    .searchbox input::placeholder {
      color: var(--color-text-tertiary);
      opacity: 1;
    }

    .content {
      padding: 20px 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .page-head {
      min-height: 86px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 18px;
      padding: 18px 20px;
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
    }

    .page-title {
      margin: 0 0 6px;
      font-family: var(--font-display);
      font-size: 24px;
      line-height: 1.25;
      font-weight: 720;
      letter-spacing: 0;
    }

    .page-subtitle {
      margin: 0;
      color: var(--color-text-secondary);
      font-size: 13px;
      line-height: 1.6;
      max-width: 980px;
    }

    .data-freshness {
      margin: 6px 0 0;
      color: var(--color-text-tertiary);
      font-size: 12px;
      line-height: 1.5;
    }

    .page-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn[hidden] {
      display: none !important;
    }

    .content.channel-compact-mode {
      padding-top: 14px;
      gap: 10px;
    }

    .content.channel-compact-mode .page-head {
      min-height: 0;
      padding: 12px 16px;
      align-items: center;
    }

    .content.channel-compact-mode .page-title {
      margin-bottom: 3px;
      font-size: 21px;
    }

    .content.channel-compact-mode .page-subtitle {
      line-height: 1.45;
    }

    .content.channel-compact-mode .data-freshness {
      margin-top: 3px;
    }

    .content.channel-compact-mode .tabs {
      min-height: 44px;
      padding-block: 5px;
    }

    .content.channel-compact-mode .panel-head {
      min-height: 42px;
      padding-block: 9px;
    }

    .content.channel-compact-mode .channel-action-bar {
      min-height: 44px;
      padding: 6px 12px;
    }

    .content.channel-compact-mode .filters {
      padding: 8px 12px;
      gap: 8px;
    }

    .content.channel-compact-mode .table-pagination {
      min-height: 44px;
      padding: 6px 12px;
    }

    .btn {
      height: 32px;
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-md);
      background: #fff;
      color: var(--color-text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      white-space: nowrap;
      transition: border-color 0.16s ease, color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    }

    .btn:hover {
      border-color: var(--color-primary-hover);
      color: var(--color-primary);
    }

    .btn.primary {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }

    .btn.primary:hover {
      background: var(--color-primary-hover);
      color: #fff;
    }

    .btn.ghost {
      border-color: transparent;
      background: #f2f3f5;
      color: var(--color-text-secondary);
    }

    .btn.danger {
      border-color: #ffd4cc;
      background: #fff;
      color: var(--color-danger);
    }

    .btn:disabled,
    .btn:disabled:hover {
      cursor: not-allowed;
      border-color: var(--color-border);
      background: #f2f3f5;
      color: #9aa0aa;
      box-shadow: none;
    }

    .fact-receipt {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 14px;
      border: 1px solid #b7f4d5;
      border-radius: var(--radius-md);
      background: var(--color-success-light);
    }

    .fact-receipt.show {
      display: flex;
    }

    .fact-receipt-main {
      min-width: 0;
      display: grid;
      gap: 4px;
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.5;
    }

    .fact-receipt-title {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      color: var(--color-text-primary);
      font-size: 13px;
    }

    .fact-receipt-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex: 0 0 auto;
    }

    .modal-feedback {
      margin-bottom: 14px;
      padding: 10px 12px;
      border: 1px solid #ffd4cc;
      border-radius: var(--radius-md);
      background: var(--color-danger-light);
      color: var(--color-danger);
      font-size: 13px;
      line-height: 1.5;
    }

    .confirm-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: #fbfcfe;
      color: var(--color-text-secondary);
      font-size: 13px;
      line-height: 1.5;
    }

    .confirm-card input {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      flex: 0 0 auto;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      border-radius: 999px;
      padding: 0 8px;
      border: 1px solid transparent;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .pill.blue {
      color: var(--color-primary);
      background: var(--color-primary-light);
      border-color: #bedaff;
    }

    .pill.green {
      color: var(--color-success);
      background: var(--color-success-light);
      border-color: #b7f4d5;
    }

    .pill.orange {
      color: var(--color-warning);
      background: var(--color-warning-light);
      border-color: #ffe4ba;
    }

    .pill.red {
      color: var(--color-danger);
      background: var(--color-danger-light);
      border-color: #ffd4cc;
    }

    .pill.gray {
      color: var(--color-text-secondary);
      background: #f2f3f5;
      border-color: var(--color-border);
    }

    .pill.cyan {
      color: var(--color-info);
      background: var(--color-info-light);
      border-color: #a7f3d0;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 44px;
      padding: 5px;
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow-x: auto;
    }

    .tab {
      height: 32px;
      border: 0;
      border-radius: var(--radius-sm);
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: transparent;
      color: var(--color-text-secondary);
      font-size: 13px;
      white-space: nowrap;
      transition: background 0.16s ease, color 0.16s ease;
    }

    .tab:hover {
      background: var(--color-bg-subtle);
      color: var(--color-primary);
    }

    .tab.active {
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-weight: 700;
    }

    .workbench {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 14px;
      align-items: start;
    }

    .workbench.collection-table-mode,
    .workbench.payout-table-mode,
    .workbench.product-table-mode {
      grid-template-columns: minmax(0, 1fr);
    }

    .workbench.collection-table-mode .rail,
    .workbench.payout-table-mode .rail,
    .workbench.product-table-mode .rail {
      display: none;
    }

    .panel {
      min-width: 0;
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .panel-head {
      min-height: 48px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 15px;
      line-height: 1.35;
      font-weight: 720;
    }

    .panel-meta {
      color: var(--color-text-tertiary);
      font-size: 12px;
      white-space: nowrap;
    }

    .filters {
      padding: 12px 14px;
      border-bottom: 1px solid var(--color-border);
      display: grid;
      grid-template-columns: repeat(5, minmax(128px, 1fr)) auto;
      gap: 10px;
      align-items: end;
      background: #fbfcfe;
    }

    .filters.collection-mode {
      grid-template-columns: minmax(220px, 1fr) minmax(170px, 0.7fr) auto;
    }

    .filters.payout-mode {
      grid-template-columns: minmax(230px, 1.2fr) repeat(3, minmax(160px, 0.8fr)) auto auto;
    }

    .channel-action-bar {
      min-height: 52px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: #fff;
    }

    .channel-action-bar[hidden] {
      display: none !important;
    }

    .channel-action-bar .btn.warn {
      color: #8a4b00;
      border-color: #f0b44d;
      background: #fff7e8;
    }

    .channel-action-bar .btn.danger {
      color: var(--color-danger);
      border-color: #f3b5ad;
      background: var(--color-danger-light);
    }

    .vendor-summary {
      padding: 12px 14px;
      border-bottom: 1px solid var(--color-border);
      display: grid;
      grid-template-columns: minmax(150px, 0.55fr) minmax(260px, 1fr) minmax(420px, 1.8fr);
      gap: 10px;
      background: #f7f9fc;
    }

    .vendor-summary[hidden],
    .field[hidden] {
      display: none !important;
    }

    .summary-item {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: #fff;
      display: grid;
      gap: 3px;
    }

    .summary-item label {
      color: var(--color-text-tertiary);
      font-size: 12px;
      font-weight: 650;
    }

    .summary-item strong {
      font-family: var(--font-mono);
      font-size: 17px;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    .summary-wallet,
    .wallet-cell {
      display: grid;
      gap: 7px;
    }

    .summary-wallet-row,
    .wallet-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }

    .currency-tag {
      min-width: 46px;
      height: 23px;
      padding: 0 7px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .wallet-balance {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .wallet-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 3px 12px;
      color: var(--color-text-secondary);
      font-size: 11px;
      line-height: 1.45;
    }

    .wallet-metrics strong {
      color: var(--color-text);
      font-family: var(--font-mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .capability-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      max-width: 240px;
    }

    .field {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    .field label {
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.2;
      font-weight: 600;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-height: 32px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--color-text-primary);
      outline: 0;
      padding: 5px 9px;
      font-size: 13px;
    }

    .check-grid {
      min-height: 32px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .check-line {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--color-text-secondary);
      cursor: pointer;
    }

    .check-line input {
      width: 16px;
      height: 16px;
      accent-color: var(--color-primary);
    }

    .field textarea {
      min-height: 74px;
      resize: vertical;
      line-height: 1.5;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--color-primary-hover);
      box-shadow: 0 0 0 3px rgba(20, 95, 232, 0.1);
    }

    .table-wrap {
      overflow: auto;
      min-height: 404px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 980px;
    }

    table.channel-wide {
      min-width: 2200px;
    }

    table.collection-wide {
      width: 2200px;
      min-width: 2200px;
      table-layout: fixed;
    }

    table.payout-wide {
      width: 2180px;
      min-width: 2180px;
      table-layout: fixed;
    }

    table.vendor-wide {
      min-width: 1280px;
    }

    th,
    td {
      height: 44px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--color-border);
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--color-bg-subtle);
      color: var(--color-text-secondary);
      font-size: 12px;
      font-weight: 700;
    }

    th:last-child,
    td:last-child {
      position: sticky;
      right: 0;
      z-index: 2;
      background: #fff;
      box-shadow: -1px 0 0 var(--color-border);
    }

    th:last-child {
      z-index: 3;
      background: var(--color-bg-subtle);
    }

    tbody tr {
      transition: background 0.16s ease;
    }

    tbody tr:hover {
      background: #f7fbff;
    }

    tbody tr.action-open {
      position: relative;
      z-index: 8;
    }

    tbody tr:hover td:last-child {
      background: #f7fbff;
    }

    tbody tr.action-open td:last-child {
      z-index: 30;
    }

    .collection-wide th,
    .collection-wide td {
      height: 40px;
      padding: 6px 8px;
    }

    .collection-wide th:last-child,
    .collection-wide td:last-child {
      position: static;
      box-shadow: none;
    }

    .collection-wide tbody tr {
      height: var(--collection-row-height, 60px);
    }

    .collection-wide tbody tr:hover td:last-child {
      background: transparent;
    }

    .payout-wide th,
    .payout-wide td {
      height: 40px;
      padding: 6px 8px;
    }

    .payout-wide tbody tr {
      height: 52px;
    }

    .payout-wide .payout-inline-actions {
      align-items: center;
      flex-wrap: wrap;
      gap: 2px 8px;
      white-space: normal;
      font-size: 11px;
    }

    .payout-wide .payout-inline-actions .cell-link,
    .payout-wide .cell-action > .cell-link {
      height: auto;
      padding: 0;
      border-radius: 0;
      background: transparent;
      font-weight: 600;
    }

    .payout-wide .payout-inline-actions .cell-link:hover,
    .payout-wide .cell-action > .cell-link:hover {
      background: transparent;
      text-decoration: underline;
    }

    .payout-wide .money-action-buttons .cell-link {
      height: 22px;
      padding-inline: 5px;
      color: #fff;
      border-color: #e7a126;
      background: #e7a126;
      font-size: 11px;
    }

    .payout-wide .money-action-buttons .cell-link:hover {
      background: #cf8811;
    }

    .payout-wide .money-action {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .payout-wide .cell-action {
      gap: 4px;
    }

    .payout-wide .cell-action > .cell-link i,
    .payout-wide .row-actions .icon-link i {
      display: none;
    }

    .payout-wide .row-actions {
      gap: 1px;
    }

    .payout-wide .row-actions .icon-link {
      height: 24px;
      padding-inline: 4px;
      font-size: 11px;
    }

    .payout-wide .collection-toggle {
      flex: 0 0 38px;
    }

    .collection-select {
      width: 16px;
      height: 16px;
      accent-color: var(--color-primary);
    }

    .collection-channel-cell {
      min-height: 44px;
      display: grid;
      align-content: center;
      gap: 3px;
      white-space: normal;
    }

    .collection-channel-name {
      color: var(--color-text-primary);
      font-weight: 650;
      line-height: 1.35;
    }

    .collection-row-links {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
    }

    .collection-row-links .cell-link,
    .collection-wide .money-action-buttons .cell-link,
    .collection-type-actions .cell-link {
      height: auto;
      padding: 0;
      border-radius: 0;
      background: transparent;
      font-weight: 600;
    }

    .collection-row-links .cell-link:hover,
    .collection-wide .money-action-buttons .cell-link:hover,
    .collection-type-actions .cell-link:hover {
      background: transparent;
      text-decoration: underline;
    }

    .collection-type-stack {
      display: grid;
      align-content: center;
      gap: 0;
      min-height: 30px;
    }

    .collection-type-line {
      min-height: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .collection-type-action-line {
      overflow: visible;
    }

    .collection-type-action-line .action-menu {
      position: fixed;
      right: auto;
      z-index: 100;
    }

    .collection-code-option { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .collection-code-option input { flex-shrink: 0; }
    .collection-code-count { color: var(--color-text-secondary); font-size: 13px; }
    .collection-code-delete-list { margin: 12px 0 0; padding-left: 22px; line-height: 1.8; }

    .collection-type-name {
      color: var(--color-text-tertiary);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .collection-type-actions {
      display: grid;
      align-content: center;
      gap: 0;
    }

    .collection-type-actions > span {
      min-height: 30px;
      display: flex;
      align-items: center;
    }

    .collection-toggle {
      position: relative;
      flex: 0 0 38px;
      min-width: 38px !important;
      width: 38px !important;
      min-height: 32px !important;
      height: 32px !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 999px;
      background: transparent;
      box-shadow: none;
    }

    .collection-toggle::before {
      content: "";
      position: absolute;
      top: 7px;
      left: 2px;
      width: 34px;
      height: 18px;
      border-radius: 999px;
      background: #c7ced8;
      transition: background .18s ease;
    }

    .collection-toggle::after {
      content: "";
      position: absolute;
      top: 9px;
      left: 4px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .22);
      transition: transform .18s ease;
    }

    .collection-toggle.on::before {
      background: #409eff;
    }

    .collection-toggle.on::after {
      transform: translateX(16px);
    }

    .collection-wide .money-action {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .collection-wide .money-action-buttons {
      gap: 6px;
    }

    .collection-wide .money-action-buttons .cell-link,
    .collection-wide .collection-type-actions .cell-link {
      font-size: 11px;
    }

    .table-pagination {
      min-height: 52px;
      padding: 9px 14px;
      border-top: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      color: var(--color-text-secondary);
      background: #fff;
      font-size: 12px;
    }

    .table-pagination[hidden],
    .filters[hidden] {
      display: none !important;
    }

    .page-chip {
      min-width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--color-primary);
      color: #fff;
      font-weight: 700;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .muted {
      color: var(--color-text-tertiary);
    }

    .row-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .icon-link {
      height: 28px;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--color-primary);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
      white-space: nowrap;
    }

    .icon-link:hover {
      background: var(--color-primary-light);
    }

    .cell-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
    }

    .cell-action .cell-value {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cell-link {
      height: 24px;
      border: 0;
      border-radius: var(--radius-sm);
      background: var(--color-primary-light);
      color: var(--color-primary);
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 0 6px;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
    }

    .cell-link:hover {
      background: #d8eaff;
    }

    .cell-link i {
      width: 14px;
      height: 14px;
    }

    .money-action {
      display: grid;
      grid-template-columns: auto;
      gap: 4px;
      min-width: 112px;
    }

    .money-action strong {
      color: var(--color-text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .money-action-buttons {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .money-action-buttons .cell-link {
      padding-inline: 5px;
    }

    .switch-button {
      min-width: 54px;
      height: 28px;
      padding: 0 9px;
      border: 1px solid;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      transition: color .18s ease, background .18s ease, border-color .18s ease;
    }

    .switch-button.on {
      color: var(--color-success);
      border-color: #a8e8c8;
      background: var(--color-success-light);
    }

    .switch-button.off {
      color: var(--color-text-tertiary);
      border-color: var(--color-border);
      background: #f3f4f6;
    }

    .payout-inline-actions {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .balance-cell {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 128px;
    }

    .balance-values {
      display: grid;
      gap: 2px;
      min-width: 58px;
    }

    .balance-line {
      display: flex;
      align-items: baseline;
      gap: 4px;
      line-height: 1.25;
      white-space: nowrap;
    }

    .balance-label {
      color: var(--color-text-tertiary);
      font-size: 11px;
    }

    .action-more {
      position: relative;
      display: inline-flex;
    }

    .action-more summary {
      height: 28px;
      border-radius: var(--radius-sm);
      color: var(--color-primary);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
      cursor: pointer;
      user-select: none;
      list-style: none;
    }

    .action-more summary::-webkit-details-marker {
      display: none;
    }

    .action-more summary:hover,
    .action-more[open] summary {
      background: var(--color-primary-light);
    }

    .action-menu {
      position: absolute;
      right: 0;
      top: 34px;
      z-index: 20;
      width: 156px;
      padding: 6px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: #fff;
      box-shadow: var(--shadow-md);
      display: grid;
      gap: 2px;
    }

    .action-menu .icon-link {
      width: 100%;
      justify-content: flex-start;
      color: var(--color-text-secondary);
    }

    .action-menu .icon-link:hover {
      color: var(--color-primary);
    }

    .rail {
      position: sticky;
      top: calc(var(--topbar-height) + 14px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .chain {
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .chain-node {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      min-height: 52px;
    }

    .node-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: var(--radius-md);
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-weight: 800;
      font-size: 12px;
    }

    .node-title {
      color: var(--color-text-tertiary);
      font-size: 12px;
      margin-bottom: 3px;
    }

    .node-value {
      color: var(--color-text-primary);
      font-size: 13px;
      line-height: 1.35;
      font-weight: 650;
      word-break: break-word;
    }

    .rule-list {
      padding: 12px 14px 14px;
      display: grid;
      gap: 10px;
    }

    .rule-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.55;
    }

    .rule-dot {
      width: 7px;
      height: 7px;
      margin-top: 6px;
      border-radius: 50%;
      background: var(--color-primary);
    }

    .health-bar {
      width: 118px;
      height: 8px;
      border-radius: 999px;
      background: #eef0f5;
      overflow: hidden;
    }

    .health-bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--color-success);
    }

    .health-bar.warning span {
      background: var(--color-warning);
    }

    .health-bar.danger span {
      background: var(--color-danger);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(17, 24, 39, 0.42);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(960px, 100%);
      max-height: calc(100vh - 56px);
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-modal);
      overflow: hidden;
    }

    .modal.sm {
      width: min(680px, 100%);
    }

    .modal.lg {
      width: min(1180px, 100%);
    }

    .modal-head {
      min-height: 56px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.35;
    }

    .modal-body {
      padding: 16px 18px;
      overflow: auto;
    }

    .modal-foot {
      min-height: 56px;
      padding: 12px 18px;
      border-top: 1px solid var(--color-border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      background: #fbfcfe;
    }

    .desc-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 18px;
    }

    .desc-item {
      min-width: 0;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 8px;
    }

    .desc-item label {
      display: block;
      color: var(--color-text-tertiary);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .desc-item span {
      display: block;
      color: var(--color-text-primary);
      font-size: 13px;
      line-height: 1.45;
      word-break: break-word;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 14px;
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    .blue-form {
      display: grid;
      gap: 14px;
      padding: 2px 0;
    }

    .blue-row {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
    }

    .blue-row label {
      color: var(--color-text-secondary);
      font-size: 14px;
      line-height: 1.35;
      font-weight: 600;
      text-align: right;
    }

    .blue-row.required label::before {
      content: "* ";
      color: var(--color-danger);
    }

    .blue-row input,
    .blue-row select,
    .blue-row textarea {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--color-text-primary);
      outline: 0;
      padding: 7px 12px;
      font-size: 14px;
    }

    .blue-row textarea {
      min-height: 88px;
      resize: vertical;
      line-height: 1.55;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .blue-row input[readonly],
    .blue-row input:disabled,
    .blue-row textarea[readonly] {
      background: #f4f7fb;
      color: var(--color-text-secondary);
    }

    .payout-development-form textarea { min-height: 58px; }
    .payout-development-form .radio-line input { width: 16px; }

    .blue-inline {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .blue-code {
      width: 108px;
      flex: 0 0 108px;
    }

    .radio-line {
      display: flex;
      gap: 28px;
      align-items: center;
      min-height: 38px;
    }

    .radio-line label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      color: var(--color-text-primary);
      font-size: 14px;
      font-weight: 600;
    }

    .radio-line input {
      width: 16px;
      min-height: 16px;
      accent-color: var(--color-primary);
    }

    .stepper {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) 54px;
      min-height: 38px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #fff;
    }

    .stepper button,
    .stepper input {
      border: 0;
      min-height: 38px;
      border-radius: 0;
      text-align: center;
      background: #fff;
    }

    .stepper button {
      color: var(--color-text-secondary);
      background: #f7f9fc;
      font-size: 18px;
    }

    .stepper button:hover {
      color: var(--color-primary);
      background: var(--color-primary-light);
    }

    .blue-section {
      position: relative;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 28px 22px 20px;
      margin-top: 8px;
    }

    .blue-section-title {
      position: absolute;
      top: -12px;
      left: 20px;
      padding: 0 10px;
      background: #fff;
      color: var(--color-text-primary);
      font-size: 16px;
      font-weight: 700;
    }

    .hint {
      margin-top: 6px;
      color: var(--color-text-tertiary);
      font-size: 13px;
      line-height: 1.45;
    }

    .test-split {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .test-block {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: #fbfcfe;
      overflow: hidden;
    }

    .test-block h3 {
      margin: 0;
      padding: 10px 12px;
      border-bottom: 1px solid var(--color-border);
      font-size: 13px;
      line-height: 1.35;
    }

    .test-block textarea {
      width: 100%;
      min-height: 150px;
      border: 0;
      border-radius: 0;
      background: #fff;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.55;
      resize: vertical;
      outline: 0;
    }

    .inline-error {
      display: none;
      margin-top: 8px;
      color: var(--color-danger);
      font-size: 12px;
    }

    .inline-error.show {
      display: block;
    }

    .timeline {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr);
      gap: 10px;
      color: var(--color-text-secondary);
      font-size: 13px;
      line-height: 1.5;
    }

    .timeline-item::before {
      content: "";
      width: 8px;
      height: 8px;
      margin-top: 6px;
      border-radius: 50%;
      background: var(--color-primary);
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 60;
      min-width: 280px;
      max-width: 420px;
      display: none;
      align-items: start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: #111827;
      color: #fff;
      box-shadow: 0 10px 28px rgba(17, 24, 39, 0.22);
      font-size: 13px;
      line-height: 1.5;
    }

    .toast.show {
      display: flex;
      animation: toast-in 0.18s ease;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 1280px) {
      .app {
        grid-template-columns: 72px minmax(0, 1fr);
      }

      .brand strong,
      .brand span,
      .nav-title,
      .nav-button span {
        display: none;
      }

      .brand {
        justify-content: center;
        padding: 12px;
      }

      .nav-button {
        justify-content: center;
      }

      .workbench {
        grid-template-columns: minmax(0, 1fr);
      }

      .rail {
        position: static;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 860px) {
      .topbar,
      .page-head {
        grid-template-columns: minmax(0, 1fr);
      }

      .top-actions,
      .page-actions {
        justify-content: flex-start;
      }

      .searchbox {
        width: 100%;
      }

      .filters,
      .vendor-summary,
      .form-grid,
      .desc-grid,
      .test-split,
      .rail {
        grid-template-columns: minmax(0, 1fr);
      }

      .blue-row {
        grid-template-columns: minmax(0, 1fr);
        gap: 6px;
      }

      .blue-row label {
        text-align: left;
      }

      .content {
        padding: 14px;
      }

      .fact-receipt {
        align-items: stretch;
        flex-direction: column;
      }

      .fact-receipt-actions .btn {
        flex: 1 1 140px;
      }
    }

    @media (max-width: 720px) {
      .app { display: block; }
      .topbar { height: auto; min-height: 56px; padding: 10px 14px; }
      .sidebar {
        position: sticky;
        top: 0;
        z-index: 30;
        height: auto;
        overflow-x: auto;
      }
      .brand { min-height: 54px; justify-content: flex-start; padding: 10px 14px; }
      .brand strong, .brand span { display: block; }
      .nav { padding: 8px 12px 12px; }
      .nav > div { display: flex; gap: 8px; width: max-content; }
      .nav-title { display: none; }
      .nav-button { width: auto; min-width: max-content; min-height: 44px; }
      .nav-button span { display: inline; }
      .modal-backdrop { padding: 0; align-items: flex-end; }
      .modal { width: 100%; height: auto; max-height: 92vh; border-radius: 16px 16px 0 0; }
      .modal-head { padding: 12px 16px; }
      .modal-body { padding: 14px 16px; }
      .modal-foot { position: sticky; bottom: 0; padding: 10px 16px; }
      .toast { left: 14px; right: 14px; bottom: 14px; min-width: 0; max-width: none; }
      th:last-child,
      td:last-child {
        position: static;
        box-shadow: none;
      }
    }
    /* 三端共用：键盘、动效与窄屏触控基线 */
    :focus-visible {
      outline: 3px solid #ffffff;
      box-shadow: 0 0 0 5px #145fe8;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    @media (max-width: 768px) {
      button,
      input:not([type="checkbox"]):not([type="radio"]),
      select,
      textarea,
      [role="button"] {
        min-height: 44px !important;
      }

      button,
      [role="button"] {
        min-width: 44px !important;
      }

      input,
      select,
      textarea {
        font-size: 16px !important;
      }

      .action-more summary {
        min-height: 44px;
      }
    }

    /* 三端统一视觉与响应式基线（2026-07-18） */
    :root {
      --font-ui: "Avenir Next", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

</style><script src="../platform-auth-route-guard.js" data-page-permission="platform.business_grant.view"></script></head><body><main class="tenant-content"><section class="page-head"><div><h1>通道商授权</h1><p class="page-subtitle">平台负责通道商接入和租户授权；租户自行建立通道、配置产品与对接信息。</p></div><div class="page-actions"><button class="btn" data-action="refresh">刷新</button><button class="btn" id="exportButton" data-action="export">导出授权</button><button class="btn primary" id="primaryAction" data-action="primary">新增通道商授权</button></div></section><div class="tenant-filters"><label for="tenantFilter">租户</label><select id="tenantFilter"></select><label for="keyword">通道商 / 租户</label><input id="keyword" placeholder="请输入名称或编号"><button class="btn primary" data-action="search">查询</button><button class="btn" data-action="reset">重置</button></div><div class="tenant-page-table"><table style="min-width:960px"><thead><tr><th>租户</th><th>通道商</th><th>授权业务</th><th>授权状态</th><th>最近变更</th><th>变更原因</th><th>操作</th></tr></thead><tbody id="tableBody"></tbody></table></div><p id="recordCount" class="muted" role="status"></p><section class="tenant-panel"><h3>租户服务费</h3><p class="muted">在租户管理新增／编辑中设置。</p><table><thead><tr><th>租户</th><th>代收计费</th><th>代付计费</th></tr></thead><tbody id="tenantBillingRows"></tbody></table></section></main><div class="modal-backdrop" id="modalBackdrop" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle"></h2><button class="btn ghost" data-action="close">关闭</button></div><div class="modal-body" id="modalBody"></div><div class="modal-footer" id="modalFoot"></div></section></div><div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span></div><script>(() => {
 const guard=window.HSPlatformAuthRouteGuard;if(guard?.allowBusinessBoot?.()===false)return;
 const model=window.HSProviderDemo,$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const auth=guard?.getAuthorizationContext?.();const allowed=code=>!auth||auth.actionPermissions.includes(code);
 const scopedTenants=model.tenants.filter(t=>!auth||auth.dataScope?.scopeCode!=='platform.assigned_tenants'||auth.dataScope.tenantIds.includes(t.id));
 let editing=null,returnFocus=null;
 const tenant=id=>model.tenants.find(t=>t.id===id),provider=id=>model.providers.find(p=>p.id===id);
 const directionTags=p=>(p?.directions||[]).map(d=>`<span class="pill ${d==='代收'?'green':'blue'}">${esc(d)}</span>`).join(' ');
 function toast(t){$('#toastText').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2600);}
 function rows(){const tid=$('#tenantFilter').value,q=$('#keyword').value.toLowerCase().trim();return model.grants.filter(g=>scopedTenants.some(t=>t.id===g.tenantId)&&(!tid||g.tenantId===tid)&&(!q||[tenant(g.tenantId)?.name,provider(g.providerId)?.name,g.id].join(' ').toLowerCase().includes(q)));}
 function render(){const tid=$('#tenantFilter').value;$('#tenantBillingRows').innerHTML=scopedTenants.filter(t=>!tid||t.id===tid).map(t=>{const billing=model.tenantBilling(t.id);return `<tr><td>${esc(t.name)}</td><td>${esc(model.billingFormula(billing.collection))}</td><td>${esc(model.billingFormula(billing.payout))}</td></tr>`;}).join('');const list=rows();$('#tableBody').innerHTML=list.map(g=>`<tr><td><strong>${esc(tenant(g.tenantId)?.name)}</strong><div class="muted">${esc(g.tenantId)}</div></td><td><strong>${esc(provider(g.providerId)?.name)}</strong><div class="muted">${esc(g.providerId)}</div></td><td>${directionTags(g)}</td><td><span class="pill ${g.status==='已授权'?'green':'gray'}">${esc(g.status)}</span></td><td>${esc(g.updatedAt)}</td><td>${esc(g.reason)}</td><td>${allowed('platform.business_grant.manage')?`<button class="icon-link" data-edit="${esc(g.id)}">编辑授权</button>`:'只读'}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">暂无符合条件的通道商授权</td></tr>';$('#recordCount').textContent=`共 ${list.length} 条授权`;$('#primaryAction').hidden=!allowed('platform.business_grant.manage');$('#exportButton').hidden=!allowed('platform.business_grant.export');}
 function open(id){if(!allowed('platform.business_grant.manage'))return toast('当前账号无授权管理权限');editing=model.grants.find(g=>g.id===id)||null;if(id&&(!editing||!scopedTenants.some(t=>t.id===editing.tenantId)))return toast('无权访问此授权');returnFocus=document.activeElement;$('#modalTitle').textContent=editing?'编辑通道商授权':'新增通道商授权';
  $('#modalBody').innerHTML=`<div id="formError" class="modal-feedback" role="alert" hidden></div><div class="form-grid"><div class="field"><label for="grantTenant">租户</label><select id="grantTenant" ${editing?'disabled':''}>${scopedTenants.map(t=>`<option value="${t.id}" ${editing?.tenantId===t.id?'selected':''}>${esc(t.name)} · ${t.id}</option>`).join('')}</select></div><div class="field"><label for="grantStatus">授权状态</label><select id="grantStatus"><option ${editing?.status!=='已停用'?'selected':''}>已授权</option><option ${editing?.status==='已停用'?'selected':''}>已停用</option></select></div></div><div class="field" style="margin-top:16px"><label>通道商</label><div id="providerChoices"></div><p class="muted">逐个勾选通道商的代收／代付业务，通道和产品由租户配置。</p></div><div class="field"><label for="grantReason">变更原因</label><textarea id="grantReason" maxlength="200">${esc(editing?.reason||'')}</textarea></div><div class="field"><label for="grantMfa">当前操作人 Google MFA 验证码 *</label><input id="grantMfa" type="text" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" required placeholder="请输入 6 位验证码" aria-describedby="grantMfaHelp formError"><p id="grantMfaHelp" class="muted">演示验证码：123456</p></div>`;
  $('#modalFoot').innerHTML='<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="saveGrant">保存授权</button>';$('#modalBackdrop').classList.add('show');$('#modalBackdrop').setAttribute('aria-hidden','false');choices();$('#grantMfa').value='';$('#grantTenant').focus();
 }
 function choices(){const tid=$('#grantTenant').value;$('#providerChoices').innerHTML=model.providers.map(p=>{const existing=model.grantFor(tid,p.id),selected=editing?.providerId===p.id,locked=!!(editing&&!selected||!editing&&existing);return `<div class="tenant-provider-option"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="grantProvider" value="${esc(p.id)}" ${selected?'checked':''} ${locked?'disabled':''}><strong>${esc(p.name)}</strong></label><div style="display:flex;gap:16px">${(p.directions||[]).map(d=>`<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" name="grantDirection" data-provider="${esc(p.id)}" value="${d}" aria-label="${esc(p.name)} 授权${d}" ${selected&&editing.directions?.includes(d)?'checked':''} ${!selected||locked?'disabled':''}>${d}</label>`).join('')}</div><span class="muted">${esc(p.id)}${!editing&&existing?' · 已有授权':''}</span></div>`;}).join('');}
 function close(){ if($('#grantMfa'))$('#grantMfa').value='';$('#modalBackdrop').classList.remove('show');$('#modalBackdrop').setAttribute('aria-hidden','true');returnFocus?.focus();editing=null; }
 function save(){if(!allowed('platform.business_grant.manage'))return;const tid=$('#grantTenant').value,ids=[...document.querySelectorAll('[name="grantProvider"]:checked')].map(b=>b.value),reason=$('#grantReason').value.trim(),status=$('#grantStatus').value;
  const err=t=>{$('#formError').textContent=t;$('#formError').hidden=false;};if(!scopedTenants.some(t=>t.id===tid)||!ids.length||!reason)return err('请选择租户、至少一个通道商，并填写变更原因');
  if(!['已授权','已停用'].includes(status)||editing&&(tid!==editing.tenantId||ids.length!==1||ids[0]!==editing.providerId)||ids.some(id=>!provider(id)||(!editing&&model.grantFor(tid,id))))return err('授权记录已变化，请重新选择');
  const selections=new Map();try {for(const id of ids){const directions=[...document.querySelectorAll('[name="grantDirection"]:checked')].filter(b=>b.dataset.provider===id).map(b=>b.value);selections.set(id,model.validateGrantDirections(id,directions));}}catch(e){return err(e.message);}
  const mfa=$('#grantMfa'),otp=mfa.value.trim();mfa.removeAttribute('aria-invalid');
  if(!/^[0-9]{6}$/.test(otp)||otp==='000000'){mfa.value='';mfa.setAttribute('aria-invalid','true');err(otp==='000000'?'Google MFA 验证未通过，请重新输入':'请输入当前操作人的 6 位 Google MFA 验证码');mfa.focus();return;}
  mfa.value='';
  for(const id of ids){const grant=editing||{id:`VG-${tid}-${id}`,tenantId:tid,providerId:id};Object.assign(grant,{status,directions:selections.get(id),reason,updatedAt:model.now()});if(!editing)model.grants.push(grant);model.log('保存通道商授权',grant.id,tid,'platform');}
  close();render();toast('通道商授权已保存');
 }
 $('#tenantFilter').innerHTML='<option value="">全部租户</option>'+scopedTenants.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.edit)return open(b.dataset.edit);const a=b.dataset.action;if(a==='primary')open();else if(a==='close')close();else if(a==='saveGrant')save();else if(a==='search'||a==='refresh')render();else if(a==='reset'){$('#tenantFilter').value='';$('#keyword').value='';render();}else if(a==='export'&&allowed('platform.business_grant.export')){const cell=v=>`"${String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')}"`;const csv=[['租户','通道商','授权业务','授权状态','最近变更'],...rows().map(g=>[tenant(g.tenantId)?.name,provider(g.providerId)?.name,(g.directions||[]).join(' / '),g.status,g.updatedAt])].map(r=>r.map(cell).join(',')).join('\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='汇盛支付-通道商授权.csv';link.click();URL.revokeObjectURL(url);toast('授权已导出');}});
 document.addEventListener('change',e=>{if(e.target.id==='grantTenant')choices();if(e.target.name==='grantProvider'){document.querySelectorAll('[name="grantDirection"]').forEach(b=>{if(b.dataset.provider===e.target.value){b.disabled=!e.target.checked;if(!e.target.checked)b.checked=false;}});}});document.addEventListener('input',e=>{if(e.target.id==='keyword')render();});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&$('#modalBackdrop').classList.contains('show')){const nodes=[...$('#modalBackdrop').querySelectorAll('button,input,select,textarea')].filter(n=>!n.disabled&&!n.hidden);if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1)?.focus();}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0]?.focus();}}});$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))close();});render();
})();
</script></body></html>
