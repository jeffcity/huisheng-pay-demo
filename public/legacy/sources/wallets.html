<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汇盛支付平台端 · 租户结算单</title><style>
    :root {
      --font-ui: "Avenir Next", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: "DIN Alternate", "Avenir Next Condensed", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-mono: "SFMono-Regular", "Fira Code", Consolas, monospace;
      --color-primary: #145fe8;
      --color-primary-hover: #0f52cc;
      --color-primary-light: #e8f3ff;
      --color-bg-page: #f5f7fb;
      --color-bg-surface: #ffffff;
      --color-bg-subtle: #f7f8fa;
      --color-border: #e5e6eb;
      --color-border-strong: #c9cdd4;
      --color-text-primary: #1d2129;
      --color-text-secondary: #4e5969;
      --color-text-tertiary: #626d7b;
      --color-success: #087a55;
      --color-success-light: #e8fff3;
      --color-warning: #8a4b00;
      --color-warning-light: #fff7e8;
      --color-danger: #cf1f1f;
      --color-danger-light: #fff0ed;
      --color-info: #0e7490;
      --color-info-light: #e6fffb;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --shadow-modal: 0 18px 48px rgba(29, 33, 41, 0.18);
      --sidebar-width: 248px;
      --topbar-height: 56px;
      --spacing-control: 32px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--color-bg-page);
      color: var(--color-text-primary);
      font-family: var(--font-ui);
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      background: #111827;
      color: #d9e0ec;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .brand {
      min-height: 64px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #145fe8 0%, #0e7490 100%);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
    }

    .brand strong {
      display: block;
      color: #fff;
      font-size: 16px;
      line-height: 1.3;
    }

    .brand span {
      display: block;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 2px;
    }

    .nav {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .nav-title {
      padding: 0 10px;
      color: #8b95a7;
      font-size: 12px;
      font-weight: 700;
      line-height: 24px;
    }

    .nav-button {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 0;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: 10px;
      color: #c9d1df;
      background: transparent;
      text-align: left;
      transition: background 0.16s ease, color 0.16s ease;
    }

    .nav-button:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
    }

    .nav-button.active {
      background: rgba(20, 95, 232, 0.24);
      color: #fff;
    }

    .nav-button i,
    .btn i,
    .icon-link i {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .workspace {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 15;
      height: var(--topbar-height);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--color-border);
      backdrop-filter: blur(10px);
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--color-text-tertiary);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .breadcrumbs strong {
      color: var(--color-text-secondary);
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .searchbox {
      width: 280px;
      height: 34px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-bg-subtle);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      color: var(--color-text-tertiary);
      font-size: 13px;
    }

    .searchbox input {
      min-width: 0;
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--color-text-primary);
    }

    .searchbox input::placeholder {
      color: var(--color-text-tertiary);
      opacity: 1;
    }

    .content {
      padding: 20px 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .page-head {
      min-height: 86px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 18px;
      padding: 18px 20px;
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
    }

    .page-title {
      margin: 0 0 6px;
      font-family: var(--font-display);
      font-size: 24px;
      line-height: 1.25;
      font-weight: 720;
      letter-spacing: 0;
    }

    .page-subtitle {
      margin: 0;
      color: var(--color-text-secondary);
      font-size: 13px;
      line-height: 1.6;
      max-width: 980px;
    }

    .data-freshness {
      margin: 6px 0 0;
      color: var(--color-text-tertiary);
      font-size: 12px;
      line-height: 1.5;
    }

    .page-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn[hidden] {
      display: none !important;
    }

    .content.channel-compact-mode {
      padding-top: 14px;
      gap: 10px;
    }

    .content.channel-compact-mode .page-head {
      min-height: 0;
      padding: 12px 16px;
      align-items: center;
    }

    .content.channel-compact-mode .page-title {
      margin-bottom: 3px;
      font-size: 21px;
    }

    .content.channel-compact-mode .page-subtitle {
      line-height: 1.45;
    }

    .content.channel-compact-mode .data-freshness {
      margin-top: 3px;
    }

    .content.channel-compact-mode .tabs {
      min-height: 44px;
      padding-block: 5px;
    }

    .content.channel-compact-mode .panel-head {
      min-height: 42px;
      padding-block: 9px;
    }

    .content.channel-compact-mode .channel-action-bar {
      min-height: 44px;
      padding: 6px 12px;
    }

    .content.channel-compact-mode .filters {
      padding: 8px 12px;
      gap: 8px;
    }

    .content.channel-compact-mode .table-pagination {
      min-height: 44px;
      padding: 6px 12px;
    }

    .btn {
      height: 32px;
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-md);
      background: #fff;
      color: var(--color-text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      white-space: nowrap;
      transition: border-color 0.16s ease, color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    }

    .btn:hover {
      border-color: var(--color-primary-hover);
      color: var(--color-primary);
    }

    .btn.primary {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }

    .btn.primary:hover {
      background: var(--color-primary-hover);
      color: #fff;
    }

    .btn.ghost {
      border-color: transparent;
      background: #f2f3f5;
      color: var(--color-text-secondary);
    }

    .btn.danger {
      border-color: #ffd4cc;
      background: #fff;
      color: var(--color-danger);
    }

    .btn:disabled,
    .btn:disabled:hover {
      cursor: not-allowed;
      border-color: var(--color-border);
      background: #f2f3f5;
      color: #9aa0aa;
      box-shadow: none;
    }

    .fact-receipt {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 14px;
      border: 1px solid #b7f4d5;
      border-radius: var(--radius-md);
      background: var(--color-success-light);
    }

    .fact-receipt.show {
      display: flex;
    }

    .fact-receipt-main {
      min-width: 0;
      display: grid;
      gap: 4px;
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.5;
    }

    .fact-receipt-title {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      color: var(--color-text-primary);
      font-size: 13px;
    }

    .fact-receipt-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex: 0 0 auto;
    }

    .modal-feedback {
      margin-bottom: 14px;
      padding: 10px 12px;
      border: 1px solid #ffd4cc;
      border-radius: var(--radius-md);
      background: var(--color-danger-light);
      color: var(--color-danger);
      font-size: 13px;
      line-height: 1.5;
    }

    .confirm-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: #fbfcfe;
      color: var(--color-text-secondary);
      font-size: 13px;
      line-height: 1.5;
    }

    .confirm-card input {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      flex: 0 0 auto;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      border-radius: 999px;
      padding: 0 8px;
      border: 1px solid transparent;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .pill.blue {
      color: var(--color-primary);
      background: var(--color-primary-light);
      border-color: #bedaff;
    }

    .pill.green {
      color: var(--color-success);
      background: var(--color-success-light);
      border-color: #b7f4d5;
    }

    .pill.orange {
      color: var(--color-warning);
      background: var(--color-warning-light);
      border-color: #ffe4ba;
    }

    .pill.red {
      color: var(--color-danger);
      background: var(--color-danger-light);
      border-color: #ffd4cc;
    }

    .pill.gray {
      color: var(--color-text-secondary);
      background: #f2f3f5;
      border-color: var(--color-border);
    }

    .pill.cyan {
      color: var(--color-info);
      background: var(--color-info-light);
      border-color: #a7f3d0;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 44px;
      padding: 5px;
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow-x: auto;
    }

    .tab {
      height: 32px;
      border: 0;
      border-radius: var(--radius-sm);
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: transparent;
      color: var(--color-text-secondary);
      font-size: 13px;
      white-space: nowrap;
      transition: background 0.16s ease, color 0.16s ease;
    }

    .tab:hover {
      background: var(--color-bg-subtle);
      color: var(--color-primary);
    }

    .tab.active {
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-weight: 700;
    }

    .workbench {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 14px;
      align-items: start;
    }

    .workbench.collection-table-mode,
    .workbench.payout-table-mode,
    .workbench.product-table-mode {
      grid-template-columns: minmax(0, 1fr);
    }

    .workbench.collection-table-mode .rail,
    .workbench.payout-table-mode .rail,
    .workbench.product-table-mode .rail {
      display: none;
    }

    .panel {
      min-width: 0;
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .panel-head {
      min-height: 48px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 15px;
      line-height: 1.35;
      font-weight: 720;
    }

    .panel-meta {
      color: var(--color-text-tertiary);
      font-size: 12px;
      white-space: nowrap;
    }

    .filters {
      padding: 12px 14px;
      border-bottom: 1px solid var(--color-border);
      display: grid;
      grid-template-columns: repeat(5, minmax(128px, 1fr)) auto;
      gap: 10px;
      align-items: end;
      background: #fbfcfe;
    }

    .filters.collection-mode {
      grid-template-columns: minmax(220px, 1fr) minmax(170px, 0.7fr) auto;
    }

    .filters.payout-mode {
      grid-template-columns: minmax(230px, 1.2fr) repeat(3, minmax(160px, 0.8fr)) auto auto;
    }

    .channel-action-bar {
      min-height: 52px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: #fff;
    }

    .channel-action-bar[hidden] {
      display: none !important;
    }

    .channel-action-bar .btn.warn {
      color: #8a4b00;
      border-color: #f0b44d;
      background: #fff7e8;
    }

    .channel-action-bar .btn.danger {
      color: var(--color-danger);
      border-color: #f3b5ad;
      background: var(--color-danger-light);
    }

    .vendor-summary {
      padding: 12px 14px;
      border-bottom: 1px solid var(--color-border);
      display: grid;
      grid-template-columns: minmax(150px, 0.55fr) minmax(260px, 1fr) minmax(420px, 1.8fr);
      gap: 10px;
      background: #f7f9fc;
    }

    .vendor-summary[hidden],
    .field[hidden] {
      display: none !important;
    }

    .summary-item {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: #fff;
      display: grid;
      gap: 3px;
    }

    .summary-item label {
      color: var(--color-text-tertiary);
      font-size: 12px;
      font-weight: 650;
    }

    .summary-item strong {
      font-family: var(--font-mono);
      font-size: 17px;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    .summary-wallet,
    .wallet-cell {
      display: grid;
      gap: 7px;
    }

    .summary-wallet-row,
    .wallet-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }

    .currency-tag {
      min-width: 46px;
      height: 23px;
      padding: 0 7px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .wallet-balance {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .wallet-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 3px 12px;
      color: var(--color-text-secondary);
      font-size: 11px;
      line-height: 1.45;
    }

    .wallet-metrics strong {
      color: var(--color-text);
      font-family: var(--font-mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .capability-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      max-width: 240px;
    }

    .field {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    .field label {
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.2;
      font-weight: 600;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-height: 32px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--color-text-primary);
      outline: 0;
      padding: 5px 9px;
      font-size: 13px;
    }

    .check-grid {
      min-height: 32px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .check-line {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--color-text-secondary);
      cursor: pointer;
    }

    .check-line input {
      width: 16px;
      height: 16px;
      accent-color: var(--color-primary);
    }

    .field textarea {
      min-height: 74px;
      resize: vertical;
      line-height: 1.5;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--color-primary-hover);
      box-shadow: 0 0 0 3px rgba(20, 95, 232, 0.1);
    }

    .table-wrap {
      overflow: auto;
      min-height: 404px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 980px;
    }

    table.channel-wide {
      min-width: 2200px;
    }

    table.collection-wide {
      width: 2200px;
      min-width: 2200px;
      table-layout: fixed;
    }

    table.payout-wide {
      width: 2180px;
      min-width: 2180px;
      table-layout: fixed;
    }

    table.vendor-wide {
      min-width: 1280px;
    }

    th,
    td {
      height: 44px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--color-border);
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--color-bg-subtle);
      color: var(--color-text-secondary);
      font-size: 12px;
      font-weight: 700;
    }

    th:last-child,
    td:last-child {
      position: sticky;
      right: 0;
      z-index: 2;
      background: #fff;
      box-shadow: -1px 0 0 var(--color-border);
    }

    th:last-child {
      z-index: 3;
      background: var(--color-bg-subtle);
    }

    tbody tr {
      transition: background 0.16s ease;
    }

    tbody tr:hover {
      background: #f7fbff;
    }

    tbody tr.action-open {
      position: relative;
      z-index: 8;
    }

    tbody tr:hover td:last-child {
      background: #f7fbff;
    }

    tbody tr.action-open td:last-child {
      z-index: 30;
    }

    .collection-wide th,
    .collection-wide td {
      height: 40px;
      padding: 6px 8px;
    }

    .collection-wide th:last-child,
    .collection-wide td:last-child {
      position: static;
      box-shadow: none;
    }

    .collection-wide tbody tr {
      height: var(--collection-row-height, 60px);
    }

    .collection-wide tbody tr:hover td:last-child {
      background: transparent;
    }

    .payout-wide th,
    .payout-wide td {
      height: 40px;
      padding: 6px 8px;
    }

    .payout-wide tbody tr {
      height: 52px;
    }

    .payout-wide .payout-inline-actions {
      align-items: center;
      flex-wrap: wrap;
      gap: 2px 8px;
      white-space: normal;
      font-size: 11px;
    }

    .payout-wide .payout-inline-actions .cell-link,
    .payout-wide .cell-action > .cell-link {
      height: auto;
      padding: 0;
      border-radius: 0;
      background: transparent;
      font-weight: 600;
    }

    .payout-wide .payout-inline-actions .cell-link:hover,
    .payout-wide .cell-action > .cell-link:hover {
      background: transparent;
      text-decoration: underline;
    }

    .payout-wide .money-action-buttons .cell-link {
      height: 22px;
      padding-inline: 5px;
      color: #fff;
      border-color: #e7a126;
      background: #e7a126;
      font-size: 11px;
    }

    .payout-wide .money-action-buttons .cell-link:hover {
      background: #cf8811;
    }

    .payout-wide .money-action {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .payout-wide .cell-action {
      gap: 4px;
    }

    .payout-wide .cell-action > .cell-link i,
    .payout-wide .row-actions .icon-link i {
      display: none;
    }

    .payout-wide .row-actions {
      gap: 1px;
    }

    .payout-wide .row-actions .icon-link {
      height: 24px;
      padding-inline: 4px;
      font-size: 11px;
    }

    .payout-wide .collection-toggle {
      flex: 0 0 38px;
    }

    .collection-select {
      width: 16px;
      height: 16px;
      accent-color: var(--color-primary);
    }

    .collection-channel-cell {
      min-height: 44px;
      display: grid;
      align-content: center;
      gap: 3px;
      white-space: normal;
    }

    .collection-channel-name {
      color: var(--color-text-primary);
      font-weight: 650;
      line-height: 1.35;
    }

    .collection-row-links {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
    }

    .collection-row-links .cell-link,
    .collection-wide .money-action-buttons .cell-link,
    .collection-type-actions .cell-link {
      height: auto;
      padding: 0;
      border-radius: 0;
      background: transparent;
      font-weight: 600;
    }

    .collection-row-links .cell-link:hover,
    .collection-wide .money-action-buttons .cell-link:hover,
    .collection-type-actions .cell-link:hover {
      background: transparent;
      text-decoration: underline;
    }

    .collection-type-stack {
      display: grid;
      align-content: center;
      gap: 0;
      min-height: 30px;
    }

    .collection-type-line {
      min-height: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .collection-type-action-line {
      overflow: visible;
    }

    .collection-type-action-line .action-menu {
      position: fixed;
      right: auto;
      z-index: 100;
    }

    .collection-code-option { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .collection-code-option input { flex-shrink: 0; }
    .collection-code-count { color: var(--color-text-secondary); font-size: 13px; }
    .collection-code-delete-list { margin: 12px 0 0; padding-left: 22px; line-height: 1.8; }

    .collection-type-name {
      color: var(--color-text-tertiary);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .collection-type-actions {
      display: grid;
      align-content: center;
      gap: 0;
    }

    .collection-type-actions > span {
      min-height: 30px;
      display: flex;
      align-items: center;
    }

    .collection-toggle {
      position: relative;
      flex: 0 0 38px;
      min-width: 38px !important;
      width: 38px !important;
      min-height: 32px !important;
      height: 32px !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 999px;
      background: transparent;
      box-shadow: none;
    }

    .collection-toggle::before {
      content: "";
      position: absolute;
      top: 7px;
      left: 2px;
      width: 34px;
      height: 18px;
      border-radius: 999px;
      background: #c7ced8;
      transition: background .18s ease;
    }

    .collection-toggle::after {
      content: "";
      position: absolute;
      top: 9px;
      left: 4px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .22);
      transition: transform .18s ease;
    }

    .collection-toggle.on::before {
      background: #409eff;
    }

    .collection-toggle.on::after {
      transform: translateX(16px);
    }

    .collection-wide .money-action {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .collection-wide .money-action-buttons {
      gap: 6px;
    }

    .collection-wide .money-action-buttons .cell-link,
    .collection-wide .collection-type-actions .cell-link {
      font-size: 11px;
    }

    .table-pagination {
      min-height: 52px;
      padding: 9px 14px;
      border-top: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      color: var(--color-text-secondary);
      background: #fff;
      font-size: 12px;
    }

    .table-pagination[hidden],
    .filters[hidden] {
      display: none !important;
    }

    .page-chip {
      min-width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--color-primary);
      color: #fff;
      font-weight: 700;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .muted {
      color: var(--color-text-tertiary);
    }

    .row-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .icon-link {
      height: 28px;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--color-primary);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
      white-space: nowrap;
    }

    .icon-link:hover {
      background: var(--color-primary-light);
    }

    .cell-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
    }

    .cell-action .cell-value {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cell-link {
      height: 24px;
      border: 0;
      border-radius: var(--radius-sm);
      background: var(--color-primary-light);
      color: var(--color-primary);
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 0 6px;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
    }

    .cell-link:hover {
      background: #d8eaff;
    }

    .cell-link i {
      width: 14px;
      height: 14px;
    }

    .money-action {
      display: grid;
      grid-template-columns: auto;
      gap: 4px;
      min-width: 112px;
    }

    .money-action strong {
      color: var(--color-text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .money-action-buttons {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .money-action-buttons .cell-link {
      padding-inline: 5px;
    }

    .switch-button {
      min-width: 54px;
      height: 28px;
      padding: 0 9px;
      border: 1px solid;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      transition: color .18s ease, background .18s ease, border-color .18s ease;
    }

    .switch-button.on {
      color: var(--color-success);
      border-color: #a8e8c8;
      background: var(--color-success-light);
    }

    .switch-button.off {
      color: var(--color-text-tertiary);
      border-color: var(--color-border);
      background: #f3f4f6;
    }

    .payout-inline-actions {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .balance-cell {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 128px;
    }

    .balance-values {
      display: grid;
      gap: 2px;
      min-width: 58px;
    }

    .balance-line {
      display: flex;
      align-items: baseline;
      gap: 4px;
      line-height: 1.25;
      white-space: nowrap;
    }

    .balance-label {
      color: var(--color-text-tertiary);
      font-size: 11px;
    }

    .action-more {
      position: relative;
      display: inline-flex;
    }

    .action-more summary {
      height: 28px;
      border-radius: var(--radius-sm);
      color: var(--color-primary);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
      cursor: pointer;
      user-select: none;
      list-style: none;
    }

    .action-more summary::-webkit-details-marker {
      display: none;
    }

    .action-more summary:hover,
    .action-more[open] summary {
      background: var(--color-primary-light);
    }

    .action-menu {
      position: absolute;
      right: 0;
      top: 34px;
      z-index: 20;
      width: 156px;
      padding: 6px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: #fff;
      box-shadow: var(--shadow-md);
      display: grid;
      gap: 2px;
    }

    .action-menu .icon-link {
      width: 100%;
      justify-content: flex-start;
      color: var(--color-text-secondary);
    }

    .action-menu .icon-link:hover {
      color: var(--color-primary);
    }

    .rail {
      position: sticky;
      top: calc(var(--topbar-height) + 14px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .chain {
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .chain-node {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      min-height: 52px;
    }

    .node-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: var(--radius-md);
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-weight: 800;
      font-size: 12px;
    }

    .node-title {
      color: var(--color-text-tertiary);
      font-size: 12px;
      margin-bottom: 3px;
    }

    .node-value {
      color: var(--color-text-primary);
      font-size: 13px;
      line-height: 1.35;
      font-weight: 650;
      word-break: break-word;
    }

    .rule-list {
      padding: 12px 14px 14px;
      display: grid;
      gap: 10px;
    }

    .rule-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.55;
    }

    .rule-dot {
      width: 7px;
      height: 7px;
      margin-top: 6px;
      border-radius: 50%;
      background: var(--color-primary);
    }

    .health-bar {
      width: 118px;
      height: 8px;
      border-radius: 999px;
      background: #eef0f5;
      overflow: hidden;
    }

    .health-bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--color-success);
    }

    .health-bar.warning span {
      background: var(--color-warning);
    }

    .health-bar.danger span {
      background: var(--color-danger);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(17, 24, 39, 0.42);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(960px, 100%);
      max-height: calc(100vh - 56px);
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-modal);
      overflow: hidden;
    }

    .modal.sm {
      width: min(680px, 100%);
    }

    .modal.lg {
      width: min(1180px, 100%);
    }

    .modal-head {
      min-height: 56px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.35;
    }

    .modal-body {
      padding: 16px 18px;
      overflow: auto;
    }

    .modal-foot {
      min-height: 56px;
      padding: 12px 18px;
      border-top: 1px solid var(--color-border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      background: #fbfcfe;
    }

    .desc-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 18px;
    }

    .desc-item {
      min-width: 0;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 8px;
    }

    .desc-item label {
      display: block;
      color: var(--color-text-tertiary);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .desc-item span {
      display: block;
      color: var(--color-text-primary);
      font-size: 13px;
      line-height: 1.45;
      word-break: break-word;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 14px;
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    .blue-form {
      display: grid;
      gap: 14px;
      padding: 2px 0;
    }

    .blue-row {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
    }

    .blue-row label {
      color: var(--color-text-secondary);
      font-size: 14px;
      line-height: 1.35;
      font-weight: 600;
      text-align: right;
    }

    .blue-row.required label::before {
      content: "* ";
      color: var(--color-danger);
    }

    .blue-row input,
    .blue-row select,
    .blue-row textarea {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--color-text-primary);
      outline: 0;
      padding: 7px 12px;
      font-size: 14px;
    }

    .blue-row textarea {
      min-height: 88px;
      resize: vertical;
      line-height: 1.55;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .blue-row input[readonly],
    .blue-row input:disabled,
    .blue-row textarea[readonly] {
      background: #f4f7fb;
      color: var(--color-text-secondary);
    }

    .payout-development-form textarea { min-height: 58px; }
    .payout-development-form .radio-line input { width: 16px; }

    .blue-inline {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .blue-code {
      width: 108px;
      flex: 0 0 108px;
    }

    .radio-line {
      display: flex;
      gap: 28px;
      align-items: center;
      min-height: 38px;
    }

    .radio-line label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      color: var(--color-text-primary);
      font-size: 14px;
      font-weight: 600;
    }

    .radio-line input {
      width: 16px;
      min-height: 16px;
      accent-color: var(--color-primary);
    }

    .stepper {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) 54px;
      min-height: 38px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #fff;
    }

    .stepper button,
    .stepper input {
      border: 0;
      min-height: 38px;
      border-radius: 0;
      text-align: center;
      background: #fff;
    }

    .stepper button {
      color: var(--color-text-secondary);
      background: #f7f9fc;
      font-size: 18px;
    }

    .stepper button:hover {
      color: var(--color-primary);
      background: var(--color-primary-light);
    }

    .blue-section {
      position: relative;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 28px 22px 20px;
      margin-top: 8px;
    }

    .blue-section-title {
      position: absolute;
      top: -12px;
      left: 20px;
      padding: 0 10px;
      background: #fff;
      color: var(--color-text-primary);
      font-size: 16px;
      font-weight: 700;
    }

    .hint {
      margin-top: 6px;
      color: var(--color-text-tertiary);
      font-size: 13px;
      line-height: 1.45;
    }

    .test-split {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .test-block {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: #fbfcfe;
      overflow: hidden;
    }

    .test-block h3 {
      margin: 0;
      padding: 10px 12px;
      border-bottom: 1px solid var(--color-border);
      font-size: 13px;
      line-height: 1.35;
    }

    .test-block textarea {
      width: 100%;
      min-height: 150px;
      border: 0;
      border-radius: 0;
      background: #fff;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.55;
      resize: vertical;
      outline: 0;
    }

    .inline-error {
      display: none;
      margin-top: 8px;
      color: var(--color-danger);
      font-size: 12px;
    }

    .inline-error.show {
      display: block;
    }

    .timeline {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr);
      gap: 10px;
      color: var(--color-text-secondary);
      font-size: 13px;
      line-height: 1.5;
    }

    .timeline-item::before {
      content: "";
      width: 8px;
      height: 8px;
      margin-top: 6px;
      border-radius: 50%;
      background: var(--color-primary);
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 60;
      min-width: 280px;
      max-width: 420px;
      display: none;
      align-items: start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: #111827;
      color: #fff;
      box-shadow: 0 10px 28px rgba(17, 24, 39, 0.22);
      font-size: 13px;
      line-height: 1.5;
    }

    .toast.show {
      display: flex;
      animation: toast-in 0.18s ease;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 1280px) {
      .app {
        grid-template-columns: 72px minmax(0, 1fr);
      }

      .brand strong,
      .brand span,
      .nav-title,
      .nav-button span {
        display: none;
      }

      .brand {
        justify-content: center;
        padding: 12px;
      }

      .nav-button {
        justify-content: center;
      }

      .workbench {
        grid-template-columns: minmax(0, 1fr);
      }

      .rail {
        position: static;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 860px) {
      .topbar,
      .page-head {
        grid-template-columns: minmax(0, 1fr);
      }

      .top-actions,
      .page-actions {
        justify-content: flex-start;
      }

      .searchbox {
        width: 100%;
      }

      .filters,
      .vendor-summary,
      .form-grid,
      .desc-grid,
      .test-split,
      .rail {
        grid-template-columns: minmax(0, 1fr);
      }

      .blue-row {
        grid-template-columns: minmax(0, 1fr);
        gap: 6px;
      }

      .blue-row label {
        text-align: left;
      }

      .content {
        padding: 14px;
      }

      .fact-receipt {
        align-items: stretch;
        flex-direction: column;
      }

      .fact-receipt-actions .btn {
        flex: 1 1 140px;
      }
    }

    @media (max-width: 720px) {
      .app { display: block; }
      .topbar { height: auto; min-height: 56px; padding: 10px 14px; }
      .sidebar {
        position: sticky;
        top: 0;
        z-index: 30;
        height: auto;
        overflow-x: auto;
      }
      .brand { min-height: 54px; justify-content: flex-start; padding: 10px 14px; }
      .brand strong, .brand span { display: block; }
      .nav { padding: 8px 12px 12px; }
      .nav > div { display: flex; gap: 8px; width: max-content; }
      .nav-title { display: none; }
      .nav-button { width: auto; min-width: max-content; min-height: 44px; }
      .nav-button span { display: inline; }
      .modal-backdrop { padding: 0; align-items: flex-end; }
      .modal { width: 100%; height: auto; max-height: 92vh; border-radius: 16px 16px 0 0; }
      .modal-head { padding: 12px 16px; }
      .modal-body { padding: 14px 16px; }
      .modal-foot { position: sticky; bottom: 0; padding: 10px 16px; }
      .toast { left: 14px; right: 14px; bottom: 14px; min-width: 0; max-width: none; }
      th:last-child,
      td:last-child {
        position: static;
        box-shadow: none;
      }
    }
    /* 三端共用：键盘、动效与窄屏触控基线 */
    :focus-visible {
      outline: 3px solid #ffffff;
      box-shadow: 0 0 0 5px #145fe8;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    @media (max-width: 768px) {
      button,
      input:not([type="checkbox"]):not([type="radio"]),
      select,
      textarea,
      [role="button"] {
        min-height: 44px !important;
      }

      button,
      [role="button"] {
        min-width: 44px !important;
      }

      input,
      select,
      textarea {
        font-size: 16px !important;
      }

      .action-more summary {
        min-height: 44px;
      }
    }

    /* 三端统一视觉与响应式基线（2026-07-18） */
    :root {
      --font-ui: "Avenir Next", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

</style><script src="../platform-auth-route-guard.js" data-page-permission="platform.wallet.view"></script></head><body><main class="tenant-content"><section class="page-head"><div><h1>租户结算单</h1><p class="page-subtitle">按月汇总代收、代付成功订单，根据租户收费规则计算平台应收服务费。</p></div></section>
<div class="tenant-filters"><label for="settlementMonth">结算月份</label><input id="settlementMonth" type="month" value="2026-07"><label for="settlementTenant">租户</label><select id="settlementTenant"></select><button class="btn primary" id="settlementSearch">查询</button><button class="btn" id="settlementReset">重置</button></div>
<div id="settlementError" class="modal-feedback" role="alert" hidden></div>
<p class="muted">按自然月（UTC+8）统计成功订单。代收、代付分别计费；结算金额为平台服务费。已生成结算单保留生成时的统计和费率。</p>
<div class="tenant-page-table"><table style="min-width:1000px"><thead><tr><th>租户</th><th>月份</th><th>成功笔数</th><th>成功金额（CNY）</th><th>代收服务费（CNY）</th><th>代付服务费（CNY）</th><th>应结算费用（CNY）</th><th>操作</th></tr></thead><tbody id="settlementRows"></tbody></table></div><p id="settlementCount" class="muted"></p>
</main><div class="modal-backdrop" id="settlementBackdrop" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="settlementTitle"><div class="modal-head"><h2 id="settlementTitle">租户结算明细</h2><button class="btn" id="settlementClose">关闭</button></div><div class="modal-body" id="settlementDetail"></div><div class="modal-footer"><button class="btn" id="settlementExport">导出结算单</button></div></section></div><div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span></div>
<script>(()=>{
 const guard=window.HSPlatformAuthRouteGuard;if(guard?.allowBusinessBoot?.()===false)return;
 const model=window.HSTenantSettlements,auth=guard?.getAuthorizationContext?.(),allowed=code=>!auth||auth.actionPermissions.includes(code),scope=id=>!auth||auth.dataScope?.scopeCode!=='platform.assigned_tenants'||auth.dataScope.tenantIds.includes(id),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const tenants=model.tenants.filter(t=>scope(t.id));let detail=null,opener=null;
 const error=text=>{$('#settlementError').textContent=text;$('#settlementError').hidden=!text;},fee=value=>value===null?'待设置费率':value;
 $('#settlementTenant').innerHTML='<option value="">全部租户</option>'+tenants.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
 function render(){try{error('');const month=$('#settlementMonth').value,tid=$('#settlementTenant').value;const rows=tenants.filter(t=>!tid||t.id===tid).map(t=>{const existing=model.find(t.id,month),b=existing||model.preview(t.id,month);return `<tr><td><strong>${esc(t.name)}</strong><div class="muted">${t.id}</div></td><td>${esc(month)}</td><td>${b.count}</td><td>${b.amount}</td><td>${fee(b.lines[0].fee)}</td><td>${fee(b.lines[1].fee)}</td><td><strong>${fee(b.total)}</strong></td><td><button class="icon-link" data-view="${t.id}">${existing?'查看结算单':'查看统计'}</button> ${!existing&&allowed('platform.settlement.generate')?`<button class="icon-link" data-generate="${t.id}" ${!b.count||b.total===null?'disabled':''}>生成结算单</button>`:''}</td></tr>`;});$('#settlementRows').innerHTML=rows.join('')||'<tr><td colspan="8">暂无符合条件的租户</td></tr>';$('#settlementCount').textContent=`共 ${rows.length} 个租户`;}catch(e){error(e.message);}}
 function open(id){if(!scope(id)||!tenants.some(t=>t.id===id))return error('无权查看该租户');detail=model.find(id,$('#settlementMonth').value)||model.preview(id,$('#settlementMonth').value);opener=document.activeElement;const b=detail;$('#settlementTitle').textContent=`${b.tenantName} · ${b.month} ${b.id?'结算单':'订单统计'}`;$('#settlementDetail').innerHTML=`<p>${b.id?esc(b.id)+' · 生成时间 '+esc(b.createdAt):'尚未生成结算单'}</p><table><thead><tr><th>业务</th><th>成功笔数</th><th>成功金额（CNY）</th><th>计费规则</th><th>服务费（CNY）</th></tr></thead><tbody>${b.lines.map(l=>`<tr><td>${l.direction}</td><td>${l.count}</td><td>${l.amount}</td><td>${esc(l.formula)}</td><td>${fee(l.fee)}</td></tr>`).join('')}</tbody></table><p><strong>应结算费用：CNY ${fee(b.total)}</strong></p><h3>成功订单明细</h3><table><thead><tr><th>平台订单号</th><th>业务</th><th>金额（CNY）</th><th>成功时间（UTC+8）</th></tr></thead><tbody>${b.orders.map(o=>`<tr><td>${esc(o.id)}</td><td>${o.direction}</td><td>${o.amount}</td><td>${o.completedAt}</td></tr>`).join('')||'<tr><td colspan="4">本月没有成功订单</td></tr>'}</tbody></table>`;$('#settlementExport').hidden=!b.id||!allowed('platform.wallet.export');$('#settlementBackdrop').classList.add('show');$('#settlementBackdrop').setAttribute('aria-hidden','false');$('#settlementClose').focus();}
 function close(){$('#settlementBackdrop').classList.remove('show');$('#settlementBackdrop').setAttribute('aria-hidden','true');opener?.focus();detail=null;}
 $('#settlementSearch').addEventListener('click',render);$('#settlementReset').addEventListener('click',()=>{$('#settlementTenant').value='';$('#settlementMonth').value='2026-07';render();});$('#settlementClose').addEventListener('click',close);
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.view)open(b.dataset.view);if(b.dataset.generate){if(!allowed('platform.settlement.generate')||!scope(b.dataset.generate)||!tenants.some(t=>t.id===b.dataset.generate))return error('无权生成该租户结算单');model.generate(b.dataset.generate,$('#settlementMonth').value);render();open(b.dataset.generate);}}catch(e){error(e.message);}});
 $('#settlementExport').addEventListener('click',()=>{if(!detail?.id||!scope(detail.tenantId)||!allowed('platform.wallet.export'))return;const b=detail,cell=v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"',rows=[['结算单号','租户','结算月份','业务','成功笔数','成功金额CNY','计费规则','服务费CNY'],...b.lines.map(l=>[b.id,b.tenantName,b.month,l.direction,l.count,l.amount,l.formula,l.fee]),['合计','','','','','','',b.total]],url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=b.id+'.csv';a.click();URL.revokeObjectURL(url);});
 document.addEventListener('keydown',e=>{if(!$('#settlementBackdrop').classList.contains('show'))return;if(e.key==='Escape')close();if(e.key==='Tab'){const nodes=[...$('#settlementBackdrop').querySelectorAll('button:not([hidden])')],first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});$('#settlementBackdrop').addEventListener('click',e=>{if(e.target===$('#settlementBackdrop'))close();});render();
})();</script></body></html>
