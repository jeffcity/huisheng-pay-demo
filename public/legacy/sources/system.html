    function recordSystemChange(module, object, action, result = "成功") {
      systemChangeHistory.unshift({ time: platformNow(), operator: "Jeff", module, object, action, result });
    }

    function bumpRolePermissionVersions(roleName, expectedMembers = 0) {
      const affected = accounts.filter(account => account.roles.includes(roleName));
      affected.forEach(account => { account.permissionVersion = Number(account.permissionVersion || 1) + 1; });
      return Math.max(expectedMembers, affected.length);
    }

    function bumpAllPlatformPermissionVersions() {
      accounts.forEach(account => { account.permissionVersion = Number(account.permissionVersion || 1) + 1; });
      return accounts.length;
    }

    function failSystemAction(message, fieldId = "") {
      showToast(message);
      if (fieldId) document.getElementById(fieldId)?.focus();
      return false;
    }

    function finishSystemAction(message) {
      state.modalAction = "";
      state.modalPayload = "";
      closeModal();
      render();
      showToast(message);
      return true;
    }

    function checkedRoleNames() {
      return [...document.querySelectorAll("#modalBody [data-role-name]:checked")].map(input => input.dataset.roleName);
    }

    function samePlatformRoleSet(left, right) {
      const a = [...left].sort();
      const b = [...right].sort();
      return a.length === b.length && a.every((name, index) => name === b[index]);
    }

    function adjustPlatformRoleMemberCounts(before, after) {
      before.filter(name => !after.includes(name)).forEach(name => {
        const role = roles.find(item => item.name === name);
        if (role) role.members = Math.max(0, Number(role.members || 0) - 1);
      });
      after.filter(name => !before.includes(name)).forEach(name => {
        const role = roles.find(item => item.name === name);
        if (role) role.members = Number(role.members || 0) + 1;
      });
    }

    function applyAccountAction(payload) {
      const parts = payload.split(":");
      const kind = parts[1];
      const account = parts[2] ? accountById(parts[2]) : null;
      if (kind === "create") {
        const login = modalValue("accountLoginCreate");
        const name = modalValue("accountNameCreate");
        const rolesSelected = checkedRoleNames();
        const remark = modalValue("accountRemarkCreate");
        if (!/^[A-Za-z0-9._-]{3,40}$/.test(login)) return failSystemAction("登录账号需为 3 至 40 位字母、数字、点、下划线或连字符。", "accountLoginCreate");
        if (accounts.some(item => item.login.toLowerCase() === login.toLowerCase())) return failSystemAction("登录账号已存在，请更换。", "accountLoginCreate");
        if (!name) return failSystemAction("请填写姓名。", "accountNameCreate");
        if (!rolesSelected.length) return failSystemAction("请至少绑定一个角色。");
        if (rolesSelected.some(roleName => roles.find(role => role.name === roleName)?.status !== "启用")) return failSystemAction("新账号只能绑定当前启用状态的角色。");
        const idBase = login.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "account";
        let id = idBase;
        let suffix = 2;
        while (accounts.some(item => item.id === id)) id = `${idBase}-${suffix++}`;
        const account = { id, login, name, dept: rolesSelected[0], roles: rolesSelected, status: "正常", twofa: "待绑定", credential: "首次改密", sessionVersion: 1, permissionVersion: 1, ip: "-", scope: "全部租户", scopeCode: "platform.all_tenants", tenantIds: [], remark, last: "未登录" };
        accounts.unshift(account);
        adjustPlatformRoleMemberCounts([], rolesSelected);
        state.selectedAccount = id;
        recordSystemChange("账号", login, "新增账号");
        showAccountSecretResult(account, `账号已创建：${name}`, oneTimePasswordFor(account), "首次登录必须修改密码并绑定 Google 2FA。关闭本结果后秘密值会被销毁。");
        return true;
      }
      if (!account) return failSystemAction("未找到目标账号，数据未变更。");
      if (kind === "edit") {
        const name = modalValue("accountNameEdit");
        const rolesSelected = checkedRoleNames();
        const remark = modalValue("accountRemarkEdit");
        const statusInput = document.getElementById("accountStatusEdit");
        const nextStatus = account.status === "锁定" ? "锁定" : statusInput?.checked ? "正常" : "停用";
        if (!name) return failSystemAction("请填写姓名。", "accountNameEdit");
        if (!rolesSelected.length) return failSystemAction("请至少绑定一个角色。");
        const invalidNewRole = rolesSelected.find(roleName => !account.roles.includes(roleName) && roles.find(role => role.name === roleName)?.status !== "启用");
        if (invalidNewRole) return failSystemAction(`${invalidNewRole} 当前停用，只能保留原绑定或移除，不能重新添加。`);
        if (account.roles.includes("平台超管") && !rolesSelected.includes("平台超管")) {
          const otherUsableSuperAdmins = accounts.filter(item => item.id !== account.id && item.status === "正常" && item.roles.includes("平台超管")).length;
          if (!otherUsableSuperAdmins) return failSystemAction("当前登录的最后一个可用平台超级管理员必须保留超管角色。");
        }
        const permissionChanged = !samePlatformRoleSet(rolesSelected, account.roles);
        const statusChanged = nextStatus !== account.status;
        adjustPlatformRoleMemberCounts(account.roles, rolesSelected);
        Object.assign(account, { name, dept: rolesSelected[0], roles: rolesSelected, status: nextStatus, scope: "全部租户", scopeCode: "platform.all_tenants", tenantIds: [], remark });
        if (permissionChanged) account.permissionVersion = Number(account.permissionVersion || 1) + 1;
        if (statusChanged && nextStatus !== "正常") account.sessionVersion = Number(account.sessionVersion || 1) + 1;
        const changes = [permissionChanged ? `角色权限版本更新为 P${account.permissionVersion}` : "角色不变", statusChanged ? `状态调整为${nextStatus}` : "状态不变"];
        recordSystemChange("账号", account.login, `编辑账号：${changes.join("；")}`);
        return finishSystemAction(`${account.login} 账号已保存；${changes.join("，")}。`);
      }
      if (account.id === "jeff") return failSystemAction("当前登录的最后一个可用平台超级管理员受保护，不能执行该操作。");
      if (kind === "reset-password") {
        if (!modalValue("resetPasswordReason")) return failSystemAction("请填写重置原因。", "resetPasswordReason");
        account.sessionVersion += 1;
        account.credential = "首次改密";
        recordSystemChange("账号", account.login, "重置密码并清除全部会话");
        showAccountSecretResult(account, `密码已重置：${account.name}`, oneTimePasswordFor(account), "下次登录必须使用此密码并立即修改；账号状态和角色权限保持不变。");
        return true;
      }
      if (kind === "reset-2fa") {
        if (!modalValue("resetReason")) return failSystemAction("请填写重置原因。", "resetReason");
        account.twofa = "待重新绑定";
        account.sessionVersion += 1;
        recordSystemChange("账号", account.login, "重置 2FA 并清除全部会话");
        return finishSystemAction(`${account.login} 的 2FA 已重置，下次登录必须重新绑定。`);
      }
      if (kind === "security") {
        if (!modalValue("accountSecurityReason")) return failSystemAction("请填写账号操作原因。", "accountSecurityReason");
        const action = modalValue("accountSecurityAction");
        const transitions = { lock: "锁定", disable: "停用", unlock: "正常", enable: "正常" };
        const previous = account.status;
        const next = transitions[action];
        if (!next || next === previous) return failSystemAction("账号状态已变化，请刷新后重新确认。", "accountSecurityAction");
        account.status = next;
        const recovering = action === "unlock" || action === "enable";
        if (!recovering) account.sessionVersion += 1;
        const actionLabel = { lock: "锁定账号", disable: "停用账号", unlock: "解锁账号", enable: "启用账号" }[action];
        recordSystemChange("账号", account.login, `${actionLabel}：${previous} → ${next}`);
        return finishSystemAction(recovering
          ? `${account.login} 已恢复后续登录资格；旧会话不会恢复。`
          : `${account.login} 已${next}，全部在线会话已失效。`);
      }
      if (kind === "logout") {
        if (!modalValue("logoutReason")) return failSystemAction("请填写下线原因。", "logoutReason");
        account.sessionVersion += 1;
        recordSystemChange("账号", account.login, "强制下线全部会话");
        return finishSystemAction(`${account.login} 的全部在线会话已下线；账号状态不变，可以重新登录。`);
      }
      return null;
    }

    function applyRoleAction(payload) {
      const parts = payload.split(":");
      const kind = parts[1];
      const role = parts[2] ? roleById(parts[2]) : null;
      if (kind === "create") {
        const name = modalValue("roleNameCreate");
        if (!name) return failSystemAction("请填写角色名称。", "roleNameCreate");
        if (roles.some(item => item.name === name)) return failSystemAction("角色名称已存在。", "roleNameCreate");
        let sequence = roles.length + 1;
        let code = `PLATFORM_ROLE_${String(sequence).padStart(2, "0")}`;
        while (roles.some(item => roleCode(item) === code)) code = `PLATFORM_ROLE_${String(++sequence).padStart(2, "0")}`;
        const idBase = code.toLowerCase().replaceAll("_", "-");
        let id = idBase;
        let suffix = 2;
        while (roles.some(item => item.id === id)) id = `${idBase}-${suffix++}`;
        const status = document.getElementById("roleStatusCreate")?.checked ? "启用" : "停用";
        roles.push({ id, code, name, members: 0, status, scope: "未配置", scopeCode: "empty", tenantIds: [], note: modalValue("roleNoteCreate") || "用户自建角色" });
        roleGrants[id] = {};
        roleSensitiveGrants[id] = false;
        state.selectedRole = id;
        recordSystemChange("角色", name, "新增角色（默认无权限）");
        closeModal();
        render();
        showToast(`${name} 已创建，默认无权限，请继续完成授权。`);
        openModal(`role:authorize:${id}`);
        return true;
      }
      if (!role) return failSystemAction("未找到目标角色，数据未变更。");
      if (role.id === "super") return failSystemAction("系统超级管理员角色受保护，不能编辑、停用、删除或修改授权。");
      if (kind === "edit") {
        const oldName = role.name;
        const name = modalValue("roleNameEdit");
        const nextStatus = document.getElementById("roleStatusEdit")?.checked ? "启用" : "停用";
        if (!name) return failSystemAction("请填写角色名称。", "roleNameEdit");
        if (roles.some(item => item.id !== role.id && item.name === name)) return failSystemAction("角色名称已存在。", "roleNameEdit");
        const statusChanged = nextStatus !== role.status;
        const affected = statusChanged ? bumpRolePermissionVersions(oldName, role.members) : 0;
        role.name = name;
        role.status = nextStatus;
        role.note = modalValue("roleNoteEdit") || role.note;
        if (oldName !== name) accounts.forEach(account => { account.roles = account.roles.map(item => item === oldName ? name : item); });
        recordSystemChange("角色", name, statusChanged ? `角色状态调整为${nextStatus}：影响 ${affected} 个账号` : "编辑角色资料：权限版本不变");
        return finishSystemAction(statusChanged
          ? `${name} 已保存并${nextStatus}；影响 ${affected} 个账号，下一次请求使用最新权限。`
          : `${name} 的名称或说明已保存；角色状态、账号权限版本和会话保持不变。`);
      }
      if (kind === "authorize") {
        const grants = {};
        document.querySelectorAll("#modalBody [data-permission-page]:checked").forEach(input => { grants[input.dataset.permissionPage] = []; });
        document.querySelectorAll("#modalBody [data-permission-action]:checked").forEach(input => {
          const permissionId = input.dataset.permissionAction;
          if (!Object.prototype.hasOwnProperty.call(grants, permissionId)) return;
          grants[permissionId].push(input.dataset.actionName);
        });
        const sensitive = document.querySelector('#modalBody [data-sensitive-permission="platform.sensitive.view"]')?.checked === true;
        const changed = !samePlatformGrantDefinition(roleGrants[role.id] || {}, grants) || platformRoleHasSensitive(role.id) !== sensitive;
        roleGrants[role.id] = grants;
        roleSensitiveGrants[role.id] = sensitive;
        const affected = changed && role.status === "启用" ? bumpRolePermissionVersions(role.name, role.members) : 0;
        const exportCount = platformRoleExportActionCount(role.id);
        recordSystemChange("角色", role.name, `保存授权：${Object.keys(grants).length} 个页面 / ${Object.values(grants).flat().length} 项按钮 / ${exportCount} 项导出 / 完整敏感资料${sensitive ? "允许" : "不允许"}；${changed ? role.status === "启用" ? `影响 ${affected} 个账号` : "停用角色当前定义已更新" : "有效权限未变化"}`);
        if (!changed) return finishSystemAction(`${role.name} 授权定义未变化；成员权限版本和会话保持不变。`);
        return finishSystemAction(role.status === "启用"
          ? `${role.name} 授权已生效；完整敏感资料${sensitive ? "允许" : "不允许"}，${exportCount} 项导出动作；影响 ${affected} 个账号，权限版本已递增。账号保持登录，下一次请求刷新页面、按钮和脱敏结果。`
          : `${role.name} 当前授权定义已保存；角色仍为停用，不影响账号有效权限，重新启用时按当前定义恢复。`);
      }
      if (kind === "members") return finishSystemAction(`${role.name} 成员列表已查看；角色状态和成员绑定均未改变。`);
      if (kind === "delete") {
        if (!modalValue("roleDeleteReason")) return failSystemAction("请填写删除原因。", "roleDeleteReason");
        if (role.members > 0) {
          recordSystemChange("角色", role.name, `阻断删除：仍有 ${role.members} 名成员`, "失败");
          return finishSystemAction(`${role.name} 仍有 ${role.members} 名成员，删除已阻断；角色、成员绑定和账号权限版本均未改变。请先在成员列表调整账号角色。`);
        }
        const index = roles.findIndex(item => item.id === role.id);
        roles.splice(index, 1);
        delete roleGrants[role.id];
        delete roleSensitiveGrants[role.id];
        state.selectedRole = roles[0].id;
        recordSystemChange("角色", role.name, "逻辑删除无成员角色");
        return finishSystemAction(`${role.name} 已逻辑删除；历史授权、成员关系和审计永久保留。`);
      }
      return null;
    }

    function menuDescendantIds(id) {
      const found = [];
      const walk = parentId => menuCatalog.filter(item => item.parentId === parentId).forEach(item => { found.push(item.id); walk(item.id); });
      walk(id);
      return found;
    }

    function applyMenuAction(payload) {
      const parts = payload.split(":");
      const kind = parts[1];
      const item = parts[2] ? menuById(parts[2]) : null;
      if (kind === "create" || kind === "child" || kind === "edit") {
        const current = kind === "edit" ? item : null;
        const name = modalValue("menuName");
        const parentId = modalValue("menuParent");
        const path = modalValue("menuPath");
        const permission = modalValue("menuPermission");
        const component = modalValue("menuComponent");
        const order = modalValue("menuOrder");
        const reason = modalValue("menuReason");
        if (!name) return failSystemAction("请填写菜单名称。", "menuName");
        if (!path.startsWith("/platform/") || path.includes("//")) return failSystemAction("平台端路由必须以 /platform/ 开头且不能包含重复斜线。", "menuPath");
        if (!component) return failSystemAction("请填写前端组件。", "menuComponent");
        if (!/^platform:[a-z0-9:-]+$/.test(permission)) return failSystemAction("权限标识需以 platform: 开头，并使用小写字母、数字、冒号或连字符。", "menuPermission");
        if (!order) return failSystemAction("请填写排序值。", "menuOrder");
        if (!reason) return failSystemAction("请填写变更原因。", "menuReason");
        const parent = parentId === "root" ? null : menuCatalog.find(entry => entry.id === parentId);
        if (parentId !== "root" && !parent) return failSystemAction("上级菜单不存在，请重新选择。", "menuParent");
        if (current && (parentId === current.id || menuDescendantIds(current.id).includes(parentId))) return failSystemAction("不能将菜单移动到自身或自己的子级下。", "menuParent");
        if (menuCatalog.some(entry => entry.id !== current?.id && entry.path === path)) return failSystemAction("路由路径已存在。", "menuPath");
        if (menuCatalog.some(entry => entry.id !== current?.id && entry.permission === permission)) return failSystemAction("权限标识已存在。", "menuPermission");
        if (menuCatalog.some(entry => entry.id !== current?.id && entry.parentId === parentId && entry.order === order)) return failSystemAction("同层排序值已存在。", "menuOrder");
        const values = { parentId, parent: parent?.name || "根菜单", level: parent ? parent.level + 1 : 0, name, type: modalValue("menuType") || "页面", path, component, permission, order, icon: modalValue("menuIcon") || "file", visible: modalValue("menuVisible") || "显示", cache: modalValue("menuCache") || "不缓存", status: modalValue("menuStatus") || "启用", updated: `Jeff ${platformNow()}`, note: modalValue("menuNote") || reason };
        if (current) {
          const accessChanged = ["parentId", "path", "component", "permission", "visible", "status"].some(field => current[field] !== values[field]);
          const affected = accessChanged ? bumpAllPlatformPermissionVersions() : 0;
          Object.assign(current, values);
          recordSystemChange("菜单", name, accessChanged ? `编辑访问边界并传播权限：影响 ${affected} 个账号；${reason}` : `编辑展示资料：权限版本不变；${reason}`);
          state.selectedMenu = current.id;
          return finishSystemAction(accessChanged
            ? `${name} 菜单已保存；影响 ${affected} 个账号，权限版本已递增，会话保持有效，下一次请求刷新导航和直连访问权限。`
            : `${name} 菜单已保存；访问边界未变，账号权限版本和会话保持不变。`);
        } else {
          const idBase = name.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, "-").replace(/^-|-$/g, "") || "menu";
          let id = idBase;
          let suffix = 2;
          while (menuCatalog.some(entry => entry.id === id)) id = `${idBase}-${suffix++}`;
          menuCatalog.push({ id, ...values });
          state.selectedMenu = id;
          recordSystemChange("菜单", name, `新增菜单：${reason}`);
        }
        return finishSystemAction(`${name} 菜单已保存；角色权限仍需在用户与角色中配置。`);
      }
      if (payload === "menu:audit") return finishSystemAction("菜单变更记录已查看。");
      if (payload === "menu:sort") {
        const inputs = [...document.querySelectorAll("#modalBody tbody input[aria-label$='排序']")];
        const values = inputs.map(input => input.value.trim());
        if (values.some(value => !value)) return failSystemAction("排序值不能为空。");
        if (new Set(values).size !== values.length) return failSystemAction("一级菜单排序值重复，已阻断保存。");
        if (!modalValue("menuSortReason")) return failSystemAction("请填写排序原因。", "menuSortReason");
        inputs.forEach(input => {
          const name = input.getAttribute("aria-label").replace(/\s*排序$/, "");
          const row = menuCatalog.find(entry => entry.level === 0 && entry.name === name);
          if (row) { row.order = input.value.trim(); row.updated = `Jeff ${platformNow()}`; }
        });
        recordSystemChange("菜单", "平台端菜单树", `保存排序：${modalValue("menuSortReason")}`);
        return finishSystemAction("平台端菜单排序已保存并写入永久审计。 ");
      }
      if (!item) return failSystemAction("未找到目标菜单，数据未变更。");
      if (kind === "disable") {
        const nextStatus = item.status === "启用" ? "停用" : "启用";
        const reason = document.querySelector("#modalBody textarea[aria-label='处理原因']")?.value.trim();
        if (!reason) return failSystemAction("请填写处理原因。");
        item.status = nextStatus;
        item.updated = `Jeff ${platformNow()}`;
        const childMode = document.querySelector("#modalBody select[aria-label='子节点处理']")?.value || "仅处理当前节点";
        if (childMode.includes("全部")) menuDescendantIds(item.id).forEach(id => { const child = menuCatalog.find(entry => entry.id === id); if (child) child.status = nextStatus; });
        const affected = bumpAllPlatformPermissionVersions();
        recordSystemChange("菜单", item.name, `${nextStatus}菜单并传播权限：影响 ${affected} 个账号；${reason}`);
        return finishSystemAction(`${item.name} 已${nextStatus}；影响 ${affected} 个账号，权限版本已递增，会话保持有效，下一次请求刷新导航和直连访问权限。`);
      }
      if (kind === "delete") {
        const children = menuCatalog.filter(entry => entry.parentId === item.id);
        if (children.length) return failSystemAction(`当前有 ${children.length} 个子菜单，必须先迁移或删除子级。`);
        const reason = document.querySelector("#modalBody textarea[aria-label='删除原因']")?.value.trim();
        if (!reason) return failSystemAction("请填写删除原因。");
        menuCatalog.splice(menuCatalog.findIndex(entry => entry.id === item.id), 1);
        state.selectedMenu = menuCatalog[0].id;
        const affected = bumpAllPlatformPermissionVersions();
        recordSystemChange("菜单", item.name, `删除菜单并传播权限：影响 ${affected} 个账号；${reason}`);
        return finishSystemAction(`${item.name} 已删除；影响 ${affected} 个账号，权限版本已递增，会话保持有效，下一次请求不再返回关联入口。`);
      }
      return null;
    }

    function tenantMenuDescendantIds(id) {
      const found = [];
      const walk = parentId => tenantMenuCatalog.filter(item => item.parentId === parentId).forEach(item => { found.push(item.id); walk(item.id); });
      walk(id);
      return found;
    }

    function nextTenantMenuVersion() {
      const versions = tenantMenuCatalog.map(item => Number(String(item.version).match(/T(\d+)/)?.[1] || 0));
      return `T${Math.max(18, ...versions) + 1}`;
    }

    function applyTenantMenuAction(payload) {
      const parts = payload.split(":");
      const kind = parts[1];
      const item = parts[2] ? tenantMenuById(parts[2]) : null;
      if (kind === "create" || kind === "child" || kind === "edit") {
        const current = kind === "edit" ? item : null;
        const name = modalValue("tenantMenuName");
        const parentId = modalValue("tenantMenuParent");
        const path = modalValue("tenantMenuPath");
        const component = modalValue("tenantMenuComponent");
        const permission = modalValue("tenantMenuPermission");
        const order = modalValue("tenantMenuOrder");
        const reason = modalValue("tenantMenuReason");
        const releaseScope = modalValue("tenantMenuReleaseScope") || "全部租户";
        const tenantIds = [...document.querySelectorAll("#modalBody [data-tenant-release-id]:checked")].map(input => input.dataset.tenantReleaseId);
        if (!name) return failSystemAction("请填写菜单名称。", "tenantMenuName");
        if (!path.startsWith("/tenant/") || path.includes("//")) return failSystemAction("租户端路由必须以 /tenant/ 开头且不能包含重复斜线。", "tenantMenuPath");
        if (!component.startsWith("tenant/")) return failSystemAction("组件标识必须以 tenant/ 开头。", "tenantMenuComponent");
        if (!/^tenant:[a-z0-9:-]+$/.test(permission)) return failSystemAction("权限标识需以 tenant: 开头，并使用小写字母、数字、冒号或连字符。", "tenantMenuPermission");
        if (!order) return failSystemAction("请填写排序值。", "tenantMenuOrder");
        if (!reason) return failSystemAction("请填写变更原因。", "tenantMenuReason");
        const parent = parentId === "root" ? null : tenantMenuCatalog.find(entry => entry.id === parentId);
        if (parentId !== "root" && !parent) return failSystemAction("上级菜单不存在，请重新选择。", "tenantMenuParent");
        if (current && (parentId === current.id || tenantMenuDescendantIds(current.id).includes(parentId))) return failSystemAction("不能将菜单移动到自身或自己的子级下。", "tenantMenuParent");
        if (tenantMenuCatalog.some(entry => entry.id !== current?.id && entry.path === path)) return failSystemAction("租户端路由已存在。", "tenantMenuPath");
        if (tenantMenuCatalog.some(entry => entry.id !== current?.id && entry.permission === permission)) return failSystemAction("租户端权限标识已存在。", "tenantMenuPermission");
        if (tenantMenuCatalog.some(entry => entry.id !== current?.id && entry.parentId === parentId && entry.order === order)) return failSystemAction("同层排序值已存在。", "tenantMenuOrder");
        const values = {
          parentId,
          parent: parent?.name || "根菜单",
          level: parent ? parent.level + 1 : 0,
          name,
          type: modalValue("tenantMenuType") || "页面",
          path,
          component,
          permission,
          order,
          icon: modalValue("tenantMenuIcon") || "file",
          visible: modalValue("tenantMenuVisible") || "显示",
          cache: modalValue("tenantMenuCache") || "不缓存",
          releaseScope,
          tenantIds: releaseScope === "全部租户" ? [] : tenantIds,
          capability: modalValue("tenantMenuCapability") || "基础功能",
          updated: `Jeff ${platformNow()}`,
          note: modalValue("tenantMenuNote") || reason
        };
        if (current) {
          const publishedVersion = current.status === "已发布" ? current.version : current.publishedVersion;
          Object.assign(current, values, { hasDraft: true, publishedVersion, version: publishedVersion ? `${nextTenantMenuVersion()}-draft / 线上 ${publishedVersion}` : `${nextTenantMenuVersion()}-draft` });
          state.selectedTenantMenu = current.id;
          recordSystemChange("租户菜单", name, `保存待发布版本：线上版本保持不变；${reason}`);
          return finishSystemAction(`${name} 的待发布版本已保存；租户端线上菜单和角色授权均未变化。`);
        }
        const idBase = name.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, "-").replace(/^-|-$/g, "") || "tenant-menu";
        let id = idBase;
        let suffix = 2;
        while (tenantMenuCatalog.some(entry => entry.id === id)) id = `${idBase}-${suffix++}`;
        tenantMenuCatalog.push({ id, ...values, status: "草稿", version: `${nextTenantMenuVersion()}-draft`, hasDraft: false });
        state.selectedTenantMenu = id;
        recordSystemChange("租户菜单", name, `新增草稿：${reason}`);
        return finishSystemAction(`${name} 已保存为草稿；完成租户端路由联调并发布前，任何租户都不可见。`);
      }
      if (payload === "tenant-menu:audit") return finishSystemAction("租户菜单变更记录已查看。");
      if (payload === "tenant-menu:sort") {
        const inputs = [...document.querySelectorAll("#modalBody tbody input[aria-label$='租户菜单排序']")];
        const values = inputs.map(input => input.value.trim());
        if (values.some(value => !value)) return failSystemAction("排序值不能为空。");
        if (new Set(values).size !== values.length) return failSystemAction("一级菜单排序值重复，已阻断保存。");
        if (!modalValue("tenantMenuSortReason")) return failSystemAction("请填写排序原因。", "tenantMenuSortReason");
        inputs.forEach(input => {
          const name = input.getAttribute("aria-label").replace(/\s*租户菜单排序$/, "");
          const row = tenantMenuCatalog.find(entry => entry.level === 0 && entry.name === name);
          if (row) { row.order = input.value.trim(); row.hasDraft = true; row.updated = `Jeff ${platformNow()}`; }
        });
        recordSystemChange("租户菜单", "租户端菜单树", `保存排序草稿：${modalValue("tenantMenuSortReason")}`);
        return finishSystemAction("租户菜单排序已保存为待发布版本；线上租户菜单顺序未改变。 ");
      }
      if (!item) return failSystemAction("未找到目标租户菜单，数据未变更。");
      if (kind === "publish") {
        const publishing = item.status !== "已发布";
        const reason = modalValue("tenantMenuPublishReason");
        if (!reason) return failSystemAction("请填写处理原因。", "tenantMenuPublishReason");
        if (publishing && item.releaseScope === "指定租户" && !item.tenantIds.length) return failSystemAction("适用范围为指定租户时，至少选择一个租户。", "tenantMenuReleaseScope");
        const version = nextTenantMenuVersion();
        item.status = publishing ? "已发布" : "已停用";
        item.version = version;
        item.publishedVersion = publishing ? version : item.publishedVersion || version;
        item.hasDraft = false;
        item.updated = `Jeff ${platformNow()}`;
        const scopeText = item.releaseScope === "全部租户" ? "全部租户" : `${item.tenantIds.length} 个指定租户`;
        recordSystemChange("租户菜单", item.name, `${publishing ? "发布" : "停用"} ${version}：${scopeText}；${reason}`);
        return finishSystemAction(publishing
          ? `${item.name} 已发布为 ${version}，进入 ${scopeText} 的可授权菜单范围；未自动修改任何租户角色。`
          : `${item.name} 已停用为 ${version}；匹配租户下一次刷新后移除入口并阻断直连，历史角色授权记录保留。`);
      }
      return null;
    }

    function applySystemModalAction() {
      const payload = state.modalPayload;
      if (!payload) return null;
      if (payload.startsWith("account:")) return applyAccountAction(payload);
      if (payload.startsWith("role:")) return applyRoleAction(payload);
      if (payload.startsWith("menu:")) return applyMenuAction(payload);
      if (payload.startsWith("tenant-menu:")) return applyTenantMenuAction(payload);
      return null;
    }

    function openModal(title) {
      const accountConfig = accountModalConfig(title);
      const roleConfig = roleModalConfig(title);
      const menuConfig = menuModalConfig(title);
      const tenantMenuConfig = tenantMenuModalConfig(title);
      const config = accountConfig || roleConfig || menuConfig || tenantMenuConfig || {
        title: title || "高风险确认",
        body: `
        <div class="risk-note">该动作会写入审计日志，并记录操作人、对象、原因、IP、时间和结果；首版不记录异常设备信息。</div>
        <div class="kv-list">
          <div class="kv"><span>操作对象</span><strong>${title || "当前选中对象"}</strong></div>
          <div class="kv"><span>影响范围</span><strong>${state.module === "menus" ? "12 个角色 / 42 个账号" : state.module === "tenant-menus" ? "匹配租户的可授权菜单范围" : "当前权限范围"}</strong></div>
          <div class="kv"><span>执行规则</span><strong>二次确认后按当前动作已确认的业务规则执行</strong></div>
        </div>
      `,
        confirmText: "确认并写审计",
        toast: `${title || "操作"} 已确认，审计日志已生成。`,
        auditAction: title || "操作确认"
      };
      state.modalAction = config.auditAction;
      state.modalPayload = title || "";
      state.modalToast = config.toast;
      document.querySelector("#modalBackdrop .modal").className = `modal ${config.className || ""}`.trim();
      document.getElementById("modalTitle").textContent = config.title;
      document.getElementById("modalBody").innerHTML = config.body;
      const confirm = document.getElementById("modalConfirm");
      confirm.textContent = config.confirmText || "确认并写审计";
      confirm.className = `btn ${config.confirmClass || "primary"}`;
      showSystemModal();
      updatePlatformEffectiveScopeSummary();
      if (window.lucide) lucide.createIcons();
    }

    function closeModal() {
      const backdrop = document.getElementById("modalBackdrop");
      if (!backdrop.classList.contains("open")) return;
      backdrop.classList.remove("open");
      backdrop.setAttribute("aria-hidden", "true");
      document.getElementById("modalBody").querySelectorAll('input[type="password"], input[inputmode="numeric"], input[autocomplete="one-time-code"], input[id*="2fa" i], [data-one-time-secret]').forEach(input => { input.value = ""; input.textContent = ""; });
      if (state.modalAction === "account-secret-result") document.getElementById("modalBody").innerHTML = "";
      document.getElementById("modalCancel").textContent = "取消";
      const returnTarget = systemModalReturnFocus;
      systemModalReturnFocus = null;
      if (returnTarget?.isConnected && returnTarget.offsetParent !== null) returnTarget.focus();
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      document.getElementById("toastText").textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 3600);
      if (window.lucide) lucide.createIcons();
    }

    document.getElementById("modalClose").addEventListener("click", closeModal);
    document.getElementById("modalCancel").addEventListener("click", closeModal);
    document.getElementById("modalConfirm").addEventListener("click", () => {
      if (state.modalAction === "account-secret-result") {
        state.modalAction = "";
        closeModal();
        return;
      }
      if (state.modalAction === "fee-form") {
        submitFeeForm();
        return;
      }
      if (state.modalAction === "fee-status-form") {
        submitFeeStatus();
        return;
      }
      if (state.modalAction === "fee-apply") {
        applyFeeChange();
        return;
      }
      if (state.modalAction === "fee-export-confirm") {
        createFeeExportTask();
        return;
      }
      if (state.modalAction === "fee-export-center") {
        closeModal();
        return;
      }
      if (state.modalAction === "fee-blocked") {
        openFeeReferences(state.pendingFee.plan.id);
        return;
      }
      if (state.modalAction === "fee-reference") {
        closeModal();
        return;
      }
      if (state.modalAction === "security-whitelist") {
        const reason = document.getElementById("securityChangeReason")?.value.trim();
        if (!reason) {
          showToast("请填写白名单变更原因");
          document.getElementById("securityChangeReason")?.focus();
          return;
        }
        const confirm = document.getElementById("modalConfirm");
        confirm.disabled = true;
        confirm.textContent = "正在保存…";
        window.setTimeout(() => {
          state.security.enabled = state.pendingSecurity.enabled;
          state.security.updated = new Intl.DateTimeFormat("zh-CN", { timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date()).replaceAll("/", "-");
          state.pendingSecurity = null;
          state.modalAction = "";
          confirm.disabled = false;
          closeModal();
          render();
          showToast("白名单配置已生效；变更前后值、原因、操作人、来源 IP 和结果已写入永久审计日志");
        }, 450);
        return;
      }
      const systemResult = applySystemModalAction();
      if (systemResult !== null) return;
      closeModal();
      showToast(state.modalToast || `${state.modalAction} 已确认，审计日志已生成。`);
    });
    document.getElementById("modalBackdrop").addEventListener("click", event => {
      if (event.target.id === "modalBackdrop") closeModal();
    });
    document.getElementById("modalBody").addEventListener("change", event => {
      if (event.target.matches('[data-role-name], [data-platform-scope-code], [data-platform-scope-tenant]')) updatePlatformEffectiveScopeSummary();
      if (event.target.matches('[data-sensitive-permission="platform.sensitive.view"]')) updatePlatformSensitivePreview();
      if (event.target.matches('#accountStatusEdit')) {
        const label = document.querySelector('[data-account-status-label]');
        if (label) label.textContent = event.target.checked ? "启用" : "停用";
      }
      if (event.target.matches('#roleStatusEdit, #roleStatusCreate')) {
        const label = event.target.closest('.form-field')?.querySelector('[data-role-status-label]');
        if (label) label.textContent = event.target.checked ? "启用" : "停用";
      }
    });
    document.getElementById("modalBody").addEventListener("click", event => {
      const platformTarget = event.target.closest("[data-platform-target]");
      if (platformTarget) {
        navigatePlatformMaster(platformTarget.dataset.platformPage, platformTarget.dataset.platformTarget);
        return;
      }
      const download = event.target.closest("[data-fee-export-download]");
      if (download) downloadFeeExportTask(download.dataset.feeExportDownload);
      const retry = event.target.closest("[data-fee-export-retry]");
      if (retry) retryFeeExportTask(retry.dataset.feeExportRetry);
    });
    document.addEventListener("keydown", event => {
      if (!document.getElementById("modalBackdrop").classList.contains("open")) return;
      if (event.key === "Escape") closeModal();
      else if (event.key === "Tab") trapSystemModalFocus(event);
    });

    window.__platformDataScopeTest = {
      getUserScope: id => {
        const account = accountById(id);
        if (!account) return null;
        const accountScope = { scopeCode: account.scopeCode, tenantIds: [...account.tenantIds] };
        return { accountScope, roleMergedScope: platformRoleMergedScope(account.roles), effectiveScope: platformEffectiveScope(account.roles, accountScope) };
      },
      getRoleScope: id => {
        const role = roleById(id);
        return role ? { scopeCode: role.scopeCode, tenantIds: [...role.tenantIds] } : null;
      }
    };
    window.__platformSensitivePermissionTest = {
      getRoleAccess: id => {
        const role = roleById(id);
        return role ? { sensitive: platformRoleHasSensitive(id), exportActionCount: platformRoleExportActionCount(id) } : null;
      },
      getUserAccess: id => {
        const account = accountById(id);
        return account ? platformUserDataAccess(account.roles) : null;
      }
    };
    window.__platformFeeExportTest = {
      requiredPermission: "platform.fee_package.export",
      getTasks: () => JSON.parse(JSON.stringify(visibleFeeExportTasks().map(({ csv, expiresAtMs, ...task }) => task))),
      getAudits: () => JSON.parse(JSON.stringify(visibleFeeExportAudits())),
      getSecurityAuditCount: () => feeExportSecurityAudits.length,
      setPermission: allowed => {
        state.platformPermissions["platform.fee_package.export"] = allowed === true;
        if (state.modalAction === "fee-export-center") closeModal();
        return state.platformPermissions["platform.fee_package.export"];
      },
      setExportSecurity: ({ permissionVersion, scopeCode, tenantIds } = {}) => {
        const account = accounts.find(item => item.id === "jeff");
        if (!account) return null;
        if (permissionVersion !== undefined) account.permissionVersion = Number(permissionVersion);
        if (scopeCode !== undefined) {
          account.scopeCode = String(scopeCode);
          account.tenantIds = Array.isArray(tenantIds) ? tenantIds.map(String) : [];
          account.scope = platformScopeSummary(account.scopeCode, account.tenantIds);
        }
        if (state.modalAction === "fee-export-center") closeModal();
        return JSON.parse(JSON.stringify({ permissionVersion: account.permissionVersion, scopeCode: account.scopeCode, tenantIds: account.tenantIds }));
      },
      download: taskId => downloadFeeExportTask(taskId, false),
      setExpiry: (taskId, expiresAtMs) => {
        const task = feeExportTasks.find(item => item.id === taskId);
        if (!task) return false;
        task.expiresAtMs = Number(expiresAtMs);
        return true;
      },
      retry: taskId => {
        const task = retryFeeExportTask(taskId);
        if (!task) return null;
        const { csv, expiresAtMs, ...result } = task;
        return JSON.parse(JSON.stringify(result));
      }
    };
    render();
    const initialModal = new URLSearchParams(window.location.search).get("modal");
    if (initialModal) window.setTimeout(() => openModal(initialModal), 0);
    }
  </script>
  <script>
    (() => {
      const liveId = "hsFormErrorLive";
      const nativeErrorClass = "hs-native-field-error";
      const errorSelector = `.form-error, .field-error, .error-text, [data-error], .${nativeErrorClass}`;
      const fieldSelector = 'input:not([type="hidden"]), select, textarea';
      const fieldContainerSelector = '.field, .form-field, .modal-field, .blue-row, .setting-row, .filter-item, .form-group, .control-group';
      let errorSequence = 0;
      let fieldLabelSequence = 0;

      function normalizedLabelText(label) {
        if (!(label instanceof HTMLElement)) return "";
        const copy = label.cloneNode(true);
        copy.querySelectorAll("input, select, textarea, button, svg, i").forEach(node => node.remove());
        return copy.textContent.replace(/\s+/g, " ").trim();
      }

      function hasAccessibleFieldName(field) {
        if ((field.getAttribute("aria-label") || "").trim()) return true;
        const labelledByText = (field.getAttribute("aria-labelledby") || "")
          .split(/\s+/)
          .filter(Boolean)
          .map(id => document.getElementById(id)?.textContent?.replace(/\s+/g, " ").trim() || "")
          .filter(Boolean)
          .join(" ");
        if (labelledByText) return true;
        return Array.from(field.labels || []).some(label => normalizedLabelText(label));
      }

      function upgradeFieldName(field) {
        if (!(field instanceof HTMLElement) || !field.matches(fieldSelector) || hasAccessibleFieldName(field)) return;
        const container = field.closest(fieldContainerSelector);
        const label = container?.querySelector("label");
        if (!label || !normalizedLabelText(label)) return;
        if (!label.id) label.id = `hsFieldLabel${++fieldLabelSequence}`;
        const ids = new Set((field.getAttribute("aria-labelledby") || "").split(/\s+/).filter(Boolean));
        ids.add(label.id);
        field.setAttribute("aria-labelledby", [...ids].join(" "));
      }

      function ensureNativeErrorStyles() {
        if (document.getElementById("hsNativeFieldErrorStyles")) return;
        const style = document.createElement("style");
        style.id = "hsNativeFieldErrorStyles";
        style.textContent = `
          .${nativeErrorClass} {
            display: block;
            flex: 0 0 100%;
            width: 100%;
            max-width: 100%;
            margin: 6px 0 0;
            color: var(--color-danger, var(--danger, #b42318));
            font-size: 12px;
            font-weight: 500;
            line-height: 1.45;
          }
          .${nativeErrorClass}[hidden] { display: none !important; }
        `;
        document.head.appendChild(style);
      }

      function fieldKey(field) {
        if (!field.dataset.hsFeedbackKey) {
          field.dataset.hsFeedbackKey = field.id || `hsFeedbackField${++errorSequence}`;
        }
        return field.dataset.hsFeedbackKey;
      }

      function ensureLiveRegion() {
        let live = document.getElementById(liveId);
        if (live) return live;
        live = document.createElement("div");
        live.id = liveId;
        live.setAttribute("role", "alert");
        live.setAttribute("aria-live", "assertive");
        live.setAttribute("aria-atomic", "true");
        live.style.cssText = "position:fixed;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0";
        document.body.appendChild(live);
        return live;
      }

      function upgradeErrorNode(node) {
        if (!(node instanceof HTMLElement) || !node.matches(errorSelector)) return null;
        if (!node.id) node.id = `hsFieldError${++errorSequence}`;
        node.setAttribute("role", "alert");
        node.setAttribute("aria-live", "assertive");
        node.setAttribute("aria-atomic", "true");
        return node;
      }

      function ensureNativeError(field) {
        let node = field.dataset.hsNativeErrorId
          ? document.getElementById(field.dataset.hsNativeErrorId)
          : null;
        if (!node) {
          node = document.createElement("div");
          node.id = `hsNativeFieldError${++errorSequence}`;
          node.className = nativeErrorClass;
          node.dataset.hsNativeError = "true";
          node.hidden = true;
          field.insertAdjacentElement("afterend", node);
          field.dataset.hsNativeErrorId = node.id;
        }
        return upgradeErrorNode(node);
      }

      function linkField(field, errorNode, focusField = true) {
        if (!(field instanceof HTMLElement) || !field.matches("input, select, textarea, [contenteditable='true']")) return;
        field.setAttribute("aria-invalid", "true");
        const ids = new Set((field.getAttribute("aria-describedby") || "").split(/\s+/).filter(Boolean));
        ids.add(errorNode.id);
        field.setAttribute("aria-describedby", [...ids].join(" "));
        errorNode.dataset.hsErrorFor = fieldKey(field);
        if (!focusField || !field.isConnected) return;
        field.focus({ preventScroll: true });
        requestAnimationFrame(() => {
          if (!field.isConnected || document.activeElement !== field) return;
          field.scrollIntoView({ block: "nearest", inline: "nearest" });
        });
      }

      function clearField(field) {
        if (!(field instanceof HTMLElement) || field.getAttribute("aria-invalid") !== "true") return;
        field.removeAttribute("aria-invalid");
        const key = field.dataset.hsFeedbackKey || field.id || "";
        const ids = (field.getAttribute("aria-describedby") || "").split(/\s+/).filter(Boolean);
        const kept = ids.filter(id => id !== liveId && document.getElementById(id)?.dataset.hsErrorFor !== key);
        if (kept.length) field.setAttribute("aria-describedby", kept.join(" "));
        else field.removeAttribute("aria-describedby");
        ids.forEach(id => {
          const node = document.getElementById(id);
          if (!node || node.dataset.hsErrorFor !== key) return;
          if (node.dataset.hsNativeError === "true") {
            if (field.dataset.hsNativeErrorId === node.id) delete field.dataset.hsNativeErrorId;
            node.remove();
            return;
          }
          node.textContent = "";
          node.classList.remove("show");
          if (node.hasAttribute("hidden")) node.hidden = true;
          delete node.dataset.hsErrorFor;
        });
      }

      function report(message, field = null, errorNode = null, focusField = true) {
        const live = ensureLiveRegion();
        const target = upgradeErrorNode(errorNode) || live;
        if (errorNode && message) {
          target.textContent = message;
          target.hidden = false;
          target.classList.add("show");
        }
        live.textContent = "";
        requestAnimationFrame(() => { live.textContent = message || "请检查表单内容。"; });
        if (field) linkField(field, target, focusField);
        return false;
      }

      window.HSFormFeedback = { report, clear: clearField, upgrade: upgradeErrorNode };
      ensureNativeErrorStyles();
      ensureLiveRegion();
      document.querySelectorAll(errorSelector).forEach(upgradeErrorNode);
      document.querySelectorAll(fieldSelector).forEach(upgradeFieldName);

      document.addEventListener("invalid", event => {
        const field = event.target;
        if (!(field instanceof HTMLElement)) return;
        const firstInvalid = field.form?.querySelector(":invalid");
        const error = ensureNativeError(field);
        report(
          field.validationMessage || "请检查此字段。",
          field,
          error,
          !firstInvalid || firstInvalid === field
        );
      }, true);

      ["input", "change"].forEach(type => {
        document.addEventListener(type, event => {
          const field = event.target;
          if (!(field instanceof HTMLElement)) return;
          if (field.matches("input, select, textarea") && field.willValidate && !field.validity.valid) return;
          clearField(field);
        }, true);
      });

      new MutationObserver(records => {
        records.forEach(record => {
          if (record.target instanceof HTMLElement) {
            const node = record.target.matches?.(errorSelector) ? record.target : record.target.closest?.(errorSelector);
            if (node) {
              upgradeErrorNode(node);
              if (node.textContent.trim() && !node.hidden) ensureLiveRegion().textContent = node.textContent.trim();
            }
          }
          record.addedNodes.forEach(added => {
            if (!(added instanceof HTMLElement)) return;
            if (added.matches(errorSelector)) upgradeErrorNode(added);
            added.querySelectorAll?.(errorSelector).forEach(upgradeErrorNode);
            if (added.matches(fieldSelector)) upgradeFieldName(added);
            added.querySelectorAll?.(fieldSelector).forEach(upgradeFieldName);
            const labelContainers = added.matches("label") ? [added] : Array.from(added.querySelectorAll?.("label") || []);
            labelContainers.forEach(label => label.closest(fieldContainerSelector)?.querySelectorAll(fieldSelector).forEach(upgradeFieldName));
          });
        });
      }).observe(document.body, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["class", "hidden"] });
    })();
  </script>

</body>
</html>
