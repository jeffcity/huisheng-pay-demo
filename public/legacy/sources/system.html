<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>汇盛支付平台端控制台 - 系统管理</title>
  <script src="../platform-auth-route-guard.js" data-platform-route-targets='{"users":"platform.user.manage","security":"platform.security.whitelist.view","menus":"platform.menu.manage"}'></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --font-ui: "Avenir Next", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "Fira Code", "SFMono-Regular", Consolas, monospace;
      --bg-page: #F5F7FB;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F1F5F9;
      --bg-muted: #F1F5F9;
      --bg-rail: #111827;
      --text-strong: #1D2129;
      --text-main: #4E5969;
      --text-muted: #626d7b;
      --text-inverse: #F8FAFC;
      --line: #E5E6EB;
      --line-strong: #C9CDD4;
      --primary: #145fe8;
      --primary-strong: #0f52cc;
      --primary-soft: #E8F3FF;
      --accent: #FF7D00;
      --accent-soft: #FFF7E8;
      --danger: #F53F3F;
      --danger-soft: #FFECE8;
      --success: #00B42A;
      --success-soft: #E8FFEA;
      --info: #722ED1;
      --info-soft: #F4ECFF;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --shadow-pop: 0 18px 45px rgba(29, 33, 41, 0.14);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --rail-width: 248px;
      --topbar-height: 56px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font-ui);
      color: var(--text-main);
      background: var(--bg-page);
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--primary-strong);
      outline-offset: 2px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: var(--rail-width) minmax(0, 1fr);
      min-height: 100dvh;
    }

    .sidebar {
      background: var(--bg-rail);
      color: #E5E7EB;
      padding: 0;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100dvh;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      overflow-y: auto;
    }

    .brand {
      height: var(--topbar-height);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, #165DFF 0%, #0E7490 100%);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #ffffff;
      font-family: "Fira Code", "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
      line-height: 1;
    }

    .brand-title {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .brand strong {
      display: block;
      color: #ffffff;
      font-size: 15px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .brand span {
      display: block;
      color: #9CA3AF;
      font-size: 12px;
    }

    .nav-list {
      padding: 14px 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .nav-group {
      display: grid;
      gap: 4px;
    }

    .nav-group-title {
      padding: 0 10px;
      color: #8B95A7;
      font-size: 12px;
      font-weight: 700;
      line-height: 22px;
    }

    .nav-button {
      width: 100%;
      min-height: 38px;
      border: 0;
      border-radius: var(--radius-md);
      color: #C9D1DF;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      text-align: left;
      transition: background 160ms ease, color 160ms ease;
    }

    .nav-button:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
    }

    .nav-button.active {
      background: rgba(20, 95, 232, 0.24);
      color: #ffffff;
    }

    .nav-button i,
    .top-icon i,
    .btn i,
    .icon-only i {
      width: 16px;
      height: 16px;
      stroke-width: 2;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: var(--topbar-height) minmax(0, 1fr);
    }

    .topbar {
      height: var(--topbar-height);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .breadcrumb strong {
      color: var(--text-strong);
      font-size: 15px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-icon {
      min-height: 34px;
      border: 1px solid var(--line);
      background: var(--bg-surface);
      color: var(--text-main);
      border-radius: var(--radius-md);
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .top-icon:hover {
      border-color: #9db3bc;
      background: #f8fbfc;
    }

    .workspace {
      padding: 18px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
      min-width: 0;
    }

    .content {
      min-width: 0;
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      background: var(--bg-surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 16px;
    }

    h1 {
      margin: 0;
      color: var(--text-strong);
      font-size: 28px;
      line-height: 1.25;
      letter-spacing: 0;
      font-family: var(--font-ui);
      font-weight: 600;
    }

    .page-desc {
      margin: 6px 0 0;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
      max-width: 72ch;
    }

    .head-actions,
    .row-actions,
    .filter-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .btn {
      min-height: 34px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text-main);
      border-radius: var(--radius-md);
      padding: 0 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 600;
      transition: transform 120ms ease, background 160ms ease, border-color 160ms ease, color 160ms ease;
      white-space: nowrap;
    }

    .module-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: var(--bg-subtle);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow-x: auto;
    }

    .module-button {
      min-height: 34px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-main);
      border-radius: var(--radius-md);
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      white-space: nowrap;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .module-button:hover {
      background: rgba(255, 255, 255, 0.75);
      color: var(--text-strong);
    }

    .module-button.active {
      color: var(--primary);
      background: #ffffff;
      border-color: var(--line);
      box-shadow: inset 0 -2px 0 var(--primary);
    }

    .module-button i {
      width: 16px;
      height: 16px;
      stroke-width: 2;
    }

    .btn:hover {
      border-color: #a8bac2;
      background: #f8fbfc;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    .btn.primary:hover {
      background: var(--primary-strong);
    }

    .btn.danger {
      border-color: rgba(245, 63, 63, 0.35);
      color: var(--danger);
      background: var(--danger-soft);
    }

    .btn.warning {
      border-color: #ffe4ba;
      color: var(--accent);
      background: var(--accent-soft);
    }

    .btn.ghost {
      background: transparent;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      background: var(--bg-surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 13px 14px;
    }

    .metric span {
      display: block;
      color: var(--text-muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .metric strong {
      color: var(--text-strong);
      font-size: 24px;
      line-height: 1;
    }

    .metric small {
      color: var(--text-muted);
      margin-left: 6px;
      font-size: 12px;
    }

    .panel {
      background: var(--bg-surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .panel-head {
      min-height: 52px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .panel-title {
      color: var(--text-strong);
      font-size: 15px;
      font-weight: 700;
      margin: 0;
    }

    .panel-sub {
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }

    .tab {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      border-radius: var(--radius-md);
      padding: 8px 10px;
      font-weight: 700;
      white-space: nowrap;
      transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
    }

    .tab:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.7);
    }

    .tab.active {
      color: var(--primary);
      background: #ffffff;
      border-color: var(--line);
    }

    .toolbar {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search {
      min-height: 34px;
      min-width: 230px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 0 10px;
      color: var(--text-main);
      background: #ffffff;
    }

    .select {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 0 28px 0 10px;
      color: var(--text-main);
      background: #ffffff;
    }

    .input,
    .textarea {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 8px 10px;
      color: var(--text-main);
      background: #ffffff;
      font: inherit;
      outline: none;
      transition: border 140ms ease, box-shadow 140ms ease;
    }

    .textarea {
      min-height: 72px;
      resize: vertical;
      line-height: 1.5;
    }

    .input:focus,
    .textarea:focus,
    .select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      background: #f8fbfc;
    }

    tbody tr {
      transition: background 140ms ease;
    }

    tbody tr:hover {
      background: #f8fbfc;
    }

    tbody tr.selected {
      background: var(--primary-soft);
      box-shadow: inset 3px 0 0 var(--primary);
    }

    .mono {
      font-family: "Fira Code", "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .tag.success {
      color: var(--success);
      background: var(--success-soft);
      border-color: #aff0b5;
    }

    .tag.warning {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: #ffe4ba;
    }

    .tag.danger {
      color: var(--danger);
      background: var(--danger-soft);
      border-color: #ffd4cc;
    }

    .tag.info {
      color: var(--primary);
      background: var(--primary-soft);
      border-color: #bedaff;
    }

    .tag.neutral {
      color: #52656f;
      background: #eef3f6;
      border-color: #d9e2e7;
    }

    .role-stack {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .kv-list {
      display: grid;
      gap: 8px;
    }

    .kv {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      padding: 9px 10px;
    }

    .kv + .kv {
      border-top: 1px dashed var(--line);
    }

    .kv span {
      color: var(--text-muted);
    }

    .kv strong {
      color: var(--text-strong);
      text-align: right;
      font-weight: 700;
    }

    .risk-note {
      border: 1px solid #ffe4ba;
      background: var(--accent-soft);
      color: #8A4B00;
      border-radius: var(--radius-md);
      padding: 10px;
      font-size: 13px;
      line-height: 1.45;
    }

    .audit-list {
      display: grid;
      gap: 9px;
    }

    .audit-item {
      display: grid;
      gap: 3px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    .audit-item:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .audit-item strong {
      color: var(--text-strong);
    }

    .audit-item span {
      color: var(--text-muted);
      font-size: 12px;
    }

    .split-grid {
      display: grid;
      grid-template-columns: minmax(260px, 0.9fr) minmax(300px, 1.1fr);
      gap: 14px;
      padding: 14px;
    }

    .list-block {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #ffffff;
    }

    .list-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
      color: var(--text-main);
      font: inherit;
      text-align: left;
      cursor: pointer;
      min-height: 48px;
      transition: background 140ms ease;
    }

    .list-row:last-child {
      border-bottom: 0;
    }

    .list-row:hover,
    .list-row.active {
      background: var(--primary-soft);
    }

    .role-config {
      display: grid;
      gap: 14px;
      padding: 14px;
    }

    .role-section {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #ffffff;
      overflow: hidden;
    }

    .role-section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #f8fbfc;
    }

    .role-section-head strong {
      color: var(--text-strong);
      font-size: 15px;
    }

    .role-section-head span {
      display: block;
      margin-top: 3px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .permission-auth-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    .permission-auth-head strong {
      color: var(--text-strong);
      font-size: 15px;
    }

    .permission-auth-head span {
      color: var(--text-muted);
      font-size: 12px;
    }

    .permission-cell {
      min-width: 260px;
    }

    .role-config-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: start;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #ffffff;
    }

    .role-selector {
      display: grid;
      gap: 8px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .role-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .role-option {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 11px;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text-main);
      font-weight: 700;
      transition: all 140ms ease;
    }

    .role-option:hover,
    .role-option.active {
      color: var(--primary);
      border-color: var(--primary-strong);
      background: var(--primary-soft);
    }

    .role-meta {
      min-width: 230px;
      display: grid;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .role-meta strong {
      color: var(--text-strong);
    }

    .permission-board {
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(360px, 1fr);
      gap: 14px;
      align-items: start;
    }

    .permission-column {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #ffffff;
      overflow: hidden;
    }

    .permission-column-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #f8fbfc;
    }

    .permission-column-head strong {
      color: var(--text-strong);
    }

    .permission-column-head span {
      color: var(--text-muted);
      font-size: 12px;
    }

    .permission-list {
      display: grid;
      gap: 10px;
      padding: 12px;
      max-height: 520px;
      overflow: auto;
    }

    .permission-card {
      display: grid;
      gap: 8px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #ffffff;
    }

    .permission-card.authorized {
      border-color: #bedaff;
      background: #fbfdff;
    }

    .permission-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .permission-card-head strong {
      color: var(--text-strong);
    }

    .permission-card small {
      color: var(--text-muted);
      font-size: 12px;
    }

    .role-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #ffffff;
      color: var(--text-main);
      font-size: 13px;
    }

    .tree {
      display: grid;
      gap: 6px;
      font-size: 13px;
    }

    .tree-node {
      border: 1px solid var(--line);
      background: #ffffff;
      border-radius: var(--radius-md);
      padding: 9px 10px;
    }

    .tree-node.child {
      margin-left: 18px;
    }

    .tree-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .checks {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .check-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 24px;
      border: 1px solid var(--line);
      background: #f7fafb;
      border-radius: 999px;
      padding: 0 8px;
      color: var(--text-main);
      font-size: 12px;
    }

    .check-pill.enabled {
      color: var(--primary);
      background: var(--primary-soft);
      border-color: #bedaff;
    }

    .security-grid,
    .config-grid,
    .fee-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      padding: 14px;
    }

    .mini-panel {
      border: 1px solid var(--line);
      background: #ffffff;
      border-radius: var(--radius-md);
      padding: 12px;
      min-width: 0;
    }

    .mini-panel h3 {
      margin: 0 0 8px;
      color: var(--text-strong);
      font-size: 14px;
    }

    .policy-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    .policy-row:last-child {
      border-bottom: 0;
    }

    .settings-form {
      display: grid;
      gap: 10px;
    }

    .setting-row {
      display: grid;
      grid-template-columns: minmax(180px, 0.8fr) minmax(220px, 1fr);
      gap: 14px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .setting-row strong {
      display: block;
      color: var(--text-strong);
      font-size: 13px;
      margin-bottom: 3px;
    }

    .setting-row small {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .setting-control {
      width: min(260px, 100%);
      justify-self: end;
    }

    .menu-layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
    }

    .menu-workbench {
      display: grid;
      gap: 12px;
      padding: 14px;
    }

    .menu-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #ffffff;
    }

    .menu-toolbar .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      min-width: 0;
    }

    .tree-table td,
    .tree-table th {
      white-space: nowrap;
    }

    .tree-table {
      min-width: 1040px;
    }

    .tree-table td {
      padding-top: 8px;
      padding-bottom: 8px;
    }

    .tree-table th:last-child,
    .tree-table td:last-child {
      width: 235px;
      min-width: 235px;
      position: sticky;
      right: 0;
      background: #ffffff;
      box-shadow: -1px 0 0 var(--line);
      z-index: 1;
    }

    .tree-table th:last-child {
      background: #f8fbfc;
      z-index: 2;
    }

    .tree-table .row-actions {
      flex-wrap: nowrap;
      gap: 5px;
    }

    .tree-table .btn {
      min-height: 30px;
      padding: 0 8px;
      font-size: 12px;
    }

    .tree-name {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 240px;
      padding-left: calc(var(--level) * 22px);
    }

    .tree-name i {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      flex: 0 0 auto;
    }

    .tree-toggle {
      width: 32px;
      min-width: 32px !important;
      min-height: 32px !important;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      display: inline-grid;
      place-items: center;
    }

    .tree-toggle:hover {
      background: var(--surface-soft);
      color: var(--primary);
    }

    .tree-toggle svg {
      width: 16px;
      height: 16px;
    }

    .tree-name strong {
      color: var(--text-strong);
      display: block;
    }

    .tree-name small,
    .route-stack small {
      color: var(--text-muted);
      display: block;
      margin-top: 2px;
    }

    .route-stack strong {
      display: block;
      color: var(--text-strong);
      font-family: "Fira Code", "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
    }

    .menu-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #f8fbfc;
      color: var(--text-muted);
      font-size: 13px;
    }

    .menu-workbench .table-wrap {
      overflow-x: auto;
    }

    .impact-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .impact-item {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 10px;
      background: #f8fbfc;
    }

    .impact-item span {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .impact-item strong {
      color: var(--text-strong);
      font-size: 18px;
    }

    .state-band {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid #c7d9df;
      background: #f5fafb;
      border-radius: var(--radius-md);
      padding: 10px;
      margin-top: 10px;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .empty {
      padding: 22px;
      color: var(--text-muted);
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: var(--radius-md);
      background: #fbfdfe;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(12, 25, 31, 0.42);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(520px, 100%);
      background: #ffffff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-pop);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .modal.role-modal {
      width: min(760px, calc(100vw - 36px));
    }

    .modal.account-modal {
      width: min(920px, calc(100vw - 36px));
    }

    .modal.permission-modal {
      width: min(1120px, calc(100vw - 36px));
    }

    .modal.menu-modal {
      width: min(960px, calc(100vw - 36px));
    }

    .modal.fee-modal {
      width: min(980px, calc(100vw - 36px));
    }

    .inline-error {
      display: none;
      padding: 10px 12px;
      border: 1px solid #f3b4b4;
      border-radius: var(--radius-md);
      color: #b42318;
      background: #fff6f5;
      font-size: 13px;
      font-weight: 700;
    }

    .inline-error.show {
      display: block;
    }

    .modal-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .modal-head h2 {
      margin: 0;
      color: var(--text-strong);
      font-size: 17px;
    }

    .modal-body {
      padding: 16px;
      display: grid;
      gap: 12px;
      max-height: min(72vh, 680px);
      overflow: auto;
    }

    .modal-foot {
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      background: #f8fbfc;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .form-field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .form-field.full {
      grid-column: 1 / -1;
    }

    .form-field label {
      color: var(--text-strong);
      font-size: 13px;
      font-weight: 700;
    }

    .form-field small {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .audit-strip,
    .form-note {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #f8fbfc;
      font-size: 12px;
    }

    .audit-strip span,
    .form-note span {
      display: block;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .audit-strip strong,
    .form-note strong {
      color: var(--text-strong);
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .choice-card,
    .permission-row {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 10px;
      background: #ffffff;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      color: var(--text-main);
      font-size: 13px;
    }

    .choice-card input,
    .permission-row input {
      margin-top: 2px;
      accent-color: var(--primary);
    }

    .permission-editor {
      display: grid;
      gap: 8px;
    }

    .permission-row {
      justify-content: space-between;
      align-items: center;
    }

    .permission-row label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: var(--text-strong);
    }

    .auth-summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .auth-summary-item {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #f8fbfc;
      font-size: 12px;
    }

    .auth-summary-item span {
      display: block;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .auth-summary-item strong {
      color: var(--text-strong);
    }

    .auth-matrix {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #ffffff;
    }

    .auth-matrix table {
      min-width: 980px;
    }

    .auth-page-cell {
      min-width: 230px;
    }

    .auth-page-cell strong,
    .auth-page-cell small {
      display: block;
    }

    .auth-page-cell small {
      margin-top: 4px;
      color: var(--text-muted);
    }

    .auth-action-grid {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 280px;
    }

    .toggle-check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #ffffff;
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .toggle-check input {
      accent-color: var(--primary);
    }

    .toggle-check:has(input:checked) {
      border-color: #a8cdfc;
      background: #edf6ff;
      color: var(--primary);
    }

    .switch-control {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 36px;
      width: fit-content;
      cursor: pointer;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
    }

    .switch-control input {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .switch-track {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background: #cbd5e1;
      transition: background 180ms ease;
      flex: 0 0 auto;
    }

    .switch-track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.22);
      transition: transform 180ms ease;
    }

    .switch-control input:checked + .switch-track {
      background: var(--primary);
    }

    .switch-control input:checked + .switch-track::after {
      transform: translateX(20px);
    }

    .switch-control input:focus-visible + .switch-track {
      outline: 3px solid rgba(37, 99, 235, 0.22);
      outline-offset: 2px;
    }

    .switch-control:has(input:disabled) {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .inline-setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #f8fbfc;
    }

    .inline-setting span,
    .inline-setting strong {
      display: block;
    }

    .inline-setting > div > span {
      color: var(--text-muted);
      font-size: 12px;
      margin-bottom: 2px;
    }

    .auth-risk {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid #d7e5ef;
      border-radius: var(--radius-md);
      background: #f7fbfd;
      color: var(--text-main);
      font-size: 13px;
    }

    .delete-impact {
      border: 1px solid #ffd4cc;
      background: var(--danger-soft);
      border-radius: var(--radius-md);
      padding: 12px;
      display: grid;
      gap: 8px;
      color: #9d2a19;
      font-size: 13px;
    }

    .icon-only {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      display: inline-grid;
      place-items: center;
      background: #ffffff;
      color: var(--text-main);
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: min(420px, calc(100vw - 36px));
      background: #132027;
      color: #ffffff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-pop);
      padding: 12px 14px;
      display: none;
      gap: 8px;
      align-items: flex-start;
      z-index: 60;
      font-size: 13px;
      line-height: 1.45;
    }

    .toast.show {
      display: flex;
    }

    .toast i {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      margin-top: 1px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }

    @media (max-width: 1180px) {
      .workspace {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 860px) {
      .app-shell {
        grid-template-columns: 1fr;
      }
      .main {
        grid-template-rows: auto minmax(0, 1fr);
      }
      .sidebar {
        position: static;
      }
      .nav-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .metric-grid,
      .security-grid,
      .config-grid,
      .fee-grid,
      .split-grid,
      .permission-board,
      .role-config-toolbar,
      .auth-summary,
      .menu-layout,
      .topbar {
        grid-template-columns: 1fr;
        align-items: flex-start;
        min-height: 86px;
        padding: 12px;
        gap: 10px;
        flex-direction: column;
      }
      .role-meta {
        min-width: 0;
      }
      .setting-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .setting-control {
        width: 100%;
        justify-self: stretch;
      }
      .workspace {
        padding: 12px;
      }
      .page-head {
        flex-direction: column;
      }
      .search {
        min-width: 100%;
      }
      table {
        min-width: 820px;
      }
      .table-wrap {
        overflow-x: auto;
      }
    }

    @media (max-width: 600px) {
      .app-shell {
        display: block;
      }
      .sidebar {
        position: sticky;
        top: 0;
        z-index: 30;
        width: 100%;
        height: auto;
        overflow-x: auto;
      }
      .brand {
        display: none;
      }
      .nav-group-title {
        display: none;
      }
      .nav-list {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        grid-template-columns: none;
        width: max-content;
        padding: 8px 10px 10px;
        gap: 8px;
      }
      .nav-group {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        gap: 8px;
      }
      .nav-button {
        width: auto;
        min-width: max-content;
        min-height: 44px !important;
        justify-content: flex-start;
        padding: 9px 12px;
      }
      .nav-button span { display: inline; }
      .nav-button svg {
        flex: 0 0 auto;
      }
      .topbar {
        min-height: 56px;
        height: auto;
        padding: 10px 12px;
      }
      .breadcrumb {
        font-size: 12px;
      }
      .top-actions {
        width: 100%;
        min-height: 44px;
        flex: 0 0 auto;
        overflow-x: auto;
      }
      .top-icon {
        white-space: nowrap;
      }
      .page-head {
        padding: 14px;
      }
      .page-head h1 {
        font-size: 24px;
      }
      .module-switcher {
        overflow-x: auto;
        flex-wrap: nowrap;
      }
      .module-button {
        white-space: nowrap;
      }
    }
    /* 三端共用：键盘、动效与窄屏触控基线 */
    :focus-visible {
      outline: 3px solid #ffffff;
      box-shadow: 0 0 0 5px #145fe8;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    @media (max-width: 768px) {
      button,
      input:not([type="checkbox"]):not([type="radio"]),
      select,
      textarea,
      [role="button"] {
        min-height: 44px !important;
      }

      button,
      [role="button"] {
        min-width: 44px !important;
      }

      input,
      select,
      textarea {
        font-size: 16px !important;
      }
    }

    function renderMenuRow(item) {
      const hasChildren = menuCatalog.some(child => child.parentId === item.id);

        <tr class="${state.selectedMenu === item.id ? "selected" : ""}" data-menu="${item.id}">

            </div>

        </tr>`;

    function menuMatchesFilters(item) {
      const filters = state.menuFilters;
      const keyword = filters.keyword.trim().toLowerCase();
      const searchable = `${item.name} ${item.path} ${item.component} ${item.permission}`.toLowerCase();
      return (!keyword || searchable.includes(keyword))
        && (filters.type === "全部类型" || item.type === filters.type)
        && (filters.status === "全部状态" || item.status === filters.status)
        && (filters.visible === "全部显示状态" || item.visible === filters.visible);
    }

    function visibleMenuCatalog() {
      const included = new Set();
      menuCatalog.filter(menuMatchesFilters).forEach(item => {
        included.add(item.id);
        let parentId = item.parentId;
        while (parentId && parentId !== "root") {
          included.add(parentId);
          parentId = menuCatalog.find(parent => parent.id === parentId)?.parentId;
        }
      });
      return menuCatalog.filter(item => {
        if (!included.has(item.id)) return false;
        let parentId = item.parentId;
        while (parentId && parentId !== "root") {
          if (state.menuCollapsed.has(parentId)) return false;
          parentId = menuCatalog.find(parent => parent.id === parentId)?.parentId;
        }
        return true;
      });
    }

    function tenantMenuById(id) {

      if (status === "已发布") return `<span class="tag success">已发布</span>`;
      if (status === "草稿") return `<span class="tag info">草稿</span>`;
      return `<span class="tag warning">${status}</span>`;
    }

    function tenantMenuMatchesFilters(item) {
      const filters = state.tenantMenuFilters;
      const keyword = filters.keyword.trim().toLowerCase();
      const searchable = `${item.name} ${item.path} ${item.component} ${item.permission} ${item.capability}`.toLowerCase();
      return (!keyword || searchable.includes(keyword))
        && (filters.type === "全部类型" || item.type === filters.type)
        && (filters.status === "全部发布状态" || item.status === filters.status)
        && (filters.scope === "全部适用范围" || item.releaseScope === filters.scope);
    }

    function visibleTenantMenuCatalog() {
      const included = new Set();
      tenantMenuCatalog.filter(tenantMenuMatchesFilters).forEach(item => {
        included.add(item.id);
        let parentId = item.parentId;
        while (parentId && parentId !== "root") {
          included.add(parentId);
          parentId = tenantMenuCatalog.find(parent => parent.id === parentId)?.parentId;
        }
      });
      return tenantMenuCatalog.filter(item => {
        if (!included.has(item.id)) return false;
        let parentId = item.parentId;
        while (parentId && parentId !== "root") {
          if (state.tenantMenuCollapsed.has(parentId)) return false;
          parentId = tenantMenuCatalog.find(parent => parent.id === parentId)?.parentId;
        }
        return true;
      });

    function renderTenantMenuRow(item) {

        <div class="menu-workbench">

            <div class="filters">

              <select class="select" id="tenantMenuFilterType" aria-label="租户菜单类型"><option ${state.tenantMenuFilters.type === "全部类型" ? "selected" : ""}>全部类型</option><option ${state.tenantMenuFilters.type === "目录" ? "selected" : ""}>目录</option><option ${state.tenantMenuFilters.type === "页面" ? "selected" : ""}>页面</option><option ${state.tenantMenuFilters.type === "按钮" ? "selected" : ""}>按钮</option></select>

            </div>
            <div class="row-actions">
              <button class="btn" type="button" data-action="tenant-menu-reset"><i data-lucide="rotate-ccw"></i><span>重置</span></button>
              <button class="btn" type="button" data-action="tenant-menu-query"><i data-lucide="search"></i><span>查询</span></button>
              <button class="btn" type="button" data-action="tenant-menu-refresh"><i data-lucide="refresh-cw"></i><span>重新载入</span></button>
              <button class="btn" type="button" data-action="modal" data-message="tenant-menu:sort"><i data-lucide="save"></i><span>保存排序</span></button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="tree-table" aria-label="租户端菜单目录">
              <thead><tr><th>菜单名称</th><th>类型</th><th>路由 / 组件 / 权限标识</th><th>发布范围 / 能力归属</th><th>发布状态 / 版本</th><th>操作</th></tr></thead>
              <tbody>${visibleMenus.length ? visibleMenus.map(renderTenantMenuRow).join("") : `<tr><td colspan="6"><div class="empty-state"><strong>没有匹配的租户菜单</strong><span>请调整关键词、类型、发布状态或适用范围。</span></div></td></tr>`}</tbody>
            </table>
          </div>
          <div class="menu-footer">
            <span>当前显示 ${visibleMenus.length} / ${tenantMenuCatalog.length} 个节点；最近重新载入：${state.tenantMenuRefreshedAt} UTC+8。</span>
            <div class="row-actions"><span class="tag info">当前发布版本：T18</span><button class="btn" type="button" data-action="modal" data-message="tenant-menu:audit"><i data-lucide="file-clock"></i><span>变更记录</span></button></div>
          </div>
        </div>`;

    function renderFees() {
      const visibleFeePlans = !platformSystemAuthorization || platformSystemAuthorization.dataScope.scopeCode === 'platform.all_tenants'
        ? feePlans
        : platformSystemAuthorization.dataScope.scopeCode === 'platform.assigned_tenants'
          ? feePlans.filter(plan => plan.scopeKind === 'platform_global' || (plan.tenantIds || []).some(id => platformSystemAuthorization.dataScope.tenantIds.includes(String(id))))
          : [];
      return `
        <div class="panel-head">
          <div><p class="panel-title">套餐费率配置</p><div class="panel-sub">平台向租户收取的订单费与独立退款费 · CNY · 实时计费 · 不包含通道成本</div></div>
          <button class="btn primary" type="button" data-fee-create><i data-lucide="plus"></i><span>新增套餐</span></button>
        </div>
        <div class="risk-note">代收套餐独立配置退款费率，可为固定、百分比或组合，不复用代收、代付或提款费率。授权账号完成原因、Google 2FA 和影响确认后直接建立新版本，不生成费率审核单；新版本只影响之后创建的订单和退款单，既有费用快照不重算。</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>套餐</th><th>业务大类</th><th>方向 / 计费</th><th>月累计成功跑量阶梯</th><th>订单费率</th><th>退款费率</th><th>状态 / 版本</th><th>租户引用</th><th>最近生效</th><th>操作</th></tr></thead>
            <tbody>${visibleFeePlans.map(plan => `
              <tr>
                <td><strong>${plan.name}</strong><br><span class="mono muted">${plan.id}</span></td>
                <td>${plan.type}</td>
                <td>${plan.direction}<br><span class="muted">${plan.chargeType}</span></td>
                <td class="mono">${plan.range}</td>
                <td class="mono">${plan.rate}</td>
                <td class="mono">${plan.direction === "代收" ? `${plan.refundChargeType}<br><span class="muted">${plan.refundRate}</span>` : "不适用"}</td>
                <td>${statusTag(plan.status)}<br><span class="mono muted">${plan.version}</span></td>
                <td><button class="btn ghost" type="button" data-fee-refs="${plan.id}"><i data-lucide="link"></i><span>${plan.refs} 个租户</span></button></td>
                <td class="mono">${plan.updated}</td>
                <td>
                  <div class="row-actions">
                    <button class="btn ghost" type="button" data-fee-edit="${plan.id}"><i data-lucide="pencil"></i><span>编辑</span></button>
                    <button class="btn ghost" type="button" data-fee-status="${plan.id}" data-fee-status-action="${plan.status === "已启用" ? "停用" : "启用"}"><i data-lucide="${plan.status === "已启用" ? "pause-circle" : "play-circle"}"></i><span>${plan.status === "已启用" ? "停用" : "启用"}</span></button>
                  </div>
                </td>
              </tr>
            `).join("")}</tbody>
          </table>
        </div>
        <div class="panel-head"><div><p class="panel-title">套餐版本记录</p><div class="panel-sub">只读、永久保存，不支持覆盖或回滚</div></div></div>
        <div class="table-wrap"><table><thead><tr><th>记录</th><th>套餐</th><th>动作</th><th>变更前</th><th>变更后</th><th>操作人</th><th>生效时间</th><th>原因</th></tr></thead><tbody>${feeChangeHistory.map(record => `<tr><td class="mono">${record.id}</td><td>${record.planName}</td><td>${statusTag(record.action)}</td><td>${record.before}</td><td>${record.after}</td><td>${record.operator}</td><td class="mono">${record.effective}</td><td>${record.reason}</td></tr>`).join("")}</tbody></table></div>`;
    }

    function platformSystemRequiredAction(control) {
      const message = control.dataset.message || control.dataset.payload || '';
      const action = control.dataset.action || control.dataset.headAction || '';
      if (action === 'toast' || ['menu-expand', 'menu-reset', 'menu-query', 'menu-refresh', 'tenant-menu-expand', 'tenant-menu-reset', 'tenant-menu-query', 'tenant-menu-refresh'].includes(action)) return '';
      if (action === 'fee-export' || action === 'export-center') return 'platform.fee_package.export';
      if (control.hasAttribute('data-fee-create') || control.hasAttribute('data-fee-edit') || control.hasAttribute('data-fee-status') || action === 'fee-create') return 'platform.fee_package.manage';
      if (message.startsWith('account:')) return 'platform.user.manage';
      if (message.startsWith('role:')) return 'platform.role.manage';
      if (message.startsWith('menu:') || action === 'menu-toggle') return 'platform.menu.manage';
      if (message.startsWith('tenant-menu:publish:')) return 'platform.tenant_menu.publish';
      if (message === 'tenant-menu:audit') return 'platform.tenant_menu.audit';
      if (message.startsWith('tenant-menu:') || action === 'tenant-menu-toggle') return 'platform.tenant_menu.manage';
      if (['security-save', 'security-entry-add', 'security-entry-toggle'].includes(action)) return 'platform.security.whitelist.manage';
      if (state.module === 'users' && (action === 'modal' || control.hasAttribute('data-head-action'))) return state.userTab === 'roles' ? 'platform.role.manage' : 'platform.user.manage';
      if (state.module === 'menus' && (action === 'modal' || control.hasAttribute('data-head-action'))) return 'platform.menu.manage';
      if (state.module === 'tenant-menus' && (action === 'modal' || control.hasAttribute('data-head-action'))) return 'platform.tenant_menu.manage';
      if (state.module === 'fees' && control.hasAttribute('data-head-action')) return action === 'fee-export' ? 'platform.fee_package.export' : 'platform.fee_package.manage';
      return '';
    }

    function applyPlatformSystemAuthorization() {
      if (!platformSystemAuthorization) return;
      document.querySelectorAll('[data-action], [data-head-action], [data-fee-create], [data-fee-edit], [data-fee-status]').forEach(control => {
        const required = platformSystemRequiredAction(control);
        if (required) control.hidden = !platformSystemActionPermissions.has(required);
      });
    }

    function bindModuleEvents() {
      document.querySelectorAll("[data-user-tab]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.userTab = btn.dataset.userTab;
          window.history.replaceState(null, "", `#${userTabHash[state.userTab] || "users"}`);
          render();
        });
      });
      document.querySelectorAll("[data-account]").forEach(row => {
        row.addEventListener("click", event => {
          if (event.target.closest("button")) return;
          state.selectedAccount = row.dataset.account;
          render();
          showToast("已选中账号，可执行重置 2FA 或强制下线操作。");
        });
      });
      document.querySelectorAll("[data-role]").forEach(row => {
        row.addEventListener("click", event => {
          if (event.target.closest("[data-action]")) return;
          state.selectedRole = row.dataset.role;
          render();
        });
      });
      document.querySelectorAll("[data-menu]").forEach(btn => {
        btn.addEventListener("click", event => {
          if (event.target.closest("[data-action]")) return;
          state.selectedMenu = btn.dataset.menu;
          render();
        });
      });
      document.querySelectorAll("[data-tenant-menu]").forEach(row => {
        row.addEventListener("click", event => {
          if (event.target.closest("[data-action]")) return;
          state.selectedTenantMenu = row.dataset.tenantMenu;
          render();
        });
      });
      document.querySelectorAll("[data-action]").forEach(btn => {
        btn.addEventListener("click", event => {
          event.stopPropagation();
          handleAction(btn.dataset.action, btn.dataset.message);
        });
      });
      document.querySelectorAll("[data-fee-create]").forEach(btn => btn.addEventListener("click", () => openFeeForm()));
      document.querySelectorAll("[data-fee-edit]").forEach(btn => btn.addEventListener("click", () => openFeeForm(btn.dataset.feeEdit)));
      document.querySelectorAll("[data-fee-refs]").forEach(btn => btn.addEventListener("click", () => openFeeReferences(btn.dataset.feeRefs)));
      document.querySelectorAll("[data-fee-status]").forEach(btn => btn.addEventListener("click", () => openFeeStatus(btn.dataset.feeStatus, btn.dataset.feeStatusAction)));
    }

    function policyRows(rows) {
      return rows.map(([label, value, tone]) => `
        <div class="policy-row">
          <span>${label}</span>
          <span class="tag ${tone}">${value}</span>
        </div>
      `).join("");
    }

    function selectedAccount() {
      return accounts.find(account => account.id === state.selectedAccount) || accounts[0];
    }

    function accountById(id) {
      return accounts.find(account => account.id === id) || selectedAccount();
    }

    function currentRole() {
      return roles.find(role => role.id === state.selectedRole) || roles[0];
    }

    function statusTag(status) {
      const text = String(status);
      if (text.includes("正常") || text.includes("启用") || text.includes("已生效") || text.includes("可见") || text.includes("可下载") || text.includes("显示") || text.includes("成功")) return `<span class="tag success">${text}</span>`;
      if (text.includes("待") || text.includes("锁定") || text.includes("冲突") || text.includes("处理中") || text.includes("锁定态")) return `<span class="tag warning">${text}</span>`;
      if (text.includes("停用") || text.includes("失败") || text.includes("拒绝")) return `<span class="tag danger">${text}</span>`;
      if (text.includes("只读") || text.includes("端内")) return `<span class="tag info">${text}</span>`;
      return `<span class="tag neutral">${text}</span>`;
    }

    function roleById(id) {
      return roles.find(role => role.id === id) || currentRole();
    }

    function permissionById(id) {
      return permissionCatalog.find(permission => permission.id === id) || permissionCatalog[0];
    }

    function roleCode(role) {
      const codes = { super: "PLATFORM_SUPER_ADMIN", ops: "PLATFORM_OPS", finance: "PLATFORM_FINANCE", audit: "RISK_AUDIT", legacy: "LEGACY_TEST" };
      return role.code || codes[role.id] || "PLATFORM_ROLE";
    }

    function selectedOption(value, current) {
      return value === current ? "selected" : "";
    }

    function samePlatformStringSet(left = [], right = []) {
      const a = [...left].sort();
      const b = [...right].sort();
      return a.length === b.length && a.every((value, index) => value === b[index]);
    }

    function platformScopeSummary(scopeCode, tenantIds = []) {
      if (scopeCode !== "platform.assigned_tenants") return "全部租户";
      const names = tenantIds.map(id => platformScopeTenants.find(item => item.id === id)?.name || id);
      return `指定租户：${names.join("、") || "未选择"}`;
    }

    function platformScopeField(prefix, scopeCode = "platform.all_tenants", tenantIds = [], label = "数据范围", showEffective = false) {
      const choices = platformScopeTenants.map(item => `<label class="choice-card"><input type="checkbox" data-platform-scope-tenant="${prefix}" value="${item.id}" ${tenantIds.includes(item.id) ? "checked" : ""}><span><strong>${item.name}</strong><br><small class="mono">${item.id}</small></span></label>`).join("");
      return `<div class="form-field"><label for="${prefix}ScopeCode">${label}</label><select class="select" id="${prefix}ScopeCode" data-platform-scope-code="${prefix}" aria-label="${label}"><option value="platform.all_tenants" ${scopeCode === "platform.all_tenants" ? "selected" : ""}>全部租户</option><option value="platform.assigned_tenants" ${scopeCode === "platform.assigned_tenants" ? "selected" : ""}>指定租户</option></select><small>资金、审计和读写职责由页面、按钮及敏感字段权限控制。</small></div><div class="form-field full"><label>指定租户（选择指定租户时至少一项）</label><div class="choice-grid">${choices}</div></div>${showEffective ? `<div class="form-field full"><div class="form-note" id="${prefix}EffectiveScope"><div><span>账号范围</span><strong>-</strong></div><div><span>角色合并范围</span><strong>-</strong></div><div><span>最终有效范围</span><strong>-</strong></div></div></div>` : ""}`;
    }

    function readPlatformScope(prefix) {
      const scopeCode = document.getElementById(`${prefix}ScopeCode`)?.value || "platform.all_tenants";
      const tenantIds = [...document.querySelectorAll(`[data-platform-scope-tenant="${prefix}"]:checked`)].map(input => input.value);
      return { scopeCode, tenantIds: scopeCode === "platform.assigned_tenants" ? [...new Set(tenantIds)] : [] };
    }

    function platformRoleMergedScope(roleNames) {
      const enabled = roleNames.map(name => roles.find(role => role.name === name)).filter(role => role?.status === "启用");
      if (enabled.some(role => role.scopeCode === "platform.all_tenants")) return { scopeCode: "platform.all_tenants", tenantIds: [] };
      const tenantIds = [...new Set(enabled.flatMap(role => role.tenantIds || []))];
      return { scopeCode: tenantIds.length ? "platform.assigned_tenants" : "empty", tenantIds };
    }

    function platformEffectiveScope(roleNames, accountScope) {
      const merged = platformRoleMergedScope(roleNames);
      if (merged.scopeCode === "empty") return { scopeCode: "empty", tenantIds: [] };
      if (merged.scopeCode === "platform.all_tenants") return accountScope;
      if (accountScope.scopeCode === "platform.all_tenants") return merged;
      const tenantIds = merged.tenantIds.filter(id => accountScope.tenantIds.includes(id));
      return { scopeCode: tenantIds.length ? "platform.assigned_tenants" : "empty", tenantIds };
    }

    function updatePlatformEffectiveScopeSummary() {
      const codeField = document.querySelector('#modalBody [data-platform-scope-code^="account"]');
      if (!codeField) return;
      const prefix = codeField.dataset.platformScopeCode;
      const accountScope = readPlatformScope(prefix);
      const roleNames = checkedRoleNames();
      const merged = platformRoleMergedScope(roleNames);
      const effective = platformEffectiveScope(roleNames, accountScope);
      const summary = document.getElementById(`${prefix}EffectiveScope`);
      const access = platformUserDataAccess(roleNames);
      if (summary) summary.innerHTML = `<div><span>账号范围</span><strong>${platformScopeSummary(accountScope.scopeCode, accountScope.tenantIds)}</strong></div><div><span>角色合并范围</span><strong>${merged.scopeCode === "empty" ? "无启用角色范围" : platformScopeSummary(merged.scopeCode, merged.tenantIds)}</strong></div><div><span>最终有效范围</span><strong>${effective.scopeCode === "empty" ? "无有效数据范围" : platformScopeSummary(effective.scopeCode, effective.tenantIds)}</strong></div><div><span>完整敏感资料</span><strong>${access.sensitive ? "允许（仍受当前页面、最终范围和 2FA 限制）" : "不允许，页面与导出保持脱敏"}</strong></div><div><span>导出动作</span><strong>${access.exportActionCount ? `${access.exportActionCount} 项页面导出动作` : "无"}</strong></div>`;
    }

    function auditStrip(action, object, result = "待提交") {
      return `
        <div class="audit-strip">
          <div><span>操作人</span><strong>Jeff / 103.18.42.21</strong></div>
          <div><span>操作对象</span><strong>${object}</strong></div>
          <div><span>审计结果</span><strong>${action} / ${result}</strong></div>
        </div>`;
    }

    function roleChoiceCards(selectedRoles = []) {
      return roles.filter(role => (role.id !== "legacy" || selectedRoles.includes(role.name)) && (role.status === "启用" || selectedRoles.includes(role.name))).map(role => `
        <label class="choice-card">
          <input type="checkbox" data-role-name="${role.name}" data-role-status="${role.status}" ${selectedRoles.includes(role.name) ? "checked" : ""}>
          <span>
            <strong>${role.name}</strong><br>
            <small>${role.status === "停用" ? "已绑定停用角色，可保留或移除，当前不贡献权限" : "启用，可参与权限合并"}</small>
          </span>
        </label>
      `).join("");
    }

    function renderAccountCreateForm() {
      return `

    function accountModalConfig(payload) {
      const parts = String(payload || "").split(":");
      if (payload === "account:create") {
        return { title: "新增平台账号", body: renderAccountCreateForm(), className: "account-modal", confirmText: "创建账号", toast: "平台账号已创建，初始密码发送方式已记录。", auditAction: "新增平台账号" };
      }
      if (parts[0] === "account" && parts[1] === "edit") {
        const account = accountById(parts[2]);
        return { title: `编辑平台账号：${account.name}`, body: renderAccountEditForm(account), className: "account-modal", confirmText: "保存", toast: `${account.name} 账号资料已保存。`, auditAction: `编辑账号 ${account.login}` };
      }
      if (parts[0] === "account" && parts[1] === "reset-password") {
        const account = accountById(parts[2]);
        return { title: `重置密码：${account.name}`, body: renderAccountResetPasswordForm(account), className: "account-modal", confirmText: "确认重置密码", confirmClass: "warning", toast: `${account.name} 的一次性密码已生成，24 小时有效。`, auditAction: `重置密码 ${account.login}` };
      }
      if (parts[0] === "account" && parts[1] === "reset-2fa") {
        const account = accountById(parts[2]);
        return { title: `重置 2FA：${account.name}`, body: renderAccountReset2FAForm(account), className: "account-modal", confirmText: "确认重置 2FA", confirmClass: "warning", toast: `${account.name} 的 2FA 已提交重置。`, auditAction: `重置 2FA ${account.login}` };
      }
      if (parts[0] === "account" && parts[1] === "security") {
        const account = accountById(parts[2]);
        return { title: `账号操作：${account.name}`, body: renderAccountSecurityForm(account), className: "account-modal", confirmText: "二次确认并执行", confirmClass: "warning", toast: `${account.name} 的账号状态已更新。`, auditAction: `账号安全操作 ${account.login}` };
      }
      if (parts[0] === "account" && parts[1] === "logout") {
        const account = accountById(parts[2]);
        return { title: `强制下线：${account.name}`, body: renderAccountLogoutForm(account), className: "account-modal", confirmText: "确认强制下线", confirmClass: "warning", toast: `${account.name} 的在线会话已提交下线。`, auditAction: `强制下线 ${account.login}` };
      }
      return null;
    }

                const visible = isPageGranted(grants, item.id);

                return `
                  <tr class="${visible ? "selected" : ""}">

    function ipv4ToInt(ip) {
      const parts = ip.split(".");
      if (parts.length !== 4 || !parts.every(part => /^\d{1,3}$/.test(part) && Number(part) >= 0 && Number(part) <= 255)) return null;
      return parts.reduce((total, part) => ((total << 8) | Number(part)) >>> 0, 0);
    }

    function validSecurityEntry(entry) {
      const [ip, prefixText] = entry.split("/");
      if (ipv4ToInt(ip) === null) return false;
      if (prefixText === undefined) return true;
      return /^\d{1,2}$/.test(prefixText) && Number(prefixText) >= 0 && Number(prefixText) <= 32;
    }

    function securityEntryIncludesIp(entry, currentIp) {
      if (!entry.includes("/")) return entry === currentIp;
      const [network, prefixText] = entry.split("/");
      const prefix = Number(prefixText);
      const networkValue = ipv4ToInt(network);
      const currentValue = ipv4ToInt(currentIp);
      const mask = prefix === 0 ? 0 : (0xffffffff << (32 - prefix)) >>> 0;
      return (networkValue & mask) === (currentValue & mask);
    }

    function validateSecuritySave() {
      const enabled = document.getElementById("securityToggle")?.value === "启用";
      const enabledEntries = state.security.entries.filter(entry => entry.enabled);
      if (enabled && enabledEntries.length === 0) {
        showToast("没有已启用规则，不能开启全局白名单");
        return;
      }
      if (enabled && !enabledEntries.some(entry => securityEntryIncludesIp(entry.value, state.security.currentIp))) {
        showToast(`当前登录 IP ${state.security.currentIp} 未命中，已阻断保存`);
        return;
      }
      if (enabled === state.security.enabled) {
        showToast("全局开关没有变化，无需重复保存");
        return;
      }
      openSecurityConfirm({ enabled });
    }

    function addSecurityEntry() {
      const valueInput = document.getElementById("securityEntryValue");
      const nameInput = document.getElementById("securityEntryName");
      const value = valueInput?.value.trim() || "";
      const name = nameInput?.value.trim() || "";
      if (!validSecurityEntry(value)) {
        showToast("请输入有效的完整 IPv4 或 CIDR");
        valueInput?.focus();
        return;
      }
      if (!name) {
        showToast("请填写规则用途说明");
        nameInput?.focus();
        return;
      }
      if (state.security.entries.some(entry => entry.value === value)) {
        showToast("该 IP 规则已存在，不能重复新增");
        valueInput?.focus();
        return;
      }
      const next = String(Math.max(0, ...state.security.entries.map(entry => Number(entry.id.replace(/\D/g, "")) || 0)) + 1).padStart(3, "0");
      state.security.entries.push({ id: `PIP-${next}`, value, name, enabled: true, updated: `${platformNow()} Jeff` });
      recordSystemChange("安全", value, "新增登录 IP 规则（立即启用）");
      render();
      showToast(`${value} 已新增并启用；全局白名单开启后参与登录校验`);
    }

      const entry = state.security.entries.find(item => item.id === entryId);

        return;

      if (entry.enabled && state.security.enabled && securityEntryIncludesIp(entry.value, state.security.currentIp)) {

        if (!otherCurrentMatches) {

    function parseFeeTiers(raw) {
      const rows = raw.split("\n").map(row => row.trim()).filter(Boolean).map((row, index) => {
        const match = row.match(/^(\d+(?:\.\d{1,2})?)\s*-\s*(\d+(?:\.\d{1,2})?|∞)\s*:\s*(.+)$/);
        if (!match) return { error: `第 ${index + 1} 行金额边界格式错误，请使用最多两位小数的“0-5000000:0.38%”。` };
        const start = Number(match[1]);
        const end = match[2] === "∞" ? Infinity : Number(match[2]);
        const rate = match[3].trim();
        const validRate = /^(?:\d+(?:\.\d+)?%|CNY\s+\d+(?:\.\d{1,2})(?:\s*\/\s*笔)?|\d+(?:\.\d+)?%\s*\+\s*CNY\s+\d+(?:\.\d{1,2}))$/.test(rate);
        if (!validRate) return { error: `第 ${index + 1} 行费率格式错误，可输入百分比、固定 CNY 金额或两者组合。` };
        if (!(end > start)) return { error: `第 ${index + 1} 行结束金额必须大于起始金额。` };
        return { start, end, rate };
      });
      const invalid = rows.find(row => row.error);
      if (invalid) return invalid;
      if (!rows.length) return { error: "至少填写一个订单金额阶梯。" };
      rows.sort((a, b) => a.start - b.start);
      if (rows[0].start !== 0) return { error: "第一个阶梯必须从 0 开始。" };
      for (let index = 0; index < rows.length - 1; index += 1) {
        if (rows[index].end !== rows[index + 1].start) return { error: "阶梯区间存在重叠或断档，已阻断保存。" };
      }
      if (rows.at(-1).end !== Infinity) return { error: "最后一个阶梯必须覆盖到 ∞，避免新订单没有可用费率。" };
      return { rows, range: "0 - ∞", rate: rows.map(row => row.rate.replace("CNY ", "CNY ")).join(" / ") };
    }

      const parsed = parseFeeTiers(tiersText || "");
      if (parsed.error) return showFeeError(parsed.error, "feeTiers");

        const refundPatterns = {
          "固定": /^CNY\s+\d+(?:\.\d{1,2})?$/,
          "百分比": /^\d+(?:\.\d+)?%$/,
          "组合": /^\d+(?:\.\d+)?%\s*\+\s*CNY\s+\d+(?:\.\d{1,2})?$/
        };
        if (!refundRate || !refundPatterns[refundChargeType]?.test(refundRate)) return showFeeError("请按所选方式填写独立退款费率，例如 CNY 5.00、0.20% 或 0.20% + CNY 2.00。", "feeRefundRate");

    }

    function currentFeeExportSecuritySnapshot() {
      const account = accounts.find(item => item.id === "jeff");
      const effectiveScope = account ? platformEffectiveScope(account.roles, { scopeCode: account.scopeCode, tenantIds: [...account.tenantIds] }) : { scopeCode: "platform.all_tenants", tenantIds: [] };
      return {
        permissionCode: "platform.fee_package.export",
        permissionVersion: Number(account?.permissionVersion || 1),
        dataScope: JSON.parse(JSON.stringify(effectiveScope)),
        sensitiveAccess: false,
        fieldPolicy: "套餐运营字段；不包含账号、银行资料或绝密字段",
        permanentlyExcluded: ["password", "one_time_password", "google_2fa", "secret", "token", "raw_evidence_file"]
      };
    }

    function feeExportSnapshotDigest(value) {
      const input = JSON.stringify(value);
      let hash = 2166136261;
      for (let index = 0; index < input.length; index += 1) {
        hash ^= input.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return `fnv1a32:${(hash >>> 0).toString(16).padStart(8, "0")}:${input.length}`;
    }

    function feeExportPermissionCovers(task) {
      if (state.platformPermissions[task?.permission || "platform.fee_package.export"] !== true) return false;
      const account = accounts.find(item => item.id === "jeff");
      const currentScope = account ? platformEffectiveScope(account.roles, { scopeCode: account.scopeCode, tenantIds: [...account.tenantIds] }) : { scopeCode: "empty", tenantIds: [] };
      const createdScope = task?.sourceScopeSnapshot || task?.securitySnapshot?.dataScope || { scopeCode: "platform.all_tenants", tenantIds: [] };
      if (currentScope.scopeCode === "platform.all_tenants") return true;
      if (createdScope.scopeCode !== currentScope.scopeCode) return false;
      return (createdScope.tenantIds || []).every(id => (currentScope.tenantIds || []).includes(id));
    }

    function visibleFeeExportTasks() {
      return feeExportTasks.filter(feeExportPermissionCovers);
    }

    function visibleFeeExportAudits() {
      const visibleIds = new Set(visibleFeeExportTasks().map(task => task.id));
      return feeExportAudits.filter(item => visibleIds.has(item.taskId));
    }

    function addFeeExportSecurityAudit(taskId, action) {
      feeExportSecurityAudits.unshift({
        id: `FESA-${String(feeExportSecurityAuditSequence++).padStart(5, "0")}`,
        taskId: String(taskId || ""), action, result: "拒绝", reason: "任务不存在或当前账号无权查看", time: formatPlatformDateTime(new Date())
      });
    }

    function feeExportRows(sourceScopeSnapshot) {
      const scope = sourceScopeSnapshot || { scopeCode: "platform.all_tenants", tenantIds: [] };
      const allowed = new Set((scope.tenantIds || []).map(String));
      const plans = scope.scopeCode === "platform.all_tenants"
        ? feePlans
        : scope.scopeCode === "platform.assigned_tenants"
          ? feePlans.filter(plan => plan.scopeKind === "platform_global" || (plan.tenantIds || []).some(id => allowed.has(String(id))))
          : [];
      return plans.map(plan => ({
        id: plan.id, name: plan.name, direction: plan.direction, chargeType: plan.chargeType, rate: plan.rate,
        status: plan.status, version: plan.version,
        refs: scope.scopeCode === "platform.all_tenants" ? plan.refs : (plan.tenantIds || []).filter(id => allowed.has(String(id))).length,
        updated: plan.updated
      }));
    }

    function createFeeExportTask(sourceTask = null) {
      if (!sourceTask && !document.getElementById("feeExportConfirmed")?.checked) {
        showFeeExportError("请先确认当前导出范围与文件使用规则。");
        document.getElementById("feeExportConfirmed")?.focus();
        return null;
      }
      const permission = sourceTask?.permission || state.pendingFeeExport?.permission;
      if (!permission || state.platformPermissions[permission] !== true) {
        if (!sourceTask) showFeeExportError("当前账号已无 platform.fee_package.export 权限，未创建导出任务、文件或成功审计。请按最新权限重新发起。");
        if (sourceTask) addFeeExportSecurityAudit(sourceTask.id, "重试导出任务");
        return null;
      }
      const createdDate = new Date();
      const createdAt = formatPlatformDateTime(createdDate);
      const expiresAt = formatPlatformDateTime(new Date(createdDate.getTime() + 24 * 60 * 60 * 1000));
      const id = `EXP-FEE-${createdAt.slice(0, 10).replaceAll("-", "")}-${String(feeExportTasks.length + 1).padStart(4, "0")}`;
      const normalizedFilterSnapshot = sourceTask
        ? JSON.parse(JSON.stringify(sourceTask.normalizedFilterSnapshot))
        : { page: "套餐费率", filters: {}, scope: state.pendingFeeExport.scope };
      const securitySnapshot = currentFeeExportSecuritySnapshot();
      const sourceScopeSnapshot = sourceTask
        ? JSON.parse(JSON.stringify(sourceTask.sourceScopeSnapshot || sourceTask.securitySnapshot.dataScope))
        : JSON.parse(JSON.stringify(securitySnapshot.dataScope));
      const sourceSensitiveAccessRequired = sourceTask
        ? Boolean(sourceTask.sourceSensitiveAccessRequired ?? sourceTask.securitySnapshot.sensitiveAccess)
        : securitySnapshot.sensitiveAccess === true;
      const rowSnapshot = sourceTask
        ? JSON.parse(JSON.stringify(sourceTask.fileDefinitionSnapshot.rowSnapshot))
        : feeExportRows(sourceScopeSnapshot);
      const fieldSnapshot = sourceTask
        ? JSON.parse(JSON.stringify(sourceTask.fileDefinitionSnapshot.fieldSnapshot))
        : ["套餐编号", "套餐名称", "币种", "方向", "计费方式", "费率摘要", "状态", "版本", "引用租户数", "最近生效"];
      const redactionResult = sourceTask?.fileDefinitionSnapshot.redactionResult || securitySnapshot.fieldPolicy;
      const watermark = `汇盛支付平台端控制台 / Jeff / ${createdAt} UTC+8`;
      const format = String(sourceTask?.fileDefinitionSnapshot.format || "CSV").toUpperCase();
      const contentDigest = feeExportSnapshotDigest({ fieldSnapshot, rowSnapshot, redactionResult });
      const fileDefinitionSnapshot = {
        page: "套餐费率",
        normalizedFilterSnapshot: JSON.parse(JSON.stringify(normalizedFilterSnapshot)),
        cutoffAt: createdAt,
        fieldSnapshot,
        redactionResult,
        rowRangeSnapshot: { mode: "created_snapshot", rowCount: rowSnapshot.length },
        rowSnapshot,
        watermark,
        format,
        contentDigest,
        permanentlyExcluded: [...securitySnapshot.permanentlyExcluded],
        ...(sourceTask ? { regeneratedFrom: sourceTask.id } : {})
      };
      const task = {
        id,
        permission,
        source: "套餐费率",
        scope: sourceTask?.scope || state.pendingFeeExport.scope,
        rowCount: rowSnapshot.length,
        createdAt,
        cutoffAt: createdAt,
        expiresAt,
        expiresAtMs: createdDate.getTime() + 24 * 60 * 60 * 1000,
        status: "已生成",
        downloadCount: 0,
        fileName: `平台套餐费率-${id}.csv`,
        normalizedFilterSnapshot,
        securitySnapshot,
        sourceScopeSnapshot,
        sourceSensitiveAccessRequired,
        fileDefinitionSnapshot,
        fileSnapshotDigest: feeExportSnapshotDigest(fileDefinitionSnapshot),
        csv: feeExportCsv(rowSnapshot, createdAt),
        ...(sourceTask ? { retryOf: sourceTask.id } : {})
      };
      feeExportTasks.unshift(task);
      feeExportAudits.unshift({ action: sourceTask ? "按原范围重试并生成新任务" : "生成导出任务", taskId: id, operator: "Jeff", time: createdAt, result: "成功" });
      state.pendingFeeExport = null;
      openFeeExportCenter();
      showToast(`${id} 已生成；文件 24 小时有效，可在导出任务中重复下载。`);
      return task;
    }

    function downloadFeeExportTask(taskId, triggerBrowserDownload = true) {
      const task = feeExportTasks.find(item => item.id === taskId);
      if (!task || !feeExportPermissionCovers(task)) {
        addFeeExportSecurityAudit(taskId, "下载导出文件");
        showToast("当前无权查看或操作该导出任务");
        return false;
      }
      const now = new Date();
      if (now.getTime() >= task.expiresAtMs) {
        task.status = "已失效";
        feeExportAudits.unshift({ action: "下载导出文件", taskId: task.id, operator: "Jeff", time: formatPlatformDateTime(now), result: "拒绝：文件已失效" });
        showToast("文件已超过 24 小时有效期，请重新创建导出任务。");
        openFeeExportCenter();
        return false;
      }
      if (triggerBrowserDownload) {
        const url = URL.createObjectURL(new Blob([task.csv], { type: "text/csv;charset=utf-8" }));
        const link = document.createElement("a");
        link.href = url;
        link.download = task.fileName;
        link.click();
        URL.revokeObjectURL(url);
      }
      task.downloadCount += 1;
      feeExportAudits.unshift({ action: "下载导出文件", taskId: task.id, operator: "Jeff", time: formatPlatformDateTime(now), result: "成功" });
      openFeeExportCenter();
      showToast(`${task.id} 已下载 ${task.downloadCount} 次；本次下载已写永久审计。`);
      return true;
    }

    function retryFeeExportTask(taskId) {
      const oldTask = feeExportTasks.find(item => item.id === taskId);
      if (!oldTask || !feeExportPermissionCovers(oldTask)) {
        addFeeExportSecurityAudit(taskId, "重试导出任务");
        showToast("当前无权查看或操作该导出任务");
        return null;
      }
      if (!["生成失败", "已失效"].includes(oldTask.status)) {
        feeExportAudits.unshift({ action: "重试导出任务", taskId: oldTask.id, operator: "Jeff", time: formatPlatformDateTime(new Date()), result: `拒绝：任务状态 ${oldTask.status} 不允许重试` });
        return null;
      }
      return createFeeExportTask(oldTask);
    }

        openFeeForm();
        return;

        openFeeExportConfirm();
        return;

        openFeeExportCenter();
        return;
      }
      if (action === "modal") {

      }

        validateSecuritySave();

      }

        addSecurityEntry();
        return;
      }
      if (action === "security-entry-toggle") {
        toggleSecurityEntry(payload);

      }
      if (action === "menu-toggle") {
        if (state.menuCollapsed.has(payload)) state.menuCollapsed.delete(payload);
        else state.menuCollapsed.add(payload);

      }
      if (action === "menu-expand") {
        state.menuCollapsed.clear();
        render();

        state.menuFilters.status = document.getElementById("menuFilterStatus")?.value || "全部状态";

        render();
        showToast(`已按当前条件查询，显示 ${visibleMenuCatalog().length} 个菜单节点。`);

      }
      if (action === "menu-reset") {
        Object.assign(state.menuFilters, { keyword: "", type: "全部类型", status: "全部状态", visible: "全部显示状态" });
        state.menuCollapsed.clear();
        render();
        showToast("菜单筛选已重置。");
        return;
      }
      if (action === "menu-refresh") {
        state.menuRefreshedAt = platformNow();
        render();
        showToast(`菜单数据已重新载入，当前共 ${menuCatalog.length} 个节点。`);

      }
      if (action === "tenant-menu-toggle") {
        if (state.tenantMenuCollapsed.has(payload)) state.tenantMenuCollapsed.delete(payload);
        else state.tenantMenuCollapsed.add(payload);
        render();
        return;
      }
      if (action === "tenant-menu-expand") {
        state.tenantMenuCollapsed.clear();
        render();
        showToast("全部租户菜单节点已展开。");
        return;
      }
      if (action === "tenant-menu-query") {
        state.tenantMenuFilters.keyword = document.getElementById("tenantMenuKeyword")?.value || "";
        state.tenantMenuFilters.type = document.getElementById("tenantMenuFilterType")?.value || "全部类型";
        state.tenantMenuFilters.status = document.getElementById("tenantMenuFilterStatus")?.value || "全部发布状态";
        state.tenantMenuFilters.scope = document.getElementById("tenantMenuFilterScope")?.value || "全部适用范围";
        state.tenantMenuCollapsed.clear();
        render();
        showToast(`已按当前条件查询，显示 ${visibleTenantMenuCatalog().length} 个租户菜单节点。`);
        return;
      }
      if (action === "tenant-menu-reset") {
        Object.assign(state.tenantMenuFilters, { keyword: "", type: "全部类型", status: "全部发布状态", scope: "全部适用范围" });
        state.tenantMenuCollapsed.clear();
        render();
        showToast("租户菜单筛选已重置。");

      return document.getElementById(id)?.value.trim() || "";

      return `HsP!${String(account.sessionVersion || 1).padStart(2, "0")}K7Q9`;
