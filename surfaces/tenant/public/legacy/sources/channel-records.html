<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>汇盛支付租户端 · 通道流水记录</title>
<style>
:root{--primary:#3246d2;--primary-hover:#2939b7;--soft:#eef0ff;--bg:#f0f2f5;--surface:#fff;--text:#303133;--muted:#606266;--hint:#909399;--border:#e4e7ed;--control:#dcdfe6;--green:#67c23a;--red:#f56c6c;font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;font-size:13px}button,input,select{font:inherit}button{cursor:pointer}button,input,select{transition:background .16s,border-color .16s,color .16s}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px}[hidden]{display:none!important}.page{padding:16px;min-width:0}.card{padding:20px;background:var(--surface);border-radius:4px;min-width:0}.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}.control{height:32px;border:1px solid var(--control);border-radius:4px;padding:0 10px;background:var(--surface);color:var(--muted);min-width:0}.control:hover{border-color:#c0c4cc}.control:focus{border-color:var(--primary)}.control::placeholder{color:var(--hint)}.order-input,.select{width:150px}.select{padding-right:20px}.filter-actions{display:flex;gap:10px}.btn{height:32px;border:1px solid var(--control);border-radius:4px;padding:0 15px;color:var(--muted);background:var(--surface);white-space:nowrap}.btn:hover{color:var(--primary);border-color:var(--primary);background:var(--soft)}.btn.primary{background:var(--primary);border-color:var(--primary);color:white}.btn.primary:hover{background:var(--primary-hover)}button:disabled{cursor:not-allowed;opacity:.45}.range{height:32px;width:360px;display:flex;align-items:center;gap:6px;border:1px solid var(--control);border-radius:4px;padding:0 10px;color:var(--hint);position:relative}.range:focus-within{border-color:var(--primary)}.range-icon{width:14px;height:14px;flex-shrink:0}.range input{width:calc(50% - 24px);flex:1;min-width:0;border:0;outline:0!important;height:28px;text-align:center;font-size:12px;color:var(--muted);background:transparent}.range input::placeholder{color:var(--hint)}.range-separator{color:var(--text)}.range-clear{padding:0;border:0;background:transparent;color:var(--hint);font-size:17px}.currency-tabs{display:flex;gap:32px;border-bottom:2px solid var(--border);margin-bottom:16px}.currency-tab{background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-2px;padding:0 0 12px;height:38px;color:var(--text);font-size:14px}.currency-tab:hover{color:var(--primary)}.currency-tab[aria-selected=true]{border-bottom-color:var(--primary);color:var(--primary)}.table-wrap{overflow:auto;width:100%;border:1px solid #ebeef5}table{width:100%;min-width:1580px;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}th,td{height:40px;padding:0 10px;text-align:center;border-bottom:1px solid #ebeef5;border-right:1px solid #ebeef5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}th{color:var(--hint);background:var(--surface)}tbody{color:var(--muted)}tbody tr:nth-child(even){background:#fafafa}tbody tr:hover{background:#f5f7fa}tbody tr:last-child td{border-bottom:0}th:last-child,td:last-child{border-right:0}.increase{color:var(--green)}.decrease{color:var(--red)}.empty{height:150px!important;color:var(--hint)}.pagination{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:16px;min-height:32px;color:var(--muted);flex-wrap:wrap}.page-btn{width:30px;height:30px;padding:0;border:0;background:transparent;border-radius:2px;color:var(--text)}.page-btn:hover{color:var(--primary);background:var(--soft)}.page-btn[aria-current=page]{color:var(--primary);font-weight:600}.page-dots{display:inline-flex;align-items:center;justify-content:center;width:24px}.page-size{width:128px;height:32px;margin-left:10px}.jump{width:56px;text-align:center;padding:0 4px}.jump::-webkit-inner-spin-button{-webkit-appearance:none}.error{margin:0 0 12px;color:var(--red);line-height:20px}.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);padding:10px 20px;max-width:90%;background:#f0f9eb;border:1px solid #e1f3d8;color:#529b2e;border-radius:4px;box-shadow:0 3px 10px #0001;z-index:40}.date-popover{position:fixed;width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;border:1px solid var(--border);border-radius:4px;background:white;box-shadow:0 3px 16px #0002;z-index:30}.date-entry{display:flex;gap:14px;padding:12px;border-bottom:1px solid var(--border)}.date-entry input{width:50%;height:30px;font-size:12px}.calendar-pair{display:grid;grid-template-columns:1fr 1fr}.calendar{padding:12px 16px}.calendar:first-child{border-right:1px solid var(--border)}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.calendar-head button{border:0;background:transparent;color:var(--hint);font-size:18px;padding:2px 6px}.calendar-head strong{font-size:14px;font-weight:500}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.week{height:26px;line-height:26px;color:var(--muted)}.day{border:0;background:transparent;color:var(--muted);border-radius:50%;width:28px;height:28px;margin:1px auto;font-size:12px}.day:hover{color:var(--primary);background:var(--soft)}.day.outside{color:#c0c4cc}.day.selected{background:var(--primary);color:white}.day.between{border-radius:0;background:var(--soft)}.date-footer{padding:10px 12px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}.date-footer .btn{height:28px;padding:0 12px;font-size:12px}@media(max-width:660px){.page{padding:12px}.card{padding:14px}.order-input,.select{flex:1 1 140px;width:auto}.range{width:100%;flex-basis:100%}.filter-actions{margin-left:auto}.calendar-pair{grid-template-columns:1fr}.calendar:last-child{display:none}.date-entry{flex-direction:column;gap:8px}.date-entry input{width:100%}.pagination{gap:4px}}
</style>
</head>
<body>
<main class="page"><section class="card" aria-label="通道流水记录">
<form class="filters" id="recordFilters" autocomplete="off">
<input class="control order-input" id="platformOrder" aria-label="平台订单号" placeholder="平台订单号">
<input class="control order-input" id="merchantOrder" aria-label="商户订单号" placeholder="商户订单号">
<select class="control select" id="typeFilter" aria-label="流水类型"></select>
<div class="range" id="dateRange"><svg class="range-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg><input id="startTime" aria-label="变更起始时间" placeholder="变更起始时间" role="combobox" aria-controls="datePopover" aria-expanded="false"><span class="range-separator">至</span><input id="endTime" aria-label="变更结束时间" placeholder="变更结束时间" role="combobox" aria-controls="datePopover" aria-expanded="false"><button class="range-clear" id="clearRange" type="button" aria-label="清空日期" hidden>×</button></div>
<select class="control select" id="channelFilter" aria-label="通道"></select>
<div class="filter-actions"><button class="btn primary" type="submit">搜索</button><button class="btn" id="resetFilters" type="button">重置</button><button class="btn" id="exportRecords" type="button">导出</button></div>
</form>
<p class="error" id="filterError" role="alert" hidden></p>
<div class="currency-tabs" id="currencyTabs" role="tablist" aria-label="币种"></div>
<div role="tabpanel" id="currencyPanel"><div class="table-wrap" tabindex="0" role="region" aria-label="流水记录表格"><table id="recordTable"><colgroup id="recordColumns"></colgroup><thead id="recordHead"></thead><tbody id="recordRows"></tbody></table></div></div>
<nav class="pagination" aria-label="流水记录分页"><button class="page-btn" id="previousPage" type="button" aria-label="上一页">‹</button><span id="pageNumbers"></span><button class="page-btn" id="nextPage" type="button" aria-label="下一页">›</button><select class="control page-size" id="pageSize" aria-label="每页条数"><option value="10">10条/页</option><option value="20">20条/页</option><option value="50">50条/页</option><option value="100">100条/页</option></select><span>前往</span><input class="control jump" id="jumpPage" type="number" min="1" aria-label="前往页码" value="1"><span>页</span></nav>
</section></main>
<div class="date-popover" id="datePopover" role="dialog" aria-label="选择变更时间范围" hidden><div class="date-entry"><input class="control" id="draftStart" type="datetime-local" step="1" aria-label="选择起始时间"><input class="control" id="draftEnd" type="datetime-local" step="1" aria-label="选择结束时间"></div><div class="calendar-pair" id="calendars"></div><div class="date-footer"><button class="btn" id="clearDateDraft" type="button">清空</button><button class="btn primary" id="confirmDates" type="button">确定</button></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(() => {
 const model=window.HSChannelRecords,provider=window.HSProviderDemo,$=id=>document.getElementById(id);
 const requested=window.__UNIFIED_DEMO_HASH||location.hash.slice(1),route=model.configs[requested]?requested:'channel-pay-change',config=model.configs[route],tenantId=provider?.tenantId||'';
 const sourceRows=model.fixtures(route,tenantId),esc=model.escapeHtml;
 let applied={currency:'CNY'},page=1,size=10,matched=[],timer,calendarMonth=new Date(2026,9,1),pickStart=true,dateFocus;
 document.title='汇盛支付租户端 · '+config.title;document.body.dataset.record=route;
 const widths={id:60,channel:145,provider:145,platformOrder:200,merchantOrder:220,merchantNo:220,type:110,currency:90,before:130,change:140,after:150,at:200,remark:210};
 $('recordTable').style.minWidth=config.direction==='payout'?'1750px':'1640px';
 $('recordColumns').innerHTML=config.columns.map(([key])=>'<col style="width:'+widths[key]+'px">').join('');
 $('recordHead').innerHTML='<tr>'+config.columns.map(([,label])=>'<th scope="col">'+esc(label)+'</th>').join('')+'</tr>';
 $('typeFilter').innerHTML='<option value="">全部类型</option>'+config.types.map(v=>'<option>'+esc(v)+'</option>').join('');
 const channelChoices=model.channels[config.direction].filter(([id])=>!id.endsWith('USDT'));
 $('channelFilter').innerHTML='<option value="">全部通道</option>'+channelChoices.map(([id,name])=>'<option value="'+esc(id)+'">'+esc(name)+'</option>').join('');
 $('currencyTabs').innerHTML=config.currencies.map(currency=>'<button class="currency-tab" type="button" role="tab" id="tab-'+currency+'" aria-controls="currencyPanel" data-currency="'+currency+'">'+currency+'</button>').join('');
 function error(message){$('filterError').textContent=message;$('filterError').hidden=!message;}
 function scoped(){if(!tenantId||provider?.tenantId!==tenantId){error('租户已切换，请重新打开页面');return []}return model.query(sourceRows,route,tenantId,applied)}
 function render(){
  matched=scoped();const result=model.paginate(matched,page,size);page=result.page;
  $('recordRows').innerHTML=result.rows.length?result.rows.map(row=>'<tr>'+config.columns.map(([key])=>{const value=key==='at'?row.at.replaceAll('-','/'):(row[key]??''),tone=key==='change'?(value.startsWith('+')?'increase':value.startsWith('-')?'decrease':''):'';return '<td class="'+tone+'" title="'+esc(value)+'">'+esc(value)+'</td>'}).join('')+'</tr>').join(''):'<tr><td class="empty" colspan="'+config.columns.length+'">暂无数据</td></tr>';
  config.currencies.forEach(c=>{const button=$('tab-'+c),selected=c===applied.currency;button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1});$('currencyPanel').setAttribute('aria-labelledby','tab-'+applied.currency);
  const pages=result.pages,nums=new Set([1,pages]);for(let n=Math.max(1,page-2);n<=Math.min(pages,Math.max(6,page+2));n++)nums.add(n);
  let previous=0; $('pageNumbers').innerHTML=[...nums].sort((a,b)=>a-b).map(n=>{const dots=n>previous+1?'<span class="page-dots">…</span>':'';previous=n;return dots+'<button class="page-btn" type="button" data-page="'+n+'" aria-label="第 '+n+' 页"'+(n===page?' aria-current="page"':'')+'>'+n+'</button>'}).join('');
  $('previousPage').disabled=page===1;$('nextPage').disabled=page===pages;$('jumpPage').value=page;$('jumpPage').max=pages;
 }
 function apply(currency=applied.currency){try{const next={currency,platformOrder:$('platformOrder').value,merchantOrder:$('merchantOrder').value,type:$('typeFilter').value,channel:$('channelFilter').value,start:$('startTime').value,end:$('endTime').value};model.query(sourceRows,route,tenantId,next);applied=next;page=1;error('');render();return true}catch(e){error(e.message);return false}}
 $('recordFilters').addEventListener('submit',e=>{e.preventDefault();hideDates();apply()});
 $('resetFilters').addEventListener('click',()=>{$('recordFilters').reset();$('startTime').value='';$('endTime').value='';hideDates();syncClear();apply()});
 $('currencyTabs').addEventListener('click',e=>{const b=e.target.closest('[data-currency]');if(b){hideDates();apply(b.dataset.currency)}});
 $('currencyTabs').addEventListener('keydown',e=>{const i=config.currencies.indexOf(e.target.dataset.currency);if(i<0)return;let n=i;if(e.key==='ArrowRight')n=(i+1)%config.currencies.length;else if(e.key==='ArrowLeft')n=(i+config.currencies.length-1)%config.currencies.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=config.currencies.length-1;else return;e.preventDefault();if(apply(config.currencies[n]))$('tab-'+config.currencies[n]).focus()});
 $('previousPage').onclick=()=>{page--;render()};$('nextPage').onclick=()=>{page++;render()};$('pageNumbers').onclick=e=>{const b=e.target.closest('[data-page]');if(b){page=Number(b.dataset.page);render()}};$('pageSize').onchange=()=>{size=Number($('pageSize').value);page=1;render()};
 const jump=()=>{page=Number($('jumpPage').value);render()};$('jumpPage').onchange=jump;$('jumpPage').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();jump()}};
 function toast(message){clearTimeout(timer);$('toast').textContent=message;$('toast').hidden=false;timer=setTimeout(()=>{$('toast').hidden=true},2500)}
 $('exportRecords').onclick=()=>{const rows=scoped();if(!rows.length){toast('暂无可导出的数据');return}const blob=new Blob([model.csv(rows,route,tenantId)],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=config.title+'_'+applied.currency+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('导出成功')};
 const pad=n=>String(n).padStart(2,'0'),isoDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
 function syncClear(){$('clearRange').hidden=!($('startTime').value||$('endTime').value)}
 function drawCalendars(){
  const start=$('draftStart').value.slice(0,10),end=$('draftEnd').value.slice(0,10);$('confirmDates').disabled=!(start&&end);
  $('calendars').innerHTML=[0,1].map(offset=>{const month=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+offset,1),first=new Date(month);first.setDate(1-first.getDay());const days=Array.from({length:42},(_,i)=>{const d=new Date(first);d.setDate(d.getDate()+i);const date=isoDate(d),selected=date===start||date===end,between=start&&end&&date>start&&date<end;return '<button class="day'+(d.getMonth()!==month.getMonth()?' outside':'')+(selected?' selected':between?' between':'')+'" type="button" data-date="'+date+'" aria-label="'+date+'" aria-pressed="'+selected+'">'+d.getDate()+'</button>'}).join('');return '<div class="calendar"><div class="calendar-head"><button type="button" data-month="-1" aria-label="上个月">‹</button><strong>'+month.getFullYear()+' 年 '+(month.getMonth()+1)+' 月</strong><button type="button" data-month="1" aria-label="下个月">›</button></div><div class="calendar-grid">'+['日','一','二','三','四','五','六'].map(v=>'<span class="week">'+v+'</span>').join('')+days+'</div></div>'}).join('');
 }
 function showDates(e){dateFocus=e?.target;$('draftStart').value=$('startTime').value.replace(' ','T');$('draftEnd').value=$('endTime').value.replace(' ','T');const value=$('draftStart').value;if(value)calendarMonth=new Date(value.slice(0,7)+'-01T00:00:00');pickStart=true;drawCalendars();const rect=$('dateRange').getBoundingClientRect(),panel=$('datePopover');panel.hidden=false;panel.style.left=Math.max(12,Math.min(rect.left,innerWidth-panel.offsetWidth-12))+'px';panel.style.top=Math.max(12,Math.min(rect.bottom+8,innerHeight-panel.offsetHeight-12))+'px';['startTime','endTime'].forEach(id=>$(id).setAttribute('aria-expanded','true'))}
 function hideDates(){ $('datePopover').hidden=true;['startTime','endTime'].forEach(id=>$(id).setAttribute('aria-expanded','false')) }
 ['startTime','endTime'].forEach(id=>{$(id).addEventListener('click',showDates);$(id).addEventListener('input',syncClear);$(id).addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();showDates(e);$('draftStart').focus()}})});
 $('clearRange').onclick=()=>{$('startTime').value='';$('endTime').value='';syncClear();hideDates()};
 $('calendars').onclick=e=>{const month=e.target.closest('[data-month]'),day=e.target.closest('[data-date]');if(month){calendarMonth.setMonth(calendarMonth.getMonth()+Number(month.dataset.month));drawCalendars()}if(day){if(pickStart){$('draftStart').value=day.dataset.date+'T00:00:00';$('draftEnd').value='';pickStart=false}else{$('draftEnd').value=day.dataset.date+'T23:59:59';pickStart=true}drawCalendars()}};
 $('calendars').addEventListener('keydown',e=>{const day=e.target.closest('[data-date]'),offset={ArrowRight:1,ArrowLeft:-1,ArrowDown:7,ArrowUp:-7}[e.key];if(!day||!offset)return;e.preventDefault();const date=new Date(day.dataset.date+'T00:00:00');date.setDate(date.getDate()+offset);const monthIndex=date.getFullYear()*12+date.getMonth(),base=calendarMonth.getFullYear()*12+calendarMonth.getMonth();const extraMonth=matchMedia('(max-width:660px)').matches?0:1;if(monthIndex<base||monthIndex>base+extraMonth)calendarMonth=new Date(date.getFullYear(),date.getMonth(),1);drawCalendars();const targets=[...$('calendars').querySelectorAll('[data-date="'+isoDate(date)+'"]')];(targets.find(b=>!b.classList.contains('outside')&&b.offsetParent!==null)||targets.find(b=>b.offsetParent!==null))?.focus()});
 ['draftStart','draftEnd'].forEach(id=>$(id).addEventListener('input',drawCalendars));
 $('clearDateDraft').onclick=()=>{$('draftStart').value='';$('draftEnd').value='';$('startTime').value='';$('endTime').value='';syncClear();hideDates();dateFocus?.focus()};
 $('confirmDates').onclick=()=>{try{const start=model.normalizeTime($('draftStart').value),end=model.normalizeTime($('draftEnd').value,true);if(start&&end&&start>end)throw new Error('变更起始时间不能晚于结束时间');$('startTime').value=start;$('endTime').value=end;syncClear();error('');hideDates();dateFocus?.focus()}catch(e){error(e.message)}};
 document.addEventListener('pointerdown',e=>{if(!e.target.closest('#dateRange,#datePopover'))hideDates()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('datePopover').hidden){e.preventDefault();hideDates();dateFocus?.focus()}});window.addEventListener('resize',hideDates);window.addEventListener('scroll',hideDates);
 render();
})();
</script>
</body></html>
