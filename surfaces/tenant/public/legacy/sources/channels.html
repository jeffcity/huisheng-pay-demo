<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汇盛支付租户端 · 通道管理</title><style>
    :root {
      --font-ui: "Avenir Next", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: "DIN Alternate", "Avenir Next Condensed", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-mono: "SFMono-Regular", "Fira Code", Consolas, monospace;
      --color-primary: #145fe8;
      --color-primary-hover: #0f52cc;
      --color-primary-light: #e8f3ff;
      --color-bg-page: #f5f7fb;
      --color-bg-surface: #ffffff;
      --color-bg-subtle: #f7f8fa;
      --color-border: #e5e6eb;
      --color-border-strong: #c9cdd4;
      --color-text-primary: #1d2129;
      --color-text-secondary: #4e5969;
      --color-text-tertiary: #626d7b;
      --color-success: #087a55;
      --color-success-light: #e8fff3;
      --color-warning: #8a4b00;
      --color-warning-light: #fff7e8;
      --color-danger: #cf1f1f;
      --color-danger-light: #fff0ed;
      --color-info: #0e7490;
      --color-info-light: #e6fffb;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --shadow-modal: 0 18px 48px rgba(29, 33, 41, 0.18);
      --sidebar-width: 248px;
      --topbar-height: 56px;
      --spacing-control: 32px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--color-bg-page);
      color: var(--color-text-primary);
      font-family: var(--font-ui);
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      background: #111827;
      color: #d9e0ec;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .brand {
      min-height: 64px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #145fe8 0%, #0e7490 100%);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
    }

    .brand strong {
      display: block;
      color: #fff;
      font-size: 16px;
      line-height: 1.3;
    }

    .brand span {
      display: block;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 2px;
    }

    .nav {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .nav-title {
      padding: 0 10px;
      color: #8b95a7;
      font-size: 12px;
      font-weight: 700;
      line-height: 24px;
    }

    .nav-button {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 0;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: 10px;
      color: #c9d1df;
      background: transparent;
      text-align: left;
      transition: background 0.16s ease, color 0.16s ease;
    }

    .nav-button:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
    }

    .nav-button.active {
      background: rgba(20, 95, 232, 0.24);
      color: #fff;
    }

    .nav-button i,
    .btn i,
    .icon-link i {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .workspace {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 15;
      height: var(--topbar-height);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--color-border);
      backdrop-filter: blur(10px);
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--color-text-tertiary);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .breadcrumbs strong {
      color: var(--color-text-secondary);
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .searchbox {
      width: 280px;
      height: 34px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-bg-subtle);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      color: var(--color-text-tertiary);
      font-size: 13px;
    }

    .searchbox input {
      min-width: 0;
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--color-text-primary);
    }

    .searchbox input::placeholder {
      color: var(--color-text-tertiary);
      opacity: 1;
    }

    .content {
      padding: 20px 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .page-head {
      min-height: 86px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 18px;
      padding: 18px 20px;
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
    }

    .page-title {
      margin: 0 0 6px;
      font-family: var(--font-display);
      font-size: 24px;
      line-height: 1.25;
      font-weight: 720;
      letter-spacing: 0;
    }

    .page-subtitle {
      margin: 0;
      color: var(--color-text-secondary);
      font-size: 13px;
      line-height: 1.6;
      max-width: 980px;
    }

    .data-freshness {
      margin: 6px 0 0;
      color: var(--color-text-tertiary);
      font-size: 12px;
      line-height: 1.5;
    }

    .page-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn[hidden] {
      display: none !important;
    }

    .content.channel-compact-mode {
      padding-top: 14px;
      gap: 10px;
    }

    .content.channel-compact-mode .page-head {
      min-height: 0;
      padding: 12px 16px;
      align-items: center;
    }

    .content.channel-compact-mode .page-title {
      margin-bottom: 3px;
      font-size: 21px;
    }

    .content.channel-compact-mode .page-subtitle {
      line-height: 1.45;
    }

    .content.channel-compact-mode .data-freshness {
      margin-top: 3px;
    }

    .content.channel-compact-mode .tabs {
      min-height: 44px;
      padding-block: 5px;
    }

    .content.channel-compact-mode .panel-head {
      min-height: 42px;
      padding-block: 9px;
    }

    .content.channel-compact-mode .channel-action-bar {
      min-height: 44px;
      padding: 6px 12px;
    }

    .content.channel-compact-mode .filters {
      padding: 8px 12px;
      gap: 8px;
    }

    .content.channel-compact-mode .table-pagination {
      min-height: 44px;
      padding: 6px 12px;
    }

    .btn {
      height: 32px;
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-md);
      background: #fff;
      color: var(--color-text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      white-space: nowrap;
      transition: border-color 0.16s ease, color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    }

    .btn:hover {
      border-color: var(--color-primary-hover);
      color: var(--color-primary);
    }

    .btn.primary {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }

    .btn.primary:hover {
      background: var(--color-primary-hover);
      color: #fff;
    }

    .btn.ghost {
      border-color: transparent;
      background: #f2f3f5;
      color: var(--color-text-secondary);
    }

    .btn.danger {
      border-color: #ffd4cc;
      background: #fff;
      color: var(--color-danger);
    }

    .btn:disabled,
    .btn:disabled:hover {
      cursor: not-allowed;
      border-color: var(--color-border);
      background: #f2f3f5;
      color: #9aa0aa;
      box-shadow: none;
    }

    .fact-receipt {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 14px;
      border: 1px solid #b7f4d5;
      border-radius: var(--radius-md);
      background: var(--color-success-light);
    }

    .fact-receipt.show {
      display: flex;
    }

    .fact-receipt-main {
      min-width: 0;
      display: grid;
      gap: 4px;
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.5;
    }

    .fact-receipt-title {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      color: var(--color-text-primary);
      font-size: 13px;
    }

    .fact-receipt-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex: 0 0 auto;
    }

    .modal-feedback {
      margin-bottom: 14px;
      padding: 10px 12px;
      border: 1px solid #ffd4cc;
      border-radius: var(--radius-md);
      background: var(--color-danger-light);
      color: var(--color-danger);
      font-size: 13px;
      line-height: 1.5;
    }

    .confirm-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: #fbfcfe;
      color: var(--color-text-secondary);
      font-size: 13px;
      line-height: 1.5;
    }

    .confirm-card input {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      flex: 0 0 auto;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      border-radius: 999px;
      padding: 0 8px;
      border: 1px solid transparent;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .pill.blue {
      color: var(--color-primary);
      background: var(--color-primary-light);
      border-color: #bedaff;
    }

    .pill.green {
      color: var(--color-success);
      background: var(--color-success-light);
      border-color: #b7f4d5;
    }

    .pill.orange {
      color: var(--color-warning);
      background: var(--color-warning-light);
      border-color: #ffe4ba;
    }

    .pill.red {
      color: var(--color-danger);
      background: var(--color-danger-light);
      border-color: #ffd4cc;
    }

    .pill.gray {
      color: var(--color-text-secondary);
      background: #f2f3f5;
      border-color: var(--color-border);
    }

    .pill.cyan {
      color: var(--color-info);
      background: var(--color-info-light);
      border-color: #a7f3d0;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 44px;
      padding: 5px;
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow-x: auto;
    }

    .tab {
      height: 32px;
      border: 0;
      border-radius: var(--radius-sm);
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: transparent;
      color: var(--color-text-secondary);
      font-size: 13px;
      white-space: nowrap;
      transition: background 0.16s ease, color 0.16s ease;
    }

    .tab:hover {
      background: var(--color-bg-subtle);
      color: var(--color-primary);
    }

    .tab.active {
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-weight: 700;
    }

    .workbench {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 14px;
      align-items: start;
    }

    .workbench.collection-table-mode,
    .workbench.payout-table-mode,
    .workbench.product-table-mode {
      grid-template-columns: minmax(0, 1fr);
    }

    .workbench.collection-table-mode .rail,
    .workbench.payout-table-mode .rail,
    .workbench.product-table-mode .rail {
      display: none;
    }

    .panel {
      min-width: 0;
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .panel-head {
      min-height: 48px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 15px;
      line-height: 1.35;
      font-weight: 720;
    }

    .panel-meta {
      color: var(--color-text-tertiary);
      font-size: 12px;
      white-space: nowrap;
    }

    .filters {
      padding: 12px 14px;
      border-bottom: 1px solid var(--color-border);
      display: grid;
      grid-template-columns: repeat(5, minmax(128px, 1fr)) auto;
      gap: 10px;
      align-items: end;
      background: #fbfcfe;
    }

    .filters.collection-mode {
      grid-template-columns: minmax(220px, 1fr) minmax(170px, 0.7fr) auto;
    }

    .filters.payout-mode {
      grid-template-columns: minmax(230px, 1.2fr) repeat(3, minmax(160px, 0.8fr)) auto auto;
    }

    .channel-action-bar {
      min-height: 52px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: #fff;
    }

    .channel-action-bar[hidden] {
      display: none !important;
    }

    .channel-action-bar .btn.warn {
      color: #8a4b00;
      border-color: #f0b44d;
      background: #fff7e8;
    }

    .channel-action-bar .btn.danger {
      color: var(--color-danger);
      border-color: #f3b5ad;
      background: var(--color-danger-light);
    }

    .vendor-summary {
      padding: 12px 14px;
      border-bottom: 1px solid var(--color-border);
      display: grid;
      grid-template-columns: minmax(150px, 0.55fr) minmax(260px, 1fr) minmax(420px, 1.8fr);
      gap: 10px;
      background: #f7f9fc;
    }

    .vendor-summary[hidden],
    .field[hidden] {
      display: none !important;
    }

    .summary-item {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: #fff;
      display: grid;
      gap: 3px;
    }

    .summary-item label {
      color: var(--color-text-tertiary);
      font-size: 12px;
      font-weight: 650;
    }

    .summary-item strong {
      font-family: var(--font-mono);
      font-size: 17px;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    .summary-wallet,
    .wallet-cell {
      display: grid;
      gap: 7px;
    }

    .summary-wallet-row,
    .wallet-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }

    .currency-tag {
      min-width: 46px;
      height: 23px;
      padding: 0 7px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .wallet-balance {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .wallet-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 3px 12px;
      color: var(--color-text-secondary);
      font-size: 11px;
      line-height: 1.45;
    }

    .wallet-metrics strong {
      color: var(--color-text);
      font-family: var(--font-mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .capability-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      max-width: 240px;
    }

    .field {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    .field label {
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.2;
      font-weight: 600;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-height: 32px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--color-text-primary);
      outline: 0;
      padding: 5px 9px;
      font-size: 13px;
    }

    .check-grid {
      min-height: 32px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .check-line {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--color-text-secondary);
      cursor: pointer;
    }

    .check-line input {
      width: 16px;
      height: 16px;
      accent-color: var(--color-primary);
    }

    .field textarea {
      min-height: 74px;
      resize: vertical;
      line-height: 1.5;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--color-primary-hover);
      box-shadow: 0 0 0 3px rgba(20, 95, 232, 0.1);
    }

    .table-wrap {
      overflow: auto;
      min-height: 404px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 980px;
    }

    table.channel-wide {
      min-width: 2200px;
    }

    table.collection-wide {
      width: 2200px;
      min-width: 2200px;
      table-layout: fixed;
    }

    table.payout-wide {
      width: 2180px;
      min-width: 2180px;
      table-layout: fixed;
    }

    table.vendor-wide {
      min-width: 1280px;
    }

    th,
    td {
      height: 44px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--color-border);
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--color-bg-subtle);
      color: var(--color-text-secondary);
      font-size: 12px;
      font-weight: 700;
    }

    th:last-child,
    td:last-child {
      position: sticky;
      right: 0;
      z-index: 2;
      background: #fff;
      box-shadow: -1px 0 0 var(--color-border);
    }

    th:last-child {
      z-index: 3;
      background: var(--color-bg-subtle);
    }

    tbody tr {
      transition: background 0.16s ease;
    }

    tbody tr:hover {
      background: #f7fbff;
    }

    tbody tr.action-open {
      position: relative;
      z-index: 8;
    }

    tbody tr:hover td:last-child {
      background: #f7fbff;
    }

    tbody tr.action-open td:last-child {
      z-index: 30;
    }

    .collection-wide th,
    .collection-wide td {
      height: 40px;
      padding: 6px 8px;
    }

    .collection-wide th:last-child,
    .collection-wide td:last-child {
      position: static;
      box-shadow: none;
    }

    .collection-wide tbody tr {
      height: var(--collection-row-height, 60px);
    }

    .collection-wide tbody tr:hover td:last-child {
      background: transparent;
    }

    .payout-wide th,
    .payout-wide td {
      height: 40px;
      padding: 6px 8px;
    }

    .payout-wide tbody tr {
      height: 52px;
    }

    .payout-wide .payout-inline-actions {
      align-items: center;
      flex-wrap: wrap;
      gap: 2px 8px;
      white-space: normal;
      font-size: 11px;
    }

    .payout-wide .payout-inline-actions .cell-link,
    .payout-wide .cell-action > .cell-link {
      height: auto;
      padding: 0;
      border-radius: 0;
      background: transparent;
      font-weight: 600;
    }

    .payout-wide .payout-inline-actions .cell-link:hover,
    .payout-wide .cell-action > .cell-link:hover {
      background: transparent;
      text-decoration: underline;
    }

    .payout-wide .money-action-buttons .cell-link {
      height: 22px;
      padding-inline: 5px;
      color: #fff;
      border-color: #e7a126;
      background: #e7a126;
      font-size: 11px;
    }

    .payout-wide .money-action-buttons .cell-link:hover {
      background: #cf8811;
    }

    .payout-wide .money-action {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .payout-wide .cell-action {
      gap: 4px;
    }

    .payout-wide .cell-action > .cell-link i,
    .payout-wide .row-actions .icon-link i {
      display: none;
    }

    .payout-wide .row-actions {
      gap: 1px;
    }

    .payout-wide .row-actions .icon-link {
      height: 24px;
      padding-inline: 4px;
      font-size: 11px;
    }

    .payout-wide .collection-toggle {
      flex: 0 0 38px;
    }

    .collection-select {
      width: 16px;
      height: 16px;
      accent-color: var(--color-primary);
    }

    .collection-channel-cell {
      min-height: 44px;
      display: grid;
      align-content: center;
      gap: 3px;
      white-space: normal;
    }

    .collection-channel-name {
      color: var(--color-text-primary);
      font-weight: 650;
      line-height: 1.35;
    }

    .collection-row-links {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
    }

    .collection-row-links .cell-link,
    .collection-wide .money-action-buttons .cell-link,
    .collection-type-actions .cell-link {
      height: auto;
      padding: 0;
      border-radius: 0;
      background: transparent;
      font-weight: 600;
    }

    .collection-row-links .cell-link:hover,
    .collection-wide .money-action-buttons .cell-link:hover,
    .collection-type-actions .cell-link:hover {
      background: transparent;
      text-decoration: underline;
    }

    .collection-type-stack {
      display: grid;
      align-content: center;
      gap: 0;
      min-height: 30px;
    }

    .collection-type-line {
      min-height: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .collection-type-action-line {
      overflow: visible;
    }

    .collection-type-action-line .action-menu {
      position: fixed;
      right: auto;
      z-index: 100;
    }

    .collection-code-option { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .collection-code-option input { flex-shrink: 0; }
    .collection-code-count { color: var(--color-text-secondary); font-size: 13px; }
    .collection-code-delete-list { margin: 12px 0 0; padding-left: 22px; line-height: 1.8; }

    .collection-type-name {
      color: var(--color-text-tertiary);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .collection-type-actions {
      display: grid;
      align-content: center;
      gap: 0;
    }

    .collection-type-actions > span {
      min-height: 30px;
      display: flex;
      align-items: center;
    }

    .collection-toggle {
      position: relative;
      flex: 0 0 38px;
      min-width: 38px !important;
      width: 38px !important;
      min-height: 32px !important;
      height: 32px !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 999px;
      background: transparent;
      box-shadow: none;
    }

    .collection-toggle::before {
      content: "";
      position: absolute;
      top: 7px;
      left: 2px;
      width: 34px;
      height: 18px;
      border-radius: 999px;
      background: #c7ced8;
      transition: background .18s ease;
    }

    .collection-toggle::after {
      content: "";
      position: absolute;
      top: 9px;
      left: 4px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .22);
      transition: transform .18s ease;
    }

    .collection-toggle.on::before {
      background: #409eff;
    }

    .collection-toggle.on::after {
      transform: translateX(16px);
    }

    .collection-wide .money-action {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .collection-wide .money-action-buttons {
      gap: 6px;
    }

    .collection-wide .money-action-buttons .cell-link,
    .collection-wide .collection-type-actions .cell-link {
      font-size: 11px;
    }

    .table-pagination {
      min-height: 52px;
      padding: 9px 14px;
      border-top: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      color: var(--color-text-secondary);
      background: #fff;
      font-size: 12px;
    }

    .table-pagination[hidden],
    .filters[hidden] {
      display: none !important;
    }

    .page-chip {
      min-width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--color-primary);
      color: #fff;
      font-weight: 700;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .muted {
      color: var(--color-text-tertiary);
    }

    .row-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .icon-link {
      height: 28px;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--color-primary);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
      white-space: nowrap;
    }

    .icon-link:hover {
      background: var(--color-primary-light);
    }

    .cell-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
    }

    .cell-action .cell-value {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cell-link {
      height: 24px;
      border: 0;
      border-radius: var(--radius-sm);
      background: var(--color-primary-light);
      color: var(--color-primary);
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 0 6px;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
    }

    .cell-link:hover {
      background: #d8eaff;
    }

    .cell-link i {
      width: 14px;
      height: 14px;
    }

    .money-action {
      display: grid;
      grid-template-columns: auto;
      gap: 4px;
      min-width: 112px;
    }

    .money-action strong {
      color: var(--color-text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .money-action-buttons {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .money-action-buttons .cell-link {
      padding-inline: 5px;
    }

    .switch-button {
      min-width: 54px;
      height: 28px;
      padding: 0 9px;
      border: 1px solid;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      transition: color .18s ease, background .18s ease, border-color .18s ease;
    }

    .switch-button.on {
      color: var(--color-success);
      border-color: #a8e8c8;
      background: var(--color-success-light);
    }

    .switch-button.off {
      color: var(--color-text-tertiary);
      border-color: var(--color-border);
      background: #f3f4f6;
    }

    .payout-inline-actions {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .balance-cell {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 128px;
    }

    .balance-values {
      display: grid;
      gap: 2px;
      min-width: 58px;
    }

    .balance-line {
      display: flex;
      align-items: baseline;
      gap: 4px;
      line-height: 1.25;
      white-space: nowrap;
    }

    .balance-label {
      color: var(--color-text-tertiary);
      font-size: 11px;
    }

    .action-more {
      position: relative;
      display: inline-flex;
    }

    .action-more summary {
      height: 28px;
      border-radius: var(--radius-sm);
      color: var(--color-primary);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
      cursor: pointer;
      user-select: none;
      list-style: none;
    }

    .action-more summary::-webkit-details-marker {
      display: none;
    }

    .action-more summary:hover,
    .action-more[open] summary {
      background: var(--color-primary-light);
    }

    .action-menu {
      position: absolute;
      right: 0;
      top: 34px;
      z-index: 20;
      width: 156px;
      padding: 6px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: #fff;
      box-shadow: var(--shadow-md);
      display: grid;
      gap: 2px;
    }

    .action-menu .icon-link {
      width: 100%;
      justify-content: flex-start;
      color: var(--color-text-secondary);
    }

    .action-menu .icon-link:hover {
      color: var(--color-primary);
    }

    .rail {
      position: sticky;
      top: calc(var(--topbar-height) + 14px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .chain {
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .chain-node {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      min-height: 52px;
    }

    .node-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: var(--radius-md);
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-weight: 800;
      font-size: 12px;
    }

    .node-title {
      color: var(--color-text-tertiary);
      font-size: 12px;
      margin-bottom: 3px;
    }

    .node-value {
      color: var(--color-text-primary);
      font-size: 13px;
      line-height: 1.35;
      font-weight: 650;
      word-break: break-word;
    }

    .rule-list {
      padding: 12px 14px 14px;
      display: grid;
      gap: 10px;
    }

    .rule-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.55;
    }

    .rule-dot {
      width: 7px;
      height: 7px;
      margin-top: 6px;
      border-radius: 50%;
      background: var(--color-primary);
    }

    .health-bar {
      width: 118px;
      height: 8px;
      border-radius: 999px;
      background: #eef0f5;
      overflow: hidden;
    }

    .health-bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--color-success);
    }

    .health-bar.warning span {
      background: var(--color-warning);
    }

    .health-bar.danger span {
      background: var(--color-danger);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(17, 24, 39, 0.42);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(960px, 100%);
      max-height: calc(100vh - 56px);
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-modal);
      overflow: hidden;
    }

    .modal.sm {
      width: min(680px, 100%);
    }

    .modal.lg {
      width: min(1180px, 100%);
    }

    .modal-head {
      min-height: 56px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.35;
    }

    .modal-body {
      padding: 16px 18px;
      overflow: auto;
    }

    .modal-foot {
      min-height: 56px;
      padding: 12px 18px;
      border-top: 1px solid var(--color-border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      background: #fbfcfe;
    }

    .desc-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 18px;
    }

    .desc-item {
      min-width: 0;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 8px;
    }

    .desc-item label {
      display: block;
      color: var(--color-text-tertiary);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .desc-item span {
      display: block;
      color: var(--color-text-primary);
      font-size: 13px;
      line-height: 1.45;
      word-break: break-word;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 14px;
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    .blue-form {
      display: grid;
      gap: 14px;
      padding: 2px 0;
    }

    .blue-row {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
    }

    .blue-row label {
      color: var(--color-text-secondary);
      font-size: 14px;
      line-height: 1.35;
      font-weight: 600;
      text-align: right;
    }

    .blue-row.required label::before {
      content: "* ";
      color: var(--color-danger);
    }

    .blue-row input,
    .blue-row select,
    .blue-row textarea {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--color-text-primary);
      outline: 0;
      padding: 7px 12px;
      font-size: 14px;
    }

    .blue-row textarea {
      min-height: 88px;
      resize: vertical;
      line-height: 1.55;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .blue-row input[readonly],
    .blue-row input:disabled,
    .blue-row textarea[readonly] {
      background: #f4f7fb;
      color: var(--color-text-secondary);
    }

    .payout-development-form textarea { min-height: 58px; }
    .payout-development-form .radio-line input { width: 16px; }

    .blue-inline {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .blue-code {
      width: 108px;
      flex: 0 0 108px;
    }

    .radio-line {
      display: flex;
      gap: 28px;
      align-items: center;
      min-height: 38px;
    }

    .radio-line label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      color: var(--color-text-primary);
      font-size: 14px;
      font-weight: 600;
    }

    .radio-line input {
      width: 16px;
      min-height: 16px;
      accent-color: var(--color-primary);
    }

    .stepper {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) 54px;
      min-height: 38px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #fff;
    }

    .stepper button,
    .stepper input {
      border: 0;
      min-height: 38px;
      border-radius: 0;
      text-align: center;
      background: #fff;
    }

    .stepper button {
      color: var(--color-text-secondary);
      background: #f7f9fc;
      font-size: 18px;
    }

    .stepper button:hover {
      color: var(--color-primary);
      background: var(--color-primary-light);
    }

    .blue-section {
      position: relative;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 28px 22px 20px;
      margin-top: 8px;
    }

    .blue-section-title {
      position: absolute;
      top: -12px;
      left: 20px;
      padding: 0 10px;
      background: #fff;
      color: var(--color-text-primary);
      font-size: 16px;
      font-weight: 700;
    }

    .hint {
      margin-top: 6px;
      color: var(--color-text-tertiary);
      font-size: 13px;
      line-height: 1.45;
    }

    .test-split {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .test-block {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: #fbfcfe;
      overflow: hidden;
    }

    .test-block h3 {
      margin: 0;
      padding: 10px 12px;
      border-bottom: 1px solid var(--color-border);
      font-size: 13px;
      line-height: 1.35;
    }

    .test-block textarea {
      width: 100%;
      min-height: 150px;
      border: 0;
      border-radius: 0;
      background: #fff;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.55;
      resize: vertical;
      outline: 0;
    }

    .inline-error {
      display: none;
      margin-top: 8px;
      color: var(--color-danger);
      font-size: 12px;
    }

    .inline-error.show {
      display: block;
    }

    .timeline {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr);
      gap: 10px;
      color: var(--color-text-secondary);
      font-size: 13px;
      line-height: 1.5;
    }

    .timeline-item::before {
      content: "";
      width: 8px;
      height: 8px;
      margin-top: 6px;
      border-radius: 50%;
      background: var(--color-primary);
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 60;
      min-width: 280px;
      max-width: 420px;
      display: none;
      align-items: start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: #111827;
      color: #fff;
      box-shadow: 0 10px 28px rgba(17, 24, 39, 0.22);
      font-size: 13px;
      line-height: 1.5;
    }

    .toast.show {
      display: flex;
      animation: toast-in 0.18s ease;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 1280px) {
      .app {
        grid-template-columns: 72px minmax(0, 1fr);
      }

      .brand strong,
      .brand span,
      .nav-title,
      .nav-button span {
        display: none;
      }

      .brand {
        justify-content: center;
        padding: 12px;
      }

      .nav-button {
        justify-content: center;
      }

      .workbench {
        grid-template-columns: minmax(0, 1fr);
      }

      .rail {
        position: static;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 860px) {
      .topbar,
      .page-head {
        grid-template-columns: minmax(0, 1fr);
      }

      .top-actions,
      .page-actions {
        justify-content: flex-start;
      }

      .searchbox {
        width: 100%;
      }

      .filters,
      .vendor-summary,
      .form-grid,
      .desc-grid,
      .test-split,
      .rail {
        grid-template-columns: minmax(0, 1fr);
      }

      .blue-row {
        grid-template-columns: minmax(0, 1fr);
        gap: 6px;
      }

      .blue-row label {
        text-align: left;
      }

      .content {
        padding: 14px;
      }

      .fact-receipt {
        align-items: stretch;
        flex-direction: column;
      }

      .fact-receipt-actions .btn {
        flex: 1 1 140px;
      }
    }

    @media (max-width: 720px) {
      .app { display: block; }
      .topbar { height: auto; min-height: 56px; padding: 10px 14px; }
      .sidebar {
        position: sticky;
        top: 0;
        z-index: 30;
        height: auto;
        overflow-x: auto;
      }
      .brand { min-height: 54px; justify-content: flex-start; padding: 10px 14px; }
      .brand strong, .brand span { display: block; }
      .nav { padding: 8px 12px 12px; }
      .nav > div { display: flex; gap: 8px; width: max-content; }
      .nav-title { display: none; }
      .nav-button { width: auto; min-width: max-content; min-height: 44px; }
      .nav-button span { display: inline; }
      .modal-backdrop { padding: 0; align-items: flex-end; }
      .modal { width: 100%; height: auto; max-height: 92vh; border-radius: 16px 16px 0 0; }
      .modal-head { padding: 12px 16px; }
      .modal-body { padding: 14px 16px; }
      .modal-foot { position: sticky; bottom: 0; padding: 10px 16px; }
      .toast { left: 14px; right: 14px; bottom: 14px; min-width: 0; max-width: none; }
      th:last-child,
      td:last-child {
        position: static;
        box-shadow: none;
      }
    }
    /* 三端共用：键盘、动效与窄屏触控基线 */
    :focus-visible {
      outline: 3px solid #ffffff;
      box-shadow: 0 0 0 5px #145fe8;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    @media (max-width: 768px) {
      button,
      input:not([type="checkbox"]):not([type="radio"]),
      select,
      textarea,
      [role="button"] {
        min-height: 44px !important;
      }

      button,
      [role="button"] {
        min-width: 44px !important;
      }

      input,
      select,
      textarea {
        font-size: 16px !important;
      }

      .action-more summary {
        min-height: 44px;
      }
    }

    /* 三端统一视觉与响应式基线（2026-07-18） */
    :root {

</style></head><body><main class="tenant-content"><section class="page-head"><div><h1 id="pageTitle">已授权通道商</h1><p class="page-subtitle" id="pageSubtitle"></p></div><div class="page-actions"><button class="btn" data-action="refresh">刷新</button><button class="btn" data-action="export">导出</button><button class="btn primary" id="primaryAction" data-action="primary">新增通道</button></div></section><div class="tabs" id="tabs" role="tablist" aria-label="通道管理"></div><div id="providerBusinessTabs" class="provider-business-tabs" role="tablist" aria-label="通道商业务"></div><section id="providerPayoutOverview" class="tenant-panel" hidden></section><div class="tenant-filters"><span class="product-code-filter" id="productCodeFilter" hidden><label for="productCodeKeyword">产品编码</label><input id="productCodeKeyword" placeholder="产品编码"></span><label for="keyword">名称 / 编码</label><input id="keyword" placeholder="请输入名称或编码"><span class="payout-filter-extra" id="payoutFilters" hidden><label for="payoutTypeFilter">通道类型</label><select id="payoutTypeFilter"></select><label for="payoutProviderFilter">通道商</label><select id="payoutProviderFilter"></select></span><label for="statusFilter">状态</label><select id="statusFilter"></select><button class="btn primary" data-action="search">查询</button><button class="btn" data-action="reset">重置</button><button class="btn danger" id="bulkButton" data-action="bulkDelete" hidden>批量删除通道编码</button><span id="selectionCount" role="status"></span></div><div class="collection-toolbar" id="collectionToolbar" hidden><button class="btn primary" data-action="primary">新增通道</button><button class="btn" data-action="batchEnable">全部开启</button><button class="btn" data-action="batchDisable">全部关闭</button><button class="btn" data-action="batchSettlement">一键结算</button></div><div class="collection-toolbar" id="productToolbar" hidden><button class="btn primary" data-action="primary">添加</button><button class="btn" data-action="productEnable">全部开启</button><button class="btn" data-action="productDisable">全部关闭</button></div><div class="collection-toolbar" id="payoutToolbar" hidden><button class="btn" data-action="payoutBulkDev">一键编辑配置</button><button class="btn" data-action="payoutBulkCallback">一键编辑回调</button><button class="btn primary" data-action="primary">添加代付通道</button><button class="btn" id="payoutTopButton" data-action="payoutTop">开启置顶</button></div><div class="tenant-page-table"><table id="dataTable"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div><div class="table-pagination"><p class="muted" id="recordCount" role="status"></p><div id="pagination"></div></div></main><div class="modal-backdrop" id="modalBackdrop" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle"></h2><button class="btn ghost" data-action="close">关闭</button></div><div class="modal-body" id="modalBody"></div><div class="modal-footer" id="modalFoot"></div></section></div><div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span></div><script>(() => {
 const model=window.HSProviderDemo, tenantId=model.tenantId, data=model.tenantData(tenantId);data.mappingConfigs||=new Map();
 const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const tabs=[['providers','已授权通道商'],['collectionChannels','代收通道管理'],['payoutChannels','代付通道管理'],['collectionProducts','代收产品管理'],['payoutProducts','代付产品管理']];
 let providerBusiness='代收',selectedProviders=new Set();data.payoutProviderConfigs||=new Map();
 let active=window.__UNIFIED_DEMO_HASH||'providers',selected=new Set(),selectedChannels=new Set(),selectedProducts=new Set(),currentRows=[],page=1,pageSize=50,context=null,returnFocus=null;
 if(!tabs.some(t=>t[0]===active))active='providers';if(active.endsWith('Products')||active==='payoutChannels')pageSize=10;
 const direction=()=>active.startsWith('payout')?'代付':'代收',isProduct=()=>active.endsWith('Products');
 const provider=id=>model.providers.find(p=>p.id===id),channel=id=>data.channels.find(c=>c.id===id),product=id=>data.products.find(p=>p.id===id);
 function requireBusiness(dir){if(model.tenantBusinessDirections(tenantId).includes(dir))return true;const message=`当前租户未获${dir}业务授权，不能配置`;if($('#modalFeedback'))error(message);toast(message);return false;}
 function requireChannel(id){const r=channel(id);if(r&&model.canConfigureChannel(tenantId,r.providerId,r.direction))return true;const message=`当前租户未获该通道商的${r?.direction||'对应'}配置许可`;if($('#modalFeedback'))error(message);toast(message);return false;}
 function configurationActionAllowed(a,id){if(a.startsWith('provider'))return providerActionAllowed(a,id);if(['close','refresh','search','reset','export','pagePrev','pageNext','payoutTop','payoutTypeSearch','payoutMerchantSearch','bindingSearch','merchantSearch'].includes(a))return true;if(context?.kind==='deleteCodes'&&!context.targets.every(t=>requireChannel(t.channelId)))return false;const r=channel(id)||channel(context?.id);if(r&&!requireChannel(r.id))return false;if(context?.ids&&!context.ids.every(cid=>context.kind==='productBatch'?requireBusiness(product(cid)?.direction):requireChannel(cid)))return false;const p=product(id)||product(context?.id);return requireBusiness(p?.direction||context?.direction||r?.direction||direction());}

 const permitted=new Set(['tenant.channel.manage','tenant.channel.config.manage','tenant.channel.product.manage','tenant.channel.export']);
 const permission=a=>['connection','saveConnection','test','runTest','mapping','saveMapping','mapSection','mapAdd','mapRemove','payoutDev','savePayoutDev','payoutBulkDev','payoutBulkCallback','savePayoutBulk','payoutTest','runPayoutTest'].includes(a)?'tenant.channel.config.manage':['product','saveProduct','toggleProduct','deleteProduct','saveReplicaProduct','bindCodes','bindingSearch','bindAllCodes','unbindAllCodes','saveBindingEdit','bindMerchants','merchantSearch','bindAllMerchants','unbindAllMerchants','merchantBulkRate','saveMerchantRate','productEnable','productDisable','confirmProductBatch'].includes(a)?'tenant.channel.product.manage':a==='export'?'tenant.channel.export':'tenant.channel.manage';
 function toast(text){$('#toastText').textContent=text;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2600);}
 function button(action,label,id='',extra=''){return `<button class="icon-link" data-action="${action}" data-id="${esc(id)}" ${extra}>${label}</button>`;}
 function badge(value){return `<span class="pill ${['开启','已授权','已接入'].includes(value)?'green':'gray'}">${esc(value)}</span>`;}
 function field(id,label,value='',type='text',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`;}
 function select(id,label,options){return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${options}</select></div>`;}
 function option(value,label,checked){return `<option value="${esc(value)}" ${checked?'selected':''}>${esc(label)}</option>`;}
 function modal(title,body,action='save',label='保存'){
  $('#modalBackdrop').classList.remove('mapping-modal','collection-code-modal','payout-edit-modal');returnFocus=document.activeElement;$('#modalTitle').textContent=title;$('#modalBody').innerHTML=`<div id="modalFeedback" class="modal-feedback" role="alert" hidden></div>${body}`;
  $('#modalFoot').innerHTML=`<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="${action}">${label}</button>`;
  $('.tenant-content').inert=true;$('#modalBackdrop').classList.add('show');$('#modalBackdrop').setAttribute('aria-hidden','false');$('#modalBody input, #modalBody select, #modalFoot button')?.focus();
 }
 function close(){ $('.tenant-content').inert=false;$('#modalBackdrop').classList.remove('show');$('#modalBackdrop').setAttribute('aria-hidden','true');context=null;render();returnFocus?.focus(); }
 function error(text){$('#modalFeedback').textContent=text;$('#modalFeedback').hidden=false;}
 function finish(text,object){model.log(text,object,tenantId);close();render();toast(text);}
 function list(){const q=$('#keyword').value.trim().toLowerCase(),status=$('#statusFilter').value;
  return (active==='providers'?model.grants.filter(g=>g.tenantId===tenantId&&model.grantDirections(tenantId,g.providerId).includes(providerBusiness)).map(g=>({...g,name:providerBusiness==='代付'?payoutProvider(g.providerId).name:provider(g.providerId)?.name||g.providerId})):isProduct()?data.products.filter(p=>p.direction===direction()):data.channels.filter(c=>c.direction===direction()))
   .filter(r=>(!q||[r.name,r.id,r.productNo,r.vendor,r.thirdCode,active==='payoutChannels'?data.connectionConfigs.get(r.id)?.merchantNo:'',...(r.collectionTypes||[]).map(c=>c.code)].join(' ').toLowerCase().includes(q))&&(!status||r.status===status)&&(active!=='payoutChannels'||((!$('#payoutProviderFilter').value||r.providerId===$('#payoutProviderFilter').value)&&(!$('#payoutTypeFilter').value||data.products.find(p=>p.id===$('#payoutTypeFilter').value)?.channelIds.includes(r.id))))&&(active!=='collectionProducts'||!$('#productCodeKeyword').value.trim()||r.productNo.toLowerCase().includes($('#productCodeKeyword').value.trim().toLowerCase())));
 }
 function render(){
  model.tenantData(tenantId);
  const providerView=active==='providers',payoutProviderView=providerView&&providerBusiness==='代付';
  $('#providerBusinessTabs').hidden=!providerView;$('#providerBusinessTabs').innerHTML=['代收','代付'].map(d=>`<button class="tab ${providerBusiness===d?'active':''}" role="tab" aria-selected="${providerBusiness===d}" data-provider-business="${d}">${d}</button>`).join('');$('#providerPayoutOverview').hidden=!payoutProviderView;$('.tenant-page-table').classList.toggle('provider-table',payoutProviderView);
  const allRows=list();if(active==='payoutChannels'&&payoutTop)allRows.sort((a,b)=>Number(b.status==='开启')-Number(a.status==='开启'));page=Math.min(page,Math.max(1,Math.ceil(allRows.length/pageSize)));const rows=allRows.slice((page-1)*pageSize,page*pageSize);currentRows=rows;selectedProducts=new Set([...selectedProducts].filter(id=>data.products.some(p=>p.id===id)));selectedChannels=new Set([...selectedChannels].filter(id=>data.channels.some(c=>c.id===id)));const visibleCodes=new Set(rows.flatMap(r=>(r.collectionTypes||[]).map(c=>c.id)));selected=new Set([...selected].filter(id=>visibleCodes.has(id)));
  $('#pageTitle').textContent=tabs.find(t=>t[0]===active)[1];$('#pageSubtitle').textContent=active==='providers'?'平台授权通道商；通道和产品由当前租户自行配置。':active==='payoutProducts'?'维护本租户代付类型，通道的主产品在代付通道管理中选择。':isProduct()?'维护本租户代收产品，自行绑定子通道和商户。':'选择已授权通道商，维护当前租户的通道与对接信息。';
  $('#tabs').innerHTML=tabs.map(([key,label])=>`<button class="tab ${key===active?'active':''}" role="tab" aria-selected="${key===active}" data-tab="${key}">${label}</button>`).join('');
  $('#primaryAction').hidden=['providers','collectionChannels','payoutChannels','collectionProducts'].includes(active);$('#collectionToolbar').hidden=active!=='collectionChannels';$('#payoutToolbar').hidden=active!=='payoutChannels';$('#payoutFilters').hidden=active!=='payoutChannels';$('.tenant-page-table').classList.toggle('payout-table',active==='payoutChannels');$('#payoutTopButton').textContent=payoutTop?'取消置顶':'开启置顶';$('#productToolbar').hidden=active!=='collectionProducts';$('.tenant-filters').hidden=active==='payoutProducts';$('#productCodeFilter').hidden=active!=='collectionProducts';$('.tenant-page-table').classList.toggle('product-table',isProduct());$('.tenant-page-table').classList.toggle('collection-table',active==='collectionChannels');document.querySelector('label[for=keyword]').textContent=active==='collectionChannels'?'通道名称':active==='collectionProducts'?'产品名称':'名称 / 编码';$('#keyword').placeholder=active==='payoutChannels'?'名称/商户号/编码模糊查询':active==='collectionChannels'?'请输入通道名称':active==='collectionProducts'?'产品名称':'请输入名称或编码';$('#primaryAction').textContent=active==='payoutProducts'?'添加类型':isProduct()?`新增${direction()}产品`:`新增${direction()}通道`;
  $('#bulkButton').hidden=active!=='collectionChannels';$('#bulkButton').disabled=!selected.size;$('#selectionCount').textContent=active==='collectionChannels'?`已选 ${selectedChannels.size} 个通道 / ${selected.size} 个编码`:active==='payoutChannels'?`已选 ${selectedChannels.size} 个通道`:'';
  $('#statusFilter').hidden=active==='providers';document.querySelector('label[for="statusFilter"]').hidden=active==='providers';
  const statuses=active==='providers'?[]:['开启','关闭'];const prev=$('#statusFilter').value;$('#statusFilter').innerHTML=option('','全部状态',!prev)+statuses.map(s=>option(s,s,prev===s)).join('');
  const typeFilter=$('#payoutTypeFilter').value,providerFilter=$('#payoutProviderFilter').value;$('#payoutTypeFilter').innerHTML=option('','全部通道类型',!typeFilter)+data.products.filter(p=>p.direction==='代付').map(p=>option(p.id,p.name,typeFilter===p.id)).join('');$('#payoutProviderFilter').innerHTML=option('','全部通道商',!providerFilter)+model.providers.map(p=>option(p.id,p.name,providerFilter===p.id)).join('');
  if(payoutProviderView)renderProviderSummary(allRows);
  let heads;
  if(payoutProviderView)heads=providerPayoutHeads;
  else if(active==='providers')heads=['通道商','通道商编号','授权业务','最近变更'];
  else if(active==='collectionProducts')heads=['<input type="checkbox" data-select-products aria-label="全选当前列表产品">','名称','产品编码','产品状态','今天成交额','绑定商户数','绑定通道数','操作'];else if(active==='payoutProducts')heads=['类型名称','类型编码','币种','产品类型','绑定商户数','绑定通道数','操作'];
  else if(direction()==='代收')heads=['<input type="checkbox" data-select-channels aria-label="全选当前列表通道">','通道名称','今日成功','余额','预付','剩余预付','USDT余额','USDT预付','USDT剩余预付','状态','<label><input type="checkbox" data-select-all aria-label="全选当前列表通道编码"> 对接编码</label>','今日成交','费率','收款规则','类型状态','操作'];
  else heads=payoutHeads;
  $('#tableHead').innerHTML='<tr>'+heads.map(h=>`<th>${h}</th>`).join('')+'</tr>';
  $('#tableBody').innerHTML=rows.map((r,idx)=>{
   if(payoutProviderView)return renderPayoutProviderRow(r);
   if(active==='providers')return `<tr><td><strong>${esc(r.name)}</strong></td><td>${esc(r.providerId)}</td><td>${model.grantDirections(tenantId,r.providerId).map(d=>`<span class="pill ${d==='代收'?'green':'blue'}">${d}</span>`).join(' ')||'未获业务许可'}</td><td>${esc(r.updatedAt)}</td></tr>`;
   if(isProduct())return renderProductRow(r);
   if(direction()==='代付')return renderPayoutRow(r,idx);
   return renderCollectionRow(r,idx);
  }).join('')||`<tr><td colspan="${heads.length}" class="muted">暂无符合条件的数据</td></tr>`;
  $('#pagination').innerHTML=active==='providers'&&!payoutProviderView?'':`<button class="btn" data-action="pagePrev" ${page===1?'disabled':''}>上一页</button><span> ${page} / ${Math.max(1,Math.ceil(allRows.length/pageSize))} </span><button class="btn" data-action="pageNext" ${page*pageSize>=allRows.length?'disabled':''}>下一页</button><select id="pageSize" aria-label="每页条数">${[10,20,50,100].map(n=>option(n,n+'条/页',pageSize===n)).join('')}</select>`;
  $('#recordCount').textContent=`共 ${allRows.length} 条`;$('#dataTable').style.minWidth=payoutProviderView?'2070px':active==='collectionChannels'?'1950px':active==='payoutChannels'?'3000px':'800px';
  document.querySelectorAll('[data-action]').forEach(b=>{if(['close','refresh','search','reset'].includes(b.dataset.action))return;b.hidden=b.hidden||!permitted.has(permission(b.dataset.action));});
 }

 const providerPayoutHeads=['<input type="checkbox" data-select-providers aria-label="全选当前列表代付通道商">','名称','编号','余额','剩余预付','总预付','剩余预付限额','剩余预付限制','通道状态','群组id','回调时间','未回调','接收回调','保证金','操作'];
 function payoutProvider(id){
  if(!data.payoutProviderConfigs.has(id)){const p=provider(id);data.payoutProviderConfigs.set(id,{balance:0,remainingPrepaid:0,totalPrepaid:0,remainingLimit:0,limitEnabled:false,status:'开启',botId:p?.botId||'',callbackTime:p?.callbackLimitMinutes||0,uncallbacked:0,receiveCallback:p?.receiveCallback!==false,deposit:p?.deposit||0});}
  const config=data.payoutProviderConfigs.get(id);config.name=provider(id)?.name||id;return config;
 }
 function providerActionAllowed(a,id){
  if(!['providerEdit','providerSave','providerToggle','providerConfirmToggle','providerMoney','providerRunMoney','providerResetMoney','providerSettle','providerSettleAll','providerConfirmSettle'].includes(a))return false;
  const ids=context?.kind?.startsWith('provider')?(context.ids||[context.id]):a==='providerSettleAll'?(selectedProviders.size?[...selectedProviders]:list().map(g=>g.providerId)):[id];
  if(active==='providers'&&providerBusiness==='代付'&&ids.length&&ids.every(pid=>model.canConfigureChannel(tenantId,pid,'代付')))return true;
  const message='当前租户未获该通道商的代付授权，不能操作';if($('#modalFeedback'))error(message);toast(message);return false;
 }
 function renderProviderSummary(rows){

 function savePayoutChannel(){const r=channel(context.id),name=$('#pcName').value.trim(),pid=$('#pcProvider').value,weight=Number($('#pcWeight').value),p=product($('#pcProduct').value),interfaceType=$('#pcInterface').value;
  if(!name)return error('请填写通道名称');if(data.channels.some(c=>c.id!==r?.id&&c.name===name))return error('当前租户已有同名通道');if(!model.canConfigureChannel(tenantId,pid,'代付'))return error('当前租户未获所选通道商的代付配置许可');if(!Number.isInteger(weight)||weight<1||weight>9)return error('权重须为1-9的整数');if(p&&p.direction!=='代付')return error('请选择代付类型');const limits=readPayoutLimit();if(!limits)return;const currency=p?.currency||(r?.asset||(interfaceType==='USDT'?'USDT':'CNY'));
  const target=r||{id:`TCH-${tenantId}-${Date.now()}`,tenantId,direction:'代付',version:0,collectionTypes:[],thirdCode:'',rate:'0',fee:'0.0000',balance:'0.00',usdtAmount:'0.00',limit:'1 - 10000',limitStatus:'关闭',success:'0%',callbackStatus:'接受',callbackTime:'0'};
  if(r&&!p){const previous=product(r.productId);if(previous)previous.channelIds=previous.channelIds.filter(cid=>cid!==r.id);}if(p&&!p.channelIds.includes(target.id))p.channelIds.push(target.id);
  Object.assign(target,{name,providerId:pid,vendor:provider(pid).name,interfaceType,asset:currency,productId:p?.id||'',weight:String(weight),tgGroup:$('#pcGroup').value.trim(),status:$('#pcStatus').value,modified:true,version:target.version+1});applyPayoutLimit(target,limits);if(!r)data.channels.push(target);finish('代付通道已保存',target.id);

 function validIpList(text){return !text||text.split(/[\s,]+/).filter(Boolean).every(ip=>{if(ip.includes(':')){try{return new URL('http://['+ip+']/').hostname.length>0;}catch{return false;}}const bits=ip.split('.');return bits.length===4&&bits.every(v=>/^\d{1,3}$/.test(v)&&Number(v)<=255);});}

 function readPayoutLimit(){const min=$('#plMin').value,max=$('#plMax').value,daily=$('#plDaily').value,time=$('#plCallbackTime').value,start=$('#plStart').value,end=$('#plEnd').value,fixed=$('#plFixed').value.trim(),excluded=$('#plExcluded').value.trim(),ips=$('#plIps').value.trim();if([min,max,daily,time].some(v=>v===''||!Number.isFinite(Number(v))||Number(v)<0)||Number(max)<=0||Number(max)<Number(min)||!Number.isInteger(Number(time)))return error('请填写有效金额范围、当天金额及整数回调时间');if(!/^\d{2}:\d{2}$/.test(start)||!/^\d{2}:\d{2}$/.test(end))return error('请选择有效交易时间');if(!amountList(fixed)||!amountList(excluded))return error('固定或排除金额须为用英文逗号分隔的正数');if(!validIpList(ips))return error('提交IP黑名单中有无效IP');return {config:{min,max,dailyAmount:daily,fixedAmounts:fixed,excludedAmounts:excluded,submitIpBlacklist:ips,start,end},limitStatus:$('#plEnabled').checked?'开启':'关闭',callbackTime:time,callbackStatus:$('#plCallbackStatus').value};}

 function openPayoutMoney(id,key){const r=channel(id);context={kind:'payoutMoney',id,key};modal('调额',`<p>${esc(r.name)} · ${key==='usdtAmount'?'USDT金额':'CNY余额'} · 当前 ${fmt(r[key])}</p><div class="form-grid">${select('paDirection','操作',option('increase','增加金额',true)+option('decrease','减少金额',false))}${field('paAmount','金额','','number','min="0.01" step="0.01" placeholder="请输入金额"')}${field('paRemark','备注','','text','placeholder="请输入备注"')}${field('paGoogle','谷歌验证','','text','inputmode="numeric" maxlength="6" placeholder="演示验证码：123456"')}</div><p class="muted">此处只生成本地调额预览，不改变余额。演示验证码为123456。</p><div id="payoutMoneyResult" role="status"></div>`,'runPayoutMoney','立即提交');$('#modalFoot').insertAdjacentHTML('afterbegin','<button class="btn" data-action="resetPayoutMoney">重置</button>');}
 function runPayoutMoney(){if(!requireChannel(context?.id))return;const amount=Number($('#paAmount').value),r=channel(context.id),before=money(r[context.key]),after=before+($('#paDirection').value==='increase'?amount:-amount);if(!Number.isFinite(amount)||amount<=0)return error('请输入大于0的金额');if(!$('#paRemark').value.trim())return error('请填写备注');if($('#paGoogle').value!=='123456')return error('请输入演示验证码123456');if(after<0)return error('减少金额不能大于当前余额');$('#modalFeedback').hidden=true;$('#payoutMoneyResult').textContent=`演示预览：${fmt(before)} → ${fmt(after)}；当前余额未改变。`;model.log('代付通道调额演示',r.id,tenantId);}
 function openPayoutTest(id){const r=channel(id),p=payoutMain(r);context={kind:'payoutTest',id};modal('代付测试',`<div class="form-grid">${field('pxName','通道名称',r.name,'text','readonly')}${field('pxType','类型',p?.name||'未选择','text','readonly')}${field('pxAmount','支付金额','','number','min="0.01" step="0.01"')}${field('pxBank','银行名称','','text','placeholder="请输入银行名称"')}${field('pxBranch','支行名称','','text','placeholder="请输入支行名称"')}${field('pxBankCode','支行银联号','','text','placeholder="请输入支行银联号"')}${field('pxAccount','收款人号码','','text','placeholder="请输入演示卡号、账户或地址"')}${field('pxRecipient','收款人姓名','','text','placeholder="请输入演示姓名"')}${textarea('pxExtra','扩展参数','','placeholder="请输入JSON扩展参数"')}${field('pxPlatformOrder','平台订单号','','text','readonly')}${field('pxMerchantOrder','商户订单号','','text','readonly')}${textarea('pxRequest','下单参数','','readonly')}${textarea('pxResponse','返回参数','','readonly')}</div><p class="muted">仅模拟请求和响应，请使用演示收款信息；不会调用真实支付接口。</p>`,'runPayoutTest','发起支付');$('#modalBackdrop').classList.add('mapping-modal');}
 function runPayoutTest(){if(!requireChannel(context?.id))return;const r=channel(context.id),n=Number($('#pxAmount').value);if(r.status!=='开启')return error('通道已关闭，不能测试');if(!payoutMain(r))return error('请先选择通道主类型');if(!Number.isFinite(n)||n<=0)return error('请输入有效支付金额');if(!$('#pxAccount').value.trim()||!$('#pxRecipient').value.trim())return error('请填写演示收款人号码和姓名');if(r.limitStatus==='开启'){const c=payoutLimitFor(r);if(n<Number(c.min)||n>Number(c.max))return error('支付金额超出单笔范围');if(c.fixedAmounts&&!c.fixedAmounts.split(',').map(Number).includes(n))return error('支付金额不在固定金额列表中');if(c.excludedAmounts&&c.excludedAmounts.split(',').map(Number).includes(n))return error('支付金额位于排除金额列表');}let extra={};if($('#pxExtra').value.trim()){try{extra=JSON.parse($('#pxExtra').value);if(!extra||typeof extra!=='object'||Array.isArray(extra))throw 0;}catch{return error('扩展参数请输入JSON对象');}}const no='DEMO-PAYOUT-'+Date.now();$('#modalFeedback').hidden=true;$('#pxPlatformOrder').value=no;$('#pxMerchantOrder').value='DEMO-MERCHANT-'+Date.now();$('#pxRequest').value=JSON.stringify({channelCode:r.thirdCode,amount:n,currency:r.asset,bankName:$('#pxBank').value,account:'****'+$('#pxAccount').value.slice(-4),extra},null,2);$('#pxResponse').value=JSON.stringify({code:'DEMO_SUCCESS',message:'演示请求完成，未实际付款',platformOrderNo:no},null,2);model.log('代付测试演示',r.id,tenantId);}
 function openPayoutDelete(id){const r=channel(id);context={kind:'payoutDelete',id};modal('删除代付通道',`<p>删除【${esc(r.name)}】？本地通道的类型和商户绑定、对接与限额配置将一并移除，历史订单保留。</p>`,'confirmPayoutDelete','确认删除');}
 function confirmPayoutDelete(){if(!requireChannel(context?.id))return;const r=channel(context.id);if(!r)return error('通道已变化');for(const p of data.products)p.channelIds=p.channelIds.filter(id=>id!==r.id);data.connectionConfigs.delete(r.id);data.payoutLimits.delete(r.id);data.payoutMerchantBindings.delete(r.id);data.deletedChannelIds.add(r.id);data.channels.splice(data.channels.indexOf(r),1);selectedChannels.delete(r.id);finish('代付通道已删除',r.id);}
 function payoutAction(a,id,b){if(a==='payoutWeightStep'){const value=Number($('#pcWeight').value)||1;$('#pcWeight').value=String(Math.min(9,Math.max(1,value+Number(b.dataset.step))));}else if(a==='savePayoutChannel')savePayoutChannel();else if(a==='payoutTop'){payoutTop=!payoutTop;page=1;render();}else if(a==='payoutSetting')openPayoutSetting(id,b.dataset.key);else if(a==='savePayoutSetting')savePayoutSetting();else if(a==='payoutRate')openPayoutRate(id);else if(a==='savePayoutRate')savePayoutRate();else if(a==='payoutLimit')openPayoutLimit(id);else if(a==='savePayoutLimit')savePayoutLimit();else if(a==='payoutDev')openPayoutDev(id);else if(a==='savePayoutDev')savePayoutDev();else if(a==='payoutBulkDev'||a==='payoutBulkCallback')openPayoutBulk(a==='payoutBulkCallback');else if(a==='savePayoutBulk')savePayoutBulk();else if(a==='payoutToggle'){const r=channel(id),key=b.dataset.key;context={kind:'payoutToggle',id,key};modal('确认状态变更',`<p>${esc(r.name)} · ${({status:'状态',tgNotify:'TG通知',limitStatus:'限额状态',callbackStatus:'接受回调'})[key]}：${payoutFlag(r,key)?'关闭':'开启'}</p>`,'confirmPayoutToggle','确定');}else if(a==='confirmPayoutToggle'){const r=channel(context.id),key=context.key,on=!payoutFlag(r,key);r[key]=key==='tgNotify'?on:key==='callbackStatus'?(on?'接受':'拒绝'):(on?'开启':'关闭');r.modified=true;r.version++;finish('代付状态已更新',r.id);}else if(a==='payoutTypes')openPayoutTypes(id);else if(a==='payoutTypeSearch')renderPayoutTypes();else if(a==='payoutTypeBind'){setPayoutType(id,!product(id).channelIds.includes(context.id));renderPayoutTypes();}else if(a==='payoutTypeBindAll'||a==='payoutTypeUnbindAll'){for(const p of visiblePayoutTypes())setPayoutType(p.id,a==='payoutTypeBindAll');renderPayoutTypes();}else if(a==='payoutMerchants')openPayoutMerchants(id);else if(a==='payoutMerchantSearch')renderPayoutMerchants();else if(a==='payoutMerchantBind'){setPayoutMerchant(id,!payoutMerchantStore(context.id)[id]?.bound);renderPayoutMerchants();}else if(a==='payoutMerchantBindAll'||a==='payoutMerchantUnbindAll'){for(const m of visiblePayoutMerchants())setPayoutMerchant(m.id,a==='payoutMerchantBindAll');renderPayoutMerchants();}else if(a==='payoutMoney')openPayoutMoney(id,b.dataset.key);else if(a==='runPayoutMoney')runPayoutMoney();else if(a==='resetPayoutMoney'){for(const k of ['paAmount','paRemark','paGoogle'])$('#'+k).value='';$('#payoutMoneyResult').textContent='';}else if(a==='payoutTest')openPayoutTest(id);else if(a==='runPayoutTest')runPayoutTest();else if(a==='payoutDelete')openPayoutDelete(id);else if(a==='confirmPayoutDelete')confirmPayoutDelete();else return false;return true;}

 document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;const business=b.dataset.providerBusiness;if(business){providerBusiness=business;selectedProviders.clear();$('#keyword').value='';page=1;pageSize=10;render();return;}const tab=b.dataset.tab;if(tab){selectedProviders.clear();active=tab;payoutTop=false;$('#payoutTypeFilter').value='';$('#payoutProviderFilter').value='';page=1;pageSize=active==='collectionChannels'?50:10;selected.clear();selectedChannels.clear();selectedProducts.clear();$('#productCodeKeyword').value='';$('#keyword').value='';$('#statusFilter').value='';render();const pages={providers:'channels',collectionChannels:'collection-channels',payoutChannels:'payout-channels',collectionProducts:'collection-products',payoutProducts:'payout-products'};window.parent.postMessage({type:'hs-unified-open-page',pageId:pages[tab]},'*');return;}const a=b.dataset.action,id=b.dataset.id,cid=b.dataset.code;if(!a)return;b.closest('details')?.removeAttribute('open');
  if(!['close','refresh','search','reset'].includes(a)&&!permitted.has(permission(a)))return toast('当前账号无此操作权限');
  if(!configurationActionAllowed(a,id))return;
  if(providerAction(a,id,b)||payoutAction(a,id,b)||productAction(a,id,b)||collectionAction(a,id,cid,b))return;if(a==='pagePrev'||a==='pageNext'){page+=a==='pageNext'?1:-1;selectedProviders.clear();selected.clear();selectedChannels.clear();selectedProducts.clear();render();return;}
  if(a==='close')close();else if(a==='refresh'||a==='search'){page=1;render();}else if(a==='reset'){$('#keyword').value='';selectedProviders.clear();$('#productCodeKeyword').value='';$('#payoutTypeFilter').value='';$('#payoutProviderFilter').value='';$('#statusFilter').value='';page=1;selected.clear();selectedChannels.clear();selectedProducts.clear();render();}
  else if(a==='primary')isProduct()?openProduct():openChannel();else if(a==='channel')openChannel(id);else if(a==='saveChannel')saveChannel();else if(a==='product')openProduct(id);else if(a==='saveProduct')saveProduct();else if(a==='code')openCode(id,cid);else if(a==='saveCode')saveCode();else if(a==='connection')openConnection(id,cid);else if(a==='saveConnection')saveConnection();else if(a==='test')openTest(id,cid);else if(a==='runTest')runTest();
  else if(a==='toggleChannel'||a==='toggleProduct'){const r=a==='toggleChannel'?channel(id):product(id);context={kind:'toggle',id,product:a==='toggleProduct'};modal('确认状态变更',`<p>${esc(r.name)}：${r.status==='开启'?'关闭':'开启'}</p>`,'confirmToggle','确认');}
  else if(a==='confirmToggle'){const r=context.product?product(context.id):channel(context.id);r.status=r.status==='开启'?'关闭':'开启';if(!context.product){r.modified=true;r.version++;}else{for(const c of data.channels.filter(c=>r.channelIds.includes(c.id))){c.modified=true;c.version++;}}finish('状态已更新',r.id);}
  else if(a==='deleteCode'){const c=channel(id)?.collectionTypes.find(c=>c.id===cid);if(c)confirmCodes([{channelId:id,id:cid,code:c.code}]);}
  else if(a==='bulkDelete')confirmCodes(data.channels.flatMap(r=>(r.collectionTypes||[]).filter(c=>selected.has(c.id)).map(c=>({channelId:r.id,id:c.id,code:c.code}))));
  else if(a==='confirmDeleteCodes'){for(const t of context.targets){const r=channel(t.channelId);r.collectionTypes=r.collectionTypes.filter(c=>c.id!==t.id);data.codeConfigs.delete(t.id);for(const p of data.products.filter(p=>p.direction==='代收')){if(p.codeBindings){delete p.codeBindings[t.id];syncProductChannels(p);}else if(!r.collectionTypes.length)p.channelIds=p.channelIds.filter(id=>id!==r.id);}r.modified=true;r.version++;}selected.clear();finish('通道编码已删除','编码删除');}
  else if(a==='deleteProduct'){const p=product(id);if(p.channelIds.length||Object.values(p.merchantBindings||{}).some(c=>c.bound))return toast('请先解除产品与通道、商户的关联');context={kind:'deleteProduct',id};modal('确认删除产品',`<p>删除 ${esc(p.name)}，保留历史记录。</p>`,'confirmDeleteProduct','确认删除');}
  else if(a==='confirmDeleteProduct'){data.products.splice(data.products.findIndex(p=>p.id===context.id),1);finish('产品已删除',context.id);}else if(a==='export')exportRows();
 });
 document.addEventListener('change',e=>{if(e.target.dataset.providerSelect){e.target.checked?selectedProviders.add(e.target.dataset.providerSelect):selectedProviders.delete(e.target.dataset.providerSelect);return;}if(e.target.hasAttribute('data-select-providers')){currentRows.forEach(g=>e.target.checked?selectedProviders.add(g.providerId):selectedProviders.delete(g.providerId));render();return;}if(e.target.name==='pcStatusChoice')$('#pcStatus').value=e.target.value;if(e.target.dataset.bindMerchant&&!requireBusiness(product(context?.id)?.direction)){e.target.checked=!e.target.checked;return;}if(e.target.id==='pageSize'){selectedProviders.clear();pageSize=Number(e.target.value);page=1;selected.clear();selectedChannels.clear();selectedProducts.clear();render();}if(e.target.dataset.productSelect){e.target.checked?selectedProducts.add(e.target.dataset.productSelect):selectedProducts.delete(e.target.dataset.productSelect);}if(e.target.hasAttribute('data-select-products')){currentRows.forEach(p=>e.target.checked?selectedProducts.add(p.id):selectedProducts.delete(p.id));render();}if(e.target.dataset.bindCode)setCodeBinding(e.target.dataset.bindCode,e.target.checked);if(e.target.dataset.bindMerchant){const p=product(context.id);merchantConfig(p,e.target.dataset.bindMerchant).bound=e.target.checked;model.log(e.target.checked?'绑定产品商户':'解绑产品商户',p.id,tenantId);renderMerchantBindings();}if(e.target.id==='ccWarning'||e.target.id==='ccAutoStop')syncThresholds();if(e.target.dataset.channelSelect){e.target.checked?selectedChannels.add(e.target.dataset.channelSelect):selectedChannels.delete(e.target.dataset.channelSelect);render();}if(e.target.hasAttribute('data-select-channels')){currentRows.forEach(r=>e.target.checked?selectedChannels.add(r.id):selectedChannels.delete(r.id));render();}if(e.target.id==='productCurrency')renderBindings();if(e.target.dataset.codeSelect){e.target.checked?selected.add(e.target.dataset.codeSelect):selected.delete(e.target.dataset.codeSelect);render();}if(e.target.hasAttribute('data-select-all')){currentRows.forEach(r=>(r.collectionTypes||[]).forEach(c=>e.target.checked?selected.add(c.id):selected.delete(c.id)));render();}if(['statusFilter','payoutTypeFilter','payoutProviderFilter'].includes(e.target.id)){selected.clear();selectedChannels.clear();selectedProducts.clear();document.querySelectorAll('[data-channel-select],[data-code-select],[data-product-select],[data-select-all],[data-select-channels],[data-select-products]').forEach(x=>x.checked=false);$('#bulkButton').disabled=true;$('#selectionCount').textContent=active==='collectionChannels'?'已选 0 个编码':'';}});
 document.addEventListener('input',e=>{if(e.target.id==='keyword'||e.target.id==='productCodeKeyword'){selectedProviders.clear();selected.clear();selectedChannels.clear();selectedProducts.clear();document.querySelectorAll('[data-channel-select],[data-code-select],[data-product-select],[data-select-all],[data-select-channels],[data-select-products]').forEach(x=>x.checked=false);$('#bulkButton').disabled=true;$('#selectionCount').textContent=active==='collectionChannels'?'已选 0 个编码':'';}if(e.target.id==='testAmount'&&$('#testResult'))$('#testResult').value='';});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&$('#modalBackdrop').classList.contains('show')){const nodes=[...$('#modalBackdrop').querySelectorAll('button,input,select,textarea')].filter(n=>!n.disabled&&!n.hidden);if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1)?.focus();}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0]?.focus();}}});
 $('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))close();});
 document.addEventListener('toggle',e=>{const d=e.target;if(!d.matches('details.action-more'))return;d.closest('tr')?.classList.toggle('action-open',d.open);if(!d.open)return;document.querySelectorAll('details.action-more[open]').forEach(other=>{if(other!==d)other.open=false;});const menu=d.querySelector('.action-menu'),box=d.getBoundingClientRect();const height=Math.min(menu.scrollHeight||220,280);menu.style.left=Math.max(8,Math.min(box.left,window.innerWidth-210))+'px';menu.style.top=(box.bottom+height>window.innerHeight?Math.max(8,box.top-height):box.bottom+6)+'px';},true);
 document.addEventListener('click',e=>{if(!e.target.closest('details.action-more'))document.querySelectorAll('details.action-more[open]').forEach(d=>d.open=false);});
 render();
})();
