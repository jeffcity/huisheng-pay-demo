<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>汇盛支付租户端 · 日终统计</title>
  <style>
    :root{--primary:#165dff;--primary-hover:#0e42d2;--soft:#e8f3ff;--bg:#f7f8fa;--surface:#fff;--text:#1d2129;--muted:#4e5969;--hint:#86909c;--border:#e5e6eb;--control:#c9cdd4;--danger:#f53f3f;font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
    *{box-sizing:border-box}body{margin:0;font-size:14px;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}button,input,select,textarea{transition:border-color .16s,background .16s,color .16s}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #165dff40;outline-offset:2px}[hidden]{display:none!important}
    .page{padding:22px 24px 36px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}.page-head h1{font-size:22px;margin:0;font-weight:650}.page-head p{margin:6px 0 0;color:var(--muted);font-size:13px}.scope{border-radius:16px;background:var(--soft);color:var(--primary);padding:5px 12px;white-space:nowrap;font-size:12px}.scope::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--primary);margin-right:7px;vertical-align:middle}
    .card{border:1px solid var(--border);border-radius:8px;background:var(--surface);min-width:0;overflow:hidden}.filters{padding:20px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;border-bottom:1px solid var(--border)}.field{min-width:150px}.field.wide{min-width:220px}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.control{height:34px;border:1px solid var(--control);border-radius:4px;background:var(--surface);color:var(--text);padding:0 10px;width:100%}.control:hover{border-color:var(--primary)}.dates{display:flex;align-items:center;gap:8px}.dates input{width:150px}.actions{display:flex;align-items:center;gap:8px}.btn{height:34px;padding:0 15px;border:1px solid var(--control);border-radius:4px;background:var(--surface);color:var(--muted)}.btn:hover{color:var(--primary);border-color:var(--primary);background:#f7fbff}.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--surface)}.btn.primary:hover{background:var(--primary-hover)}.btn:disabled{opacity:.45;cursor:not-allowed}.filter-error{width:100%;color:var(--danger);font-size:13px}.meta{padding:14px 20px;display:flex;justify-content:space-between;gap:16px;font-size:13px;color:var(--muted)}.meta small{color:var(--hint)}
    .table-wrap{width:100%;overflow:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px;min-width:1040px}th,td{padding:13px 15px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}th{background:var(--bg);color:var(--muted);font-weight:600;height:44px}tbody tr:hover{background:#f7fbff}.money,.number{text-align:right}.money{font-family:"SFMono-Regular",Consolas,monospace}.merchant{min-width:130px}.sub{display:block;color:var(--hint);font-size:12px;margin-top:3px}.link-btn{border:0;background:transparent;padding:4px 0;color:var(--primary);white-space:nowrap}.link-btn:hover{color:var(--primary-hover);text-decoration:underline}tfoot td{background:#f2f7ff;font-weight:600;border-top:1px solid #c3d9ff;border-bottom:0}.empty{text-align:center;padding:65px 20px;color:var(--hint)}.pagination{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:8px;padding:16px 20px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}.pagination .control{width:auto}.page-number{min-width:30px;padding:0 7px;height:30px;border:1px solid transparent;background:transparent;border-radius:4px;color:var(--muted)}.page-number:hover{background:var(--soft)}.page-number[aria-current="page"]{background:var(--soft);color:var(--primary);font-weight:600}.jump{width:56px!important}.footnote{margin:12px 0 0;color:var(--hint);font-size:12px}
    dialog{width:min(580px,calc(100vw - 32px));max-height:calc(100vh - 48px);padding:0;border:0;border-radius:10px;box-shadow:0 16px 64px #1d212933;color:var(--text);background:var(--surface)}dialog::backdrop{background:#1d212966}.dialog-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:20px}.dialog-head h2{margin:0;font-size:18px}.close-icon{border:0;background:transparent;color:var(--muted);font-size:24px;width:32px;height:32px;border-radius:4px}.close-icon:hover{background:var(--bg)}.dialog-body{padding:20px 24px}.dialog-context{margin-bottom:20px;color:var(--muted);font-size:13px}.wallet-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wallet-item{border:1px solid var(--border);border-radius:6px;padding:14px 16px;background:var(--bg)}.wallet-item span{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.wallet-item strong{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}.dialog-note{color:var(--hint);font-size:12px;margin:14px 0 0}.dialog-footer{border-top:1px solid var(--border);padding:14px 24px;text-align:right}.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:5;background:var(--surface);border:1px solid var(--border);padding:10px 18px;border-radius:6px;box-shadow:0 5px 20px #1d21291a;color:var(--text);font-size:13px}
    .currency-tabs{display:flex;gap:28px;padding:0 20px;border-bottom:1px solid var(--border);overflow:auto}.currency-tab{border:0;border-bottom:2px solid transparent;background:transparent;padding:14px 2px 12px;color:var(--muted);white-space:nowrap}.currency-tab[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}.currency-tab:hover{color:var(--primary)}.remark-cell{min-width:190px;max-width:250px}.remark-text{display:block;white-space:pre-wrap;overflow-wrap:anywhere}.remark-field label{display:block;margin-bottom:8px;color:var(--muted)}textarea.control{height:140px;padding:10px;resize:vertical;line-height:1.6}.dialog-footer .btn+.btn{margin-left:8px}
    body[data-report^="merchant"] th:last-child,body[data-report^="merchant"] td:last-child{position:sticky;right:0;background:var(--surface);box-shadow:-1px 0 0 var(--border)}body[data-report^="merchant"] th:last-child{background:var(--bg)}body[data-report^="merchant"] tfoot td:last-child{background:#f2f7ff}
    @media(max-width:700px){.page{padding:16px}.page-head{flex-direction:column;gap:10px}.filters{padding:16px;gap:12px}.field{flex:1;min-width:135px}.field.wide{flex-basis:100%;min-width:0}.dates input{width:calc(50% - 14px)}.actions{flex-basis:100%;flex-wrap:wrap}.meta{flex-direction:column;gap:4px;padding:12px 16px}.pagination{padding:12px}.wallet-grid{grid-template-columns:1fr}.dialog-head,.dialog-body{padding:16px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="page-head"><div><h1 id="reportTitle"></h1><p id="reportDescription"></p></div><span class="scope">当前租户 · 汇盛东南亚</span></header>
    <section class="card" aria-label="日终统计报表">
      <nav class="currency-tabs" id="currencyTabs" role="tablist" aria-label="报表币种"></nav>
      <form class="filters" id="reportFilters">
        <div class="field wide"><label id="entityLabel" for="entityFilter"></label><select class="control" id="entityFilter"></select></div>
        <div class="field"><label for="timePreset">统计时间</label><select class="control" id="timePreset"><option value="all">全部时间</option><option value="today">今天</option><option value="yesterday">昨天</option><option value="week">本周</option><option value="month">本月</option></select></div>
        <div class="field wide"><label for="startDate">日期范围（UTC+8）</label><div class="dates"><input class="control" type="date" id="startDate" aria-label="开始日期"><span>—</span><input class="control" type="date" id="endDate" aria-label="结束日期"></div></div>
        <div class="actions"><button class="btn primary" type="submit">搜索</button><button class="btn" type="button" id="resetFilters">重置</button><button class="btn" type="button" id="exportReport">导出</button></div>
        <div class="filter-error" id="filterError" role="alert" hidden></div>
      </form>
      <div class="meta"><span id="resultCount" aria-live="polite"></span><small id="snapshotTime">示例数据 · 截至 2026-10-05 16:30（UTC+8）</small></div>
      <div id="currencyPanel" role="tabpanel"><div class="table-wrap"><table id="reportTable"><thead id="reportHead"></thead><tbody id="reportRows"></tbody><tfoot id="reportTotal"></tfoot></table></div>
      </div>
      <nav class="pagination" aria-label="报表分页"><span id="pageInfo"></span><button class="btn" type="button" id="previousPage" aria-label="上一页">‹</button><span id="pageNumbers"></span><button class="btn" type="button" id="nextPage" aria-label="下一页">›</button><select class="control" id="pageSize" aria-label="每页条数"><option value="10">10条/页</option><option value="20">20条/页</option><option value="50">50条/页</option></select><span>前往</span><input class="control jump" id="jumpPage" type="number" min="1" value="1" aria-label="前往页码"><button class="btn" type="button" id="goPage">确定</button></nav>
    </section>
    <p class="footnote" id="reportNote"></p>
  </main>
  <dialog id="walletDialog" aria-labelledby="walletDialogTitle">
    <div class="dialog-head"><h2 id="walletDialogTitle">钱包明细</h2><button class="close-icon" type="button" id="closeWalletIcon" aria-label="关闭钱包明细">×</button></div>
    <div class="dialog-body"><div class="dialog-context" id="walletContext"></div><div class="wallet-grid" id="walletValues"></div><p class="dialog-note">期初、期末余额为钱包总额；期末可用余额 = 期末余额 − 期末冻结金额。</p></div>
    <div class="dialog-footer"><button class="btn primary" type="button" id="closeWallet">关闭</button></div>
  </dialog>
  <dialog id="remarkDialog" aria-labelledby="remarkDialogTitle">
    <form id="remarkForm">
      <div class="dialog-head"><h2 id="remarkDialogTitle">编辑备注</h2><button class="close-icon" type="button" id="closeRemarkIcon" aria-label="关闭编辑备注">×</button></div>
      <div class="dialog-body"><div class="dialog-context" id="remarkContext"></div><div class="remark-field"><label for="remarkInput">备注</label><textarea class="control" id="remarkInput" placeholder="请输入备注，留空保存可清除原备注"></textarea></div></div>
      <div class="dialog-footer"><button class="btn" type="button" id="cancelRemark">取消</button><button class="btn primary" type="submit">保存</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script>
    (() => {
      const reportConfigs = {
        'payout-channel-daily': { title: '代付通道日终统计', direction: 'payout', kind: 'channel' },
        'collect-channel-daily': { title: '代收通道日终统计', direction: 'collect', kind: 'channel' },
        'merchant-collect-daily': { title: '商户代收日终统计', direction: 'collect', kind: 'merchant' },
        'merchant-payout-daily': { title: '商户代付日终统计', direction: 'payout', kind: 'merchant' }
      };
      const requested = window.__UNIFIED_DEMO_HASH || location.hash.slice(1);
      const config = reportConfigs[requested] || reportConfigs['payout-channel-daily'];
      const merchantPage = config.kind === 'merchant';
      const payout = config.direction === 'payout';
      const walletName = payout ? '代付钱包' : '代收钱包';
      const demoToday = '2026-10-05';
      const merchants = [{id:'MCH-2031',name:'星河游戏'},{id:'MCH-1188',name:'东盛电商'},{id:'MCH-3096',name:'远山商贸'}];
      const channels = payout ? ['银联代付通道','快捷代付通道'] : ['快捷代收通道','网银代收通道'];
      // Static review fixtures, not an implementation of LanSheng's production metric formulas.
      // 成交率、未支付／未成交计算由开发移植时核对蓝盛代码；这里仅展示示例结果。
      const channelRows = [], merchantRows = [];
      for (let day = 0; day < 6; day++) {
        const date = new Date(demoToday + 'T00:00:00Z'); date.setUTCDate(date.getUTCDate()-day);
        const reportDate = date.toISOString().slice(0,10);
        merchants.forEach((merchant,m) => {
          const slices = channels.map((channel,c) => {
            const total = 64 + day*11 + m*17 + c*23;
            const success = total - (3 + m + c + day);
            const amount = (success * (payout ? 42850 : 28600)) + m*12400 + day*1500;
            const row = {date:reportDate,merchantId:merchant.id,merchant:merchant.name,channel,currency:'CNY',amount,total,success,rate:(success/total*100).toFixed(2)+'%',remark:''};
            channelRows.push(row); return row;
          });
          const total = slices.reduce((sum,row)=>sum+row.total,0);
          const success = slices.reduce((sum,row)=>sum+row.success,0);
          const amount = slices.reduce((sum,row)=>sum+row.amount,0);
          const notPaid = total-success;
          const notAmount = notPaid * (payout ? 38500 : 22400);
          // Wallet snapshots include all booked changes, independently of transaction totals.
          const walletStart = (payout ? 62842000 : 93688000) + m*24786000 + day*940000;
          const walletEnd = walletStart + (payout ? -2753600-m*356200 : 3385400+m*194200) + day*87200;
          const frozen = 1230000 + m*348000 + day*42600;
          merchantRows.push({date:reportDate,merchantId:merchant.id,merchant:merchant.name,currency:'CNY',amount,orderAmount:amount+notAmount,notAmount,total,success,notPaid,rate:(success/total*100).toFixed(2)+'%',walletStart,walletEnd,frozen,available:walletEnd-frozen});
        });
      }
      // Independent fixtures for the currencies already present in the unified Demo.
      // These are review samples, not exchange-rate conversions or business grants.
      const currencies = ['CNY','USD','PHP','THB'];
      const extraChannelRows=[],extraMerchantRows=[];
      currencies.slice(1).forEach((currency,index)=>{
        const scale=[0.19,3.4,2.1][index];
        channelRows.filter((row,i)=>i%(index+2)!==0).forEach(row=>{
          const total=row.total+index+4,success=total-(index+5);
          extraChannelRows.push({...row,currency,amount:Math.round(row.amount*scale),total,success,rate:(success/total*100).toFixed(2)+'%'});
        });
        merchantRows.filter((row,i)=>i%(index+2)!==0).forEach(row=>{
          const copy={...row,currency,total:row.total+index+8,success:row.success+index+3};
          ['amount','notAmount','walletStart','walletEnd','frozen'].forEach(key=>copy[key]=Math.round(row[key]*scale));
          copy.orderAmount=copy.amount+copy.notAmount;copy.available=copy.walletEnd-copy.frozen;
          copy.notPaid=copy.total-copy.success;copy.rate=(copy.success/copy.total*100).toFixed(2)+'%';extraMerchantRows.push(copy);
        });
      });
      channelRows.push(...extraChannelRows);merchantRows.push(...extraMerchantRows);
      const remarkStorageKey='huisheng-demo:HS-TEN-001:daily-report-remarks:v1';
      const remarkId=row=>JSON.stringify([config.direction,row.currency,row.date,row.merchantId,row.channel]);
      function readRemarks(){const parsed=JSON.parse(window.top.localStorage.getItem(remarkStorageKey)||'{}');return parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:{}}
      let savedRemarks={};try{savedRemarks=readRemarks()}catch{}
      channelRows.forEach(row=>{const value=savedRemarks[remarkId(row)];if(typeof value==='string')row.remark=value});
      const sourceRows = merchantPage ? merchantRows : channelRows;
      sourceRows.sort((a,b)=>b.date.localeCompare(a.date)||a.merchantId.localeCompare(b.merchantId));
      sourceRows.forEach((row,i)=>{row.key=String(i)});
      const columns = merchantPage ? [
        ['date','日期'],['merchant','商户名称'],
        ...(payout ? [['orderAmount','订单总金额']] : []),['amount','成交金额'],
        ...(payout ? [['notAmount','未成交金额']] : []),['total','总单量'],['success','成功数'],
        ...(payout ? [['notPaid','未支付']] : []),['rate','成交率'],
        ['walletStart',walletName+'期初余额'],['walletEnd',walletName+'期末余额'],['detail','钱包明细']
      ] : [['date','日期'],['merchantId','商户号'],['merchant','商户名称'],['channel','通道名称'],['amount','成交金额'],['total','总单量'],['rate','成交率'],['remark','备注']];
      const moneyFields = new Set(['amount','orderAmount','notAmount','walletStart','walletEnd']);
      const countFields = new Set(['total','success','notPaid']);
      const sumFields = new Set(['amount','orderAmount','notAmount','total','success','notPaid']);
      const $ = id => document.getElementById(id);
      const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const money = value => (value/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
      const fieldClass = key => moneyFields.has(key)?'money':countFields.has(key)||key==='rate'?'number':'';
      let applied = {entity:'',start:'',end:'',currency:'CNY'}, page=1, pageSize=10, toastTimer, returnFocus, activeRemarkRow;
      document.title = '汇盛支付租户端 · '+config.title;
      document.body.dataset.report = requested in reportConfigs ? requested : 'payout-channel-daily';
      $('reportTitle').textContent = config.title;
      $('reportDescription').textContent = merchantPage ? '按商户查看每日交易结果与'+walletName+'日终余额。' : '按日期、商户和通道查看每日交易结果。';
      $('reportNote').textContent = merchantPage ? '钱包余额包含已记账的订单、费用、划转及资金调整；钱包明细仅供查看。' : '合计按当前筛选范围汇总，不受分页影响。';
      $('currencyTabs').innerHTML=currencies.map((currency,i)=>'<button class="currency-tab" id="currency-'+currency+'" type="button" role="tab" aria-controls="currencyPanel" aria-selected="'+(i===0)+'" tabindex="'+(i===0?'0':'-1')+'" data-currency="'+currency+'">'+currency+'</button>').join('');
      $('entityLabel').textContent = merchantPage ? '商户' : '通道';
      const options = merchantPage ? merchants.map(m=>[m.id,m.name+' · '+m.id]) : channels.map(c=>[c,c]);
      $('entityFilter').innerHTML = '<option value="">'+(merchantPage?'全部商户':'全部渠道')+'</option>'+options.map(([value,label])=>'<option value="'+escapeHtml(value)+'">'+escapeHtml(label)+'</option>').join('');
      $('reportHead').innerHTML = '<tr>'+columns.map(([key,label])=>'<th scope="col" class="'+fieldClass(key)+'">'+escapeHtml(label)+'</th>').join('')+'</tr>';
      $('reportTable').style.minWidth = merchantPage ? (payout?'1560px':'1200px') : '1040px';
      const filtered = () => sourceRows.filter(row=>(!applied.entity||(merchantPage?row.merchantId:row.channel)===applied.entity)&&(!applied.start||row.date>=applied.start)&&(!applied.end||row.date<=applied.end)&&row.currency===applied.currency);
      function render() {
        document.querySelectorAll('[data-currency]').forEach(button=>{const selected=button.dataset.currency===applied.currency;button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1});
        $('currencyPanel').setAttribute('aria-labelledby','currency-'+applied.currency);
        const rows=filtered(), pages=Math.max(1,Math.ceil(rows.length/pageSize)); page=Math.min(page,pages);
        const visible=rows.slice((page-1)*pageSize,page*pageSize);
        $('resultCount').textContent='共 '+rows.length+' 条 · '+applied.currency;
        $('reportRows').innerHTML=visible.length?visible.map(row=>'<tr data-row-key="'+row.key+'">'+columns.map(([key])=>{
          if(key==='detail') return '<td><button class="link-btn" type="button" data-wallet-key="'+row.key+'" aria-label="查看 '+escapeHtml(row.merchant)+' '+row.date+' 钱包明细">钱包明细</button></td>';
          if(key==='remark') return '<td class="remark-cell"><span class="remark-text">'+escapeHtml(row.remark||'—')+'</span><button class="link-btn" type="button" data-remark-key="'+row.key+'" aria-label="编辑 '+escapeHtml(row.merchant)+' '+row.date+' '+escapeHtml(row.channel)+' '+row.currency+' 备注">编辑</button></td>';
          return '<td class="'+fieldClass(key)+'">'+(moneyFields.has(key)?money(row[key]):escapeHtml(row[key]|| (typeof row[key]==='number'?0:'—')))+'</td>';
        }).join('')+'</tr>').join(''):'<tr><td colspan="'+columns.length+'" class="empty">当前筛选条件下暂无数据</td></tr>';
        $('reportTotal').innerHTML=rows.length?'<tr>'+columns.map(([key],i)=>'<td class="'+fieldClass(key)+'">'+(i===0?'合计':sumFields.has(key)?(moneyFields.has(key)?money(rows.reduce((sum,r)=>sum+r[key],0)):rows.reduce((sum,r)=>sum+r[key],0)):'—')+'</td>').join('')+'</tr>':'';
        $('pageInfo').textContent='第 '+page+' / '+pages+' 页';$('previousPage').disabled=page===1;$('nextPage').disabled=page===pages;
        const start=Math.max(1,Math.min(page-2,pages-4)),end=Math.min(pages,start+4);
        $('pageNumbers').innerHTML=Array.from({length:end-start+1},(_,i)=>start+i).map(n=>'<button class="page-number" type="button" data-page="'+n+'" aria-label="第 '+n+' 页"'+(n===page?' aria-current="page"':'')+'>'+n+'</button>').join('');
        $('jumpPage').value=page;$('jumpPage').max=pages;$('exportReport').disabled=!rows.length;
      }
      function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>{$('toast').hidden=true},2400)}
      function applyFilters(){
        const start=$('startDate').value,end=$('endDate').value;
        if(start&&end&&start>end){$('filterError').textContent='开始日期不能晚于结束日期';$('filterError').hidden=false;$('startDate').focus();return false}
        $('filterError').hidden=true;applied={entity:$('entityFilter').value,start,end,currency:applied.currency};page=1;render();return true;
      }
      $('reportFilters').addEventListener('submit',event=>{event.preventDefault();applyFilters()});
      $('resetFilters').addEventListener('click',()=>{$('reportFilters').reset();$('startDate').value='';$('endDate').value='';applyFilters()});
      function switchCurrency(currency){if(!currencies.includes(currency))return;applied={...applied,currency};page=1;render()}
      $('currencyTabs').addEventListener('click',event=>{const button=event.target.closest('[data-currency]');if(button)switchCurrency(button.dataset.currency)});
      $('currencyTabs').addEventListener('keydown',event=>{const current=currencies.indexOf(event.target.dataset.currency);if(current<0)return;let next=current;if(event.key==='ArrowRight')next=(current+1)%currencies.length;else if(event.key==='ArrowLeft')next=(current+currencies.length-1)%currencies.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=currencies.length-1;else return;event.preventDefault();switchCurrency(currencies[next]);$('currency-'+currencies[next]).focus()});
      $('timePreset').addEventListener('change',()=>{
        const preset=$('timePreset').value,date=new Date(demoToday+'T00:00:00Z');let start='',end='';
        if(preset!=='all'){end=demoToday;if(preset==='yesterday'){date.setUTCDate(date.getUTCDate()-1);end=date.toISOString().slice(0,10)}else if(preset==='week'){date.setUTCDate(date.getUTCDate()-((date.getUTCDay()+6)%7))}else if(preset==='month'){date.setUTCDate(1)}start=date.toISOString().slice(0,10)}
        $('startDate').value=start;$('endDate').value=end;
      });
      ['startDate','endDate'].forEach(id=>$(id).addEventListener('input',()=>{$('timePreset').value='all';$('filterError').hidden=true}));
      $('previousPage').addEventListener('click',()=>{page=Math.max(1,page-1);render()});$('nextPage').addEventListener('click',()=>{page++;render()});
      $('pageNumbers').addEventListener('click',event=>{const target=event.target.closest('[data-page]');if(target){page=Number(target.dataset.page);render()}});
      $('pageSize').addEventListener('change',()=>{pageSize=Number($('pageSize').value);page=1;render()});
      function jump(){const value=Number($('jumpPage').value),max=Number($('jumpPage').max);if(!Number.isInteger(value)||value<1||value>max){toast('请输入 1 至 '+max+' 的页码');$('jumpPage').focus();return}page=value;render()}
      $('goPage').addEventListener('click',jump);$('jumpPage').addEventListener('keydown',event=>{if(event.key==='Enter')jump()});
      $('reportRows').addEventListener('click',event=>{
        const remarkButton=event.target.closest('[data-remark-key]');
        if(remarkButton){
          const row=filtered().find(r=>r.key===remarkButton.dataset.remarkKey);if(!row)return;
          activeRemarkRow=row;$('remarkInput').value=row.remark;
          $('remarkContext').textContent=row.date+' · '+row.merchant+'（'+row.merchantId+'） · '+row.channel+' · '+row.currency;
          $('remarkDialog').showModal();$('remarkInput').focus();return;
        }
        const button=event.target.closest('[data-wallet-key]');if(!button)return;
        const row=filtered().find(r=>r.key===button.dataset.walletKey);if(!row)return;
        returnFocus=button;$('walletDialogTitle').textContent=walletName+' · 钱包明细';
        $('walletContext').textContent=row.merchant+'（'+row.merchantId+'） · '+row.date+' · '+row.currency+(row.date===demoToday?' · 截至 16:30（UTC+8）':' · UTC+8 日终');
        $('walletValues').innerHTML=[['期初余额',row.walletStart],['期末余额',row.walletEnd],['期末冻结金额',row.frozen],['期末可用余额',row.available]].map(([label,value])=>'<div class="wallet-item"><span>'+label+'</span><strong>'+row.currency+' '+money(value)+'</strong></div>').join('');
        $('walletDialog').showModal();$('closeWalletIcon').focus();
      });
      ['closeWallet','closeWalletIcon'].forEach(id=>$(id).addEventListener('click',()=>{$('walletDialog').close()}));
      $('walletDialog').addEventListener('close',()=>{returnFocus?.focus()});
      $('walletDialog').addEventListener('click',event=>{if(event.target!==$('walletDialog'))return;const rect=$('walletDialog').getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)$('walletDialog').close()});
      $('remarkForm').addEventListener('submit',event=>{
        event.preventDefault();if(!activeRemarkRow)return;const value=$('remarkInput').value.trim();
        try{const remarks=readRemarks();if(value)remarks[remarkId(activeRemarkRow)]=value;else delete remarks[remarkId(activeRemarkRow)];window.top.localStorage.setItem(remarkStorageKey,JSON.stringify(remarks))}
        catch{toast('备注未保存，请检查浏览器本地存储后重试');return}
        activeRemarkRow.remark=value;render();$('remarkDialog').close();toast(value?'备注已保存':'备注已清空');
      });
      ['cancelRemark','closeRemarkIcon'].forEach(id=>$(id).addEventListener('click',()=>{$('remarkDialog').close()}));
      $('remarkDialog').addEventListener('close',()=>{if(activeRemarkRow)document.querySelector('[data-remark-key="'+activeRemarkRow.key+'"]')?.focus();activeRemarkRow=null});
      $('exportReport').addEventListener('click',()=>{
        const rows=filtered();if(!rows.length)return;
        const exportColumns=columns.filter(([key])=>key!=='detail');
        const csvCell=value=>'"'+String(value??'').replace(/"/g,'""')+'"';
        const records=[exportColumns.map(([,label])=>label),...rows.map(row=>exportColumns.map(([key])=>moneyFields.has(key)?(row[key]/100).toFixed(2):key==='remark'&&/^[\s]*[=+@-]/.test(row[key])?"'"+row[key]:row[key])),exportColumns.map(([key],i)=>i===0?'合计':sumFields.has(key)?(moneyFields.has(key)?(rows.reduce((sum,r)=>sum+r[key],0)/100).toFixed(2):rows.reduce((sum,r)=>sum+r[key],0)):'')];
        const blob=new Blob(['\ufeff'+records.map(record=>record.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob);
        const link=document.createElement('a');link.href=url;link.download=config.title+'_'+applied.currency+'.csv';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前筛选的 '+rows.length+' 条记录');
      });
      render();
    })();
  </script>
</body>
</html>
