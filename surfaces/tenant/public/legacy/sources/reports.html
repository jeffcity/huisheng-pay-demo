<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>汇盛支付租户端 · 日终统计</title>
  <style>
    :root{--primary:#165dff;--primary-hover:#0e42d2;--soft:#e8f3ff;--bg:#f7f8fa;--surface:#fff;--text:#1d2129;--muted:#4e5969;--hint:#86909c;--border:#e5e6eb;--control:#c9cdd4;--danger:#f53f3f;font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
    *{box-sizing:border-box}body{margin:0;font-size:14px;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}button,input,select,textarea{transition:border-color .16s,background .16s,color .16s}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #165dff40;outline-offset:2px}[hidden]{display:none!important}
    .page{padding:22px 24px 36px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}.page-head h1{font-size:22px;margin:0;font-weight:650}.page-head p{margin:6px 0 0;color:var(--muted);font-size:13px}.scope{border-radius:16px;background:var(--soft);color:var(--primary);padding:5px 12px;white-space:nowrap;font-size:12px}.scope::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--primary);margin-right:7px;vertical-align:middle}
    .card{border:1px solid var(--border);border-radius:8px;background:var(--surface);min-width:0;overflow:hidden}.filters{padding:20px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;border-bottom:1px solid var(--border)}.field{min-width:150px}.field.wide{min-width:220px}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.control{height:34px;border:1px solid var(--control);border-radius:4px;background:var(--surface);color:var(--text);padding:0 10px;width:100%}.control:hover{border-color:var(--primary)}.dates{display:flex;align-items:center;gap:8px}.dates input{width:150px}.actions{display:flex;align-items:center;gap:8px}.btn{height:34px;padding:0 15px;border:1px solid var(--control);border-radius:4px;background:var(--surface);color:var(--muted)}.btn:hover{color:var(--primary);border-color:var(--primary);background:#f7fbff}.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--surface)}.btn.primary:hover{background:var(--primary-hover)}.btn:disabled{opacity:.45;cursor:not-allowed}.filter-error{width:100%;color:var(--danger);font-size:13px}.meta{padding:14px 20px;display:flex;justify-content:space-between;gap:16px;font-size:13px;color:var(--muted)}.meta small{color:var(--hint)}
    .table-wrap{width:100%;overflow:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px;min-width:1040px}th,td{padding:13px 15px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}th{background:var(--bg);color:var(--muted);font-weight:600;height:44px}tbody tr:hover{background:#f7fbff}.money,.number{text-align:right}.money{font-family:"SFMono-Regular",Consolas,monospace}.merchant{min-width:130px}.sub{display:block;color:var(--hint);font-size:12px;margin-top:3px}.link-btn{border:0;background:transparent;padding:4px 0;color:var(--primary);white-space:nowrap}.link-btn:hover{color:var(--primary-hover);text-decoration:underline}tfoot td{background:#f2f7ff;font-weight:600;border-top:1px solid #c3d9ff;border-bottom:0}.empty{text-align:center;padding:65px 20px;color:var(--hint)}.pagination{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:8px;padding:16px 20px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}.pagination .control{width:auto}.page-number{min-width:30px;padding:0 7px;height:30px;border:1px solid transparent;background:transparent;border-radius:4px;color:var(--muted)}.page-number:hover{background:var(--soft)}.page-number[aria-current="page"]{background:var(--soft);color:var(--primary);font-weight:600}.jump{width:56px!important}.footnote{margin:12px 0 0;color:var(--hint);font-size:12px}
    dialog{width:min(580px,calc(100vw - 32px));max-height:calc(100vh - 48px);padding:0;border:0;border-radius:10px;box-shadow:0 16px 64px #1d212933;color:var(--text);background:var(--surface)}dialog::backdrop{background:#1d212966}.dialog-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:20px}.dialog-head h2{margin:0;font-size:18px}.close-icon{border:0;background:transparent;color:var(--muted);font-size:24px;width:32px;height:32px;border-radius:4px}.close-icon:hover{background:var(--bg)}.dialog-body{padding:20px 24px}.dialog-context{margin-bottom:20px;color:var(--muted);font-size:13px}.wallet-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wallet-item{border:1px solid var(--border);border-radius:6px;padding:14px 16px;background:var(--bg)}.wallet-item span{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.wallet-item strong{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}.dialog-note{color:var(--hint);font-size:12px;margin:14px 0 0}.dialog-footer{border-top:1px solid var(--border);padding:14px 24px;text-align:right}.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:5;background:var(--surface);border:1px solid var(--border);padding:10px 18px;border-radius:6px;box-shadow:0 5px 20px #1d21291a;color:var(--text);font-size:13px}
    .currency-tabs{display:flex;gap:28px;padding:0 20px;border-bottom:1px solid var(--border);overflow:auto}.currency-tab{border:0;border-bottom:2px solid transparent;background:transparent;padding:14px 2px 12px;color:var(--muted);white-space:nowrap}.currency-tab[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}.currency-tab:hover{color:var(--primary)}.remark-cell{min-width:190px;max-width:250px}.remark-text{display:block;white-space:pre-wrap;overflow-wrap:anywhere}.remark-field label{display:block;margin-bottom:8px;color:var(--muted)}textarea.control{height:140px;padding:10px;resize:vertical;line-height:1.6}.dialog-footer .btn+.btn{margin-left:8px}
    @media(max-width:700px){.page{padding:16px}.page-head{flex-direction:column;gap:10px}.filters{padding:16px;gap:12px}.field{flex:1;min-width:135px}.field.wide{flex-basis:100%;min-width:0}.dates input{width:calc(50% - 14px)}.actions{flex-basis:100%;flex-wrap:wrap}.meta{flex-direction:column;gap:4px;padding:12px 16px}.pagination{padding:12px}.wallet-grid{grid-template-columns:1fr}.dialog-head,.dialog-body{padding:16px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="page-head"><div><h1 id="reportTitle"></h1><p id="reportDescription"></p></div><span class="scope">当前租户 · 汇盛东南亚</span></header>
    <section class="card" aria-label="日终统计报表">
      <nav class="currency-tabs" id="currencyTabs" role="tablist" aria-label="报表币种"></nav>
      <form class="filters" id="reportFilters">
        <div class="field wide"><label id="entityLabel" for="entityFilter"></label><select class="control" id="entityFilter"></select></div>
        <div class="field"><label for="timePreset">统计时间</label><select class="control" id="timePreset"><option value="all">全部时间</option><option value="today">今天</option><option value="yesterday">昨天</option><option value="week">本周</option><option value="month">本月</option></select></div>
        <div class="field wide"><label for="startDate">日期范围（UTC+8）</label><div class="dates"><input class="control" type="date" id="startDate" aria-label="开始日期"><span>—</span><input class="control" type="date" id="endDate" aria-label="结束日期"></div></div>
        <div class="actions"><button class="btn primary" type="submit">搜索</button><button class="btn" type="button" id="resetFilters">重置</button><button class="btn" type="button" id="exportReport">导出</button></div>
        <div class="filter-error" id="filterError" role="alert" hidden></div>
      </form>
      <div class="meta"><span id="resultCount" aria-live="polite"></span><small id="snapshotTime">示例数据 · 截至 2026-10-05 16:30（UTC+8）</small></div>
      <div id="currencyPanel" role="tabpanel"><div class="table-wrap"><table id="reportTable"><thead id="reportHead"></thead><tbody id="reportRows"></tbody><tfoot id="reportTotal"></tfoot></table></div>
      </div>
      <nav class="pagination" aria-label="报表分页"><span id="pageInfo"></span><button class="btn" type="button" id="previousPage" aria-label="上一页">‹</button><span id="pageNumbers"></span><button class="btn" type="button" id="nextPage" aria-label="下一页">›</button><select class="control" id="pageSize" aria-label="每页条数"><option value="10">10条/页</option><option value="20">20条/页</option><option value="50">50条/页</option><option value="100">100条/页</option></select><span>前往</span><input class="control jump" id="jumpPage" type="number" min="1" value="1" aria-label="前往页码"><button class="btn" type="button" id="goPage">确定</button></nav>
    </section>
    <p class="footnote" id="reportNote"></p>
  </main>
  <dialog id="remarkDialog" aria-labelledby="remarkDialogTitle">
    <form id="remarkForm">
      <div class="dialog-head"><h2 id="remarkDialogTitle">编辑备注</h2><button class="close-icon" type="button" id="closeRemarkIcon" aria-label="关闭编辑备注">×</button></div>
      <div class="dialog-body"><div class="dialog-context" id="remarkContext"></div><div class="remark-field"><label for="remarkInput">备注</label><textarea class="control" id="remarkInput" placeholder="请输入备注，留空保存可清除原备注"></textarea></div></div>
      <div class="dialog-footer"><button class="btn" type="button" id="cancelRemark">取消</button><button class="btn primary" type="submit">保存</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script>
(() => {
  const model=window.HSDailyReports,provider=window.HSProviderDemo,$=id=>document.getElementById(id),esc=model.escapeHtml;
  const requested=window.__UNIFIED_DEMO_HASH||location.hash.slice(1),route=model.configs[requested]?requested:'payout-channel-daily',config=model.configs[route];
  const tenantId=provider?.tenantId||'',columns=config.columns,moneyFields=model.moneyFields,countFields=model.countFields,sumFields=model.sumFields;
  const sourceRows=model.fixtures(route,tenantId).map(row=>({...row}));
  const remarkStorageKey='huisheng-demo:'+tenantId+':daily-report-remarks:v1';
  const remarkId=row=>JSON.stringify([config.direction,'CNY',row.date,row.merchantId,row.channel]);
  function readRemarks(){const saved=JSON.parse(window.top.localStorage.getItem(remarkStorageKey)||'{}');return saved&&typeof saved==='object'&&!Array.isArray(saved)?saved:{}}
  try{const saved=readRemarks();sourceRows.forEach(row=>{if(typeof saved[remarkId(row)]==='string')row.remark=saved[remarkId(row)]})}catch{}
  const fieldClass=key=>moneyFields.has(key)?'money':countFields.has(key)||key==='rate'||key==='id'?'number':'';
  const money=cents=>(cents/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  let applied={entity:'',start:'',end:'',currency:'CNY'},page=1,pageSize=10,activeRemarkRow,toastTimer;
  document.title='汇盛支付租户端 · '+config.title;document.body.dataset.report=route;
  $('reportTitle').textContent=config.title;
  $('reportDescription').textContent=config.kind==='platform'?'查看当前租户内业务的每日成交、费用与余额汇总。':config.kind==='merchant'?'按商户查看每日交易结果、余额和预付记录。':'按日期、商户和通道查看每日交易结果。';
  document.querySelector('.scope').textContent='当前租户 · CNY';
  $('snapshotTime').textContent='示例数据 · 截至 '+model.demoToday+' 16:30（UTC+8）';
  $('reportNote').textContent='仅展示 CNY；合计覆盖当前筛选的全部记录，余额和预付快照不跨日期累加。';
  $('currencyTabs').innerHTML='<button class="currency-tab" id="currency-CNY" type="button" role="tab" aria-controls="currencyPanel" aria-selected="true">CNY</button>';
  $('currencyPanel').setAttribute('aria-labelledby','currency-CNY');
  const entityName={channel:'通道',merchant:'商户',platform:''}[config.kind];
  $('entityLabel').textContent=entityName;$('entityFilter').closest('.field').hidden=config.kind==='platform';
  $('entityFilter').innerHTML='<option value="">全部'+esc(entityName)+'</option>'+model.entities(route).map(([id,name])=>'<option value="'+esc(id)+'">'+esc(name)+' · '+esc(id)+'</option>').join('');
  $('reportHead').innerHTML='<tr>'+columns.map(([key,label])=>'<th scope="col" class="'+fieldClass(key)+'">'+esc(label)+'</th>').join('')+'</tr>';
  $('reportTable').style.minWidth=(config.kind==='platform'?Math.max(1480,columns.length*110):config.kind==='merchant'?Math.max(1560,columns.length*110):1420)+'px';
  function scopeValid(){return !!tenantId&&provider?.tenantId===tenantId}
  function error(message){$('filterError').textContent=message;$('filterError').hidden=!message}
  function filtered(){if(!scopeValid()){error('租户已切换，请重新打开页面');return []}return model.query(sourceRows,route,tenantId,applied)}
  function render(){
    const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.max(1,Math.min(page,pages));
    $('resultCount').textContent='共 '+rows.length+' 条 · CNY';
    $('reportRows').innerHTML=rows.length?rows.slice((page-1)*pageSize,page*pageSize).map(row=>'<tr data-row-key="'+esc(row.key)+'">'+columns.map(([key])=>{
      if(key==='remark')return '<td class="remark-cell"><span class="remark-text">'+esc(row.remark||'—')+'</span><button class="link-btn" type="button" data-remark-key="'+esc(row.key)+'" aria-label="编辑 '+esc(row.merchant)+' '+row.date+' '+esc(row.channel)+' CNY 备注">编辑</button></td>';
      return '<td class="'+fieldClass(key)+'">'+(moneyFields.has(key)?money(row[key]):esc(row[key]??'—'))+'</td>';
    }).join('')+'</tr>').join(''):'<tr><td colspan="'+columns.length+'" class="empty">当前筛选条件下暂无数据</td></tr>';
    const total=model.totals(rows,route,tenantId);
    $('reportTotal').innerHTML=rows.length?'<tr>'+columns.map(([key],i)=>'<td class="'+fieldClass(key)+'">'+(i===0?'合计':sumFields.has(key)?(moneyFields.has(key)?money(total[key]):total[key]):key==='rate'?total.rate:'—')+'</td>').join('')+'</tr>':'';
    $('pageInfo').textContent='第 '+page+' / '+pages+' 页';$('previousPage').disabled=page===1;$('nextPage').disabled=page===pages;
    const start=Math.max(1,Math.min(page-2,pages-4)),end=Math.min(pages,start+4);
    $('pageNumbers').innerHTML=Array.from({length:end-start+1},(_,i)=>start+i).map(n=>'<button class="page-number" type="button" data-page="'+n+'" aria-label="第 '+n+' 页"'+(n===page?' aria-current="page"':'')+'>'+n+'</button>').join('');
    $('jumpPage').value=page;$('jumpPage').max=pages;$('exportReport').disabled=!rows.length;
  }
  function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>{$('toast').hidden=true},2400)}
  function applyFilters(){
    if(!scopeValid()){render();return false}
    const next={entity:$('entityFilter').value,start:$('startDate').value,end:$('endDate').value,currency:'CNY'};
    try{model.query(sourceRows,route,tenantId,next);applied=next;page=1;error('');render();return true}catch(e){error(e.message);return false}
  }
  $('reportFilters').addEventListener('submit',event=>{event.preventDefault();applyFilters()});
  $('resetFilters').onclick=()=>{$('reportFilters').reset();$('startDate').value='';$('endDate').value='';applyFilters()};
  $('timePreset').onchange=()=>{const range=model.presetRange($('timePreset').value);$('startDate').value=range.start;$('endDate').value=range.end};
  ['startDate','endDate'].forEach(id=>$(id).oninput=()=>{$('timePreset').value='all';error('')});
  $('previousPage').onclick=()=>{page--;render()};$('nextPage').onclick=()=>{page++;render()};
  $('pageNumbers').onclick=event=>{const target=event.target.closest('[data-page]');if(target){page=Number(target.dataset.page);render()}};
  $('pageSize').onchange=()=>{pageSize=[10,20,50,100].includes(Number($('pageSize').value))?Number($('pageSize').value):10;page=1;render()};
  function jump(){const value=Number($('jumpPage').value),max=Number($('jumpPage').max);if(!Number.isInteger(value)||value<1||value>max){toast('请输入 1 至 '+max+' 的页码');$('jumpPage').focus();return}page=value;render()}
  $('goPage').onclick=jump;$('jumpPage').onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();jump()}};
  $('reportRows').onclick=event=>{
    const button=event.target.closest('[data-remark-key]');if(!button||!scopeValid())return;
    const row=filtered().find(item=>item.key===button.dataset.remarkKey);if(!row)return;
    activeRemarkRow=row;$('remarkInput').value=row.remark;$('remarkContext').textContent=row.date+' · '+row.merchant+'（'+row.merchantId+'） · '+row.channel+' · CNY';
    $('remarkDialog').showModal();$('remarkInput').focus();
  };
  $('remarkForm').onsubmit=event=>{
    event.preventDefault();if(!activeRemarkRow)return;if(!scopeValid()){toast('租户已切换，备注未保存');return}
    const value=$('remarkInput').value.trim();
    try{const saved=readRemarks();if(value)saved[remarkId(activeRemarkRow)]=value;else delete saved[remarkId(activeRemarkRow)];window.top.localStorage.setItem(remarkStorageKey,JSON.stringify(saved))}catch{toast('备注未保存，请检查浏览器本地存储后重试');return}
    activeRemarkRow.remark=value;render();$('remarkDialog').close();toast(value?'备注已保存':'备注已清空');
  };
  ['cancelRemark','closeRemarkIcon'].forEach(id=>$(id).onclick=()=>{$('remarkDialog').close()});
  $('remarkDialog').addEventListener('close',()=>{if(activeRemarkRow)document.querySelector('[data-remark-key="'+activeRemarkRow.key+'"]')?.focus();activeRemarkRow=null});
  $('exportReport').onclick=()=>{
    if(!scopeValid()){render();return}const rows=filtered();if(!rows.length)return;
    const blob=new Blob([model.csv(rows,route,tenantId)],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');
    link.href=url;link.download=config.title+'_CNY.csv';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前筛选的 '+rows.length+' 条记录');
  };
  render();
})();
  </script>
</body>
</html>
