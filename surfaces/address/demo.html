<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汇盛支付地址池</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#172a32;background:#f3f6f7}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%}aside{background:white;border-right:1px solid #e5ecef;overflow:auto;padding:20px 10px}.brand{padding:0 12px 24px;font-size:16px;font-weight:600}.brand small{display:block;font-size:12px;color:#536b77;margin-top:6px;font-weight:400}nav{display:grid;gap:4px}nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#536b77;text-align:left;padding:10px 12px;font:inherit;font-size:13px;border-radius:7px;cursor:pointer}nav svg{width:18px;height:18px;flex-shrink:0}nav button:hover{background:#edf3f5}nav button[aria-current="page"]{background:#173b47;color:white}nav button.child{padding-left:42px}button:focus-visible{outline:2px solid #245665;outline-offset:2px}.workspace{min-width:0;display:grid;grid-template-rows:64px 34px minmax(0,1fr)}header{background:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #e5ecef}h1{font-size:18px;font-weight:600;margin:0}.context{font-size:12px;color:#536b77}.path{background:white;padding:8px 24px;font-size:12px;color:#536b77;border-bottom:1px solid #e5ecef}#content{position:relative;min-width:0;min-height:0}iframe{width:100%;height:100%;border:0;display:block}.empty{margin:24px;padding:40px 24px;border:1px solid #e5ecef;border-radius:8px;background:white;text-align:center}.empty h2{font-size:18px}.empty p{font-size:14px;color:#536b77}@media(max-width:680px){.shell{grid-template-columns:180px minmax(0,1fr)}header{padding:0 14px}.context{display:none}.path{padding:8px 14px}}@media(max-width:500px){.shell{grid-template-columns:130px minmax(0,1fr)}aside{padding:16px 6px}nav button{font-size:12px;padding:10px 8px;gap:6px}.brand{padding-left:8px;font-size:14px}nav button.child{padding-left:30px}}

.group{font-size:11px;color:#536b77;padding:0 12px 10px}@media(max-width:500px){.shell{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}aside{padding:10px;border-right:0;border-bottom:1px solid #e5ecef}.brand,.group{display:none}nav{display:flex}nav button{flex:1;width:auto}.workspace{grid-template-rows:48px 30px minmax(0,1fr)}}
</style></head><body><div class="shell"><aside><div class="brand">汇盛支付<small>地址池</small></div><div class="group">支付订单管理</div><nav id="menu" aria-label="地址池导航"></nav></aside><main class="workspace"><header><h1 id="title">钱包地址管理</h1><span class="context">汇盛地址池</span></header><div class="path" id="path">地址池 / 支付订单管理 / 钱包地址管理</div><div id="content"></div></main></div>
<!-- ADDRESS_PAYLOAD -->
<script>
(() => {
 const routes=[{id:'address-wallet',title:'钱包地址管理',key:'wallet-address'},{id:'address-amount-level',title:'目标池/金额层级配置',key:'amount-level'}];
 const menu=document.getElementById('menu'), content=document.getElementById('content');
 const docs=JSON.parse(document.getElementById('address-documents').textContent);
 function open(id){
  const route=routes.find(r=>r.id===id)||routes[0];
  document.getElementById('title').textContent=route.title;
  document.getElementById('path').textContent='地址池 / 支付订单管理 / '+route.title;
  menu.replaceChildren();content.replaceChildren();
  routes.forEach(r=>{const b=document.createElement('button');b.type='button';b.dataset.page=r.id;if(r.id===route.id)b.setAttribute('aria-current','page');b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 3h14v18H5zM8 8h8M8 12h8M8 16h5"/></svg><span></span>';b.querySelector('span').textContent=r.title;b.onclick=()=>{try{history.replaceState(null,'','#'+r.id)}catch{}open(r.id)};menu.append(b)});
  const frame=document.createElement('iframe');frame.title='汇盛地址池 · '+route.title;frame.dataset.page=route.id;content.append(frame);
  const init='<script>window.__HS_ADDRESS_EMBED__=true;window.__HS_ADDRESS_SURFACE__="ADDRESS";<'+ '/script>';
  const source=docs[route.key].replace('</head>',()=>init+'</head>');
  const d=frame.contentDocument;d.open();d.write(source);d.close();
 }
 window.addEventListener('hashchange',()=>open(location.hash.slice(1)));
 open(location.hash.slice(1));
})();
</script>
</body></html>
