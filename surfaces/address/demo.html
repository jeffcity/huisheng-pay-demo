<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地址管理后台</title>
<style>
:root{font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#172a32;background:#f3f6f7;--accent:#245665;--line:#dce5e8}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);border-radius:6px;background:white;color:#245665;padding:7px 13px}button.primary{background:var(--accent);border-color:var(--accent);color:white}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #318798;outline-offset:2px}
h1,h2,h3,p{margin:0}h1{font-size:23px}h2{font-size:18px}small,.muted{color:#586f79}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login form{width:min(390px,100%);padding:30px;display:grid;gap:18px}.panel,dialog,.login form{background:white;border:1px solid var(--line);border-radius:10px}.brand{display:flex;align-items:center;gap:10px}.mark{background:var(--accent);color:white;border-radius:7px;padding:9px;font-weight:700}.shell{display:grid;grid-template-columns:206px minmax(0,1fr);min-height:100vh}aside{background:white;border-right:1px solid var(--line);padding:22px 14px}aside .brand{margin:0 6px 26px}nav{display:grid;gap:4px}nav button{text-align:left;border:0;color:#405863}nav button[aria-current=page]{background:#e6f0f2;color:#173b47;font-weight:650}main{min-width:0}.bar,.head,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.bar{padding:16px 24px;background:white;border-bottom:1px solid var(--line)}.panel{margin:20px;padding:18px}.head{margin-bottom:18px}.actions{justify-content:flex-start}.table{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f4f7f8;color:#455f69;white-space:nowrap}.mono,code{font:13px/1.5 ui-monospace,monospace;overflow-wrap:anywhere}.badge{background:#e8f1f2;color:#275865;padding:2px 7px;border-radius:4px;white-space:nowrap}.empty{text-align:center;color:#60757d;padding:32px}label{display:grid;gap:5px;color:#425862;font-weight:550}input,select,textarea{min-width:0;width:100%;border:1px solid #cddade;background:white;border-radius:6px;padding:8px;color:#172a32}dialog{width:min(540px,94vw);max-height:90vh;padding:20px;color:inherit}dialog::backdrop{background:#182d3866}dialog form{display:grid;gap:14px}dialog footer{display:flex;justify-content:flex-end;gap:8px}.error{color:#ab3030}.error:empty{display:none}.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.filters input{max-width:265px}.filters select{width:auto}.compare{display:grid;grid-template-columns:auto 1fr 1fr;gap:0;border:1px solid var(--line);font-size:13px}.compare>*{padding:7px;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}.compare strong{background:#f3f6f7}.levels{display:block;border:0;width:100%;height:70vh}details{min-width:190px}summary{cursor:pointer;color:var(--accent)}
@media(max-width:680px){.shell{display:block}aside{border-bottom:1px solid var(--line);padding:10px}aside .brand{margin:0 0 8px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}.panel{margin:10px;padding:12px}.bar{padding:12px}.table table{min-width:580px}}
.policy-info{margin:0 0 14px}.permission{display:flex;align-items:center;gap:8px;margin-top:8px}.permission input{width:auto}fieldset{border:1px solid var(--line);border-radius:6px}
.system-nav>button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}
.system-nav>button::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg)}
.system-nav>button[aria-expanded=true]::after{transform:rotate(225deg)}
#systemNavItems:not([hidden]){display:grid;gap:2px;margin:4px 0 4px 14px;padding-left:6px;border-left:1px solid var(--line)}
#systemNavItems button{font-size:13px}
@media(max-width:680px){nav{align-items:flex-start}nav .system-nav{flex-shrink:0}}
.grant-row{display:grid;grid-template-columns:minmax(105px,1fr) 2fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.grant-row:last-child{border:0}.grant{display:flex;align-items:center;gap:6px;font-weight:400}.grant input{width:auto}.grant-buttons{display:flex;flex-wrap:wrap;gap:5px 12px}.grant-head{color:#455f69;font-size:13px}.actions button{white-space:nowrap}button[data-action^="delete-"]{color:#a23030}
.address-pool-fields{display:grid;gap:14px}
.review-history ol{margin:8px 0 0;padding-left:22px}.review-history li+li{margin-top:8px}.review-history li div{color:#455f69;overflow-wrap:anywhere;white-space:pre-wrap}
</style></head><body><div id="app"></div><dialog id="dialog"></dialog>
