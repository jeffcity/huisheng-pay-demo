<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>汇盛支付统一 Demo</title>
  <link rel="icon" href="data:,">
  <style>
    :root{--primary:#3246d2;--soft:#eef0ff;--ink:#1d2433;--muted:#5c6575;--line:#e5e6eb;--surface:#fff;--canvas:#f2f3f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--canvas)}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
    .unified-demo{height:100%;display:grid;grid-template-rows:64px minmax(0,1fr)}
    .topbar{display:flex;align-items:center;gap:32px;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:12px;white-space:nowrap;font-size:18px;font-weight:700}
    .brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:var(--primary);color:white;font-size:13px;letter-spacing:.04em}
    .brand small{margin-left:8px;font-size:12px;font-weight:500;color:var(--muted)}
    .tabs{display:flex;align-self:stretch;gap:4px}
    .tabs button{min-width:92px;padding:0 20px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .16s,color .16s}
    .tabs button:hover{background:var(--soft);color:var(--primary)}
    .tabs button[aria-selected="true"]{color:var(--primary);background:var(--soft);border-bottom-color:var(--primary)}
    button:focus-visible{outline:3px solid var(--primary);outline-offset:-4px}
    .workspace{position:relative;min-height:0;overflow:hidden}
    .workspace iframe{display:block;border:0;width:100%;height:100%;background:var(--canvas)}
    .status{position:absolute;inset:0;display:grid;place-content:center;gap:14px;text-align:center;background:var(--canvas);color:var(--muted);font-size:14px;z-index:1}
    .status[hidden]{display:none}.status button{padding:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;color:var(--primary);cursor:pointer;font:inherit}
    @media(max-width:650px){.unified-demo{grid-template-rows:104px minmax(0,1fr)}.topbar{padding:0 12px;gap:0;flex-wrap:wrap}.brand{height:52px;width:100%;font-size:16px}.brand-mark{width:28px;height:28px}.tabs{height:52px;flex:1}.tabs button{flex:1;min-width:0;padding:0 16px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <div class="unified-demo">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">HS</span><span>汇盛支付<small>统一 Demo</small></span></div>
      <nav class="tabs" role="tablist" aria-label="切换业务端">
        <button id="tab-platform" role="tab" type="button" data-surface="platform" aria-controls="surface-panel" aria-selected="false">平台端</button>
        <button id="tab-tenant" role="tab" type="button" data-surface="tenant" aria-controls="surface-panel" aria-selected="false" tabindex="-1">租户端</button>
        <button id="tab-merchant" role="tab" type="button" data-surface="merchant" aria-controls="surface-panel" aria-selected="false" tabindex="-1">商户端</button>
      </nav>
    </header>
    <main class="workspace" id="surface-panel" role="tabpanel" aria-labelledby="tab-platform">
      <div class="status" id="loading" role="status"><span id="statusText">正在加载平台端…</span><button id="retry" type="button" hidden>重新加载</button></div>
    </main>
  </div>
  <!-- SURFACE_DOCUMENTS -->
  <script>
    (() => {
      const buttons = [...document.querySelectorAll('[data-surface]')];
      const panel = document.getElementById('surface-panel');
      const loading = document.getElementById('loading');
      const statusText = document.getElementById('statusText');
      const retry = document.getElementById('retry');
      let active = '';
      let timer;
      function openSurface(id, updateUrl = true, force = false) {
        const button = buttons.find(button => button.dataset.surface === id) || buttons[0];
        id = button.dataset.surface;
        if (id === active && !force) return;
        active = id;
        clearTimeout(timer);
        // 真正卸载旧端：不保留隐藏 iframe，不预加载其他端的运行时。
        panel.querySelector('iframe')?.remove();
        buttons.forEach(item => {
          const selected = item === button;
          item.setAttribute('aria-selected', String(selected));
          item.tabIndex = selected ? 0 : -1;
        });
        panel.setAttribute('aria-labelledby', button.id);
        loading.hidden = false;
        retry.hidden = true;
        statusText.textContent = '正在加载' + button.textContent + '…';
        const frame = document.createElement('iframe');
        frame.title = '汇盛支付 · ' + button.textContent;
        frame.dataset.activeSurface = id;
        frame.addEventListener('load', () => {
          if (panel.contains(frame)) { clearTimeout(timer); loading.hidden = true; }
        });
        try {
          frame.srcdoc = JSON.parse(document.getElementById('surface-' + id).textContent);
          panel.append(frame);
          timer = setTimeout(() => { statusText.textContent = '加载时间较长，请重试'; retry.hidden = false; }, 15000);
        } catch (error) {
          statusText.textContent = '页面加载失败，请重新加载';
          retry.hidden = false;
        }
        if (updateUrl) {
          try { history.pushState(null, '', '#' + id); } catch {}
        }
      }
      buttons.forEach((button, index) => {
        button.addEventListener('click', () => openSurface(button.dataset.surface));
        button.addEventListener('keydown', event => {
          const next = {ArrowRight:(index+1)%3, ArrowLeft:(index+2)%3, Home:0, End:2}[event.key];
          if (next === undefined) return;
          event.preventDefault();
          buttons[next].focus();
          openSurface(buttons[next].dataset.surface);
        });
      });
      retry.addEventListener('click', () => openSurface(active, false, true));
      window.addEventListener('popstate', () => openSurface(location.hash.slice(1), false));
      window.addEventListener('hashchange', () => openSurface(location.hash.slice(1), false));
      openSurface(location.hash.slice(1), false);
    })();
  </script>
</body>
</html>
