<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>汇盛支付统一 Demo</title>
  <link rel="icon" href="data:,">
  <style>
    :root{--primary:#245665;--soft:#eaf2f4;--ink:#172a32;--muted:#536b77;--line:#e5ecef;--surface:#fff;--canvas:#f3f6f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--canvas)}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
    .unified-demo{height:100%;display:grid;grid-template-rows:56px minmax(0,1fr)}
    .topbar{display:flex;align-items:center;gap:36px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:16px;font-weight:650}
    .brand-mark{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:var(--primary);color:white;font-size:11px;letter-spacing:.04em}
    .brand small{margin-left:9px;font-size:11px;font-weight:400;color:var(--muted)}
    .tabs{display:flex;align-items:center;gap:4px;padding:3px;background:var(--canvas);border:1px solid var(--line);border-radius:9px}
    .tabs button{min-width:80px;height:32px;padding:0 17px;border:0;border-radius:6px;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:background .16s ease-out,color .16s ease-out}
    .tabs button:hover{background:var(--soft);color:var(--primary)}
    .tabs button[aria-selected="true"]{color:#fff;background:var(--primary)}
    button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
    .tabs button[aria-selected="true"]:focus-visible{outline-color:#b9dce5;outline-offset:-4px}
    .workspace{position:relative;min-height:0;overflow:hidden}
    .workspace iframe{display:block;border:0;width:100%;height:100%;background:var(--canvas)}
    .status{position:absolute;inset:0;display:grid;place-content:center;gap:14px;text-align:center;background:var(--canvas);color:var(--muted);font-size:14px;z-index:1}
    .status[hidden]{display:none}.status button{padding:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;color:var(--primary);cursor:pointer;font:inherit}
    @media(max-width:840px){
      .unified-demo{grid-template-rows:auto minmax(0,1fr)}
      .topbar{display:block;padding:0 12px}
      .brand{height:42px;font-size:15px}
      .brand-mark{width:27px;height:27px}
      .tabs{gap:2px;margin-bottom:8px}
      .tabs button{flex:1 0 auto;min-width:0;padding:0 5px;white-space:nowrap}
    }
    @media(max-width:520px){
      .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <div class="unified-demo">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">HS</span><span>汇盛支付<small>统一 Demo</small></span></div>
      <nav class="tabs" role="tablist" aria-label="切换业务端">
        <button id="tab-platform" role="tab" type="button" data-surface="platform" aria-controls="surface-panel" aria-selected="false">平台端</button>
        <button id="tab-tenant" role="tab" type="button" data-surface="tenant" aria-controls="surface-panel" aria-selected="false" tabindex="-1">租户端</button>
        <button id="tab-address" role="tab" type="button" data-surface="address" aria-controls="surface-panel" aria-selected="false" tabindex="-1">租户地址后台</button>
        <button id="tab-address-classic" role="tab" type="button" data-surface="address-classic" aria-controls="surface-panel" aria-selected="false" tabindex="-1">地址池（复刻版）</button>
        <button id="tab-merchant" role="tab" type="button" data-surface="merchant" aria-controls="surface-panel" aria-selected="false" tabindex="-1">商户端</button>
        <button id="tab-beauty" role="tab" type="button" data-surface="beauty" aria-controls="surface-panel" aria-selected="false" tabindex="-1">美人桥商户端</button>
      </nav>
    </header>
    <main class="workspace" id="surface-panel" role="tabpanel" aria-labelledby="tab-platform">
      <div class="status" id="loading" role="status"><span id="statusText">正在加载平台端…</span><button id="retry" type="button" hidden>重新加载</button></div>
    </main>
  </div>
  <!-- CASHIER_DOCUMENT -->
  <!-- ADDRESS_MODEL -->
  <!-- SURFACE_DOCUMENTS -->
  <script>
    (() => {
      const buttons = [...document.querySelectorAll('[data-surface]')];
      const panel = document.getElementById('surface-panel');
      const loading = document.getElementById('loading');
      const statusText = document.getElementById('statusText');
      const retry = document.getElementById('retry');
      const tenantAddress = new URLSearchParams(location.search).get('addressTenant');
      if (tenantAddress !== null) {
        document.querySelector('.topbar').remove();
        document.querySelector('.unified-demo').style.gridTemplateRows = 'minmax(0,1fr)';
        panel.removeAttribute('aria-labelledby');
        panel.setAttribute('aria-label','租户地址管理后台');
        panel.setAttribute('role','main');
        document.title = '汇盛 · 地址管理后台';
        if (!/^HS-TEN-[A-Z0-9]+(?:-[A-Z0-9]+)*$/.test(tenantAddress)) {
          statusText.textContent='租户登录地址无效'; return;
        }
        const frame=document.createElement('iframe');
        frame.title='租户专属地址管理后台';
        frame.dataset.activeSurface='address';
        panel.replaceChildren(frame);
        const doc=frame.contentDocument;
        doc.open(); doc.write(JSON.parse(document.getElementById('surface-address').textContent)); doc.close();
        return;
      }
      let active = '';
      let timer;
      function openSurface(id, updateUrl = true, force = false) {
        const button = buttons.find(button => button.dataset.surface === id) || buttons[0];
        id = button.dataset.surface;
        if (id === active && !force) return;
        active = id;
        clearTimeout(timer);
        // 真正卸载旧端：不保留隐藏 iframe，不预加载其他端的运行时。
        panel.querySelector('iframe')?.remove();
        buttons.forEach(item => {
          const selected = item === button;
          item.setAttribute('aria-selected', String(selected));
          item.tabIndex = selected ? 0 : -1;
        });
        panel.setAttribute('aria-labelledby', button.id);
        loading.hidden = false;
        retry.hidden = true;
        statusText.textContent = '正在加载' + button.textContent + '…';
        const frame = document.createElement('iframe');
        frame.title = '汇盛支付 · ' + button.textContent;
        frame.dataset.activeSurface = id;
        let written = false;
        frame.addEventListener('load', () => {
          if (written && frame.contentDocument?.readyState === 'complete' && panel.contains(frame)) { clearTimeout(timer); loading.hidden = true; }
        });
        try {
          const html = JSON.parse(document.getElementById('surface-' + id).textContent);
          panel.append(frame);
          timer = setTimeout(() => { statusText.textContent = '加载时间较长，请重试'; retry.hidden = false; }, 15000);
          const embedded = frame.contentDocument;
          embedded.open();embedded.write(html);written = true;embedded.close();
        } catch (error) {
          statusText.textContent = '页面加载失败，请重新加载';
          retry.hidden = false;
        }
        if (updateUrl) {
          try { history.pushState(null, '', '#' + id); } catch {}
        }
      }
      buttons.forEach((button, index) => {
        button.addEventListener('click', () => openSurface(button.dataset.surface));
        button.addEventListener('keydown', event => {
          const next = {ArrowRight:(index+1)%buttons.length, ArrowLeft:(index+buttons.length-1)%buttons.length, Home:0, End:buttons.length-1}[event.key];
          if (next === undefined) return;
          event.preventDefault();
          buttons[next].focus();
          openSurface(buttons[next].dataset.surface);
        });
      });
      retry.addEventListener('click', () => openSurface(active, false, true));
      window.addEventListener('popstate', () => openSurface(location.hash.slice(1), false));
      window.addEventListener('hashchange', () => openSurface(location.hash.slice(1), false));
      openSurface(location.hash.slice(1), false);
    })();
  </script>
</body>
</html>
